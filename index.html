  // ========== ドラッグ＆ドロップ / 貼り付けで config.js を取り込む（v3.5〜） ==========
  useEffect(() => {
    const applyConfigObject = (obj, sourceLabel) => {
      try {
        const json = JSON.stringify(obj);
        setFirebaseConfigStr(json);
        localStorage.setItem('school_firebase_config', json);
        setConfigDropOverlay('success');
        setConfigDropMessage(`${sourceLabel} から Firebase 接続情報を読み込みました。クラウド接続を開始します。`);
        setIsConfigOpen(false);
        setTimeout(() => setConfigDropOverlay(null), 3500);
      } catch (e) {
        setConfigDropOverlay('error');
        setConfigDropMessage('接続情報の適用に失敗しました: ' + e.message);
        setTimeout(() => setConfigDropOverlay(null), 4500);
      }
    };
    const readFile = (file) => {
      if (!file) return;
      const name = file.name || 'ファイル';
      const reader = new FileReader();
      reader.onload = () => {
        const text = String(reader.result || '');
        const obj = parseFirebaseConfigText(text);
        if (obj) applyConfigObject(obj, `「${name}」`);
        else {
          setConfigDropOverlay('error');
          setConfigDropMessage(`「${name}」から Firebase 接続情報を読み取れませんでした。Firebase Console でコピーした config を含む .js / .json / .txt ファイルを指定してください。`);
          setTimeout(() => setConfigDropOverlay(null), 5500);
        }
      };
      reader.onerror = () => {
        setConfigDropOverlay('error');
        setConfigDropMessage('ファイルの読み込みに失敗しました。');
        setTimeout(() => setConfigDropOverlay(null), 4000);
      };
      reader.readAsText(file, 'UTF-8');
    };
    // 「config.js を読み込む」ボタンや環境設定ポップアップ内のファイル選択から呼べるよう window に公開。
    // v3.6: 画面全体へのドラッグ＆ドロップ / 自動貼り付け取り込みは廃止。
    //       config の貼り付け・ファイル読み込みは「環境設定」ポップアップ内のみで完結する。
    window.__loadConfigFromFile = readFile;
    window.__applyConfigFromText = (text, label) => {
      const obj = parseFirebaseConfigText(text);
      if (obj) { applyConfigObject(obj, label || 'クリップボード'); return true; }
      return false;
    };
    return () => {
      delete window.__loadConfigFromFile;
      delete window.__applyConfigFromText;
    };
  }, []);

  useEffect(() => {
    try { setCustomOrder(JSON.parse(localStorage.getItem('list_custom_order_' + roomKey) || '{}')); }
    catch (e) { setCustomOrder({}); }
    // v3.17: ルーム切替時も、次にデータを読み込んだ時点で全セクションを畳む
    collapsedInitializedRoomRef.current = null;
    setCollapsedSections(new Set());
  }, [roomKey]);

  const sortByCustomOrder = (list, gradeKey) => {
    const arr = customOrder[gradeKey] || [];
    return [...list].sort((a, b) => { const ia = arr.indexOf(a.id); const ib = arr.indexOf(b.id); if (ia === -1 && ib === -1) return 0; if (ia === -1) return 1; if (ib === -1) return -1; return ia - ib; });
  };

  const reorderListRow = (sectionKey, draggedId, targetId) => {
    if (!draggedId || draggedId === targetId) return;
    let sectionAll;
    if (sectionKey === 'other') {
      sectionAll = activeStudents.filter((s) => !['1','2','3'].includes(s.grade));
    } else if (sectionKey.endsWith('-_nocls')) {
      const g = sectionKey.split('-')[0];
      sectionAll = activeStudents.filter((s) => s.grade === g && !s.classVal);
    } else {
      const [g, c] = sectionKey.split('-');
      sectionAll = activeStudents.filter((s) => s.grade === g && s.classVal === c);
    }
    const currentArr = customOrder[sectionKey] || [];
    let ordered = sectionAll.map((s) => s.id).sort((a, b) => { const ia = currentArr.indexOf(a); const ib = currentArr.indexOf(b); if (ia === -1 && ib === -1) return 0; if (ia === -1) return 1; if (ib === -1) return -1; return ia - ib; });
    if (!ordered.includes(draggedId)) return;
    ordered = ordered.filter((id) => id !== draggedId);
    const ti = ordered.indexOf(targetId);
    if (ti === -1) ordered.push(draggedId); else ordered.splice(ti, 0, draggedId);
    const next = { ...customOrder, [sectionKey]: ordered };
    setCustomOrder(next);
    try { localStorage.setItem('list_custom_order_' + roomKey, JSON.stringify(next)); } catch (e) {}
  };

  const filteredStudents = useMemo(() => {
    const q = searchQuery.trim().toLowerCase();
    return activeStudents.filter((s) => {
      const matchSearch = !q ||
        s.name.toLowerCase().includes(q) ||
        s.location.toLowerCase().includes(q) ||
        (s.internshipDates && s.internshipDates.some((d) => d.includes(q))) ||
        (s.teacher && s.teacher.toLowerCase().includes(q)) ||
        (s.grade && `${s.grade}年`.includes(q)) ||
        (s.classVal && `${s.classVal}組`.includes(q));

      if (!matchSearch) return false;
      // v3.6: myTeacherName は「編集者名（あなたの名前）」として使うため、担当教員フィルターとしては使わない。
      // 「自分の担当生徒だけ表示」したい場合は上部の検索欄や今後追加のフィルターを使う。

      switch (filterProgress) {
        case 'phone_pending':    if (s.phoneStatus && s.phoneStatus !== 'pending') return false; break;
        case 'doc_pending':      if (s.docStatus && s.docStatus !== 'pending') return false; break;
        case 'greeting_pending': if (s.greetingStatus === 'completed') return false; break;
        case 'patrol_pending':   if ((s.patrols || []).length > 0 && (s.patrols || []).every((p) => p.done)) return false; break;
        case 'internship_in_progress': if (!(s.internshipDates || []).includes(getTodayString())) return false; break;
        case 'student_thankyou_pending': if ((s.studentThankYouStatus || 'pending') !== 'pending') return false; break;
        case 'teacher_thankyou_pending': if ((s.teacherThankYouStatus || 'pending') !== 'pending') return false; break;
        default: break;
      }

      if (filterGrade !== 'all' && s.grade !== filterGrade) return false;
      if (filterClass !== 'all' && s.classVal !== filterClass) return false;
      if (filterInternshipType !== 'all' && (s.internshipType || 'internship') !== filterInternshipType) return false;
      if (filterPhoneStatus !== 'all' && (s.phoneStatus || 'pending') !== filterPhoneStatus) return false;
      if (filterDocStatus !== 'all' && (s.docStatus || 'pending') !== filterDocStatus) return false;
      if (filterGreetingStatus !== 'all' && (s.greetingStatus || 'pending') !== filterGreetingStatus) return false;
      if (filterPatrolStatus !== 'all') { const ps = s.patrols || []; const hasUnchecked = ps.some((p) => !p.done); const allDone = ps.length > 0 && !hasUnchecked; if (filterPatrolStatus === 'pending' && !(ps.length === 0 || hasUnchecked)) return false; if (filterPatrolStatus === 'completed' && !allDone) return false; }
      if (filterStudentThankYouStatus !== 'all' && (s.studentThankYouStatus || 'pending') !== filterStudentThankYouStatus) return false;
      if (filterTeacherThankYouStatus !== 'all' && (s.teacherThankYouStatus || 'pending') !== filterTeacherThankYouStatus) return false;

      return true;
    });
  }, [activeStudents, searchQuery, filterProgress, filterGrade, filterClass,
      filterPhoneStatus, filterDocStatus, filterGreetingStatus, filterPatrolStatus,
      filterStudentThankYouStatus, filterTeacherThankYouStatus, filterInternshipType]);

  const stats = useMemo(() => {
    const total = activeStudents.length;
    if (total === 0) return {
      total: 0, phonePercent: 0, docPercent: 0, greetingPercent: 0, patrolPercent: 0,
      phonePendingCount: 0, docPendingCount: 0, greetingPendingCount: 0, patrolPendingCount: 0,
      internshipImplPercent: 0, internshipInProgressCount: 0,
      studentThankYouPercent: 0, studentThankYouPendingCount: 0,
      teacherThankYouPercent: 0, teacherThankYouPendingCount: 0
    };
    const todayKey = getTodayString();
    const phoneNeeded = activeStudents.filter((s) => (s.phoneStatus || 'pending') !== 'none').length;
    const phoneDone = activeStudents.filter((s) => s.phoneStatus === 'completed').length;
    const docNeeded = activeStudents.filter((s) => (s.docStatus || 'pending') !== 'none').length;
    const docDone = activeStudents.filter((s) => s.docStatus === 'completed').length;
    const greetingNeeded = activeStudents.filter((s) => (s.greetingStatus || 'pending') !== 'none').length;
    const greetingDone = activeStudents.filter((s) => s.greetingStatus === 'completed').length;
    const patrolNeeded = activeStudents.filter((s) => (s.patrols || []).length > 0).length;
    const patrolDone = activeStudents.filter((s) => { const ps = s.patrols || []; return ps.length > 0 && ps.every((p) => p.done); }).length;
    const internshipNeeded = activeStudents.filter((s) => (s.internshipDates || []).length > 0).length;
    const internshipImplDone = activeStudents.filter((s) => { const dates = s.internshipDates || []; if (dates.length === 0) return false; const last = [...dates].sort().pop(); return last < todayKey; }).length;
    const internshipInProgressCount = activeStudents.filter((s) => (s.internshipDates || []).includes(todayKey)).length;
    const studentTYNeeded = activeStudents.filter((s) => (s.studentThankYouStatus || 'pending') !== 'none').length;
    const studentTYDone = activeStudents.filter((s) => s.studentThankYouStatus === 'completed').length;
    const teacherTYNeeded = activeStudents.filter((s) => (s.teacherThankYouStatus || 'pending') !== 'none').length;
    const teacherTYDone = activeStudents.filter((s) => s.teacherThankYouStatus === 'completed').length;
    return {
      total,
      phonePercent:    phoneNeeded > 0 ? Math.round((phoneDone / phoneNeeded) * 100) : 0,
      docPercent:      docNeeded > 0 ? Math.round((docDone / docNeeded) * 100) : 0,
      greetingPercent: greetingNeeded > 0 ? Math.round((greetingDone / greetingNeeded) * 100) : 0,
      patrolPercent:   patrolNeeded > 0 ? Math.round((patrolDone / patrolNeeded) * 100) : 0,
      phonePendingCount:    activeStudents.filter((s) => s.phoneStatus === 'pending').length,
      docPendingCount:      activeStudents.filter((s) => s.docStatus   === 'pending').length,
      greetingPendingCount: activeStudents.filter((s) => s.greetingStatus === 'pending' || s.greetingStatus === 'scheduled').length,
      patrolPendingCount:   activeStudents.filter((s) => (s.patrols || []).some((p) => !p.done)).length,
      internshipImplPercent: internshipNeeded > 0 ? Math.round((internshipImplDone / internshipNeeded) * 100) : 0,
      internshipInProgressCount,
      studentThankYouPercent: studentTYNeeded > 0 ? Math.round((studentTYDone / studentTYNeeded) * 100) : 0,
      studentThankYouPendingCount: activeStudents.filter((s) => (s.studentThankYouStatus || 'pending') === 'pending').length,
      teacherThankYouPercent: teacherTYNeeded > 0 ? Math.round((teacherTYDone / teacherTYNeeded) * 100) : 0,
      teacherThankYouPendingCount: activeStudents.filter((s) => (s.teacherThankYouStatus || 'pending') === 'pending').length
    };
  }, [activeStudents]);

  const uniqueTeachers = useMemo(() => {
    const set = new Set();
    activeStudents.forEach((s) => { if (s.teacher) set.add(s.teacher); });
    return Array.from(set);
  }, [activeStudents]);

  const calendarDays = useMemo(() => {
    const firstDayIndex = new Date(calendarYear, calendarMonth, 1).getDay();
    const numberOfDays = new Date(calendarYear, calendarMonth + 1, 0).getDate();
    const prevMonthDays = new Date(calendarYear, calendarMonth, 0).getDate();
    const days = [];
    for (let i = firstDayIndex - 1; i >= 0; i--) {
      days.push({
        day: prevMonthDays - i,
        month: calendarMonth === 0 ? 11 : calendarMonth - 1,
        year: calendarMonth === 0 ? calendarYear - 1 : calendarYear,
        isCurrentMonth: false
      });
    }
    for (let i = 1; i <= numberOfDays; i++) {
      days.push({ day: i, month: calendarMonth, year: calendarYear, isCurrentMonth: true });
    }
    const remaining = 42 - days.length;
    for (let i = 1; i <= remaining; i++) {
      days.push({
        day: i,
        month: calendarMonth === 11 ? 0 : calendarMonth + 1,
        year: calendarMonth === 11 ? calendarYear + 1 : calendarYear,
        isCurrentMonth: false
      });
    }
    return days;
  }, [calendarYear, calendarMonth]);

  const getEventsForDate = (year, month, day) => {
    const target = formatDateKey(year, month, day);
    const events = [];
    filteredStudents.forEach((student) => {
      if ((calendarFilter === 'all' || calendarFilter === 'student') && student.greetingDate === target) {
        events.push({
          type: 'greeting',
          label: `挨拶: ${student.name} (${student.greetingTime || '時間未定'})`,
          student,
          color: student.greetingStatus === 'completed'
            ? 'bg-green-300 border-green-500 text-green-900 hover:bg-green-400'
            : 'bg-green-200 border-green-400 text-green-900 hover:bg-green-300'
        });
      }
      if (calendarFilter === 'teacher' || calendarFilter === 'all') {
        (student.patrols || []).forEach((p) => {
          if (p.date !== target) return;
          events.push({
            type: 'patrol',
            label: `巡回: ${student.name}${p.teacher ? ' / ' + p.teacher : ''}${p.time ? ` (${p.time})` : ''}`,
            student,
            color: p.done
              ? 'bg-blue-300 border-blue-500 text-blue-900 hover:bg-blue-400'
              : 'bg-blue-200 border-blue-400 text-blue-900 hover:bg-blue-300'
          });
        });
      }
      const info = computeInternshipDayInfo(student, target);
      if (info && (calendarFilter === 'student' || calendarFilter === 'all')) {
        const isObs = student.internshipType === 'observation';
        const color = isObs
          ? 'bg-pink-100 border-pink-300 text-pink-900 hover:bg-pink-200'
          : 'bg-yellow-100 border-yellow-300 text-yellow-900 hover:bg-yellow-200';
        const patrolsOnDay = (student.patrols || []).filter((p) => p.date === target);
        const patrolNames = patrolsOnDay.map((p) => p.teacher).filter(Boolean);
        const tipLines = [(isObs ? `${student.name}（${student.location || '見学先未設定'}）` : `${student.name}　${info.dayNumber}／${info.totalDays}（${student.location}）`)];
        if (student.teacher) tipLines.push(`同行: ${student.teacher}`);
        if (patrolNames.length > 0) tipLines.push(`巡回: ${patrolNames.join('、')}`);
        events.push({
          type: 'period',
          label: (isObs ? `${student.name}（${student.location || '見学先未設定'}）` : `${student.name}　${info.dayNumber}／${info.totalDays}（${student.location}）`),
          title: tipLines.join('\n'),
          student,
          color,
          dateKey: target
        });
      }
    });
    return events;
  };

  const hasPeriodEventOnDate = (year, month, day) => {
    const target = formatDateKey(year, month, day);
    return filteredStudents.some((s) => (s.internshipDates || []).includes(target));
  };

  const handlePrevMonth = () => {
    if (calendarMonth === 0) { setCalendarYear((y) => y - 1); setCalendarMonth(11); }
    else setCalendarMonth((m) => m - 1);
  };
  const handleNextMonth = () => {
    if (calendarMonth === 11) { setCalendarYear((y) => y + 1); setCalendarMonth(0); }
    else setCalendarMonth((m) => m + 1);
  };
  const handleToday = () => {
    const t = new Date();
    setCalendarYear(t.getFullYear());
    setCalendarMonth(t.getMonth());
  };

  const clearFilters = () => {
    setSearchQuery(''); setFilterProgress('all');
    setFilterGrade('all'); setFilterClass('all');
    setFilterPhoneStatus('all'); setFilterDocStatus('all');
    setFilterGreetingStatus('all'); setFilterPatrolStatus('all');
    setFilterStudentThankYouStatus('all'); setFilterTeacherThankYouStatus('all'); setFilterInternshipType('all');
  };

  const hasActiveFilter = filterProgress !== 'all' || searchQuery ||
    filterGrade !== 'all' || filterClass !== 'all' ||
    filterPhoneStatus !== 'all' || filterDocStatus !== 'all' ||
    filterGreetingStatus !== 'all' || filterPatrolStatus !== 'all' ||
    filterStudentThankYouStatus !== 'all' || filterTeacherThankYouStatus !== 'all' || filterInternshipType !== 'all';

  const handleExportExcel = () => {
    if (filteredStudents.length === 0) {
      showAlert('出力対象の生徒データがありません。');
      return;
    }
    const headers = [
      '生徒氏名', '学年', '組', '担当教員', '実習先企業・事業所名', '実習日数', '実習日（スラッシュ区切り）',
      '事前電話状況', '電話連絡完了日',
      '保護者お知らせ状況', 'お知らせ回収日',
      '事前挨拶状況', '挨拶訪問日', '挨拶予定時間', '挨拶引率教員',
      '菓子折',
      '巡回・同行予定一覧', '巡回完了件数',
      '特記事項・配慮事項'
    ];
    const labelOf = {
      phone:    (s) => s === 'completed' ? '完了'   : s === 'none' ? '不要' : '未完了',
      doc:      (s) => s === 'completed' ? '完了'   : s === 'none' ? '不要' : '未完了',
      greeting: (s) => s === 'completed' ? '挨拶終了' : s === 'scheduled' ? '挨拶日決定' : s === 'unadjusted' ? '未調整' : '必要なし'
    };
    const rows = filteredStudents.map((s) => [
      s.name || '', s.grade ? `${s.grade}年` : '', s.classVal ? `${s.classVal}組` : '', s.teacher || '',
      s.location || '', (s.internshipDates || []).length, (s.internshipDates || []).join(' / '),
      labelOf.phone(s.phoneStatus), s.phoneDate || '',
      labelOf.doc(s.docStatus), s.docDate || '',
      labelOf.greeting(s.greetingStatus), s.greetingDate || '', s.greetingTime || '', s.greetingVisitor || '',
      (s.giftStatus || 'none') === 'brought' ? '持参済み' : (s.giftStatus || 'none') === 'bring' ? '持参する' : 'ー',
      (s.patrols || []).map((p) => `${p.teacher ? p.teacher + ' ' : ''}${p.date}${p.time ? ' ' + p.time : ''}${p.done ? '(済)' : ''}`).join(' / '), (s.patrols || []).filter((p) => p.done).length,
      s.notes || ''
    ]);
    const csv = [
      headers.join(','),
      ...rows.map((row) => row.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(','))
    ].join('\r\n');
    const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
    const blob = new Blob([bom, csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    const dateStr = new Date().toLocaleDateString('ja-JP').replace(/\//g, '');
    link.href = url;
    link.download = `現場実習進捗リスト_${activePeriod.name.replace(/[\\/:*?"<>|]/g, '_')}_${roomKey}_${dateStr}.csv`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  };

  const handleBulkImport = async (rows) => {
    if (!requireWriteAccess()) return false;
    if (isActivePeriodLocked && !isAdmin) { showAlert('この実習期は終了済みのため一括登録できません。'); return; }
    rows = rows.map((r) => ({ ...r, periodId: activePeriodId }));
    setIsLoading(true);
    try {
      if (connectionStatus === 'connected' && window.firebase) {
        const db = guardedFirestore(window.firebase.app().firestore(), roomKey);
        const ref = db.collection('rooms').doc(roomKey).collection('students');
        const created = [];
        for (const r of rows) {
          const docRef = await ref.add(r);
          created.push({ id: docRef.id, ...r });
        }
        created.forEach((s) => recordCreate(s));
      } else {
        const created = rows.map((r, i) => ({ id: 'local-' + Date.now() + '-' + i, ...r }));
        const updated = [...students, ...created];
        setStudents(updated);
        localStorage.setItem(`local_students_${roomKey}`, JSON.stringify(updated));
        created.forEach((s) => recordCreate(s));
      }
      setIsBulkImportOpen(false);
      showAlert(`${rows.length}名を一括登録しました。`);
    } catch (e) {
      showAlert(`一括登録に失敗しました: ${e.message}`);
    } finally {
      setIsLoading(false);
    }
  };

  const buildPeriodCopy = (s, periodId) => ({
    periodId, name: s.name || '', grade: s.grade || '', classVal: s.classVal || '', teacher: s.teacher || '',
    location: '', internshipType: 'internship', internshipDates: [],
    phoneStatus: 'pending', phoneDate: '', docStatus: 'pending', docDate: '',
    greetingStatus: 'pending', greetingDate: '', greetingTime: '', greetingVisitor: '',
    giftStatus: 'none', patrols: [], studentThankYouStatus: 'pending', studentThankYouDate: '',
    teacherThankYouStatus: 'pending', teacherThankYouDate: '', notes: '', materials: [], lockedFields: []
  });

  const handleCreatePeriod = async () => {
    if (!requireWriteAccess()) return false;
    if (!isAdmin) { showAlert('新しい実習期の作成は管理者のみ行えます。'); return; }
    const name = newPeriodName.trim();
    if (!name) { showAlert('実習期の名前を入力してください。'); return; }
    if (periods.some((p) => p.name === name)) { showAlert('同じ名前の実習期が既にあります。'); return; }
    const newId = 'period-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
    const meta = { id: newId, name, locked: false, createdAtClient: Date.now() };
    const copies = copyPreviousRoster ? activeStudents.map((s) => buildPeriodCopy(s, newId)) : [];
    setIsLoading(true);
    try {
      if (connectionStatus === 'connected' && window.firebase) {
        const db = guardedFirestore(window.firebase.app().firestore(), roomKey);
        await db.collection('rooms').doc(roomKey).collection('students').doc(periodMetaDocId(newId)).set({ recordType: 'period', periodId: newId, name, locked: false, createdAtClient: meta.createdAtClient, createdAt: window.firebase.firestore.FieldValue.serverTimestamp() });
        if (lockPreviousPeriod) await db.collection('rooms').doc(roomKey).collection('students').doc(periodMetaDocId(activePeriodId)).set({ recordType: 'period', periodId: activePeriodId, name: activePeriod.name || DEFAULT_PERIOD.name, locked: true, createdAtClient: activePeriod.createdAtClient || 0 }, { merge: true });
        const ref = db.collection('rooms').doc(roomKey).collection('students');
        for (const row of copies) await ref.add(row);
      } else {
        const nextPeriods = [...periods.map((p) => p.id === activePeriodId && lockPreviousPeriod ? { ...p, locked: true } : p), meta];
        const copiesWithIds = copies.map((row, i) => ({ id: 'local-' + Date.now() + '-' + i, ...row }));
        setPeriods(nextPeriods); setStudents((prev) => [...prev, ...copiesWithIds]);
        localStorage.setItem(`internship_periods${ENV_SUFFIX}_${roomKey}`, JSON.stringify(nextPeriods));
        localStorage.setItem(`local_students_${roomKey}`, JSON.stringify([...students, ...copiesWithIds]));
      }
      setActivePeriodId(newId); setIsPeriodManagerOpen(false);
      showAlert(`「${name}」を作成しました。${copies.length ? `前の実習期から${copies.length}名の基本情報をコピーしました。` : ''}`);
    } catch (e) { showAlert('実習期の作成に失敗しました: ' + e.message); }
    finally { setIsLoading(false); }
  };

  const handleTogglePeriodLock = async (period) => {
    if (!requireWriteAccess()) return false;
    if (!isAdmin) { showAlert('実習期のロック変更は管理者のみ行えます。'); return; }
    const locked = !period.locked;
    try {
      if (connectionStatus === 'connected' && window.firebase) {
        const db = guardedFirestore(window.firebase.app().firestore(), roomKey);
        await db.collection('rooms').doc(roomKey).collection('students').doc(periodMetaDocId(period.id)).set({ recordType: 'period', periodId: period.id, name: period.name, locked, createdAtClient: period.createdAtClient || 0 }, { merge: true });
      } else {
        const next = periods.map((p) => p.id === period.id ? { ...p, locked } : p);
        setPeriods(next); localStorage.setItem(`internship_periods${ENV_SUFFIX}_${roomKey}`, JSON.stringify(next));
      }
    } catch (e) { showAlert('ロック変更に失敗しました: ' + e.message); }
  };

  const handleExportAllData = () => {
    const payload = { app: 'internship-manager', version: 325, exportedAt: new Date().toISOString(), roomKey, periods, students };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = `現場実習_全期間バックアップ_${getTodayString()}.json`; a.click(); URL.revokeObjectURL(url);
  };

  const handleImportAllData = (file) => {
    if (!requireWriteAccess()) return false;
    if (!isAdmin) { showAlert('バックアップの読み込みは管理者のみ行えます。'); return; }
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result));
        if (data.app !== 'internship-manager' || !Array.isArray(data.periods) || !Array.isArray(data.students)) throw new Error('対応するバックアップ形式ではありません。');
        showConfirm(`バックアップから実習期${data.periods.length}件・生徒記録${data.students.length}件を復元します。既存の同じIDは上書きされます。`, async () => {
          if (!requireWriteAccess()) return false;
          setIsLoading(true);
          try {
            if (connectionStatus === 'connected' && window.firebase) {
              const db = guardedFirestore(window.firebase.app().firestore(), roomKey);
              for (const p of data.periods) { const { id, ...body } = p; await db.collection('rooms').doc(roomKey).collection('students').doc(periodMetaDocId(id)).set({ ...body, recordType: 'period', periodId: id }, { merge: true }); }
              for (const s of data.students) { const { id, ...body } = s; await db.collection('rooms').doc(roomKey).collection('students').doc(id).set(body, { merge: true }); }
            } else {
              const pm = new Map(periods.map((p) => [p.id, p])); data.periods.forEach((p) => pm.set(p.id, p));
              const sm = new Map(students.map((x) => [x.id, x])); data.students.forEach((x) => sm.set(x.id, x));
              const nextP = Array.from(pm.values()), nextS = Array.from(sm.values());
              setPeriods(nextP); setStudents(nextS);
              localStorage.setItem(`internship_periods${ENV_SUFFIX}_${roomKey}`, JSON.stringify(nextP));
              localStorage.setItem(`local_students_${roomKey}`, JSON.stringify(nextS));
            }
            showAlert('バックアップを復元しました。');
          } catch (e) { showAlert('復元に失敗しました: ' + e.message); }
          finally { setIsLoading(false); }
        });
      } catch (e) { showAlert('バックアップを読み込めません: ' + e.message); }
    };
    reader.readAsText(file);
    if (periodBackupInputRef.current) periodBackupInputRef.current.value = '';
  };

  const toggleSelectAll = () => {
    if (filteredStudents.length > 0 && selectedIds.size === filteredStudents.length) {
      setSelectedIds(new Set());
    } else {
      setSelectedIds(new Set(filteredStudents.map((s) => s.id)));
    }
  };

  const toggleSelectOne = (id) => {
    setSelectedIds((prev) => { const n = new Set(prev); if (n.has(id)) n.delete(id); else n.add(id); return n; });
  };

  const handleBulkDelete = () => {
    if (!requireWriteAccess()) return false;
    if (isActivePeriodLocked && !isAdmin) { showAlert('この実習期は終了済みのため削除できません。'); return; }
    if (selectedIds.size === 0) return;
    showConfirm(`選択中の${selectedIds.size}名の進捗データを削除してもよろしいですか？「戻る」ボタンで取り消せます。`, async () => {
      if (!requireWriteAccess()) return false;
      const targets = activeStudents.filter((s) => selectedIds.has(s.id));
      setIsLoading(true);
      try {
        if (connectionStatus === 'connected' && window.firebase) {
          const db = guardedFirestore(window.firebase.app().firestore(), roomKey);
          for (const t of targets) {
            await db.collection('rooms').doc(roomKey).collection('students').doc(t.id).delete();
            recordDelete(t);
          }
        } else {
          const updated = students.filter((s) => !selectedIds.has(s.id));
          setStudents(updated);
          localStorage.setItem(`local_students_${roomKey}`, JSON.stringify(updated));
          targets.forEach((t) => recordDelete(t));
        }
        setSelectedIds(new Set());
        showAlert(`${targets.length}名を削除しました。`);
      } catch (e) {
        showAlert(`一括削除に失敗しました: ${e.message}`);
      } finally {
        setIsLoading(false);
      }
    });
  };

  useEffect(() => {
    const query = window.matchMedia('(min-width:1100px)');
    const change = () => { if(!query.matches)setSidebarOpen(false); };
    query.addEventListener('change', change); return () => query.removeEventListener('change', change);
  }, []);
  useEffect(() => {
    if (!sidebarOpen || window.innerWidth >= 1100) return;
    const overflow = document.body.style.overflow; document.body.style.overflow = 'hidden';
    sidebarRef.current?.querySelector('button')?.focus();
    const keydown = (e) => {
      if (e.key === 'Escape') { e.preventDefault(); setSidebarOpen(false); }
      if (e.key !== 'Tab') return;
      const nodes = [...(sidebarRef.current?.querySelectorAll('button:not(:disabled):not([hidden]),select:not(:disabled),input:not(:disabled),a[href]') || [])].filter(n => n.getClientRects().length);
      if (e.shiftKey && document.activeElement === nodes[0]) { e.preventDefault(); nodes.at(-1)?.focus(); }
      else if (!e.shiftKey && document.activeElement === nodes.at(-1)) { e.preventDefault(); nodes[0]?.focus(); }
    };
    document.addEventListener('keydown', keydown);
    return () => { document.body.style.overflow = overflow; document.removeEventListener('keydown', keydown); menuButtonRef.current?.focus(); };
  }, [sidebarOpen]);

  useEffect(() => {
    if (!cloudReadOnly) return;
    setIsAddEditOpen(false); setEditingStudent(null); setDatePickerState(null); setTextEditState(null); setSelectEditState(null); setPatrolEditState(null); setIsBulkImportOpen(false);
    clearHistory();
  }, [cloudReadOnly, cloudScopeKey]);
  useEffect(() => {
    const warn = (event) => { if (cloudWriteGate.pending > 0) { event.preventDefault(); event.returnValue = ''; } };
    window.addEventListener('beforeunload', warn); return () => window.removeEventListener('beforeunload', warn);
  }, []);

  return (
    <div className={`sb-app min-h-screen bg-slate-50 text-slate-800 flex flex-col font-sans ${sidebarOpen ? 'sb-open' : ''}`}>

      {/* 隠しファイル入力: 「config.js を読み込む」ボタンから呼ばれる */}
      <input
        ref={configFileInputRef}
        type="file"
        accept=".js,.json,.txt,application/json,text/javascript,text/plain"
        className="hidden"
        onChange={(e) => {
          const file = e.target.files?.[0];
          if (file && typeof window.__loadConfigFromFile === 'function') {
            window.__loadConfigFromFile(file);
          }
          e.target.value = '';
        }}
      />

      {/* v3.6: 編集者名入力モーダル（初回接続時に自動表示 / ヘッダーの✏️ボタンからも開ける） */}
      {isNamePromptOpen && (
        <div className="fixed inset-0 z-[150] bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn">
          <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-200">
            <div className="bg-gradient-to-r from-indigo-500 to-purple-600 px-6 py-4">
              <div className="flex items-center gap-3 text-white">
                <span className="text-3xl">✏️</span>
                <div>
                  <div className="text-lg font-extrabold">編集者名を入力</div>
                  <div className="text-xs text-indigo-100">この端末を使うあなたの名前を教えてください</div>
                </div>
              </div>
            </div>
            <div className="p-6 space-y-4">
              <div>
                <label className="text-xs font-bold text-slate-700 mb-1.5 block">あなたの名前（編集者名）</label>
                <input
                  type="text"
                  value={tempTeacherName}
                  onChange={(e) => setTempTeacherName(e.target.value)}
                  onKeyDown={(e) => {
                    if (e.key === 'Enter' && tempTeacherName.trim()) {
                      setMyTeacherName(tempTeacherName.trim());
                      setIsNamePromptOpen(false);
                    } else if (e.key === 'Escape') {
                      setIsNamePromptOpen(false);
                    }
                  }}
                  placeholder="例: 加藤 / 須田先生 / 北原 など"
                  autoFocus
                  className="w-full px-4 py-2.5 border-2 border-slate-200 focus:border-indigo-400 rounded-xl text-sm font-bold outline-none transition-colors"
                />
              </div>
              <div className="bg-sky-50 border border-sky-200 text-sky-800 text-[11px] p-3 rounded-lg leading-relaxed">
                <strong className="font-bold">この名前の使い道:</strong><br />
                ・「👥 接続中」一覧に表示されます<br />
                ・このPCで行ったコメント・編集の記録に使われます<br />
                ・後からヘッダーの ✏️ ボタンや「環境設定」でいつでも変更できます
              </div>
              <div className="flex items-center gap-2 pt-2">
                <button
                  onClick={() => setIsNamePromptOpen(false)}
                  className="flex-1 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition-colors"
                >
                  あとで設定（匿名のまま）
                </button>
                <button
                  disabled={!tempTeacherName.trim()}
                  onClick={() => {
                    setMyTeacherName(tempTeacherName.trim());
                    setIsNamePromptOpen(false);
                  }}
                  className="flex-1 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white rounded-xl text-xs font-extrabold transition-colors shadow-sm"
                >
                  この名前で保存
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* 読み込み結果トースト（環境設定ポップアップから取り込んだときに表示） */}
      {(configDropOverlay === 'success' || configDropOverlay === 'error') && (
        <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-[200] px-4 py-3 rounded-xl shadow-2xl border max-w-md text-xs font-bold animate-slideDown ${configDropOverlay === 'success' ? 'bg-emerald-50 border-emerald-300 text-emerald-900' : 'bg-rose-50 border-rose-300 text-rose-900'}`}>
          <div className="flex items-start gap-2">
            <span className="text-base shrink-0">{configDropOverlay === 'success' ? '✅' : '⚠️'}</span>
            <span className="leading-relaxed">{configDropMessage}</span>
          </div>
        </div>
      )}

      {!workflowPage && <>
      {sidebarOpen && <button className="sb-backdrop no-print" aria-label="メニューを閉じる" tabIndex={-1} onClick={() => setSidebarOpen(false)} />}
      <aside ref={sidebarRef} id="app-sidebar" className="sb-sidebar no-print" aria-label="操作メニュー" aria-hidden={!sidebarOpen} inert={!sidebarOpen ? '' : undefined}>
        <div className="sb-sidebar-top"><strong>操作メニュー</strong><button type="button" className="sb-icon-button" aria-label="サイドバーを閉じる" onClick={() => setSidebarOpen(false)}>×</button></div>
        <div className="sb-sidebar-scroll">
      <header className="sb-header">
        <div className="sb-header-inner">
          <div className="sb-brand">
            <div>
              <div className="sb-brand-title">
                <h1 className="text-lg font-bold tracking-tight text-slate-900">現場実習・施設見学</h1>
                <span className="text-[10px] bg-slate-100 text-slate-600 font-mono px-1.5 py-0.5 rounded border border-slate-200">v3.36.3 HTML</span>
                {isConfigFromFile && <span className="text-[10px] bg-emerald-50 text-emerald-700 font-mono px-1.5 py-0.5 rounded border border-emerald-200" title="config.js から Firebase 接続情報を読み込んでいます">config.js 適用中</span>}
              </div>
              <p className="text-xs text-slate-500">進捗管理・情報共有</p>
            </div>
          </div>

          <div className="sb-header-controls">
            <div className="flex items-center gap-1.5 bg-violet-50 border border-violet-200 rounded-full px-2 py-1 shadow-sm" title="表示する実習期を切り替えます">
              <span className="text-xs">🗂️</span>
              <select aria-label="サイドバーの実習期" value={activePeriodId} onChange={(e) => setActivePeriodId(e.target.value)} className="bg-transparent text-xs font-bold text-violet-900 outline-none cursor-pointer max-w-[170px]">
                {periods.map((p) => <option key={p.id} value={p.id}>{p.locked ? '🔒 ' : ''}{p.name}</option>)}
              </select>
              <button type="button" onClick={() => { setSidebarOpen(false); setIsPeriodManagerOpen(true); }} className="w-6 h-6 rounded-full bg-white border border-violet-200 hover:bg-violet-100 text-violet-800 font-bold cursor-pointer" title="実習期を管理">＋</button>
            </div>
            <div className="sb-connection"><ConnectionBadge status={connectionStatus} roomKey={roomKey} /></div>
            {/* v3.9: 管理者バッジ。管理者としてログイン中のときだけ表示。クリックでログアウト確認。 */}
            {isAdmin && (
              <button
                type="button"
                onClick={() => { showConfirm('管理者モードからログアウトしますか？ロック項目が再び編集できなくなります。', () => logoutAdmin()); }}
                title="クリックで管理者ログアウト"
                className="flex items-center gap-1.5 px-3 py-1.5 bg-amber-50 hover:bg-amber-100 border border-amber-300 text-amber-800 rounded-full text-xs font-bold transition-all shadow-sm cursor-pointer"
              >
                <span className="text-sm leading-none">🛡️</span>
                <span>管理者</span>
              </button>
            )}
            {/* v3.6: 編集者名バッジ。未設定のときは赤くパルスして気づかせる。 */}
            <button
              onClick={() => { setTempTeacherName(myTeacherName || ''); setSidebarOpen(false); setIsNamePromptOpen(true); }}
              className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold transition-all shadow-sm border ${myTeacherName ? 'bg-indigo-50 hover:bg-indigo-100 border-indigo-200 text-indigo-800' : 'bg-rose-50 hover:bg-rose-100 border-rose-300 text-rose-700 animate-pulse'}`}
              title="編集者名（あなたの名前）を設定・変更します。「接続中」一覧や記録に使われます。"
            >
              <span className="text-sm leading-none">✏️</span>
              <span className="max-w-[120px] truncate">{myTeacherName || '名前を入力'}</span>
            </button>
            {todayTargets.length > 0 && (
              <button type="button" onClick={() => { setSidebarOpen(false); setIsTodayTargetsOpen(true); }} title="今日の実習・見学対象者を表示します" className="flex items-center gap-1.5 px-3 py-1.5 bg-yellow-50 hover:bg-yellow-100 border border-yellow-300 text-yellow-900 rounded-full text-xs font-bold transition-all shadow-sm cursor-pointer">
                <span className="text-sm leading-none">📅</span>
                <span>本日の実習・見学 {todayTargets.length}名</span>
              </button>
            )}
            {/* v3.24: デスクトップ通知トグル。オンのとき掲示板投稿・生徒更新を OS の通知センターへ表示 */}
            <button
              type="button"
              onClick={handleToggleNotify}
              title={notifyEnabled ? 'デスクトップ通知をオフにする' : 'デスクトップ通知をオンにする（掲示板の新規投稿・生徒データの更新をWindowsの通知センター等に表示します）'}
              className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold transition-all shadow-sm border cursor-pointer ${notifyEnabled ? 'bg-emerald-50 hover:bg-emerald-100 border-emerald-300 text-emerald-800' : 'bg-slate-50 hover:bg-slate-100 border-slate-200 text-slate-600'}`}
            >
              {notifyEnabled ? <Bell className="w-3.5 h-3.5" /> : <BellOff className="w-3.5 h-3.5" />}
              <span>{notifyEnabled ? '通知オン' : '通知オフ'}</span>
            </button>
            {connectionStatus === 'connected' && (
              <div className="relative">
                <button
                  type="button"
                  onClick={() => setIsOnlineListOpen((v) => !v)}
                  className="flex items-center gap-1.5 px-3 py-1.5 bg-sky-50 hover:bg-sky-100 active:bg-sky-200 border border-sky-200 text-sky-800 rounded-full text-xs font-bold transition-all shadow-sm cursor-pointer"
                  title={onlineMembers.length > 0 ? 'クリックで接続中の先生の一覧を表示' : '同期接続中の人数'}
                >
                  <span className="text-sm leading-none">👥</span>
                  <span>{onlineCount} 名 接続中</span>
                  <ChevronDown className={`w-3 h-3 transition-transform ${isOnlineListOpen ? 'rotate-180' : ''}`} />
                </button>
                {isOnlineListOpen && (
                  <>
                    <div className="sb-inline-panel">
                      <div className="text-[10px] font-bold text-slate-500 px-2 py-1 border-b border-slate-100 mb-1">
                        同期接続中 ({onlineCount}名)
                      </div>
                      {onlineMembers.length === 0 ? (
                        <div className="text-xs text-slate-400 italic px-2 py-2 text-center">接続中のセッションはありません</div>
                      ) : (
                        <div className="max-h-64 overflow-y-auto scrollbar-thin">
                          {onlineMembers.map((m) => (
                            <div key={m.id} className="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-slate-50">
                              <span className="w-2 h-2 rounded-full bg-emerald-500 shrink-0 animate-pulse"></span>
                              <span className="text-xs text-slate-800 font-bold flex-1 truncate">{m.teacherName}</span>
                              {m.isSelf && <span className="text-[10px] bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded font-mono">あなた</span>}
                            </div>
                          ))}
                        </div>
                      )}
                      <div className="text-[10px] text-slate-400 px-2 pt-2 pb-1 border-t border-slate-100 mt-1 leading-snug">
                        ※ 同じルーム名({roomKey})の部屋を開いている端末を表示します。<br />15秒ごとに更新、最終更新から35秒以上経ったセッションは離脱として扱います。
                      </div>
                    </div>
                  </>
                )}
              </div>
            )}
            {/* v3.9: 今日の訪問者ボタン（管理者のみ表示） */}
            {isAdmin && (
            <div className="relative">
              <button
                type="button"
                onClick={() => setIsTodayVisitorsOpen((v) => !v)}
                title="今日このルームを開いた編集者の一覧（名前を設定した人だけ記録されます）"
                className="flex items-center gap-1.5 px-3 py-1.5 bg-violet-50 hover:bg-violet-100 active:bg-violet-200 border border-violet-200 text-violet-800 rounded-full text-xs font-bold transition-all shadow-sm cursor-pointer"
              >
                <span className="text-sm leading-none">📜</span>
                <span>今日の訪問者 {Object.keys(todayVisitors).length}名</span>
                <ChevronDown className={`w-3 h-3 transition-transform ${isTodayVisitorsOpen ? 'rotate-180' : ''}`} />
              </button>
              {isTodayVisitorsOpen && (
                <>
                  <div className="sb-inline-panel">
                    <div className="text-[10px] font-bold text-slate-500 px-2 py-1 border-b border-slate-100 mb-1 flex items-center justify-between gap-2">
                      <span>今日の訪問者 ({Object.keys(todayVisitors).length}名)</span>
                      <span className="font-mono text-slate-400">{(() => { const d = new Date(); return `${d.getMonth()+1}/${d.getDate()}`; })()}</span>
                    </div>
                    {Object.keys(todayVisitors).length === 0 ? (
                      <div className="text-xs text-slate-400 italic px-2 py-3 text-center leading-relaxed">今日はまだ訪問者がいません。<br />※ 編集者名を設定した端末のみ記録されます。</div>
                    ) : (
                      <div className="max-h-72 overflow-y-auto scrollbar-thin">
                        {Object.entries(todayVisitors).sort((a, b) => (b[1].lastSeenAt || 0) - (a[1].lastSeenAt || 0)).map(([name, v]) => {
                          const lastDate = v.lastSeenAt ? new Date(v.lastSeenAt) : null;
                          const lastStr = lastDate ? `${String(lastDate.getHours()).padStart(2,'0')}:${String(lastDate.getMinutes()).padStart(2,'0')}` : '?';
                          const isSelf = name === myTeacherName;
                          return (
                            <div key={name} className={`flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-slate-50 ${isSelf ? 'bg-indigo-50/50' : ''}`}>
                              <span className="text-sm leading-none">{isSelf ? '🙋' : '👤'}</span>
                              <span className="text-xs text-slate-800 font-bold flex-1 truncate" title={name}>{name}</span>
                              <span className="text-[10px] font-mono text-slate-500 shrink-0" title="最終接続時刻">{lastStr}</span>
                              <span className="text-[10px] font-bold bg-violet-100 text-violet-800 border border-violet-200 px-1.5 py-0.5 rounded shrink-0" title="今日の編集件数">{v.editCount || 0}件</span>
                              {isSelf && <span className="text-[9px] bg-indigo-100 text-indigo-700 px-1 py-0.5 rounded font-mono">あなた</span>}
                            </div>
                          );
                        })}
                      </div>
                    )}
                    {/* v3.13: ルーム登録者（過去全期間：このルームを編集者名付きで開いたことのある人全員） */}
                    <div className="mt-2 pt-2 border-t border-slate-200">
                      <div className="text-[10px] font-bold text-slate-500 px-2 py-1 flex items-center justify-between gap-2">
                        <span>📋 ルーム登録者 ({Object.keys(allMembers).length}名)</span>
                        <span className="font-mono text-slate-400">全期間</span>
                      </div>
                      {Object.keys(allMembers).length === 0 ? (
                        <div className="text-xs text-slate-400 italic px-2 py-3 text-center leading-relaxed">登録者はまだいません。<br />※ 編集者名を設定して開いた人だけが記録されます。</div>
                      ) : (
                        <div className="max-h-72 overflow-y-auto scrollbar-thin">
                          {Object.entries(allMembers).sort((a, b) => (b[1].lastSeenAt || 0) - (a[1].lastSeenAt || 0)).map(([name, v]) => {
                            const lastDate = v.lastSeenAt ? new Date(v.lastSeenAt) : null;
                            const lastStr = lastDate ? `${lastDate.getFullYear()}/${lastDate.getMonth()+1}/${lastDate.getDate()}` : '?';
                            const isSelf = name === myTeacherName;
                            const isToday = !!todayVisitors[name];
                            return (
                              <div key={'all-' + name} className={`flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-slate-50 ${isSelf ? 'bg-indigo-50/50' : ''}`}>
                                <span className="text-sm leading-none">{isSelf ? '🙋' : '👤'}</span>
                                <span className="text-xs text-slate-800 font-bold flex-1 truncate" title={name}>{name}</span>
                                {isToday && <span className="text-[9px] bg-emerald-100 text-emerald-700 border border-emerald-200 px-1 py-0.5 rounded font-mono shrink-0" title="今日も訪問">今日</span>}

                                <span>追加</span>
                              </button>

                                suffix={''} />

                                  <span className="flex items-center gap-1">

                                  </span>
                                  <span></span>
                                </button>

                                  </button>

                              <button onClick={() => setDatePickerState({ value: s.greetingDate || '', title: `${s.name} の事前挨拶日`, onSelect: (v) => { const upd = { greetingDate: v }; if (v && (!s.greetingStatus || s.greetingStatus === 'pending')) upd.greetingStatus = 'scheduled'; persistPartial(s.id, upd); } })}
                                className="text-[10px] font-semibold pl-1 hover:text-indigo-700 hover:underline cursor-pointer block text-left w-full">日時: <span className={s.greetingDate ? 'text-slate-700' : 'text-slate-400 italic'}>{s.greetingDate ? formatShortDate(s.greetingDate) : '未設定（タップ）'}</span></button>
                              {s.greetingTime    && <div className="text-[9px] text-slate-500 pl-1">時間: {s.greetingTime}</div>}
                              {s.greetingVisitor && <div className="text-[9px] text-slate-500 pl-1">引率: {s.greetingVisitor}</div>}
                              </>)}
                            </div>
                          </td>
                          <td data-list-column="gift" style={columnCellStyle('gift')} className="p-4 align-top">
                            <div className="space-y-1.5">
                              <ProgressToggleButton icon={Paperclip} label={(s.giftStatus || 'none') === 'brought' ? '持参済み' : (s.giftStatus || 'none') === 'bring' ? '持参する' : 'ー'}
                                status={s.giftStatus || 'none'} palette={(s.giftStatus || 'none') === 'brought' ? 'bg-emerald-50 border-emerald-200 text-emerald-800 hover:bg-emerald-100' : (s.giftStatus || 'none') === 'bring' ? 'bg-orange-50 border-orange-200 text-orange-800 hover:bg-orange-100' : 'bg-slate-100 border-slate-200 text-slate-500 hover:bg-slate-200'}
                                onClick={() => handleInstantToggle(s, 'giftStatus', s.giftStatus || 'none')}
                                locked={(s.lockedFields || []).includes('giftStatus')} onToggleLock={isAdmin ? () => toggleLockField(s, 'giftStatus') : null} isAdmin={isAdmin}
                                suffix={''} />
                            </div>
                          </td>
                          <td data-list-column="patrol" style={columnCellStyle('patrol')} className="p-4 align-top">
                            <div className="flex flex-col items-start gap-1 text-[10px] font-medium">
                              {(s.patrols || []).length === 0 && <span className="placeholder-empty mr-1">巡回 未設定</span>}
                              {(s.patrols || []).map((p) => (<label key={p.id} {...patrolCellHandlers(s.id, p.id)} className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded border border-slate-200 bg-white hover:bg-slate-50 cursor-pointer" title="長押し（0.5秒）で編集"><input type="checkbox" checked={!!p.done} onChange={() => handleTogglePatrol(s, p.id)} className="cursor-pointer accent-violet-600" /><span className={`font-bold ${p.done ? 'line-through text-slate-400' : 'text-slate-700'}`}>{p.teacher ? p.teacher + '　' : ''}{s.internshipType === 'observation' ? (p.time || '') : formatShortDate(p.date) + (p.time ? '　' + p.time : '')}</span><button onClick={(e) => { e.preventDefault(); handleRemovePatrol(s, p.id); }} title="削除" className="text-slate-400 hover:text-rose-600 leading-none cursor-pointer font-bold">×</button></label>))}
                              <button onClick={() => setDatePickerState({ value: '', title: `${s.name} の巡回日を追加`, onSelect: (v) => { if (!v) return; setTextEditState({ value: myTeacherName || '', title: '巡回担当教員を入力', label: '担当教員 (空欄可)', onSave: (te) => setTimeout(() => setTextEditState({ value: '', title: '巡回時間を入力', label: '時間 (例: 10:00 ※空欄可)', onSave: (t) => handleAddPatrol(s, v, t, te) }), 0) }); } })} className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded border border-dashed border-indigo-400 bg-white hover:bg-indigo-50 text-indigo-700 font-bold cursor-pointer"><Plus className="w-3 h-3" /><span>追加</span></button>
                            </div>
                          </td>
                          <td data-list-column="studentThankYou" style={columnCellStyle('studentThankYou')} className="p-4 align-top">
                            <div className="space-y-1.5">
                              <ProgressToggleButton icon={FileText} label={s.studentThankYouStatus === 'completed' ? '送付済' : s.studentThankYouStatus === 'none' ? '不要' : '未送付'}
                                status={s.studentThankYouStatus} palette={studentThankYouPalette}
                                onClick={() => handleInstantToggle(s, 'studentThankYouStatus', s.studentThankYouStatus)}
                                locked={(s.lockedFields || []).includes('studentThankYouStatus')} onToggleLock={isAdmin ? () => toggleLockField(s, 'studentThankYouStatus') : null} isAdmin={isAdmin}
                                suffix={''} />
                              {s.studentThankYouStatus === 'completed' && (
                                <button onClick={() => setDatePickerState({ value: s.studentThankYouDate || '', title: `${s.name} の生徒お礼状送付日`, onSelect: (v) => persistPartial(s.id, { studentThankYouDate: v }) })}
                                  className="text-[9px] text-slate-600 font-mono pl-1 hover:text-indigo-700 hover:underline cursor-pointer block text-left w-full">送付日: {s.studentThankYouDate ? formatShortDate(s.studentThankYouDate) : '未設定（タップ）'}</button>
                              )}
                            </div>
                          </td>
                          <td data-list-column="teacherThankYou" style={columnCellStyle('teacherThankYou')} className="p-4 align-top">
                            <div className="space-y-1.5">
                              <ProgressToggleButton icon={FileText} label={s.teacherThankYouStatus === 'completed' ? '送付済' : s.teacherThankYouStatus === 'none' ? '不要' : '未送付'}
                                status={s.teacherThankYouStatus} palette={teacherThankYouPalette}
                                onClick={() => handleInstantToggle(s, 'teacherThankYouStatus', s.teacherThankYouStatus)}
                                suffix={''} />
                              {s.teacherThankYouStatus === 'completed' && (
                                <button onClick={() => setDatePickerState({ value: s.teacherThankYouDate || '', title: `${s.name} の教師お礼状送付日`, onSelect: (v) => persistPartial(s.id, { teacherThankYouDate: v }) })}
                                  className="text-[9px] text-slate-600 font-mono pl-1 hover:text-indigo-700 hover:underline cursor-pointer block text-left w-full">送付日: {s.teacherThankYouDate ? formatShortDate(s.teacherThankYouDate) : '未設定（タップ）'}</button>
                              )}
                            </div>
                          </td>
                          <td data-list-column="actions" style={columnCellStyle('actions')} className="p-4 align-top">
                            <button type="button" onClick={() => setSelectedStudentDetail(s)} className="block w-full px-2 py-2 mb-2 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 rounded-lg font-bold text-xs cursor-pointer">詳細・編集</button>
                            {listViewMode === 'basic' && <button type="button" onClick={() => setMaterialModalStudentId(s.id)} className="block w-full px-2 py-1 border border-slate-200 rounded-lg text-[10px] hover:bg-amber-50 cursor-pointer">関連資料 {(s.materials || []).length}件</button>}
                            <div style={{ display: listViewMode === 'basic' ? 'none' : undefined }} className="flex items-start gap-2 opacity-80 group-hover:opacity-100 transition-opacity">
                              <div className="flex-1 min-w-0 w-[150px] max-w-[150px] space-y-1">
                                {(s.materials || []).map((m) => (
                                  <button key={m.id} onClick={() => { if (isPdfMaterial(m)) { if (!openPdfInNewTab(m)) showAlert('PDFを別タブで開けませんでした。ブラウザのポップアップ許可をご確認ください。'); } else { setMaterialPreview(m); } }} title={isPdfMaterial(m) ? `${m.name}（別タブで開く）` : m.name}
                                    className={`w-full max-w-full flex items-center gap-1 px-1.5 py-1 rounded-md text-[10px] font-bold cursor-pointer transition-all overflow-hidden border ${(m.name || '').includes('評価') ? 'bg-purple-300 hover:bg-purple-400 border-purple-500 text-purple-950 hover:text-purple-950' : 'bg-amber-50/60 hover:bg-amber-100 border-amber-200 text-slate-700 hover:text-amber-800'}`}>
                                    <span className="shrink-0 text-[11px] leading-none">{m.kind === 'url' ? '🔗' : m.mimeType?.startsWith('image/') ? '🖼️' : m.mimeType === 'application/pdf' ? '📄' : '📎'}</span>
                                    <span className="truncate flex-1 min-w-0 text-left whitespace-nowrap overflow-hidden">{m.name}</span>
                                  </button>
                                ))}
                                <button onClick={() => setMaterialModalStudentId(s.id)}
                  onDragEnter={(e) => { const types = Array.from(e.dataTransfer.types || []); if (types.includes('Files')) { e.preventDefault(); e.stopPropagation(); setMaterialDropTargetId(s.id); } }}
                  onDragOver={(e) => { const types = Array.from(e.dataTransfer.types || []); if (types.includes('Files')) { e.preventDefault(); e.stopPropagation(); e.dataTransfer.dropEffect = 'copy'; setMaterialDropTargetId(s.id); } }}
                  onDragLeave={(e) => { e.stopPropagation(); setMaterialDropTargetId((cur) => cur === s.id ? null : cur); }}
                  onDrop={(e) => { e.preventDefault(); e.stopPropagation(); setMaterialDropTargetId(null); const files = e.dataTransfer?.files; if (files && files.length > 0) handleDropFilesForMaterial(s.id, files); }}
                  title={(s.materials?.length || 0) > 0 ? 'クリックで関連資料を管理。ファイルをここにドラッグ＆ドロップしても追加できます。' : 'クリックで関連資料を追加。ファイルをここにドラッグ＆ドロップしても追加できます。'}
                                  className={`w-full flex items-center justify-center gap-1 px-1.5 py-1 border border-dashed text-[10px] font-bold cursor-pointer rounded-md transition-all ${materialDropTargetId === s.id ? 'bg-amber-100 border-amber-500 text-amber-800 ring-2 ring-amber-400 scale-105' : 'bg-white hover:bg-amber-50 border-slate-300 hover:border-amber-300 text-slate-500 hover:text-amber-700'}`}>
                                  <Paperclip className="w-3 h-3" />
                                  <span>{materialDropTargetId === s.id ? 'ここにドロップ' : (s.materials?.length || 0) > 0 ? '管理' : '追加'}</span>
                                </button>
                              </div>
                              <div className="flex flex-col items-center gap-1 shrink-0">
                                <button onClick={() => setSelectedStudentDetail(s)} title="詳細・編集"
                                  className="p-1.5 text-slate-600 hover:text-indigo-600 bg-white border border-slate-200 hover:border-indigo-200 rounded-lg shadow-sm transition-all active:scale-90 cursor-pointer">
                                  <Edit className="w-4 h-4" />
                                </button>
                                {isAdmin && (
                                  <button onClick={() => handleDeleteStudent(s.id)} title="削除（管理者のみ）"
                                    className="p-1.5 text-slate-400 hover:text-rose-600 bg-white border border-slate-200 hover:border-rose-200 rounded-lg shadow-sm transition-all active:scale-90 cursor-pointer">
                                    <Trash2 className="w-4 h-4" />
                                  </button>
                                )}
                              </div>
                            </div>
                          </td>
                        </tr>
                      );
                    }))
                    ]);
                  })()}
                </tbody>
              </table>
            </div>
            <div className="px-4 py-3 bg-slate-50 border-t border-slate-200 text-slate-500 text-[11px] flex flex-col sm:flex-row justify-between items-center gap-2">
              <span>表示中: {filteredStudents.length}名 / この実習期: {activeStudents.length}名　（{activePeriod.name}{isActivePeriodLocked ? "・終了済み" : ""}）</span>
              <span className="font-semibold text-slate-600">※ 各進捗ボタンをクリックするとその場で進捗状況を切り替えることができます。</span>
            </div>
          </div>
        ) : (
          <div key="view-calendar" className="bg-white border border-slate-200 rounded-2xl shadow-sm flex flex-col animate-fadeIn">
            <div className="sb-calendar-toolbar p-4 bg-slate-50 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3 rounded-t-2xl shadow-sm no-print">
              <div className="flex items-center gap-2">
                <button onClick={handlePrevMonth} className="p-1.5 hover:bg-slate-200 bg-white border border-slate-200 rounded-lg text-slate-700 transition-all cursor-pointer">
                  <ChevronLeft className="w-4 h-4" />
                </button>
                <h2 className="text-sm font-bold text-slate-900 min-w-[120px] text-center">{calendarYear}年 {calendarMonth + 1}月</h2>
                <button onClick={handleNextMonth} className="p-1.5 hover:bg-slate-200 bg-white border border-slate-200 rounded-lg text-slate-700 transition-all cursor-pointer">
                  <ChevronRight className="w-4 h-4" />
                </button>
              </div>
              <div className="flex items-center gap-3">
                <button onClick={handleToday} className="px-3 py-1.5 bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 text-xs font-bold rounded-xl transition-all cursor-pointer">今月</button>
                <div className="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200">
                  {[['all','全表示'],['student','生徒の予定'],['teacher','教師の予定']].map(([key, label]) => (
                    <button key={key} onClick={() => setCalendarFilter(key)} className={`px-2.5 py-1 rounded-lg text-[11px] font-bold cursor-pointer transition-all ${calendarFilter === key ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}>{label}</button>
                  ))}
                </div>
                <div className="flex flex-wrap items-center gap-3 text-[11px] font-semibold">
                  <span className="flex items-center gap-1.5"><span className="w-3.5 h-3.5 bg-yellow-100 border border-yellow-300 rounded-md block"></span><span>実習</span></span>
                  <span className="flex items-center gap-1.5"><span className="w-3.5 h-3.5 bg-pink-100 border border-pink-300 rounded-md block"></span><span>見学</span></span>
                  <span className="flex items-center gap-1.5"><span className="w-3.5 h-3.5 bg-green-200 border border-green-400 rounded-md block"></span><span>挨拶</span></span>
                  <span className="flex items-center gap-1.5"><span className="w-3.5 h-3.5 bg-blue-200 border border-blue-400 rounded-md block"></span><span>巡回</span></span>
                  <span className="flex flex-wrap items-center gap-2" aria-label="予定の右10%は学年色"><span>右側：学年</span>{['1','2','3',''].map(g=><span key={g} className="flex items-center gap-1"><span style={{backgroundColor:CALENDAR_GRADE_COLORS[g]||'#f1f5f9',width:14,height:14,borderRadius:3,display:'inline-block'}}></span>{g?g+'年':'未設定・他'}</span>)}</span>
                </div>
              </div>
            </div>

            {/* v3.8: 印刷専用の月見出し（カレンダーのスティッキーバーは no-print なので、紙面には月情報が残らない。これを補うため hidden print:block の見出しを追加） */}
            <div className="hidden print:block px-4 py-3 text-sm font-bold border-b border-slate-300 text-center">{calendarYear}年 {calendarMonth + 1}月の予定（{calendarFilter === 'all' ? '全表示' : calendarFilter === 'student' ? '生徒の予定のみ' : '教師の予定のみ'}）</div>
            <div className="grid grid-cols-7 border-b border-slate-200 bg-slate-100 text-center text-xs font-bold text-slate-600 py-2 select-none">
              <div className="text-rose-600">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div className="text-sky-600">土</div>
            </div>

            <div className="grid grid-cols-7 grid-rows-6 divide-x divide-y divide-slate-200 min-h-[500px] bg-slate-50">
              {calendarDays.map((cell, index) => {
                const dayEvents = getEventsForDate(cell.year, cell.month, cell.day);
                const today = new Date();
                const isToday = today.getFullYear() === cell.year && today.getMonth() === cell.month && today.getDate() === cell.day;
                const isInternshipDay = hasPeriodEventOnDate(cell.year, cell.month, cell.day);
                const dayOfWeek = index % 7;

                return (
                  <div
                    key={`${cell.year}-${cell.month}-${cell.day}-${index}`}
                    className={`p-1.5 flex flex-col min-h-[80px] transition-all relative group ${cell.isCurrentMonth ? 'bg-white' : 'bg-slate-50/50 text-slate-400'} ${isToday ? 'ring-2 ring-indigo-500 ring-inset bg-indigo-50/25' : ''}`}
                  >
                    <div className="flex items-center justify-between mb-1 select-none">
                      <span className={`text-xs font-bold ${isToday ? 'bg-indigo-600 text-white w-5 h-5 rounded-full flex items-center justify-center' : cell.isCurrentMonth ? (dayOfWeek === 0 ? 'text-rose-600' : dayOfWeek === 6 ? 'text-sky-600' : 'text-slate-800') : 'text-slate-400'}`}>
                        {cell.day}
                      </span>
                    </div>

                    <div className="flex flex-col">
                      {(() => {
                        const renderEvent = (ev, evIdx) => {
                          if (ev.type === 'period') {
                            return (
                              <div key={evIdx} data-calendar-grade={ev.student.grade||'unset'} style={calendarGradeStyle(ev.student.grade)} className={`calendar-grade-event text-[10px] px-1.5 py-0.5 rounded border font-bold select-none transition-colors shadow-sm flex items-center justify-between gap-1 ${ev.color}`} title={calendarGradeLabel(ev.student.grade)+'\n'+(ev.title || ev.label)}>
                                <button type="button" data-calendar-workflow-popup onClick={e=>{e.stopPropagation();openCalendarWorkflow(ev.student);}} className="truncate text-left flex-1 cursor-pointer" aria-label={`${ev.label}の業務フローを開く`}>{ev.label}</button>
                                <button onClick={(e) => { e.stopPropagation(); handleRemoveInternshipDate(ev.student, ev.dateKey); }}
                                  title="この日を実習日から外す"
                                  className="hover:bg-white/60 rounded px-1 shrink-0 text-[10px] font-bold cursor-pointer leading-none">×</button>
                              </div>
                            );
                          }
                          return (
                            <button type="button" key={evIdx} data-calendar-workflow-popup data-calendar-grade={ev.student.grade||'unset'} style={calendarGradeStyle(ev.student.grade)} onClick={e=>{e.stopPropagation();openCalendarWorkflow(ev.student);}}
                              className={`block w-full text-left text-[10px] px-1.5 py-0.5 rounded border font-bold truncate select-none transition-colors shadow-sm cursor-pointer calendar-grade-event ${ev.color}`} title={calendarGradeLabel(ev.student.grade)+'\n'+ev.label+'（業務フローを開く）'}>
                              {ev.label}
                            </button>
                          );
                        };
                        const isObservation = (ev) => ev.type === 'period' && ev.student && ev.student.internshipType === 'observation';
                        const topEvents = dayEvents.filter((ev) => !isObservation(ev));
                        const bottomEvents = dayEvents.filter((ev) => isObservation(ev));
                        const weekStart = Math.floor(index / 7) * 7;
                        let maxTop = 0, maxBottom = 0;
                        for (let wi = weekStart; wi < weekStart + 7 && wi < calendarDays.length; wi++) {
                          const wc = calendarDays[wi];
                          const wevs = getEventsForDate(wc.year, wc.month, wc.day);
                          const tc = wevs.filter((ev) => !isObservation(ev)).length;
                          const bc = wevs.filter((ev) => isObservation(ev)).length;
                          if (tc > maxTop) maxTop = tc;
                          if (bc > maxBottom) maxBottom = bc;
                        }
                        return (
                          <>
                            <div className="space-y-1 min-h-[18px] pb-1 border-b border-dashed border-slate-200">
                              {Array.from({ length: Math.max(maxTop, 1) }).map((_, i) => topEvents[i] ? renderEvent(topEvents[i], i) : <div key={`top-spc-${i}`} className="h-[18px]" aria-hidden="true" />)}
                            </div>
                            <div className="space-y-1 min-h-[18px] pt-1">
                              {Array.from({ length: Math.max(maxBottom, 1) }).map((_, i) => bottomEvents[i] ? renderEvent(bottomEvents[i], i) : <div key={`bot-spc-${i}`} className="h-[18px]" aria-hidden="true" />)}
                            </div>
                          </>
                        );
                      })()}
                    </div>

                    <button
                      type="button"
                      onClick={(e) => { e.stopPropagation(); openAddModal([formatDateKey(cell.year, cell.month, cell.day)]); }}
                      title="この日付で実習生を登録するためのモーダルを開きます。モーダル内の『登録』ボタンを押すまで予定は作成されません。"
                      className="absolute bottom-1 right-1 opacity-70 hover:opacity-100 transition-opacity bg-white border border-indigo-300 hover:border-indigo-500 hover:bg-indigo-50 rounded-full p-1 cursor-pointer shadow-sm"
                    >
                      <Plus className="w-4 h-4 text-indigo-600" />
                    </button>
                  </div>
                );
              })}
            </div>
          </div>
        )}
      {isBulkImportOpen && (<BulkImportModal onClose={() => setIsBulkImportOpen(false)} onCommit={handleBulkImport} onAlert={showAlert} defaultTeacher={myTeacherName} />)}

      </main>

      {/* v3.26.1: 表示切替と登録を右下に常駐。端末のセーフエリアを避ける。 */}
      <div className="sb-floating fixed z-40 flex flex-col items-end gap-3 no-print" style={{ right: 'max(16px, env(safe-area-inset-right))', bottom: 'max(16px, env(safe-area-inset-bottom))', maxWidth: 'calc(100vw - 32px)' }}>
        <div role="group" aria-label="表示切替" className="sb-view-switch flex items-center gap-1 p-1.5 bg-white border border-slate-300 rounded-full shadow-2xl">
          {[
            { key: 'calendar', icon: Calendar, label: 'カレンダー' },
            { key: 'list', icon: List, label: 'リスト一覧' },
            { key: 'workflow', icon: FileText, label: '業務一覧' }
          ].map(({ key, icon: Icon, label }) => (
            <button key={key} type="button" onClick={() => key === 'workflow' ? openWorkflowOverview() : setCurrentView(key)} aria-pressed={currentView === key}
              title={`${label}に切り替えます`}
              className={`inline-flex items-center justify-center gap-1.5 px-3 py-2.5 min-h-[44px] rounded-full text-xs font-bold cursor-pointer transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 ${currentView === key ? 'list-preset-active border border-indigo-300' : 'bg-white border border-transparent hover:bg-slate-100'}`}>
              <Icon className="w-4 h-4 shrink-0" aria-hidden="true" />
              <span className="whitespace-nowrap">{label}</span>
            </button>
          ))}
        </div>
        <div className="sb-float-actions">
