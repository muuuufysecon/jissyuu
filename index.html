      '菓子折',
      '巡回・同行予定一覧', '巡回完了件数',
      '特記事項・配慮事項'
    ];
    const labelOf = {
      phone:    (s) => s === 'completed' ? '完了'   : s === 'none' ? '不要' : '未完了',
      doc:      (s) => s === 'completed' ? '完了'   : s === 'none' ? '不要' : '未完了',
      greeting: (s) => s === 'completed' ? '挨拶終了' : s === 'scheduled' ? '挨拶日決定' : s === 'unadjusted' ? '未調整' : '必要なし'
    };
    const rows = filteredStudents.map((s) => [
      s.name || '', s.grade ? `${s.grade}年` : '', s.classVal ? `${s.classVal}組` : '', s.teacher || '',
      s.location || '', (s.internshipDates || []).length, (s.internshipDates || []).join(' / '),
      labelOf.phone(s.phoneStatus), s.phoneDate || '',
      labelOf.doc(s.docStatus), s.docDate || '',
      labelOf.greeting(s.greetingStatus), s.greetingDate || '', s.greetingTime || '', s.greetingVisitor || '',
      (s.giftStatus || 'none') === 'brought' ? '持参済み' : (s.giftStatus || 'none') === 'bring' ? '持参する' : 'ー',
      (s.patrols || []).map((p) => `${p.teacher ? p.teacher + ' ' : ''}${p.date}${p.time ? ' ' + p.time : ''}${p.done ? '(済)' : ''}`).join(' / '), (s.patrols || []).filter((p) => p.done).length,
      s.notes || ''
    ]);
    const csv = [
      headers.join(','),
      ...rows.map((row) => row.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(','))
    ].join('\r\n');
    const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
    const blob = new Blob([bom, csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    const dateStr = new Date().toLocaleDateString('ja-JP').replace(/\//g, '');
    link.href = url;
    link.download = `現場実習進捗リスト_${roomKey}_${dateStr}.csv`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  };

  const handleBulkImport = async (rows) => {
    setIsLoading(true);
    try {
      if (connectionStatus === 'connected' && window.firebase) {
        const db = window.firebase.app().firestore();
        const ref = db.collection('rooms').doc(roomKey).collection('students');
        const created = [];
        for (const r of rows) {
          const docRef = await ref.add(r);
          created.push({ id: docRef.id, ...r });
        }
        created.forEach((s) => recordCreate(s));
      } else {
        const created = rows.map((r, i) => ({ id: 'local-' + Date.now() + '-' + i, ...r }));
        const updated = [...students, ...created];
        setStudents(updated);
        localStorage.setItem(`local_students_${roomKey}`, JSON.stringify(updated));
        created.forEach((s) => recordCreate(s));
      }
      setIsBulkImportOpen(false);
      showAlert(`${rows.length}名を一括登録しました。`);
    } catch (e) {
      showAlert(`一括登録に失敗しました: ${e.message}`);
    } finally {
      setIsLoading(false);
    }
  };

  const toggleSelectAll = () => {
    if (filteredStudents.length > 0 && selectedIds.size === filteredStudents.length) {
      setSelectedIds(new Set());
    } else {
      setSelectedIds(new Set(filteredStudents.map((s) => s.id)));
    }
  };

  const toggleSelectOne = (id) => {
    setSelectedIds((prev) => { const n = new Set(prev); if (n.has(id)) n.delete(id); else n.add(id); return n; });
  };

  const handleBulkDelete = () => {
    if (selectedIds.size === 0) return;
    showConfirm(`選択中の${selectedIds.size}名の進捗データを削除してもよろしいですか？「戻る」ボタンで取り消せます。`, async () => {
      const targets = students.filter((s) => selectedIds.has(s.id));
      setIsLoading(true);
      try {
        if (connectionStatus === 'connected' && window.firebase) {
          const db = window.firebase.app().firestore();
          for (const t of targets) {
            await db.collection('rooms').doc(roomKey).collection('students').doc(t.id).delete();
            recordDelete(t);
          }
        } else {
          const updated = students.filter((s) => !selectedIds.has(s.id));
          setStudents(updated);
          localStorage.setItem(`local_students_${roomKey}`, JSON.stringify(updated));
          targets.forEach((t) => recordDelete(t));
        }
        setSelectedIds(new Set());
        showAlert(`${targets.length}名を削除しました。`);
      } catch (e) {
        showAlert(`一括削除に失敗しました: ${e.message}`);
      } finally {
        setIsLoading(false);
      }
    });
  };

  return (
    <div className="min-h-screen bg-slate-50 text-slate-800 flex flex-col font-sans">

      {/* v3.7: 画面上部の掲示板。ルーム単位で共有され、投稿者名と削除ボタン付き。 */}
      <div className="bg-gradient-to-r from-amber-50 via-yellow-50 to-amber-50 border-b border-amber-300 shadow-sm no-print">
        <div className="max-w-7xl mx-auto px-4 py-2">
          <div className="flex items-center gap-2">
            <button type="button" onClick={() => setIsBoardOpen((v) => !v)} className="flex items-center gap-2 text-xs font-bold text-amber-900 hover:text-amber-700 cursor-pointer">
              <span className="text-base">📣</span>
              <span>掲示板</span>
              <span className="bg-amber-200 text-amber-900 px-2 py-0.5 rounded-full text-[10px] font-mono">{boardPosts.length}件</span>
              <ChevronDown className={"w-3.5 h-3.5 transition-transform " + (isBoardOpen ? "rotate-180" : "")} />
            </button>
            <button type="button" onClick={(e) => { e.stopPropagation(); setBoardHistoryTab('deleted'); setIsBoardHistoryOpen(true); }} title="掲示板の「削除された投稿」と「非表示にした投稿」の履歴を表示します" className="shrink-0 inline-flex items-center gap-1 px-2 py-1 bg-white hover:bg-indigo-50 active:bg-indigo-100 text-slate-700 hover:text-indigo-700 border border-slate-200 hover:border-indigo-300 rounded-lg text-[10px] font-bold cursor-pointer shadow-sm transition-all">
<span className="text-[11px] leading-none">📜</span>
<span>履歴</span>
{((boardDeletedHistory || []).length + (boardHiddenHistory || []).length) > 0 && (
<span className="text-[9px] font-mono bg-slate-100 text-slate-600 border border-slate-200 rounded px-1 py-0.5">{(boardDeletedHistory || []).length + (boardHiddenHistory || []).length}</span>
)}
</button>
{!isBoardOpen && boardPosts[0] && (
              <div className="text-[11px] text-amber-900 truncate flex-1 min-w-0">
                <span className="font-bold">{boardPosts[0].author || '匿名'}:</span> {boardPosts[0].message}
              </div>
            )}
          </div>
          {isBoardOpen && (
            <div className="mt-2 space-y-2">
              <form onSubmit={(e) => { e.preventDefault(); if (!boardInput.trim()) return; addBoardPost(myTeacherName || '匿名', boardInput.trim()); setBoardInput(''); }} className="flex items-start gap-2">
                <div className="flex-shrink-0 bg-amber-100 border border-amber-300 px-2.5 py-1.5 rounded-lg text-[11px] font-bold text-amber-900 whitespace-nowrap" title="投稿者名。「編集者名」と同じ。">
                  {myTeacherName || '匿名'}
                </div>
                <textarea value={boardInput} onChange={(e) => setBoardInput(e.target.value)} placeholder="連絡事項やお知らせを入力（CtrlまたはCmd + Enter で投稿）" rows={1} onKeyDown={(e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); if (boardInput.trim()) { addBoardPost(myTeacherName || '匿名', boardInput.trim()); setBoardInput(''); } } }} className="flex-1 bg-white border border-amber-300 focus:border-amber-500 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-amber-300 text-slate-800 resize-y min-h-[34px]" />
                <button type="submit" disabled={!boardInput.trim()} className={"px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap shrink-0 " + (boardInput.trim() ? "bg-amber-600 hover:bg-amber-700 text-white cursor-pointer shadow-sm" : "bg-slate-200 text-slate-400 cursor-not-allowed")}>投稿</button>
              </form>
              {boardPosts.length === 0 ? (
                <p className="text-[11px] text-amber-700/70 italic text-center py-2">まだ投稿はありません。</p>
              ) : (
                <div className="space-y-1 max-h-56 overflow-y-auto scrollbar-thin pr-1">
                  {boardPosts.map((p) => { const ts = p.createdAt; const ms = ts && typeof ts === 'object' && ts.toMillis ? ts.toMillis() : (typeof ts === 'number' ? ts : 0); const timeStr = ms ? new Date(ms).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : ''; const canDelete = !myTeacherName || !p.author || p.author === '匿名' || p.author === myTeacherName; return (
                    <div key={p.id} className="flex items-start gap-2 bg-white/80 border border-amber-200 rounded-lg px-3 py-2 text-xs">
                      <div className="shrink-0 min-w-[80px]">
                        <div className="font-bold text-amber-900 text-[11px] truncate">{p.author || '匿名'}</div>
                        <div className="text-[9px] text-slate-500 font-mono">{timeStr}</div>
                      </div>
                      <div className="flex-1 text-slate-800 whitespace-pre-wrap break-words leading-relaxed">{p.message}</div>
                      <div className="shrink-0 flex flex-col gap-1">{myTeacherName && p.author === myTeacherName ? (<><button type="button" onClick={() => hideBoardPost(p.id)} title="この投稿を自分の画面から非表示にします（他の人の画面には残ります）" className="px-2 py-1 bg-white hover:bg-slate-50 border border-slate-300 text-slate-700 rounded-lg text-[10px] font-bold cursor-pointer whitespace-nowrap">非表示</button><button type="button" onClick={() => showConfirm('この投稿を全員の画面から削除しますか？この操作は取り消せません。', () => deleteBoardPost(p.id, myTeacherName || '匿名'))} title="自分の投稿を全員の画面から削除します" className="px-2 py-1 bg-white hover:bg-rose-50 border border-rose-200 text-rose-700 rounded-lg text-[10px] font-bold cursor-pointer whitespace-nowrap">全員削除</button></>) : (<button type="button" onClick={() => hideBoardPost(p.id)} title="この投稿を自分の画面から非表示にします（他の人の画面には残ります）" className="px-2 py-1 bg-white hover:bg-slate-50 border border-slate-300 text-slate-700 rounded-lg text-[10px] font-bold cursor-pointer whitespace-nowrap">非表示</button>)}</div>
                    </div>
                  ); })}
                </div>
              )}
            </div>
          )}
        </div>
      </div>


      {/* v3.6: 起動パスワードロック画面。@kirari を入力するまでアプリ操作をブロック */}
      {pendingFileAction && (
        <div className="fixed inset-0 z-[300] bg-slate-900/70 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-200 animate-scaleIn">
            <div className="bg-gradient-to-r from-indigo-500 to-purple-600 px-6 py-5 text-white">
              <div className="flex items-center gap-3">
                <Key className="w-7 h-7" />
                <div>
                  <div className="text-lg font-extrabold">パスワードを入力</div>
                  <div className="text-xs text-indigo-100">この保存ファイルを開くにはパスワードが必要です</div>
                </div>
              </div>
            </div>
            <form onSubmit={(e) => { e.preventDefault(); if (passwordInput.trim() === '@kirari') { const action = pendingFileAction; setPasswordError(''); setPasswordInput(''); setPendingFileAction(null); try { localStorage.setItem('file_unlock_date', getTodayString()); } catch (err) {} if (typeof action === 'function') { try { action(); } catch (err) {} } } else { setPasswordError('パスワードが違います。'); } }} className="p-6 space-y-4">
              <div>
                <label className="text-xs font-bold text-slate-700 mb-1.5 block">パスワード</label>
                <input type="password" autoFocus value={passwordInput} onChange={(e) => { setPasswordInput(e.target.value); setPasswordError(''); }} className="w-full px-4 py-2.5 border-2 border-slate-200 focus:border-indigo-400 rounded-xl text-sm font-bold outline-none transition-colors" placeholder="パスワードを入力" />
                {passwordError && <div className="mt-2 text-xs text-rose-700 font-bold">⚠ {passwordError}</div>}
              </div>
              <div className="flex gap-2"><button type="button" onClick={() => { setPendingFileAction(null); setPasswordInput(''); setPasswordError(''); }} className="flex-1 px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-bold transition-colors">キャンセル</button><button type="submit" className="flex-1 px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-extrabold transition-colors shadow-sm">開く</button></div>
              <p className="text-[10px] text-slate-500 leading-relaxed">※ セキュリティのため、保存ファイルを開くにはパスワードが必要です。一度入力すると、その日のうちは再入力なしで開けます（翌日には再度入力が必要になります）。</p>
            </form>
          </div>
        </div>
      )}

      {/* 隠しファイル入力: 「config.js を読み込む」ボタンから呼ばれる */}
      <input
        ref={configFileInputRef}
        type="file"
        accept=".js,.json,.txt,application/json,text/javascript,text/plain"
        className="hidden"
        onChange={(e) => {
          const file = e.target.files?.[0];
          if (file && typeof window.__loadConfigFromFile === 'function') {
            window.__loadConfigFromFile(file);
          }
          e.target.value = '';
        }}
      />

      {/* v3.6: 編集者名入力モーダル（初回接続時に自動表示 / ヘッダーの✏️ボタンからも開ける） */}
      {isNamePromptOpen && (
        <div className="fixed inset-0 z-[150] bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn">
          <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-200">
            <div className="bg-gradient-to-r from-indigo-500 to-purple-600 px-6 py-4">
              <div className="flex items-center gap-3 text-white">
                <span className="text-3xl">✏️</span>
                <div>
                  <div className="text-lg font-extrabold">編集者名を入力</div>
                  <div className="text-xs text-indigo-100">この端末を使うあなたの名前を教えてください</div>
                </div>
              </div>
            </div>
            <div className="p-6 space-y-4">
              <div>
                <label className="text-xs font-bold text-slate-700 mb-1.5 block">あなたの名前（編集者名）</label>
                <input
                  type="text"
                  value={tempTeacherName}
                  onChange={(e) => setTempTeacherName(e.target.value)}
                  onKeyDown={(e) => {
                    if (e.key === 'Enter' && tempTeacherName.trim()) {
                      setMyTeacherName(tempTeacherName.trim());
                      setIsNamePromptOpen(false);
                    } else if (e.key === 'Escape') {
                      setIsNamePromptOpen(false);
                    }
                  }}
                  placeholder="例: 加藤 / 須田先生 / 北原 など"
                  autoFocus
                  className="w-full px-4 py-2.5 border-2 border-slate-200 focus:border-indigo-400 rounded-xl text-sm font-bold outline-none transition-colors"
                />
              </div>
              <div className="bg-sky-50 border border-sky-200 text-sky-800 text-[11px] p-3 rounded-lg leading-relaxed">
                <strong className="font-bold">この名前の使い道:</strong><br />
                ・「👥 接続中」一覧に表示されます<br />
                ・このPCで行ったコメント・編集の記録に使われます<br />
                ・後からヘッダーの ✏️ ボタンや「環境設定」でいつでも変更できます
              </div>
              <div className="flex items-center gap-2 pt-2">
                <button
                  onClick={() => setIsNamePromptOpen(false)}
                  className="flex-1 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition-colors"
                >
                  あとで設定（匿名のまま）
                </button>
                <button
                  disabled={!tempTeacherName.trim()}
                  onClick={() => {
                    setMyTeacherName(tempTeacherName.trim());
                    setIsNamePromptOpen(false);
                  }}
                  className="flex-1 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white rounded-xl text-xs font-extrabold transition-colors shadow-sm"
                >
                  この名前で保存
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* 読み込み結果トースト（環境設定ポップアップから取り込んだときに表示） */}
      {(configDropOverlay === 'success' || configDropOverlay === 'error') && (
        <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-[200] px-4 py-3 rounded-xl shadow-2xl border max-w-md text-xs font-bold animate-slideDown ${configDropOverlay === 'success' ? 'bg-emerald-50 border-emerald-300 text-emerald-900' : 'bg-rose-50 border-rose-300 text-rose-900'}`}>
          <div className="flex items-start gap-2">
            <span className="text-base shrink-0">{configDropOverlay === 'success' ? '✅' : '⚠️'}</span>
            <span className="leading-relaxed">{configDropMessage}</span>
          </div>
        </div>
      )}

      <header className="bg-white border-b border-slate-200 shrink-0 shadow-sm no-print">
        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
          <div className="flex items-center gap-3">
            <div>
              <div className="flex items-center gap-2">
                <h1 className="text-lg font-bold tracking-tight text-slate-900">Work Experience Progress Status</h1>
                <span className="text-[10px] bg-slate-100 text-slate-600 font-mono px-1.5 py-0.5 rounded border border-slate-200">v3.18 HTML</span>
                {isConfigFromFile && <span className="text-[10px] bg-emerald-50 text-emerald-700 font-mono px-1.5 py-0.5 rounded border border-emerald-200" title="config.js から Firebase 接続情報を読み込んでいます">config.js 適用中</span>}
              </div>
              <p className="text-xs text-slate-500">教員間リアルタイム同期・実習開始/終了日カレンダーピッカー・履歴復元ボード</p>
            </div>
          </div>

          <div className="flex items-center gap-2">
            <ConnectionBadge status={connectionStatus} roomKey={roomKey} />
            {/* v3.9: 管理者バッジ。管理者としてログイン中のときだけ表示。クリックでログアウト確認。 */}
            {isAdmin && (
              <button
                type="button"
                onClick={() => { showConfirm('管理者モードからログアウトしますか？ロック項目が再び編集できなくなります。', () => logoutAdmin()); }}
                title="クリックで管理者ログアウト"
                className="flex items-center gap-1.5 px-3 py-1.5 bg-amber-50 hover:bg-amber-100 border border-amber-300 text-amber-800 rounded-full text-xs font-bold transition-all shadow-sm cursor-pointer"
              >
                <span className="text-sm leading-none">🛡️</span>
                <span>管理者</span>
              </button>
            )}
            {/* v3.6: 編集者名バッジ。未設定のときは赤くパルスして気づかせる。 */}
            <button
              onClick={() => { setTempTeacherName(myTeacherName || ''); setIsNamePromptOpen(true); }}
              className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold transition-all shadow-sm border ${myTeacherName ? 'bg-indigo-50 hover:bg-indigo-100 border-indigo-200 text-indigo-800' : 'bg-rose-50 hover:bg-rose-100 border-rose-300 text-rose-700 animate-pulse'}`}
              title="編集者名（あなたの名前）を設定・変更します。「接続中」一覧や記録に使われます。"
            >
              <span className="text-sm leading-none">✏️</span>
              <span className="max-w-[120px] truncate">{myTeacherName || '名前を入力'}</span>
            </button>
            {connectionStatus === 'connected' && (
              <div className="relative">
                <button
                  type="button"
                  onClick={() => setIsOnlineListOpen((v) => !v)}
                  className="flex items-center gap-1.5 px-3 py-1.5 bg-sky-50 hover:bg-sky-100 active:bg-sky-200 border border-sky-200 text-sky-800 rounded-full text-xs font-bold transition-all shadow-sm cursor-pointer"
                  title={onlineMembers.length > 0 ? 'クリックで接続中の先生の一覧を表示' : '同期接続中の人数'}
                >
                  <span className="text-sm leading-none">👥</span>
                  <span>{onlineCount} 名 接続中</span>
                  <ChevronDown className={`w-3 h-3 transition-transform ${isOnlineListOpen ? 'rotate-180' : ''}`} />
                </button>
                {isOnlineListOpen && (
                  <>
                    <div className="fixed inset-0 z-40" onClick={() => setIsOnlineListOpen(false)} />
                    <div className="absolute right-0 top-full mt-1 bg-white border border-slate-200 rounded-xl shadow-2xl p-2 min-w-[220px] z-50 animate-slideDown">
                      <div className="text-[10px] font-bold text-slate-500 px-2 py-1 border-b border-slate-100 mb-1">
                        同期接続中 ({onlineCount}名)
                      </div>
                      {onlineMembers.length === 0 ? (
                        <div className="text-xs text-slate-400 italic px-2 py-2 text-center">接続中のセッションはありません</div>
                      ) : (
                        <div className="max-h-64 overflow-y-auto scrollbar-thin">
                          {onlineMembers.map((m) => (
                            <div key={m.id} className="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-slate-50">
                              <span className="w-2 h-2 rounded-full bg-emerald-500 shrink-0 animate-pulse"></span>
                              <span className="text-xs text-slate-800 font-bold flex-1 truncate">{m.teacherName}</span>
                              {m.isSelf && <span className="text-[10px] bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded font-mono">あなた</span>}
                            </div>
                          ))}
                        </div>
                      )}
                      <div className="text-[10px] text-slate-400 px-2 pt-2 pb-1 border-t border-slate-100 mt-1 leading-snug">
                        ※ 同じルーム名({roomKey})の部屋を開いている端末を表示します。<br />25秒ごとに更新、最終更新から60秒以上経ったセッションは離脱として扱います。
                      </div>
                    </div>
                  </>
                )}
              </div>
            )}
            {/* v3.9: 今日の訪問者ボタン（管理者のみ表示） */}
            {isAdmin && (
            <div className="relative">
              <button
                type="button"
                onClick={() => setIsTodayVisitorsOpen((v) => !v)}
                title="今日このルームを開いた編集者の一覧（名前を設定した人だけ記録されます）"
                className="flex items-center gap-1.5 px-3 py-1.5 bg-violet-50 hover:bg-violet-100 active:bg-violet-200 border border-violet-200 text-violet-800 rounded-full text-xs font-bold transition-all shadow-sm cursor-pointer"
              >
                <span className="text-sm leading-none">📜</span>
                <span>今日の訪問者 {Object.keys(todayVisitors).length}名</span>
                <ChevronDown className={`w-3 h-3 transition-transform ${isTodayVisitorsOpen ? 'rotate-180' : ''}`} />
              </button>
              {isTodayVisitorsOpen && (
                <>
                  <div className="fixed inset-0 z-40" onClick={() => setIsTodayVisitorsOpen(false)} />
                  <div className="absolute right-0 top-full mt-1 bg-white border border-slate-200 rounded-xl shadow-2xl p-2 min-w-[280px] z-50 animate-slideDown">
                    <div className="text-[10px] font-bold text-slate-500 px-2 py-1 border-b border-slate-100 mb-1 flex items-center justify-between gap-2">
                      <span>今日の訪問者 ({Object.keys(todayVisitors).length}名)</span>
                      <span className="font-mono text-slate-400">{(() => { const d = new Date(); return `${d.getMonth()+1}/${d.getDate()}`; })()}</span>
                    </div>
                    {Object.keys(todayVisitors).length === 0 ? (
                      <div className="text-xs text-slate-400 italic px-2 py-3 text-center leading-relaxed">今日はまだ訪問者がいません。<br />※ 編集者名を設定した端末のみ記録されます。</div>
                    ) : (
                      <div className="max-h-72 overflow-y-auto scrollbar-thin">
                        {Object.entries(todayVisitors).sort((a, b) => (b[1].lastSeenAt || 0) - (a[1].lastSeenAt || 0)).map(([name, v]) => {
                          const lastDate = v.lastSeenAt ? new Date(v.lastSeenAt) : null;
                          const lastStr = lastDate ? `${String(lastDate.getHours()).padStart(2,'0')}:${String(lastDate.getMinutes()).padStart(2,'0')}` : '?';
                          const isSelf = name === myTeacherName;
                          return (
                            <div key={name} className={`flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-slate-50 ${isSelf ? 'bg-indigo-50/50' : ''}`}>
                              <span className="text-sm leading-none">{isSelf ? '🙋' : '👤'}</span>
                              <span className="text-xs text-slate-800 font-bold flex-1 truncate" title={name}>{name}</span>
                              <span className="text-[10px] font-mono text-slate-500 shrink-0" title="最終接続時刻">{lastStr}</span>
                              <span className="text-[10px] font-bold bg-violet-100 text-violet-800 border border-violet-200 px-1.5 py-0.5 rounded shrink-0" title="今日の編集件数">{v.editCount || 0}件</span>
                              {isSelf && <span className="text-[9px] bg-indigo-100 text-indigo-700 px-1 py-0.5 rounded font-mono">あなた</span>}
                            </div>
                          );
                        })}
                      </div>
                    )}
                    {/* v3.13: ルーム登録者（過去全期間：このルームを編集者名付きで開いたことのある人全員） */}
                    <div className="mt-2 pt-2 border-t border-slate-200">
                      <div className="text-[10px] font-bold text-slate-500 px-2 py-1 flex items-center justify-between gap-2">
                        <span>📋 ルーム登録者 ({Object.keys(allMembers).length}名)</span>
                        <span className="font-mono text-slate-400">全期間</span>
                      </div>
                      {Object.keys(allMembers).length === 0 ? (
                        <div className="text-xs text-slate-400 italic px-2 py-3 text-center leading-relaxed">登録者はまだいません。<br />※ 編集者名を設定して開いた人だけが記録されます。</div>
                      ) : (
                        <div className="max-h-72 overflow-y-auto scrollbar-thin">
                          {Object.entries(allMembers).sort((a, b) => (b[1].lastSeenAt || 0) - (a[1].lastSeenAt || 0)).map(([name, v]) => {
                            const lastDate = v.lastSeenAt ? new Date(v.lastSeenAt) : null;
                            const lastStr = lastDate ? `${lastDate.getFullYear()}/${lastDate.getMonth()+1}/${lastDate.getDate()}` : '?';
                            const isSelf = name === myTeacherName;
                            const isToday = !!todayVisitors[name];
                            return (
                              <div key={'all-' + name} className={`flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-slate-50 ${isSelf ? 'bg-indigo-50/50' : ''}`}>
                                <span className="text-sm leading-none">{isSelf ? '🙋' : '👤'}</span>
                                <span className="text-xs text-slate-800 font-bold flex-1 truncate" title={name}>{name}</span>
                                {isToday && <span className="text-[9px] bg-emerald-100 text-emerald-700 border border-emerald-200 px-1 py-0.5 rounded font-mono shrink-0" title="今日も訪問">今日</span>}
                                <span className="text-[10px] font-mono text-slate-500 shrink-0" title="最終訪問日">{lastStr}</span>
                                <span className="text-[10px] font-bold bg-violet-100 text-violet-800 border border-violet-200 px-1.5 py-0.5 rounded shrink-0" title="累計編集件数">{v.editCount || 0}件</span>
                                {isSelf && <span className="text-[9px] bg-indigo-100 text-indigo-700 px-1 py-0.5 rounded font-mono">あなた</span>}
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                    <div className="text-[10px] text-slate-400 px-2 pt-2 pb-1 border-t border-slate-100 mt-1 leading-snug">※ 今日（{(() => { const d = new Date(); return `${d.getMonth()+1}月${d.getDate()}日`; })()}）に編集者名を設定してこのルームを開いた人だけが「今日の訪問者」に記録されます。<br />※ 名前未設定の端末は履歴に残りません。<br />※ 「ルーム登録者」には visitors（v3.9以降の訪問記録）に加え、過去のオンライン履歴・各生徒の担当教員名・掲示板の投稿者名も統合して表示します（v3.9 以前から使っていた人も拾います）。</div>
                  </div>
                </>
              )}
            </div>
            )}
            <button
              onClick={() => { setTempRoomKey(roomKey); setIsConfigOpen(true); }}
              title="Firebase接続設定・ルーム名の切替・担当教員名の保存を行います"
              className="flex items-center gap-1.5 px-3 py-1.5 bg-white hover:bg-slate-50 active:bg-slate-100 text-slate-700 hover:text-slate-900 rounded-xl text-xs font-bold transition-all border border-slate-200 shadow-sm"
            >
              <Settings className="w-4 h-4 text-slate-500" />
              <span>環境設定</span>
            </button>
          </div>
        </div>
      </header>

      {connectionStatus === 'local' && (
        <div className="bg-amber-50 border-b border-amber-200 text-amber-900 text-xs py-2.5 px-4 shadow-sm no-print">
          <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2 font-medium">
            <span className="flex items-center gap-2 text-amber-800">
              <AlertCircle className="w-5 h-5 shrink-0 text-amber-600" />
              現在はPC1台のみの「体験デモ」で稼働しています。右上の<strong className="font-bold">「環境設定」ボタン</strong>から、config の貼り付け または config.js ファイルの読み込みでクラウド接続できます。
            </span>
            <div className="flex items-center gap-2 shrink-0">
              <button
                onClick={() => { setTempRoomKey(roomKey); setIsConfigOpen(true); }}
                className="px-3 py-1 bg-amber-600 hover:bg-amber-700 text-white rounded-lg font-bold text-[11px] transition-colors shadow-sm"
              >
                環境設定を開く
              </button>
            </div>
          </div>
        </div>
      )}

      <main className="flex-1 max-w-7xl w-full mx-auto p-4 space-y-6">
        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-7 gap-4 no-print">
          <div className="bg-white border border-slate-200 rounded-2xl p-4 flex items-center justify-between shadow-sm">
            <div>
              <p className="text-xs text-slate-500 font-bold">全登録件数</p>
              <h3 className="text-2xl font-extrabold text-slate-950 mt-1">{stats.total} <span className="text-xs font-normal text-slate-500">名</span></h3>
            </div>
            <div className="p-3 bg-indigo-50 rounded-xl border border-indigo-100">
              <User className="w-5 h-5 text-indigo-600" />
            </div>
          </div>

          <StatCard icon={Phone} label="事前電話連絡状況" percent={stats.phonePercent} pendingCount={stats.phonePendingCount}
            active={filterProgress === 'phone_pending'}
            onClick={() => setFilterProgress(filterProgress === 'phone_pending' ? 'all' : 'phone_pending')}
            title="クリックで「未連絡」の生徒だけを絞り込みします"
            barColor="bg-indigo-600" iconColor="text-indigo-600" />
          <StatCard icon={FileText} label="保護者お知らせ状況" percent={stats.docPercent} pendingCount={stats.docPendingCount}
            active={filterProgress === 'doc_pending'}
            onClick={() => setFilterProgress(filterProgress === 'doc_pending' ? 'all' : 'doc_pending')}
            title="クリックで「未配付」の生徒だけを絞り込みます"
            barColor="bg-emerald-600" iconColor="text-emerald-600" />
          <StatCard icon={Handshake} label="事前挨拶 完了状況" percent={stats.greetingPercent} pendingCount={stats.greetingPendingCount}
            active={filterProgress === 'greeting_pending'}
            onClick={() => setFilterProgress(filterProgress === 'greeting_pending' ? 'all' : 'greeting_pending')}
            title="クリックで「挨拶未完了」の生徒だけを絞り込みます"
            barColor="bg-emerald-600" iconColor="text-teal-600" />
          <StatCard icon={Calendar} label="実習・見学 実施状況" percent={stats.internshipImplPercent} pendingCount={stats.internshipInProgressCount}
            active={filterProgress === 'internship_in_progress'}
            onClick={() => setFilterProgress(filterProgress === 'internship_in_progress' ? 'all' : 'internship_in_progress')}
            title="完了率＝最終実習日が過去になった生徒の割合。クリックで「本日実習中」の生徒だけを絞り込みます"
            barColor="bg-yellow-500" iconColor="text-yellow-600" />
          <StatCard icon={FileText} label="生徒お礼状 送付状況" percent={stats.studentThankYouPercent} pendingCount={stats.studentThankYouPendingCount}
            active={filterProgress === 'student_thankyou_pending'}
            onClick={() => setFilterProgress(filterProgress === 'student_thankyou_pending' ? 'all' : 'student_thankyou_pending')}
            title="クリックで「生徒お礼状未送付」の生徒だけを絞り込みます"
            barColor="bg-pink-500" iconColor="text-pink-600" />
          <StatCard icon={FileText} label="教師お礼状 送付状況" percent={stats.teacherThankYouPercent} pendingCount={stats.teacherThankYouPendingCount}
            active={filterProgress === 'teacher_thankyou_pending'}
            onClick={() => setFilterProgress(filterProgress === 'teacher_thankyou_pending' ? 'all' : 'teacher_thankyou_pending')}
            title="クリックで「教師お礼状未送付」の生徒だけを絞り込みます"
            barColor="bg-cyan-500" iconColor="text-cyan-600" />
        </div>

        <div className="bg-white border border-slate-200 rounded-2xl p-4 space-y-4 shadow-sm no-print">
          <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
            <div className="relative flex-1 min-w-[180px]">
              <Search className="absolute left-3 top-2.5 w-4 h-4 text-slate-400" />
              <input type="text" placeholder="生徒名、実習先、期間等で検索..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)}
                className="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:bg-white transition-all" />
            </div>

            <div className="flex flex-wrap items-center gap-2 self-end lg:self-auto">
              <button onClick={handleUndo} disabled={history.length === 0}
                className={`px-3 py-2 text-xs font-bold rounded-xl flex items-center gap-1.5 border transition-all ${history.length > 0 ? 'bg-white hover:bg-slate-50 active:bg-slate-100 text-slate-700 border-slate-300 shadow-sm cursor-pointer' : 'bg-slate-50 text-slate-300 border-slate-200 cursor-not-allowed'}`}
                title="直前の操作を取り消して一つ前に戻します">
                <RotateCcw className={`w-4 h-4 ${history.length > 0 ? 'text-slate-600' : 'text-slate-300'}`} />
                <span>戻る</span>
              </button>

              <button onClick={handleRedo} disabled={redo.length === 0}
                className={`px-3 py-2 text-xs font-bold rounded-xl flex items-center gap-1.5 border transition-all ${redo.length > 0 ? 'bg-white hover:bg-slate-50 active:bg-slate-100 text-slate-700 border-slate-300 shadow-sm cursor-pointer' : 'bg-slate-50 text-slate-300 border-slate-200 cursor-not-allowed'}`}
                title="取り消した操作をやり直して一つ進めます">
                <RotateCw className={`w-4 h-4 ${redo.length > 0 ? 'text-slate-600' : 'text-slate-300'}`} />
                <span>進む</span>
              </button>

              <button onClick={() => setIsBulkImportOpen(true)}
                className="px-3 py-2 bg-indigo-50 hover:bg-indigo-100 active:bg-indigo-200 text-indigo-800 border border-indigo-200 text-xs font-bold rounded-xl flex items-center gap-1.5 shadow-sm transition-all cursor-pointer"
                title="CSV/TSVを使って複数の生徒を一括で登録します">
                <Upload className="w-4 h-4 text-indigo-600" />
                <span>一括登録</span>
              </button>

              <button onClick={handleExportExcel}
                className="px-3 py-2 bg-emerald-50 hover:bg-emerald-100 active:bg-emerald-200 text-emerald-800 border border-emerald-200 text-xs font-bold rounded-xl flex items-center gap-1.5 shadow-sm transition-all cursor-pointer"
                title="表示中の一覧をExcel等で開けるCSVファイルとして保存します">
                <Download className="w-4 h-4 text-emerald-600" />
                <span>エクセル</span>
              </button>

              <button onClick={() => openAddModal()}
                title="新しい生徒の進捗データを登録します" hidden aria-hidden="true"
                className="px-4 py-2 bg-yellow-200 hover:bg-yellow-300 active:bg-yellow-400 text-yellow-900 border border-yellow-300 text-xs font-bold rounded-xl flex items-center gap-2 shadow-sm transition-all transform active:scale-95 cursor-pointer">
                <Plus className="w-4 h-4" />
                <span>登録</span>
              </button>
            </div>
          </div>

          <div className="flex flex-wrap items-center gap-2.5 no-print">
            <div className="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1" title="表示する生徒を学年で絞り込みます">
              <Filter className="w-3.5 h-3.5 text-slate-500" />
              <select value={filterGrade} onChange={(e) => setFilterGrade(e.target.value)} title="表示する学年を選んでください"
                className="bg-transparent text-xs text-slate-700 focus:outline-none pr-1 cursor-pointer font-bold">
                <option value="all">学年: すべて</option>
                <option value="1">1年</option>
                <option value="2">2年</option>
                <option value="3">3年</option>
              </select>
            </div>

            <div className="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1" title="表示する生徒を組で絞り込みます">
              <Filter className="w-3.5 h-3.5 text-slate-500" />
              <select value={filterClass} onChange={(e) => setFilterClass(e.target.value)} title="表示する組を選んでください"
                className="bg-transparent text-xs text-slate-700 focus:outline-none pr-1 cursor-pointer font-bold">
                <option value="all">組: すべて</option>
                {Array.from(new Set(students.map((st) => st.classVal).filter(Boolean))).sort().map((c) => (
                  <option key={c} value={c}>{c}組</option>
                ))}
              </select>
            </div>

            <div className="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1" title="表示する生徒を活動種別（実習/見学）で絞り込みます"><Filter className="w-3.5 h-3.5 text-slate-500" /><select value={filterInternshipType} onChange={(e) => setFilterInternshipType(e.target.value)} title="活動種別を選んでください" className="bg-transparent text-xs text-slate-700 focus:outline-none pr-1 cursor-pointer font-bold"><option value="all">種別: すべて</option><option value="internship">実習</option><option value="observation">見学</option></select></div>

            <div className="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200">
              {[
                { key: 'list',     icon: List,     label: 'リスト一覧',   title: '全生徒の進捗を一覧表で表示します' },
                { key: 'calendar', icon: Calendar, label: 'カレンダー', title: '月別カレンダーで実習日・事前挨拶・巡回を可視化します' }
              ].map(({ key, icon: Icon, label, title }) => (
                <button key={key} onClick={() => setCurrentView(key)} title={title}
                  className={`flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer ${currentView === key ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}>
                  <Icon className="w-3.5 h-3.5" />
                  <span>{label}</span>
                </button>
              ))}
            </div>

            {/* v3.8: 印刷ボタン（現在の画面をプリンタ/PDFに出力） */}
            <button type="button" onClick={() => setIsPrintOpen(true)} title="現在の画面（リスト/カレンダー）を印刷またはPDF保存します" className="flex items-center gap-1 px-2.5 py-1.5 bg-white border border-slate-200 hover:bg-indigo-50 hover:border-indigo-300 text-slate-700 rounded-xl text-xs font-bold cursor-pointer shadow-sm">
              <Printer className="w-3.5 h-3.5 text-indigo-600" />
              <span>印刷</span>
            </button>

            {hasActiveFilter && (
              <button onClick={clearFilters} className="flex items-center gap-1 text-[11px] font-bold text-indigo-600 hover:text-indigo-800 transition-colors">
                <RotateCcw className="w-3 h-3" />
                <span>解除</span>
              </button>
            )}
          </div>

        </div>

        {currentView === 'list' ? (
          <div key="view-list" className="list-text-scale-2 bg-white border border-slate-200 rounded-2xl shadow-sm animate-fadeIn">
            {selectedIds.size > 0 && (
              <div className="px-4 py-2.5 bg-indigo-50 border-b border-indigo-200 flex flex-wrap items-center justify-between gap-2 animate-slideDown no-print">
                <span className="text-xs font-bold text-indigo-800 flex items-center gap-1.5"><CheckCircle2 className="w-4 h-4" />{selectedIds.size}名を選択中</span>
                <div className="flex items-center gap-2">
                  <button onClick={() => setSelectedIds(new Set())} className="px-3 py-1.5 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 text-xs font-bold rounded-lg cursor-pointer shadow-sm">選択解除</button>
                  <button onClick={handleBulkDelete} className="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold rounded-lg flex items-center gap-1.5 cursor-pointer shadow-sm"><Trash2 className="w-3.5 h-3.5" />選択した{selectedIds.size}名を削除</button>
                </div>
              </div>
            )}
            <div>
              <table className="w-full text-left border-collapse table-auto">
                <thead>
                  <tr className="text-slate-600 text-xs font-bold select-none">
                    <th className="p-3 w-10 sticky top-0 z-20 border-b border-slate-200 bg-slate-50 text-center"><input type="checkbox" checked={filteredStudents.length > 0 && selectedIds.size === filteredStudents.length} ref={(el) => { if (el) el.indeterminate = selectedIds.size > 0 && selectedIds.size < filteredStudents.length; }} onChange={toggleSelectAll} className="cursor-pointer accent-indigo-600 w-4 h-4" title="表示中の全件を選択 / 解除" /></th>
                    <th className="p-4 min-w-[90px] sticky top-0 z-20 border-b border-slate-200 bg-slate-50">生徒情報</th>
                    <th className="p-4 min-w-[140px] sticky top-0 z-20 border-b border-slate-200 bg-slate-50">実習先 &amp; 実習期間</th>
                    <th className="p-4 min-w-[100px] sticky top-0 z-20 border-b border-slate-200 bg-slate-50">事前電話</th>
                    <th className="p-4 min-w-[120px] sticky top-0 z-20 border-b border-slate-200 bg-slate-50"><span className="leading-tight">連絡票・<br />実施計画配付</span></th>
                    <th className="p-4 min-w-[100px] sticky top-0 z-20 border-b border-slate-200 bg-slate-50">事前挨拶</th>
                    <th className="p-4 min-w-[90px] sticky top-0 z-20 border-b border-slate-200 bg-slate-50">菓子折</th>
                    <th className="p-4 min-w-[140px] sticky top-0 z-20 border-b border-slate-200 bg-slate-50">巡回・同行予定</th>
                    <th className="p-4 min-w-[100px] sticky top-0 z-20 border-b border-slate-200 bg-slate-50">生徒お礼状</th>
                    <th className="p-4 min-w-[100px] sticky top-0 z-20 border-b border-slate-200 bg-slate-50">教師お礼状</th>
                    <th className="p-4 text-center sticky top-0 z-20 border-b border-slate-200 bg-slate-50">操作</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-sky-200 text-xs text-slate-700">
                  {isLoading ? (
                    <tr><td colSpan={11} className="p-12 text-center text-slate-500 font-medium">
                      <div className="flex flex-col items-center justify-center gap-2">
                        <span className="w-8 h-8 rounded-full border-2 border-indigo-600 border-t-transparent animate-spin inline-block"></span>
                        <span className="text-slate-600">データを同期しています...</span>
                      </div>
                    </td></tr>
                  ) : filteredStudents.length === 0 ? (
                    <tr><td colSpan={11} className="p-12 text-center text-slate-500 font-medium">条件に一致する実習対象生徒が見つかりません。</td></tr>
                  ) : (() => {
                    const grades = ['1', '2', '3'];
                    const ungraded = filteredStudents.filter((s) => !grades.includes(s.grade));
                    const sections = [];
                    const accentOf = (g) => g === '3' ? 'bg-rose-100 border-rose-100 text-rose-900' : g === '2' ? 'bg-emerald-100 border-emerald-100 text-emerald-900' : 'bg-sky-100 border-sky-100 text-sky-900';
                    grades.forEach((g) => {
                      const gradeStudents = filteredStudents.filter((s) => s.grade === g);
                      if (gradeStudents.length === 0) return;
                      const classes = Array.from(new Set(gradeStudents.map((s) => s.classVal).filter(Boolean))).sort();
                      classes.forEach((c) => {
                        const list = sortByCustomOrder(gradeStudents.filter((s) => s.classVal === c), g + '-' + c);
                        sections.push({ key: g + '-' + c, label: `${g}年${c}組`, list, accent: accentOf(g) });
                      });
                      const nocls = gradeStudents.filter((s) => !s.classVal);

                                  </button>
                                ))}
                                <button onClick={() => setMaterialModalStudentId(s.id)}
                  onDragEnter={(e) => { const types = Array.from(e.dataTransfer.types || []); if (types.includes('Files')) { e.preventDefault(); e.stopPropagation(); setMaterialDropTargetId(s.id); } }}
                  onDragOver={(e) => { const types = Array.from(e.dataTransfer.types || []); if (types.includes('Files')) { e.preventDefault(); e.stopPropagation(); e.dataTransfer.dropEffect = 'copy'; setMaterialDropTargetId(s.id); } }}
                  onDragLeave={(e) => { e.stopPropagation(); setMaterialDropTargetId((cur) => cur === s.id ? null : cur); }}
                  onDrop={(e) => { e.preventDefault(); e.stopPropagation(); setMaterialDropTargetId(null); const files = e.dataTransfer?.files; if (files && files.length > 0) handleDropFilesForMaterial(s.id, files); }}
                  title={(s.materials?.length || 0) > 0 ? 'クリックで関連資料を管理。ファイルをここにドラッグ＆ドロップしても追加できます。' : 'クリックで関連資料を追加。ファイルをここにドラッグ＆ドロップしても追加できます。'}
                                  className={`w-full flex items-center justify-center gap-1 px-1.5 py-1 border border-dashed text-[10px] font-bold cursor-pointer rounded-md transition-all ${materialDropTargetId === s.id ? 'bg-amber-100 border-amber-500 text-amber-800 ring-2 ring-amber-400 scale-105' : 'bg-white hover:bg-amber-50 border-slate-300 hover:border-amber-300 text-slate-500 hover:text-amber-700'}`}>
                                  <Paperclip className="w-3 h-3" />
                                  <span>{materialDropTargetId === s.id ? 'ここにドロップ' : (s.materials?.length || 0) > 0 ? '管理' : '追加'}</span>
                                </button>
                              </div>
                              <div className="flex flex-col items-center gap-1 shrink-0">
                                <button onClick={() => setSelectedStudentDetail(s)} title="詳細・編集"
                                  className="p-1.5 text-slate-600 hover:text-indigo-600 bg-white border border-slate-200 hover:border-indigo-200 rounded-lg shadow-sm transition-all active:scale-90 cursor-pointer">
                                  <Edit className="w-4 h-4" />
                                </button>
                                <button onClick={() => handleDeleteStudent(s.id)} title="削除"
                                  className="p-1.5 text-slate-400 hover:text-rose-600 bg-white border border-slate-200 hover:border-rose-200 rounded-lg shadow-sm transition-all active:scale-90 cursor-pointer">
                                  <Trash2 className="w-4 h-4" />
                                </button>
                              </div>
                            </div>
                          </td>
                        </tr>
                      );
                    }))
                    ]);
                  })()}
                </tbody>
              </table>
            </div>
            <div className="px-4 py-3 bg-slate-50 border-t border-slate-200 text-slate-500 text-[11px] flex flex-col sm:flex-row justify-between items-center gap-2">
              <span>表示中: {filteredStudents.length}名 / 全生徒: {students.length}名</span>
              <span className="font-semibold text-slate-600">※ 各進捗ボタンをクリックするとその場で進捗状況を切り替えることができます。</span>
            </div>
          </div>
        ) : (
          <div key="view-calendar" className="bg-white border border-slate-200 rounded-2xl shadow-sm flex flex-col animate-fadeIn">
            <div className="p-4 bg-slate-50 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3 rounded-t-2xl sticky top-0 z-30 shadow-sm no-print">
              <div className="flex items-center gap-2">
                <button onClick={handlePrevMonth} className="p-1.5 hover:bg-slate-200 bg-white border border-slate-200 rounded-lg text-slate-700 transition-all cursor-pointer">
                  <ChevronLeft className="w-4 h-4" />
                </button>
                <h2 className="text-sm font-bold text-slate-900 min-w-[120px] text-center">{calendarYear}年 {calendarMonth + 1}月</h2>
                <button onClick={handleNextMonth} className="p-1.5 hover:bg-slate-200 bg-white border border-slate-200 rounded-lg text-slate-700 transition-all cursor-pointer">
                  <ChevronRight className="w-4 h-4" />
                </button>
              </div>
              <div className="flex items-center gap-3">
                <button onClick={handleToday} className="px-3 py-1.5 bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 text-xs font-bold rounded-xl transition-all cursor-pointer">今月</button>
                <div className="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200">
                  {[['all','全表示'],['student','生徒の予定'],['teacher','教師の予定']].map(([key, label]) => (
                    <button key={key} onClick={() => setCalendarFilter(key)} className={`px-2.5 py-1 rounded-lg text-[11px] font-bold cursor-pointer transition-all ${calendarFilter === key ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}>{label}</button>
                  ))}
                </div>
                <div className="flex flex-wrap items-center gap-3 text-[11px] font-semibold">
                  <span className="flex items-center gap-1.5"><span className="w-3.5 h-3.5 bg-yellow-100 border border-yellow-300 rounded-md block"></span><span>実習</span></span>
                  <span className="flex items-center gap-1.5"><span className="w-3.5 h-3.5 bg-pink-100 border border-pink-300 rounded-md block"></span><span>見学</span></span>
                  <span className="flex items-center gap-1.5"><span className="w-3.5 h-3.5 bg-green-200 border border-green-400 rounded-md block"></span><span>挨拶</span></span>
                  <span className="flex items-center gap-1.5"><span className="w-3.5 h-3.5 bg-blue-200 border border-blue-400 rounded-md block"></span><span>巡回</span></span>
                </div>
              </div>
            </div>

            {/* v3.8: 印刷専用の月見出し（カレンダーのスティッキーバーは no-print なので、紙面には月情報が残らない。これを補うため hidden print:block の見出しを追加） */}
            <div className="hidden print:block px-4 py-3 text-sm font-bold border-b border-slate-300 text-center">{calendarYear}年 {calendarMonth + 1}月の予定（{calendarFilter === 'all' ? '全表示' : calendarFilter === 'student' ? '生徒の予定のみ' : '教師の予定のみ'}）</div>
            <div className="grid grid-cols-7 border-b border-slate-200 bg-slate-100 text-center text-xs font-bold text-slate-600 py-2 select-none">
              <div className="text-rose-600">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div className="text-sky-600">土</div>
            </div>

            <div className="grid grid-cols-7 grid-rows-6 divide-x divide-y divide-slate-200 min-h-[500px] bg-slate-50">
              {calendarDays.map((cell, index) => {
                const dayEvents = getEventsForDate(cell.year, cell.month, cell.day);
                const today = new Date();
                const isToday = today.getFullYear() === cell.year && today.getMonth() === cell.month && today.getDate() === cell.day;
                const isInternshipDay = hasPeriodEventOnDate(cell.year, cell.month, cell.day);
                const dayOfWeek = index % 7;

                return (
                  <div
                    key={`${cell.year}-${cell.month}-${cell.day}-${index}`}
                    className={`p-1.5 flex flex-col min-h-[80px] transition-all relative group ${cell.isCurrentMonth ? 'bg-white' : 'bg-slate-50/50 text-slate-400'} ${isToday ? 'ring-2 ring-indigo-500 ring-inset bg-indigo-50/25' : ''}`}
                  >
                    <div className="flex items-center justify-between mb-1 select-none">
                      <span className={`text-xs font-bold ${isToday ? 'bg-indigo-600 text-white w-5 h-5 rounded-full flex items-center justify-center' : cell.isCurrentMonth ? (dayOfWeek === 0 ? 'text-rose-600' : dayOfWeek === 6 ? 'text-sky-600' : 'text-slate-800') : 'text-slate-400'}`}>
                        {cell.day}
                      </span>
                    </div>

                    <div className="flex flex-col">
                      {(() => {
                        const renderEvent = (ev, evIdx) => {
                          if (ev.type === 'period') {
                            return (
                              <div key={evIdx} className={`text-[10px] px-1.5 py-0.5 rounded border font-bold select-none transition-colors shadow-sm flex items-center justify-between gap-1 ${ev.color}`} title={ev.title || ev.label}>
                                <button onClick={(e) => { e.stopPropagation(); setSelectedStudentDetail(ev.student); }} className="truncate text-left flex-1 cursor-pointer">{ev.label}</button>
                                <button onClick={(e) => { e.stopPropagation(); handleRemoveInternshipDate(ev.student, ev.dateKey); }}
                                  title="この日を実習日から外す"
                                  className="hover:bg-white/60 rounded px-1 shrink-0 text-[10px] font-bold cursor-pointer leading-none">×</button>
                              </div>
                            );
                          }
                          return (
                            <div key={evIdx} onClick={(e) => { e.stopPropagation(); setSelectedStudentDetail(ev.student); }}
                              className={`text-[10px] px-1.5 py-0.5 rounded border font-bold truncate select-none transition-colors shadow-sm cursor-pointer ${ev.color}`} title={ev.label}>
                              {ev.label}
                            </div>
                          );
                        };
                        const isObservation = (ev) => ev.type === 'period' && ev.student && ev.student.internshipType === 'observation';
                        const topEvents = dayEvents.filter((ev) => !isObservation(ev));
                        const bottomEvents = dayEvents.filter((ev) => isObservation(ev));
                        const weekStart = Math.floor(index / 7) * 7;
                        let maxTop = 0, maxBottom = 0;
                        for (let wi = weekStart; wi < weekStart + 7 && wi < calendarDays.length; wi++) {
                          const wc = calendarDays[wi];
                          const wevs = getEventsForDate(wc.year, wc.month, wc.day);
                          const tc = wevs.filter((ev) => !isObservation(ev)).length;
                          const bc = wevs.filter((ev) => isObservation(ev)).length;
                          if (tc > maxTop) maxTop = tc;
                          if (bc > maxBottom) maxBottom = bc;
                        }
                        return (
                          <>
                            <div className="space-y-1 min-h-[18px] pb-1 border-b border-dashed border-slate-200">
                              {Array.from({ length: Math.max(maxTop, 1) }).map((_, i) => topEvents[i] ? renderEvent(topEvents[i], i) : <div key={`top-spc-${i}`} className="h-[18px]" aria-hidden="true" />)}
                            </div>
                            <div className="space-y-1 min-h-[18px] pt-1">
                              {Array.from({ length: Math.max(maxBottom, 1) }).map((_, i) => bottomEvents[i] ? renderEvent(bottomEvents[i], i) : <div key={`bot-spc-${i}`} className="h-[18px]" aria-hidden="true" />)}
                            </div>
                          </>
                        );
                      })()}
                    </div>

                    <button
                      type="button"
                      onClick={(e) => { e.stopPropagation(); openAddModal([formatDateKey(cell.year, cell.month, cell.day)]); }}
                      title="この日付で実習生を登録するためのモーダルを開きます。モーダル内の『登録』ボタンを押すまで予定は作成されません。"
                      className="absolute bottom-1 right-1 opacity-70 hover:opacity-100 transition-opacity bg-white border border-indigo-300 hover:border-indigo-500 hover:bg-indigo-50 rounded-full p-1 cursor-pointer shadow-sm"
                    >
                      <Plus className="w-4 h-4 text-indigo-600" />
                    </button>
                  </div>
                );
              })}
            </div>
          </div>
        )}
      {isBulkImportOpen && (<BulkImportModal onClose={() => setIsBulkImportOpen(false)} onCommit={handleBulkImport} onAlert={showAlert} defaultTeacher={myTeacherName} />)}

      </main>

      {/* v3.7: 右下に常駐する登録FAB（浮遊ボタン）。どの画面でも常に表示され、クリックで新しい実習生の登録モーダルが開きます。 */}
      <button onClick={() => openAddModal()} title="新しい実習生を登録する" aria-label="新しい実習生を登録" className="fixed bottom-6 right-6 z-40 flex items-center gap-2 px-5 py-3.5 bg-yellow-300 hover:bg-yellow-400 active:bg-yellow-500 text-yellow-900 border border-yellow-400 rounded-full shadow-2xl hover:shadow-xl transition-all transform hover:scale-105 active:scale-95 cursor-pointer font-extrabold text-sm no-print">
        <Plus className="w-5 h-5" />
        <span>登録</span>
      </button>
      <footer className="bg-white border-t border-slate-200 py-6 px-4 mt-12 shrink-0 no-print">
        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4 text-xs text-slate-500">
          <div>
            <p className="font-semibold text-slate-700">現場実習進捗マネージャー - HTML スタンドアロン版</p>
            <p className="mt-0.5">Google Firebase Infrastructure 連携対応</p>
          </div>
          <div className="flex items-center gap-4 font-medium text-slate-400">
            <span>匿名認証・合言葉部屋分割・BOM付きCSV出力・Undo/Redo・カレンダー日付入力</span>
          </div>
        </div>
      </footer>

      {/* 詳細・編集モーダル(各項目タップで編集ポップアップ) */}
      {selectedStudentDetail && (() => { const sd = students.find((s) => s.id === selectedStudentDetail.id) || selectedStudentDetail; return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white border border-slate-200 rounded-2xl shadow-2xl max-w-md w-full overflow-hidden text-slate-800 animate-scaleIn max-h-[90vh] flex flex-col">
            <div className="px-6 py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between shrink-0">
              <h3 className="text-sm font-bold text-slate-900 flex items-center gap-2">
                <User className="w-5 h-5 text-indigo-600" />
                <span>実習生 詳細情報</span>
                <span className="text-[10px] bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded font-bold border border-indigo-100">タップで編集</span>
              </h3>
              <button onClick={() => setSelectedStudentDetail(null)} className="text-slate-400 hover:text-slate-900 font-bold text-xl cursor-pointer">×</button>
            </div>

            <div className="p-6 space-y-4 overflow-y-auto">
              <div>
                <div className="text-xs text-slate-400 font-bold">生徒情報（学年・組）</div>
                <div className="flex items-center gap-2 mt-1 flex-wrap">
                  <button onClick={() => setTextEditState({ value: sd.name || '', title: '生徒氏名を編集', label: '氏名(イニシャル推奨)', onSave: (v) => persistPartial(sd.id, { name: v }) })} className="text-base font-extrabold text-slate-950 hover:bg-indigo-50 px-2 py-0.5 rounded-lg cursor-pointer border border-transparent hover:border-indigo-200">{sd.name || '(未設定)'}</button>
                  <button onClick={() => setSelectEditState({ value: sd.grade || '3', title: '学年を選択', options: [['1','1年'],['2','2年'],['3','3年'],['other','他']], onSave: (v) => persistPartial(sd.id, { grade: v }) })} className="text-xs font-bold text-slate-700 hover:bg-indigo-50 px-2 py-0.5 rounded-lg cursor-pointer border border-slate-200 hover:border-indigo-200">{sd.grade ? `${sd.grade}年` : '学年'}</button>
                  <button onClick={() => setSelectEditState({ value: sd.classVal || '', title: '組を変更', options: [['', '未設定'], ['1', '1組'], ['2', '2組'], ['3', '3組']], onSave: (v) => persistPartial(sd.id, { classVal: v }) })} className="text-xs font-bold text-slate-700 hover:bg-indigo-50 px-2 py-0.5 rounded-lg cursor-pointer border border-slate-200 hover:border-indigo-200">{sd.classVal ? `${sd.classVal}組` : '組'}</button>
                </div>
              </div>

              <div>
                <div className="text-xs text-slate-400 font-bold flex items-center justify-between gap-1">
                  <span>実習先 / 活動種別</span>
                  <button onClick={() => setSelectEditState({ value: sd.internshipType || 'internship', title: '活動種別を選択', options: [['internship','実習'],['observation','見学']], onSave: (v) => persistPartial(sd.id, { internshipType: v }) })} className={`text-[10px] font-bold px-1.5 py-0.5 rounded cursor-pointer border ${sd.internshipType === 'observation' ? 'bg-pink-100 text-pink-900 border-pink-300 hover:bg-pink-200' : 'bg-yellow-100 text-yellow-900 border-yellow-300 hover:bg-yellow-200'}`}>{sd.internshipType === 'observation' ? '見学' : '実習'}</button>
                </div>
                <button onClick={() => setTextEditState({ value: sd.location || '', title: '実習先を編集', label: '企業・事業所名', onSave: (v) => persistPartial(sd.id, { location: v }) })} className="w-full text-left text-sm font-bold text-slate-900 mt-1 hover:bg-indigo-50 px-2 py-1 rounded-lg cursor-pointer border border-transparent hover:border-indigo-200">{sd.location || <span className="placeholder-empty">未設定(タップ)</span>}</button>
              </div>

              <div>
                <div className="text-xs text-slate-400 font-bold">実習日({(sd.internshipDates || []).length}日)</div>
                <div className="mt-1 flex flex-wrap items-center gap-1 text-[10px] font-medium">
                  {(sd.internshipDates || []).length === 0 && <span className="placeholder-empty mr-1">実習日 未設定</span>}
                  {(sd.internshipDates || []).map((d, idx, arr) => { const palette = sd.internshipType === 'observation' ? 'bg-pink-100 border-pink-300 text-pink-900 hover:bg-pink-200' : 'bg-yellow-100 border-yellow-300 text-yellow-900 hover:bg-yellow-200'; return (<span key={d} className={`inline-flex items-center gap-1 px-1.5 py-0.5 rounded border font-bold ${palette}`}><span>{sd.internshipType === 'observation' ? '見学' : (idx + 1) + '／' + arr.length}　　{formatShortDate(d)}</span><button onClick={() => handleRemoveInternshipDate(sd, d)} title="この日を外す" className="hover:bg-white/60 rounded text-slate-500 hover:text-rose-700 leading-none cursor-pointer font-bold">×</button></span>); })}
                  <button onClick={() => setDatePickerState({ value: '', title: `${sd.name} の実習日を追加`, onSelect: (v) => { if (v) handleAddInternshipDate(sd, v); } })} className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded border border-dashed border-indigo-400 bg-white hover:bg-indigo-50 text-indigo-700 font-bold cursor-pointer"><Plus className="w-3 h-3" /><span>追加</span></button>
                </div>
              </div>

              <hr className="border-slate-100" />

              <div className="space-y-1.5">
                <div className="flex items-center justify-between text-xs">
                  <span className="font-bold text-slate-500 flex items-center gap-1"><Phone className="w-3.5 h-3.5 text-indigo-500" />事前電話連絡</span>
                  <button onClick={() => handleInstantToggle(sd, 'phoneStatus', sd.phoneStatus)} className={`px-2 py-0.5 rounded-md font-bold cursor-pointer ${sd.phoneStatus === 'completed' ? 'bg-indigo-50 text-indigo-700 border border-indigo-200 hover:bg-indigo-100' : sd.phoneStatus === 'none' ? 'bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200' : 'bg-rose-50 text-rose-700 border border-rose-200 hover:bg-rose-100'}`}>{sd.phoneStatus === 'completed' ? '連絡済み' : sd.phoneStatus === 'none' ? '必要なし' : '未連絡'}</button>
                </div>
                {sd.phoneStatus === 'completed' && (<button onClick={() => setDatePickerState({ value: sd.phoneDate || '', title: `${sd.name} の電話連絡日`, onSelect: (v) => persistPartial(sd.id, { phoneDate: v }) })} className="text-[11px] text-slate-600 hover:text-indigo-700 hover:underline cursor-pointer block text-left pl-5">📅 連絡日: {sd.phoneDate ? formatShortDate(sd.phoneDate) : <span className="placeholder-empty">未設定(タップ)</span>}</button>)}
              </div>

              <div className="space-y-1.5">
                <div className="flex items-center justify-between text-xs">
                  <span className="font-bold text-slate-500 flex items-center gap-1"><FileText className="w-3.5 h-3.5 text-emerald-500" />保護者お知らせ</span>
                  <button onClick={() => handleInstantToggle(sd, 'docStatus', sd.docStatus)} className={`px-2 py-0.5 rounded-md font-bold cursor-pointer ${sd.docStatus === 'completed' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100' : sd.docStatus === 'none' ? 'bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200' : 'bg-rose-50 text-rose-700 border border-rose-200 hover:bg-rose-100'}`}>{sd.docStatus === 'completed' ? '配付済み' : sd.docStatus === 'none' ? '必要なし' : '未配付'}</button>
                </div>
                {sd.docStatus === 'completed' && (<button onClick={() => setDatePickerState({ value: sd.docDate || '', title: `${sd.name} の配付日`, onSelect: (v) => persistPartial(sd.id, { docDate: v }) })} className="text-[11px] text-slate-600 hover:text-indigo-700 hover:underline cursor-pointer block text-left pl-5">📅 配付日: {sd.docDate ? formatShortDate(sd.docDate) : <span className="placeholder-empty">未設定(タップ)</span>}</button>)}
              </div>

              <div className="space-y-2">
                <div className="flex items-center justify-between text-xs">
                  <span className="font-bold text-slate-500 flex items-center gap-1"><Handshake className="w-3.5 h-3.5 text-teal-600" />事前挨拶訪問</span>
                  <button onClick={() => handleInstantToggle(sd, 'greetingStatus', sd.greetingStatus)} className={`px-2 py-0.5 rounded-md font-bold cursor-pointer ${sd.greetingStatus === 'completed' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100' : sd.greetingStatus === 'scheduled' ? 'bg-sky-50 text-sky-700 border border-sky-200 hover:bg-sky-100' : sd.greetingStatus === 'unadjusted' ? 'bg-amber-50 text-amber-700 border border-amber-200 hover:bg-amber-100' : 'bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200'}`}>{sd.greetingStatus === 'completed' ? '挨拶終了' : sd.greetingStatus === 'scheduled' ? '挨拶日決定' : sd.greetingStatus === 'unadjusted' ? '未調整' : 'ー'}</button>
                </div>
                {sd.greetingStatus !== 'pending' && (<div className="p-2 bg-emerald-50/40 border border-emerald-100 text-emerald-900 rounded-lg text-xs font-semibold space-y-1">
                  <button onClick={() => setDatePickerState({ value: sd.greetingDate || '', title: `${sd.name} の挨拶予定日`, onSelect: (v) => { const upd = { greetingDate: v }; if (v && (!sd.greetingStatus || sd.greetingStatus === 'pending')) upd.greetingStatus = 'scheduled'; persistPartial(sd.id, upd); } })} className="hover:bg-white/60 rounded px-1 cursor-pointer block text-left w-full">📅 挨拶予定: <span className={sd.greetingDate ? '' : 'text-slate-400 italic'}>{sd.greetingDate ? formatShortDate(sd.greetingDate) : '未設定(タップ)'}</span></button>
                  <button onClick={() => setTextEditState({ value: sd.greetingTime || '', title: '挨拶予定時間を編集', label: '時間(例: 13:30)', onSave: (v) => persistPartial(sd.id, { greetingTime: v }) })} className="hover:bg-white/60 rounded px-1 cursor-pointer block text-left w-full">⏰ 時間: <span className={sd.greetingTime ? '' : 'text-slate-400 italic'}>{sd.greetingTime || '未設定(タップ)'}</span></button>
                  <button onClick={() => setTextEditState({ value: sd.greetingVisitor || '', title: '引率教員を編集', label: '引率教員', onSave: (v) => persistPartial(sd.id, { greetingVisitor: v }) })} className="hover:bg-white/60 rounded px-1 cursor-pointer block text-left w-full">👤 引率教員: <span className={sd.greetingVisitor ? '' : 'text-slate-400 italic'}>{sd.greetingVisitor || '未設定(タップ)'}</span></button>
