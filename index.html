                handleSaveStudent({
                  name: fd.get('name'), grade: fd.get('grade'), classVal: fd.get('classVal'),
                  location: fd.get('location'),
                  internshipType: fd.get('internshipType') || 'internship',
                  excludeWeekends: fd.get('excludeWeekends') === 'on',
                  internshipStartDate: fd.get('internshipStartDate'), internshipEndDate: fd.get('internshipEndDate'),
                  teacher: fd.get('teacher'),
                  phoneStatus: fd.get('phoneStatus'), phoneDate: fd.get('phoneDate'),
                  docStatus: fd.get('docStatus'), docDate: fd.get('docDate'),
                  greetingStatus: fd.get('greetingStatus'), greetingDate: fd.get('greetingDate'),
                  greetingTime: fd.get('greetingTime'), greetingVisitor: fd.get('greetingVisitor'),
                  patrolStatus: fd.get('patrolStatus'), patrolDate: fd.get('patrolDate'),
                  patrolTime: fd.get('patrolTime'), patrolVisitor: fd.get('patrolVisitor'),
                  notes: fd.get('notes')
                });
              }}
              className="p-6 space-y-4 max-h-[80vh] overflow-y-auto">

              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-[11px] font-bold text-slate-600 mb-1">生徒氏名 *</label>
                  <input type="text" name="name" required placeholder="例: O.H. (イニシャル推奨)" defaultValue={editingStudent?.name || ''}
                    className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800" />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-[11px] font-bold text-slate-600 mb-1">学年 *</label>
                    <select name="grade" required defaultValue={editingStudent?.grade || '3'}
                      className="w-full bg-white border border-slate-300 rounded-xl px-2 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800">
                      <option value="1">1年</option><option value="2">2年</option><option value="3">3年</option><option value="other">他</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-slate-600 mb-1">組 *</label>
                    <input type="text" name="classVal" required placeholder="例: 1" defaultValue={editingStudent?.classVal || ''}
                      className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800" />
                  </div>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-[11px] font-bold text-slate-600 mb-1">実習先企業・事業所名 *</label>
                  <input type="text" name="location" required placeholder="例: 第一物産 配送センター" defaultValue={editingStudent?.location || ''}
                    className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800" />
                </div>
                <div>
                  <label className="block text-[11px] font-bold text-slate-600 mb-1">担当教員 *</label>
                  <input type="text" name="teacher" required placeholder="例: 鈴木 先生" defaultValue={editingStudent?.teacher || myTeacherName || ''}
                    className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800" />
                </div>
              </div>

              <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2">
                <div className="flex items-center justify-between gap-2 flex-wrap">
                  <span className="text-xs font-bold text-slate-700">活動種別</span>
                  <div className="flex gap-3">
                    <label className="flex items-center gap-1 text-[11px] cursor-pointer font-semibold text-indigo-700">
                      <input type="radio" name="internshipType" value="internship" defaultChecked={(editingStudent?.internshipType || 'internship') === 'internship'} className="accent-indigo-600" />
                      <span>💼 実習</span>
                    </label>
                    <label className="flex items-center gap-1 text-[11px] cursor-pointer font-semibold text-amber-700">
                      <input type="radio" name="internshipType" value="observation" defaultChecked={editingStudent?.internshipType === 'observation'} className="accent-amber-600" />
                      <span>👁️ 見学</span>
                    </label>
                  </div>
                </div>
                <div className="flex items-center justify-between gap-2 pt-2 border-t border-slate-200">
                  <span className="text-[11px] text-slate-600">土・日曜日を実習日数に含めない（休みとして外す）</span>
                  <label className="inline-flex items-center cursor-pointer">
                    <input type="checkbox" name="excludeWeekends" defaultChecked={editingStudent ? editingStudent.excludeWeekends !== false : true} className="accent-indigo-600 w-4 h-4 cursor-pointer" />
                    <span className="ml-1.5 text-[11px] text-slate-700 font-bold">土日を除外</span>
                  </label>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-4 bg-indigo-50/20 p-3 rounded-xl border border-indigo-100">
                <div>
                  <label className="block text-[11px] font-bold text-indigo-900 mb-1">実習開始日</label>
                  <button type="button" onClick={() => setDatePickerState({ value: formDates.internshipStartDate || '', title: '実習開始日を選択', onSelect: (v) => setFormDates((f) => ({ ...f, internshipStartDate: v })) })}
                    className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-800 cursor-pointer hover:border-indigo-400 flex items-center justify-between transition-colors">
                    <span className={formDates.internshipStartDate ? '' : 'text-slate-400'}>{formDates.internshipStartDate || '日付を選択...'}</span>
                    <Calendar className="w-3.5 h-3.5 text-indigo-500" />
                  </button>
                  <input type="hidden" name="internshipStartDate" value={formDates.internshipStartDate || ''} />
                </div>
                <div>
                  <label className="block text-[11px] font-bold text-indigo-900 mb-1">実習終了日</label>
                  <button type="button" onClick={() => setDatePickerState({ value: formDates.internshipEndDate || '', title: '実習終了日を選択', onSelect: (v) => setFormDates((f) => ({ ...f, internshipEndDate: v })) })}
                    className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-800 cursor-pointer hover:border-indigo-400 flex items-center justify-between transition-colors">
                    <span className={formDates.internshipEndDate ? '' : 'text-slate-400'}>{formDates.internshipEndDate || '日付を選択...'}</span>
                    <Calendar className="w-3.5 h-3.5 text-indigo-500" />
                  </button>
                  <input type="hidden" name="internshipEndDate" value={formDates.internshipEndDate || ''} />
                </div>
              </div>

              <hr className="border-slate-200" />

              {[
                { title: '事前電話連絡', icon: Phone, headerColor: 'text-indigo-700', iconClass: 'text-indigo-600',
                  statusField: 'phoneStatus', dateField: 'phoneDate',
                  options: [['pending', '未完了'], ['completed', '完了'], ['none', '不要']],
                  accent: 'accent-indigo-600', defaultStatus: editingStudent?.phoneStatus || 'pending',
                  defaultDate: editingStudent?.phoneDate || '', dateHint: '連絡日 (空欄は本日日付)' },
                { title: '保護者お知らせ (同意書等)', icon: FileText, headerColor: 'text-emerald-800', iconClass: 'text-emerald-600',
                  statusField: 'docStatus', dateField: 'docDate',
                  options: [['pending', '未提出'], ['completed', '提出/回収済'], ['none', '不要']],
                  accent: 'accent-emerald-600', defaultStatus: editingStudent?.docStatus || 'pending',
                  defaultDate: editingStudent?.docDate || '', dateHint: '配付・回収日 (空欄は本日日付)' }
              ].map(({ title, icon: Icon, headerColor, iconClass, statusField, dateField, options, accent, defaultStatus, defaultDate, dateHint }) => (
                <div key={statusField} className="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                  <div className="flex items-center justify-between">
                    <h4 className={`text-xs font-bold ${headerColor} flex items-center gap-1`}>
                      <Icon className={`w-3.5 h-3.5 ${iconClass}`} />
                      {title}
                    </h4>
                    <div className="flex gap-2">
                      {options.map(([st, lbl]) => (
                        <label key={st} className="flex items-center gap-1 text-[10px] cursor-pointer font-semibold text-slate-700">
                          <input type="radio" name={statusField} value={st} defaultChecked={defaultStatus === st} className={accent} />
                          <span>{lbl}</span>
                        </label>
                      ))}
                    </div>
                  </div>
                  <div className="w-full">
                    <label className="block text-[9px] text-slate-500 mb-0.5">{dateHint}</label>
                    <button type="button" onClick={() => setDatePickerState({ value: formDates[dateField] || '', title: dateHint, onSelect: (v) => setFormDates((f) => ({ ...f, [dateField]: v })) })}
                      className="w-44 bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-800 cursor-pointer hover:border-indigo-400 flex items-center justify-between transition-colors">
                      <span className={formDates[dateField] ? '' : 'text-slate-400'}>{formDates[dateField] || '日付を選択...'}</span>
                      <Calendar className="w-3.5 h-3.5 text-indigo-500" />
                    </button>
                    <input type="hidden" name={dateField} value={formDates[dateField] || ''} />
                  </div>
                </div>
              ))}

              {[
                { title: '事前挨拶訪問', icon: Handshake, headerColor: 'text-teal-800', iconClass: 'text-teal-600',
                  statusField: 'greetingStatus', dateField: 'greetingDate', timeField: 'greetingTime', visitorField: 'greetingVisitor',
                  options: [['pending', '未調整'], ['scheduled', '日程確定'], ['completed', '挨拶終了']], accent: 'accent-teal-600',
                  defaultStatus: editingStudent?.greetingStatus || 'pending', defaultDate: editingStudent?.greetingDate || '',
                  defaultTime: editingStudent?.greetingTime || '', defaultVisitor: editingStudent?.greetingVisitor || editingStudent?.teacher || myTeacherName || '',
                  dateLabel: '挨拶予定日', timeLabel: '挨拶予定時間', visitorLabel: '引率教員', timePlaceholder: '例: 13:30' },
                { title: '指導巡回予定', icon: Clock, headerColor: 'text-violet-800', iconClass: 'text-violet-600',
                  statusField: 'patrolStatus', dateField: 'patrolDate', timeField: 'patrolTime', visitorField: 'patrolVisitor',
                  options: [['pending', '未確定'], ['scheduled', '日程確定'], ['completed', '巡回終了']], accent: 'accent-violet-600',
                  defaultStatus: editingStudent?.patrolStatus || 'pending', defaultDate: editingStudent?.patrolDate || '',
                  defaultTime: editingStudent?.patrolTime || '', defaultVisitor: editingStudent?.patrolVisitor || editingStudent?.teacher || myTeacherName || '',
                  dateLabel: '巡回予定日', timeLabel: '巡回予定時間', visitorLabel: '巡回訪問教員', timePlaceholder: '例: 10:00〜11:30' }
              ].map(({ title, icon: Icon, headerColor, iconClass, statusField, dateField, timeField, visitorField, options, accent, defaultStatus, defaultDate, defaultTime, defaultVisitor, dateLabel, timeLabel, visitorLabel, timePlaceholder }) => (
                <div key={statusField} className="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                  <div className="flex items-center justify-between">
                    <h4 className={`text-xs font-bold ${headerColor} flex items-center gap-1`}>
                      <Icon className={`w-3.5 h-3.5 ${iconClass}`} />
                      {title}
                    </h4>
                    <div className="flex gap-2">
                      {options.map(([st, lbl]) => (
                        <label key={st} className="flex items-center gap-1 text-[10px] cursor-pointer font-semibold text-slate-700">
                          <input type="radio" name={statusField} value={st} defaultChecked={defaultStatus === st} className={accent} />
                          <span>{lbl}</span>
                        </label>
                      ))}
                    </div>
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="block text-[9px] text-slate-500 mb-0.5">{dateLabel}</label>
                      <button type="button" onClick={() => setDatePickerState({ value: formDates[dateField] || '', title: dateLabel, onSelect: (v) => setFormDates((f) => ({ ...f, [dateField]: v })) })}
                        className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-800 cursor-pointer hover:border-indigo-400 flex items-center justify-between transition-colors">
                        <span className={formDates[dateField] ? '' : 'text-slate-400'}>{formDates[dateField] || '日付選択'}</span>
                        <Calendar className="w-3.5 h-3.5 text-indigo-500" />
                      </button>
                      <input type="hidden" name={dateField} value={formDates[dateField] || ''} />
                    </div>
                    <div>
                      <label className="block text-[9px] text-slate-500 mb-0.5">{timeLabel}</label>
                      <input type="text" name={timeField} placeholder={timePlaceholder} defaultValue={defaultTime}
                        className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800" />
                    </div>
                    <div>
                      <label className="block text-[9px] text-slate-500 mb-0.5">{visitorLabel}</label>
                      <input type="text" name={visitorField} placeholder="例: 鈴木 先生" defaultValue={defaultVisitor}
                        className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800" />
                    </div>
                  </div>
                </div>
              ))}

              <div>
                <label className="block text-[11px] font-bold text-slate-600 mb-1">実習配慮事項・特記事項</label>
                <textarea name="notes" rows={3} placeholder="健康面、服薬関係、交通アクセスでの配慮事項など..." defaultValue={editingStudent?.notes || ''}
                  className="w-full bg-white border border-slate-300 rounded-xl p-3 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400 placeholder-slate-400 text-slate-800"></textarea>
              </div>

              <div className="flex justify-end gap-2 pt-2">
                <button type="button" onClick={() => { setIsAddEditOpen(false); setEditingStudent(null); }}
                  className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition-all cursor-pointer">キャンセル</button>
                <button type="submit"
                  className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-sm transition-all cursor-pointer">保存してダッシュボードに同期</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* 設定モーダル */}
      {isConfigOpen && (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white border border-slate-200 rounded-2xl shadow-2xl max-w-xl w-full overflow-hidden text-slate-800">
            <div className="px-6 py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
              <h3 className="text-sm font-bold text-slate-900 flex items-center gap-2">
                <Settings className="w-5 h-5 text-indigo-600" />
                実習管理システム：環境連携設定
              </h3>
              <button onClick={() => setIsConfigOpen(false)} className="text-slate-400 hover:text-slate-900 font-bold text-xl cursor-pointer">×</button>
            </div>

            <div className="p-6 space-y-6">
              <div className="space-y-3">
                <div className="bg-indigo-50 p-4 rounded-xl border border-indigo-100">
                  <h4 className="text-xs font-bold text-indigo-800 flex items-center gap-1.5 mb-1">
                    <Key className="w-4 h-4 text-indigo-600" />
                    学年・クラス部屋キーの設定 (合言葉)
                  </h4>
                  <p className="text-[11px] text-indigo-900 leading-relaxed">学校独自のFirebaseプロジェクトの中で、さらに「学級」「年度」ごとに部屋を細かく分けることができます。（例：3-1、3-2、2026-all など）</p>
                </div>

                <form onSubmit={handleRoomKeyChange} className="flex gap-2">
                  <input type="text" required placeholder="例: 3-1" value={tempRoomKey} onChange={(e) => setTempRoomKey(e.target.value)}
                    className="flex-1 px-3 py-2 border border-slate-300 rounded-xl text-xs bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800" />
                  <button type="submit" className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-sm shrink-0 cursor-pointer">合言葉を変更</button>
                </form>
              </div>

              <hr className="border-slate-200" />

              <div className="space-y-3">
                <h4 className="text-xs font-bold text-slate-800 flex items-center gap-1">
                  <Database className="w-4 h-4 text-indigo-600" />
                  学校独自の Firebase Config (接続情報)
                </h4>
                <p className="text-[11px] text-slate-500 leading-relaxed">安全なデータ保護とセキュリティルール適用のため、各自のFirebaseコンソールから取得した「ウェブアプリ設定」JSONオブジェクトを以下に貼り付けてください。</p>

                <form onSubmit={handleConfigSubmit} className="space-y-4">
                  <textarea rows={5} placeholder={'{\n  "apiKey": "AIzaSy...",\n  "projectId": "school-database", ...\n}'}
                    value={firebaseConfigStr} onChange={(e) => setFirebaseConfigStr(e.target.value)}
                    className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-mono bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-700 placeholder-slate-400"></textarea>

                  <div className="flex gap-2">
                    <button type="submit" className="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs shadow-sm cursor-pointer text-center">学校のクラウドに接続する</button>
                    {firebaseConfigStr && (
                      <button type="button" onClick={resetConfig} className="px-3 py-2.5 bg-slate-100 hover:bg-rose-50 hover:text-rose-700 text-slate-600 border border-slate-200 rounded-xl text-xs font-bold transition-all cursor-pointer">接続解除</button>
                    )}
                  </div>
                </form>

                {connectionError && (
                  <div className="p-3 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-800 leading-relaxed">
                    <span className="font-bold flex items-center gap-1 mb-1 text-rose-700">
                      <AlertTriangle className="w-4 h-4 shrink-0" />
                      接続エラーガイド
                    </span>
                    <p className="text-[10px] text-rose-900">{connectionError}</p>
                  </div>
                )}
              </div>
            </div>

            <div className="px-6 py-4 bg-slate-50 border-t border-slate-200 flex justify-end">
              <button onClick={() => setIsConfigOpen(false)} className="px-4 py-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 rounded-xl text-xs font-bold cursor-pointer">閉じる</button>
            </div>
          </div>
        </div>
      )}

      {/* カスタムアラート */}
      {alertState && (
        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/30 backdrop-blur-sm">
          <div className="bg-white border border-slate-200 rounded-2xl shadow-2xl max-w-sm w-full p-6 text-center animate-scaleIn">
            <div className="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-indigo-100 mb-4 text-indigo-600">
              <Info className="h-6 w-6" />
            </div>
            <h3 className="text-sm font-bold text-slate-900 mb-2">お知らせ</h3>
            <p className="text-xs text-slate-600 mb-6 leading-relaxed">{alertState.message}</p>
            <button onClick={closeAlert} className="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-sm transition-all active:scale-95 cursor-pointer">OK</button>
          </div>
        </div>
      )}

      {/* 日付選択モーダル */}
      {datePickerState && (
        <DatePickerModal
          value={datePickerState.value}
          title={datePickerState.title}
          onSelect={datePickerState.onSelect}
          onClose={() => setDatePickerState(null)}
        />
      )}

      {/* カスタム確認ダイアログ */}
      {confirmState && (
        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/30 backdrop-blur-sm">
          <div className="bg-white border border-slate-200 rounded-2xl shadow-2xl max-w-sm w-full p-6 text-center animate-scaleIn">
            <div className="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-rose-100 mb-4 text-rose-600">
              <AlertTriangle className="h-6 w-6" />
            </div>
            <h3 className="text-sm font-bold text-slate-900 mb-2">確認</h3>
            <p className="text-xs text-slate-600 mb-6 leading-relaxed">{confirmState.message}</p>
            <div className="flex gap-2">
              <button onClick={confirmState.onCancel} className="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition-all cursor-pointer">キャンセル</button>
              <button onClick={confirmState.onConfirm} className="flex-1 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold shadow-sm transition-all active:scale-95 cursor-pointer">実行</button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

// =============================================================================
// 起動 / Bootstrap
// =============================================================================
const container = document.getElementById('root');
const root = createRoot(container);
root.render(<App />);
</script>
</body>
</html>
