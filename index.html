                const isToday = today.getFullYear() === cell.year && today.getMonth() === cell.month && today.getDate() === cell.day;
                const isInternshipDay = hasPeriodEventOnDate(cell.year, cell.month, cell.day);
                const dayOfWeek = index % 7;

                return (
                  <div
                    key={`${cell.year}-${cell.month}-${cell.day}-${index}`}
                    onClick={(e) => {
                      if (e.target === e.currentTarget) {
                        const formattedDate = formatDateKey(cell.year, cell.month, cell.day);
                        openAddModal([formattedDate]);
                      }
                    }}
                    className={`p-1.5 flex flex-col justify-between min-h-[110px] transition-all relative group cursor-pointer ${cell.isCurrentMonth ? (isInternshipDay ? 'bg-indigo-50/40' : 'bg-white') : 'bg-slate-50/50 text-slate-400'} ${isToday ? 'ring-2 ring-indigo-500 ring-inset bg-indigo-50/25' : ''}`}
                  >
                    <div className="flex items-center justify-between mb-1 select-none">
                      <span className={`text-xs font-bold ${isToday ? 'bg-indigo-600 text-white w-5 h-5 rounded-full flex items-center justify-center' : cell.isCurrentMonth ? (dayOfWeek === 0 ? 'text-rose-600' : dayOfWeek === 6 ? 'text-sky-600' : 'text-slate-800') : 'text-slate-400'}`}>
                        {cell.day}
                      </span>
                      {isInternshipDay && cell.isCurrentMonth && (
                        <span className="text-[8px] bg-indigo-100 text-indigo-700 font-bold px-1 rounded-sm border border-indigo-200">実習中</span>
                      )}
                    </div>

                    <div className="flex-1 space-y-1 overflow-y-auto max-h-[80px] scrollbar-thin">
                      {dayEvents.map((ev, evIdx) => {
                        if (ev.type === 'period') {
                          return (
                            <div key={evIdx} className={`text-[10px] px-1.5 py-0.5 rounded border font-bold select-none transition-colors shadow-sm flex items-center justify-between gap-1 ${ev.color}`} title={ev.label}>
                              <button onClick={(e) => { e.stopPropagation(); setSelectedStudentDetail(ev.student); }} className="truncate text-left flex-1 cursor-pointer">{ev.label}</button>
                              <button onClick={(e) => { e.stopPropagation(); handleRemoveInternshipDate(ev.student, ev.dateKey); }}
                                title="この日を実習日から外す"
                                className="hover:bg-white/60 rounded px-1 shrink-0 text-[10px] font-bold cursor-pointer leading-none">×</button>
                            </div>
                          );
                        }
                        return (
                          <div key={evIdx} onClick={(e) => { e.stopPropagation(); setSelectedStudentDetail(ev.student); }}
                            className={`text-[10px] px-1.5 py-0.5 rounded border font-bold truncate select-none transition-colors shadow-sm cursor-pointer ${ev.color}`} title={ev.label}>
                            {ev.label}
                          </div>
                        );
                      })}
                    </div>

                    <div className="absolute bottom-1 right-1 opacity-0 group-hover:opacity-100 transition-opacity">
                      <Plus className="w-3.5 h-3.5 text-slate-400 hover:text-indigo-600 bg-slate-100 rounded-full" />
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        ) : (
          <div className="space-y-4 animate-fadeIn">
            <div className="bg-white p-3 border border-slate-200 rounded-2xl flex flex-wrap items-center justify-between gap-3 shadow-sm">
              <span className="text-xs font-bold text-slate-600 flex items-center gap-1.5">
                <LayoutGrid className="w-4 h-4 text-indigo-600" />
                <span>進捗変更ステップ切り替え：</span>
              </span>
              <div className="flex flex-wrap gap-2">
                {Object.entries(STEP_CONFIG).map(([key, cfg]) => (
                  <button key={key} onClick={() => setKanbanStep(key)}
                    className={`px-3 py-1.5 text-xs font-bold rounded-xl border transition-all cursor-pointer ${kanbanStep === key ? cfg.activeColor : 'bg-white hover:bg-slate-50 border-slate-200 text-slate-700'}`}>
                    {cfg.label}
                  </button>
                ))}
              </div>
              <span className="text-[11px] text-slate-500 font-medium">※ 生徒カードをドラッグして各列にドロップするだけで、瞬時に進捗ステータスを更新できます。</span>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              {kanbanColumns.cols.map((col) => {
                const groupStudents = kanbanColumns.groups[col.key] || [];
                return (
                  <div key={col.key}
                    onDragOver={(e) => e.preventDefault()}
                    onDrop={() => { if (draggingStudentId) { handleKanbanDrop(draggingStudentId, col.key); setDraggingStudentId(null); } }}
                    className="bg-white border-2 border-dashed border-slate-200 rounded-2xl p-4 min-h-[400px] flex flex-col space-y-3 shadow-sm">
                    <div className={`p-2.5 rounded-xl border-l-4 font-extrabold text-xs flex items-center justify-between ${col.styles}`}>
                      <span>{col.title}</span>
                      <span className="bg-slate-100 text-slate-800 px-2 py-0.5 rounded-full text-[10px]">{groupStudents.length}名</span>
                    </div>
                    <div className="flex-1 space-y-2.5 overflow-y-auto max-h-[550px] p-0.5">
                      {groupStudents.length === 0 ? (
                        <div className="text-center text-slate-400 text-[10px] py-12">該当生徒はいません</div>
                      ) : (
                        groupStudents.map((student) => {
                          const isMy = myTeacherName && student.teacher === myTeacherName;
                          return (
                            <div key={student.id} draggable
                              onDragStart={() => setDraggingStudentId(student.id)}
                              className={`p-3 bg-white border border-slate-200 rounded-xl shadow-sm hover:shadow-md transition-all active:scale-95 cursor-grab active:cursor-grabbing group relative ${isMy ? 'ring-1 ring-indigo-400 bg-indigo-50/10' : ''}`}>
                              <div className="flex items-center justify-between">
                                <span className="font-extrabold text-sm text-slate-900">{student.name}</span>
                                <span className="text-[9px] bg-slate-100 text-slate-600 font-bold px-1.5 py-0.5 rounded">
                                  {student.grade ? `${student.grade}年` : ''}{student.classVal ? `${student.classVal}組` : ''}
                                </span>
                              </div>
                              <p className="text-xs text-slate-700 font-bold mt-1.5 truncate">{student.location}</p>
                              {(student.internshipDates || []).length > 0 && (
                                <p className="text-[10px] text-slate-400 mt-0.5 truncate">📅 {student.internshipDates.length}日間: {formatShortDate(student.internshipDates[0])} 〜 {formatShortDate(student.internshipDates[student.internshipDates.length - 1])}</p>
                              )}
                              <div className="flex items-center justify-between border-t border-slate-100 mt-2.5 pt-2 text-[10px] text-slate-500">
                                <span className="font-bold">担当教員: {student.teacher}</span>
                                <button onClick={() => setSelectedStudentDetail(student)} className="text-indigo-600 hover:text-indigo-800 font-bold hover:underline cursor-pointer">詳細表示</button>
                              </div>
                            </div>
                          );
                        })
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </main>

      <footer className="bg-white border-t border-slate-200 py-6 px-4 mt-12 shrink-0">
        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4 text-xs text-slate-500">
          <div>
            <p className="font-semibold text-slate-700">現場実習進捗マネージャー - HTML スタンドアロン版</p>
            <p className="mt-0.5">Google Firebase Infrastructure 連携対応</p>
          </div>
          <div className="flex items-center gap-4 font-medium text-slate-400">
            <span>匿名認証・合言葉部屋分割・BOM付きCSV出力・Undo/Redo・カレンダー日付入力</span>
          </div>
        </div>
      </footer>

      {/* 詳細・編集モーダル(各項目タップで編集ポップアップ) */}
      {selectedStudentDetail && (() => { const sd = students.find((s) => s.id === selectedStudentDetail.id) || selectedStudentDetail; return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white border border-slate-200 rounded-2xl shadow-2xl max-w-md w-full overflow-hidden text-slate-800 animate-scaleIn max-h-[90vh] flex flex-col">
            <div className="px-6 py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between shrink-0">
              <h3 className="text-sm font-bold text-slate-900 flex items-center gap-2">
                <User className="w-5 h-5 text-indigo-600" />
                <span>実習生 詳細情報</span>
                <span className="text-[10px] bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded font-bold border border-indigo-100">タップで編集</span>
              </h3>
              <button onClick={() => setSelectedStudentDetail(null)} className="text-slate-400 hover:text-slate-900 font-bold text-xl cursor-pointer">×</button>
            </div>

            <div className="p-6 space-y-4 overflow-y-auto">
              <div>
                <div className="text-xs text-slate-400 font-bold">生徒情報（学年・組）</div>
                <div className="flex items-center gap-2 mt-1 flex-wrap">
                  <button onClick={() => setTextEditState({ value: sd.name || '', title: '生徒氏名を編集', label: '氏名(イニシャル推奨)', onSave: (v) => persistPartial(sd.id, { name: v }) })} className="text-base font-extrabold text-slate-950 hover:bg-indigo-50 px-2 py-0.5 rounded-lg cursor-pointer border border-transparent hover:border-indigo-200">{sd.name || '(未設定)'}</button>
                  <button onClick={() => setSelectEditState({ value: sd.grade || '3', title: '学年を選択', options: [['1','1年'],['2','2年'],['3','3年'],['other','他']], onSave: (v) => persistPartial(sd.id, { grade: v }) })} className="text-xs font-bold text-slate-700 hover:bg-indigo-50 px-2 py-0.5 rounded-lg cursor-pointer border border-slate-200 hover:border-indigo-200">{sd.grade ? `${sd.grade}年` : '学年'}</button>
                  <button onClick={() => setTextEditState({ value: sd.classVal || '', title: '組を編集', label: '組(数字)', onSave: (v) => persistPartial(sd.id, { classVal: v }) })} className="text-xs font-bold text-slate-700 hover:bg-indigo-50 px-2 py-0.5 rounded-lg cursor-pointer border border-slate-200 hover:border-indigo-200">{sd.classVal ? `${sd.classVal}組` : '組'}</button>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-4">
                <div>
                  <div className="text-xs text-slate-400 font-bold">担当教員</div>
                  <button onClick={() => setTextEditState({ value: sd.teacher || '', title: '担当教員を編集', label: '担当教員', onSave: (v) => persistPartial(sd.id, { teacher: v }) })} className="w-full text-left text-sm font-bold text-slate-900 mt-1 hover:bg-indigo-50 px-2 py-1 rounded-lg cursor-pointer border border-transparent hover:border-indigo-200">{sd.teacher || <span className="text-slate-400 italic font-normal">未設定(タップ)</span>}</button>
                </div>
                <div>
                  <div className="text-xs text-slate-400 font-bold flex items-center justify-between gap-1">
                    <span>実習先 / 活動種別</span>
                    <button onClick={() => setSelectEditState({ value: sd.internshipType || 'internship', title: '活動種別を選択', options: [['internship','実習'],['observation','見学']], onSave: (v) => persistPartial(sd.id, { internshipType: v }) })} className={`text-[10px] font-bold px-1.5 py-0.5 rounded cursor-pointer border ${sd.internshipType === 'observation' ? 'bg-pink-200 text-pink-900 border-pink-400 hover:bg-pink-300' : 'bg-yellow-200 text-yellow-900 border-yellow-400 hover:bg-yellow-300'}`}>{sd.internshipType === 'observation' ? '見学' : '実習'}</button>
                  </div>
                  <button onClick={() => setTextEditState({ value: sd.location || '', title: '実習先を編集', label: '企業・事業所名', onSave: (v) => persistPartial(sd.id, { location: v }) })} className="w-full text-left text-sm font-bold text-slate-900 mt-1 hover:bg-indigo-50 px-2 py-1 rounded-lg cursor-pointer border border-transparent hover:border-indigo-200">{sd.location || <span className="text-slate-400 italic font-normal">未設定(タップ)</span>}</button>
                </div>
              </div>

              <div>
                <div className="text-xs text-slate-400 font-bold">実習日({(sd.internshipDates || []).length}日)</div>
                <div className="mt-1 flex flex-wrap items-center gap-1 text-[10px] font-medium">
                  {(sd.internshipDates || []).length === 0 && <span className="text-slate-400 italic mr-1">実習日 未設定</span>}
                  {(sd.internshipDates || []).map((d, idx, arr) => { const palette = sd.internshipType === 'observation' ? 'bg-pink-200 border-pink-400 text-pink-900 hover:bg-pink-300' : 'bg-yellow-200 border-yellow-400 text-yellow-900 hover:bg-yellow-300'; return (<span key={d} className={`inline-flex items-center gap-1 px-1.5 py-0.5 rounded border font-bold ${palette}`}><span>{idx + 1}/{arr.length} {formatShortDate(d)}</span><button onClick={() => handleRemoveInternshipDate(sd, d)} title="この日を外す" className="hover:bg-white/60 rounded text-slate-500 hover:text-rose-700 leading-none cursor-pointer font-bold">×</button></span>); })}
                  <button onClick={() => setDatePickerState({ value: '', title: `${sd.name} の実習日を追加`, onSelect: (v) => { if (v) handleAddInternshipDate(sd, v); } })} className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded border border-dashed border-indigo-400 bg-white hover:bg-indigo-50 text-indigo-700 font-bold cursor-pointer"><Plus className="w-3 h-3" /><span>追加</span></button>
                </div>
              </div>

              <hr className="border-slate-100" />

              <div className="space-y-1.5">
                <div className="flex items-center justify-between text-xs">
                  <span className="font-bold text-slate-500 flex items-center gap-1"><Phone className="w-3.5 h-3.5 text-indigo-500" />事前電話連絡</span>
                  <button onClick={() => handleInstantToggle(sd, 'phoneStatus', sd.phoneStatus)} className={`px-2 py-0.5 rounded-md font-bold cursor-pointer ${sd.phoneStatus === 'completed' ? 'bg-indigo-50 text-indigo-700 border border-indigo-200 hover:bg-indigo-100' : sd.phoneStatus === 'none' ? 'bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200' : 'bg-rose-50 text-rose-700 border border-rose-200 hover:bg-rose-100'}`}>{sd.phoneStatus === 'completed' ? '連絡済み' : sd.phoneStatus === 'none' ? '必要なし' : '未連絡'}</button>
                </div>
                {sd.phoneStatus === 'completed' && (<button onClick={() => setDatePickerState({ value: sd.phoneDate || '', title: `${sd.name} の電話連絡日`, onSelect: (v) => persistPartial(sd.id, { phoneDate: v }) })} className="text-[11px] text-slate-600 hover:text-indigo-700 hover:underline cursor-pointer block text-left pl-5">📅 連絡日: {sd.phoneDate ? formatShortDate(sd.phoneDate) : <span className="text-slate-400 italic">未設定(タップ)</span>}</button>)}
              </div>

              <div className="space-y-1.5">
                <div className="flex items-center justify-between text-xs">
                  <span className="font-bold text-slate-500 flex items-center gap-1"><FileText className="w-3.5 h-3.5 text-emerald-500" />保護者お知らせ</span>
                  <button onClick={() => handleInstantToggle(sd, 'docStatus', sd.docStatus)} className={`px-2 py-0.5 rounded-md font-bold cursor-pointer ${sd.docStatus === 'completed' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100' : sd.docStatus === 'none' ? 'bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200' : 'bg-rose-50 text-rose-700 border border-rose-200 hover:bg-rose-100'}`}>{sd.docStatus === 'completed' ? '配付済み' : sd.docStatus === 'none' ? '必要なし' : '未配付'}</button>
                </div>
                {sd.docStatus === 'completed' && (<button onClick={() => setDatePickerState({ value: sd.docDate || '', title: `${sd.name} の配付日`, onSelect: (v) => persistPartial(sd.id, { docDate: v }) })} className="text-[11px] text-slate-600 hover:text-indigo-700 hover:underline cursor-pointer block text-left pl-5">📅 配付日: {sd.docDate ? formatShortDate(sd.docDate) : <span className="text-slate-400 italic">未設定(タップ)</span>}</button>)}
              </div>

              <div className="space-y-2">
                <div className="flex items-center justify-between text-xs">
                  <span className="font-bold text-slate-500 flex items-center gap-1"><Handshake className="w-3.5 h-3.5 text-teal-600" />事前挨拶訪問</span>
                  <button onClick={() => handleInstantToggle(sd, 'greetingStatus', sd.greetingStatus)} className={`px-2 py-0.5 rounded-md font-bold cursor-pointer ${sd.greetingStatus === 'completed' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100' : sd.greetingStatus === 'scheduled' ? 'bg-sky-50 text-sky-700 border border-sky-200 hover:bg-sky-100' : 'bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200'}`}>{sd.greetingStatus === 'completed' ? '訪問終了' : sd.greetingStatus === 'scheduled' ? '日程確定' : '未調整'}</button>
                </div>
                <div className="p-2 bg-emerald-50/40 border border-emerald-100 text-emerald-900 rounded-lg text-xs font-semibold space-y-1">
                  <button onClick={() => setDatePickerState({ value: sd.greetingDate || '', title: `${sd.name} の挨拶予定日`, onSelect: (v) => { const upd = { greetingDate: v }; if (v && (!sd.greetingStatus || sd.greetingStatus === 'pending')) upd.greetingStatus = 'scheduled'; persistPartial(sd.id, upd); } })} className="hover:bg-white/60 rounded px-1 cursor-pointer block text-left w-full">📅 挨拶予定: <span className={sd.greetingDate ? '' : 'text-slate-400 italic'}>{sd.greetingDate ? formatShortDate(sd.greetingDate) : '未設定(タップ)'}</span></button>
                  <button onClick={() => setTextEditState({ value: sd.greetingTime || '', title: '挨拶予定時間を編集', label: '時間(例: 13:30)', onSave: (v) => persistPartial(sd.id, { greetingTime: v }) })} className="hover:bg-white/60 rounded px-1 cursor-pointer block text-left w-full">⏰ 時間: <span className={sd.greetingTime ? '' : 'text-slate-400 italic'}>{sd.greetingTime || '未設定(タップ)'}</span></button>
                  <button onClick={() => setTextEditState({ value: sd.greetingVisitor || '', title: '引率教員を編集', label: '引率教員', onSave: (v) => persistPartial(sd.id, { greetingVisitor: v }) })} className="hover:bg-white/60 rounded px-1 cursor-pointer block text-left w-full">👤 引率教員: <span className={sd.greetingVisitor ? '' : 'text-slate-400 italic'}>{sd.greetingVisitor || '未設定(タップ)'}</span></button>
                </div>
              </div>

              <div className="space-y-2">
                <div className="flex items-center justify-between text-xs">
                  <span className="font-bold text-slate-500 flex items-center gap-1"><Clock className="w-3.5 h-3.5 text-violet-500" />指導巡回</span>
                  <button onClick={() => handleInstantToggle(sd, 'patrolStatus', sd.patrolStatus)} className={`px-2 py-0.5 rounded-md font-bold cursor-pointer ${sd.patrolStatus === 'completed' ? 'bg-violet-50 text-violet-700 border border-violet-200 hover:bg-violet-100' : sd.patrolStatus === 'scheduled' ? 'bg-sky-50 text-sky-700 border border-sky-200 hover:bg-sky-100' : 'bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200'}`}>{sd.patrolStatus === 'completed' ? '巡回終了' : sd.patrolStatus === 'scheduled' ? '巡回確定' : '未確定'}</button>
                </div>
                <div className="p-2 bg-violet-50/40 border border-violet-100 text-violet-900 rounded-lg text-xs font-semibold space-y-1">
                  <button onClick={() => setDatePickerState({ value: sd.patrolDate || '', title: `${sd.name} の巡回予定日`, onSelect: (v) => { const upd = { patrolDate: v }; if (v && (!sd.patrolStatus || sd.patrolStatus === 'pending')) upd.patrolStatus = 'scheduled'; persistPartial(sd.id, upd); } })} className="hover:bg-white/60 rounded px-1 cursor-pointer block text-left w-full">📅 巡回予定: <span className={sd.patrolDate ? '' : 'text-slate-400 italic'}>{sd.patrolDate ? formatShortDate(sd.patrolDate) : '未設定(タップ)'}</span></button>
                  <button onClick={() => setTextEditState({ value: sd.patrolTime || '', title: '巡回予定時間を編集', label: '時間(例: 10:00〜11:30)', onSave: (v) => persistPartial(sd.id, { patrolTime: v }) })} className="hover:bg-white/60 rounded px-1 cursor-pointer block text-left w-full">⏰ 時間: <span className={sd.patrolTime ? '' : 'text-slate-400 italic'}>{sd.patrolTime || '未設定(タップ)'}</span></button>
                  <button onClick={() => setTextEditState({ value: sd.patrolVisitor || '', title: '巡回訪問教員を編集', label: '訪問教員', onSave: (v) => persistPartial(sd.id, { patrolVisitor: v }) })} className="hover:bg-white/60 rounded px-1 cursor-pointer block text-left w-full">👤 巡回教員: <span className={sd.patrolVisitor ? '' : 'text-slate-400 italic'}>{sd.patrolVisitor || '未設定(タップ)'}</span></button>
                </div>
              </div>

              <div className="space-y-1">
                <div className="text-xs text-slate-400 font-bold">特記事項・配慮事項</div>
                <button onClick={() => setTextEditState({ value: sd.notes || '', title: '特記事項・配慮事項を編集', label: '備考', multiline: true, onSave: (v) => persistPartial(sd.id, { notes: v }) })} className="w-full text-left text-xs text-slate-700 leading-relaxed bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-200 p-2.5 rounded-xl cursor-pointer min-h-[44px]">{sd.notes || <span className="text-slate-400 italic">タップして入力</span>}</button>
              </div>

              <div className="pt-2 border-t border-slate-100">
                <button onClick={() => setMaterialModalStudentId(sd.id)} className="w-full px-3 py-2 bg-amber-50 hover:bg-amber-100 border border-amber-200 text-amber-800 rounded-xl text-xs font-bold flex items-center justify-center gap-2 cursor-pointer">
                  <Paperclip className="w-4 h-4" />
                  <span>関連資料を開く</span>
                  {(sd.materials?.length || 0) > 0 && (<span className="bg-amber-500 text-white text-[10px] px-1.5 py-0.5 rounded-full">{sd.materials.length}件</span>)}
                </button>
              </div>
            </div>

            <div className="px-6 py-4 bg-slate-50 border-t border-slate-200 flex justify-between shrink-0">
              <button onClick={() => { const id = sd.id; setSelectedStudentDetail(null); handleDeleteStudent(id); }}
                className="px-3 py-2 text-rose-600 hover:bg-rose-50 text-xs font-bold rounded-xl transition-all cursor-pointer flex items-center gap-1">
                <Trash2 className="w-4 h-4" />
                削除する
              </button>
              <button onClick={() => setSelectedStudentDetail(null)}
                className="px-4 py-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 rounded-xl text-xs font-bold cursor-pointer">閉じる</button>
            </div>
          </div>
        </div>
      ); })()}

      <TextEditModal state={textEditState} onClose={() => setTextEditState(null)} />
      <SelectEditModal state={selectEditState} onClose={() => setSelectEditState(null)} />

      {/* 追加・編集モーダル */}
      {isAddEditOpen && (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white border border-slate-200 rounded-2xl shadow-2xl max-w-xl w-full overflow-hidden text-slate-800 animate-scaleIn">
            <div className="px-6 py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
              <h3 className="text-sm font-bold text-slate-900 flex items-center gap-2">
                <Plus className="w-5 h-5 text-indigo-600" />
                {editingStudent ? '実習生の登録情報を変更' : '新しい実習生を登録'}
              </h3>
              <button onClick={() => { setIsAddEditOpen(false); setEditingStudent(null); }} className="text-slate-400 hover:text-slate-900 font-bold text-xl cursor-pointer">×</button>
            </div>

            <form onSubmit={(e) => {
                e.preventDefault();
                const fd = new FormData(e.currentTarget);
                handleSaveStudent({
                  name: fd.get('name'), grade: fd.get('grade'), classVal: fd.get('classVal'),
                  location: fd.get('location'),
                  internshipType: fd.get('internshipType') || 'internship',
                  internshipDates: [...(formDates.internshipDates || [])].sort(),
                  teacher: fd.get('teacher'),
                  phoneStatus: fd.get('phoneStatus'), phoneDate: fd.get('phoneDate'),
                  docStatus: fd.get('docStatus'), docDate: fd.get('docDate'),
                  greetingStatus: fd.get('greetingStatus'), greetingDate: fd.get('greetingDate'),
                  greetingTime: fd.get('greetingTime'), greetingVisitor: fd.get('greetingVisitor'),
                  patrolStatus: fd.get('patrolStatus'), patrolDate: fd.get('patrolDate'),
                  patrolTime: fd.get('patrolTime'), patrolVisitor: fd.get('patrolVisitor'),
                  notes: fd.get('notes')
                });
              }}
              className="p-6 space-y-4 max-h-[80vh] overflow-y-auto">

              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-[11px] font-bold text-slate-600 mb-1">生徒氏名 *</label>
                  <input type="text" name="name" required placeholder="例: O.H. (イニシャル推奨)" defaultValue={editingStudent?.name || ''}
                    className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800" />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-[11px] font-bold text-slate-600 mb-1">学年 *</label>
                    <select name="grade" required defaultValue={editingStudent?.grade || '3'}
                      className="w-full bg-white border border-slate-300 rounded-xl px-2 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800">
                      <option value="1">1年</option><option value="2">2年</option><option value="3">3年</option><option value="other">他</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-slate-600 mb-1">組 *</label>
                    <input type="text" name="classVal" required placeholder="例: 1" defaultValue={editingStudent?.classVal || ''}
                      className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800" />
                  </div>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-[11px] font-bold text-slate-600 mb-1">実習先企業・事業所名 *</label>
                  <input type="text" name="location" required placeholder="例: 第一物産 配送センター" defaultValue={editingStudent?.location || ''}
                    className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800" />
                </div>
                <div>
                  <label className="block text-[11px] font-bold text-slate-600 mb-1">担当教員 *</label>
                  <input type="text" name="teacher" required placeholder="例: 鈴木 先生" defaultValue={editingStudent?.teacher || myTeacherName || ''}
                    className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800" />
                </div>
              </div>

              <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                <div className="flex items-center justify-between gap-2 flex-wrap">
                  <span className="text-xs font-bold text-slate-700">活動種別</span>
                  <div className="flex gap-3">
                    <label className="flex items-center gap-1 text-[11px] cursor-pointer font-semibold text-indigo-700">
                      <input type="radio" name="internshipType" value="internship" defaultChecked={(editingStudent?.internshipType || 'internship') === 'internship'} className="accent-indigo-600" />
                      <span>💼 実習</span>
                    </label>
                    <label className="flex items-center gap-1 text-[11px] cursor-pointer font-semibold text-amber-700">
                      <input type="radio" name="internshipType" value="observation" defaultChecked={editingStudent?.internshipType === 'observation'} className="accent-amber-600" />
                      <span>👁️ 見学</span>
                    </label>
                  </div>
                </div>
              </div>

              <div className="bg-indigo-50/20 p-3 rounded-xl border border-indigo-100 space-y-2">
                <div className="flex items-center justify-between">
                  <label className="text-[11px] font-bold text-indigo-900">実習日（1日ずつ追加）</label>
                  <span className="text-[10px] text-slate-500">合計 {(formDates.internshipDates || []).length} 日</span>
                </div>
                <div className="flex flex-wrap gap-1.5">
                  {(formDates.internshipDates || []).length === 0 && (<span className="text-[11px] text-slate-400 italic">「日付を追加」から1日ずつ登録してください</span>)}
                  {(formDates.internshipDates || []).map((d, idx, arr) => { const isStart = idx === 0; const isEnd = idx === arr.length - 1 && arr.length > 1; const palette = isStart ? 'bg-yellow-100 border-yellow-300 text-yellow-900' : isEnd ? 'bg-indigo-100 border-indigo-300 text-indigo-900' : 'bg-indigo-50 border-indigo-200 text-indigo-900'; return (<span key={d} className={`inline-flex items-center gap-1 px-2 py-1 rounded-lg border text-[11px] font-bold ${palette}`}><span>{idx + 1}/{arr.length} {formatShortDate(d)}</span><button type="button" onClick={() => setFormDates((f) => ({ ...f, internshipDates: (f.internshipDates || []).filter((x) => x !== d) }))} className="text-slate-500 hover:text-rose-600 font-bold cursor-pointer">×</button></span>); })}
                  <button type="button" onClick={() => setDatePickerState({ value: '', title: '実習日を追加', onSelect: (v) => { if (!v) return; setFormDates((f) => { const cur = f.internshipDates || []; if (cur.includes(v)) return f; return { ...f, internshipDates: [...cur, v].sort() }; }); } })}
                    className="inline-flex items-center gap-1 px-2 py-1 rounded-lg border border-dashed border-indigo-400 bg-white hover:bg-indigo-50 text-indigo-700 text-[11px] font-bold cursor-pointer">
                    <Plus className="w-3 h-3" />
                    <span>日付を追加</span>
                  </button>
                </div>
              </div>

              <hr className="border-slate-200" />

              {[
                { title: '事前電話連絡', icon: Phone, headerColor: 'text-indigo-700', iconClass: 'text-indigo-600',
                  statusField: 'phoneStatus', dateField: 'phoneDate',
                  options: [['pending', '未完了'], ['completed', '完了'], ['none', '不要']],
                  accent: 'accent-indigo-600', defaultStatus: editingStudent?.phoneStatus || 'pending',
                  defaultDate: editingStudent?.phoneDate || '', dateHint: '連絡日 (空欄は本日日付)' },
                { title: '保護者お知らせ (同意書等)', icon: FileText, headerColor: 'text-emerald-800', iconClass: 'text-emerald-600',
                  statusField: 'docStatus', dateField: 'docDate',
                  options: [['pending', '未提出'], ['completed', '提出/回収済'], ['none', '不要']],
                  accent: 'accent-emerald-600', defaultStatus: editingStudent?.docStatus || 'pending',
                  defaultDate: editingStudent?.docDate || '', dateHint: '配付・回収日 (空欄は本日日付)' }
              ].map(({ title, icon: Icon, headerColor, iconClass, statusField, dateField, options, accent, defaultStatus, defaultDate, dateHint }) => (
                <div key={statusField} className="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                  <div className="flex items-center justify-between">
                    <h4 className={`text-xs font-bold ${headerColor} flex items-center gap-1`}>
                      <Icon className={`w-3.5 h-3.5 ${iconClass}`} />
                      {title}
                    </h4>
                    <div className="flex gap-2">
                      {options.map(([st, lbl]) => (
                        <label key={st} className="flex items-center gap-1 text-[10px] cursor-pointer font-semibold text-slate-700">
                          <input type="radio" name={statusField} value={st} defaultChecked={defaultStatus === st} className={accent} />
                          <span>{lbl}</span>
                        </label>
                      ))}
                    </div>
                  </div>
                  <div className="w-full">
                    <label className="block text-[9px] text-slate-500 mb-0.5">{dateHint}</label>
                    <button type="button" onClick={() => setDatePickerState({ value: formDates[dateField] || '', title: dateHint, onSelect: (v) => setFormDates((f) => ({ ...f, [dateField]: v })) })}
                      className="w-44 bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-800 cursor-pointer hover:border-indigo-400 flex items-center justify-between transition-colors">
                      <span className={formDates[dateField] ? '' : 'text-slate-400'}>{formDates[dateField] ? formatShortDate(formDates[dateField]) : '日付を選択...'}</span>
                      <Calendar className="w-3.5 h-3.5 text-indigo-500" />
                    </button>
                    <input type="hidden" name={dateField} value={formDates[dateField] || ''} />
                  </div>
                </div>
              ))}

              {[
                { title: '事前挨拶訪問', icon: Handshake, headerColor: 'text-teal-800', iconClass: 'text-teal-600',
                  statusField: 'greetingStatus', dateField: 'greetingDate', timeField: 'greetingTime', visitorField: 'greetingVisitor',
                  options: [['pending', '未調整'], ['scheduled', '日程確定'], ['completed', '挨拶終了']], accent: 'accent-teal-600',
                  defaultStatus: editingStudent?.greetingStatus || 'pending', defaultDate: editingStudent?.greetingDate || '',
                  defaultTime: editingStudent?.greetingTime || '', defaultVisitor: editingStudent?.greetingVisitor || editingStudent?.teacher || myTeacherName || '',
                  dateLabel: '挨拶予定日', timeLabel: '挨拶予定時間', visitorLabel: '引率教員', timePlaceholder: '例: 13:30' },
                { title: '指導巡回予定', icon: Clock, headerColor: 'text-violet-800', iconClass: 'text-violet-600',
                  statusField: 'patrolStatus', dateField: 'patrolDate', timeField: 'patrolTime', visitorField: 'patrolVisitor',
                  options: [['pending', '未確定'], ['scheduled', '日程確定'], ['completed', '巡回終了']], accent: 'accent-violet-600',
                  defaultStatus: editingStudent?.patrolStatus || 'pending', defaultDate: editingStudent?.patrolDate || '',
                  defaultTime: editingStudent?.patrolTime || '', defaultVisitor: editingStudent?.patrolVisitor || editingStudent?.teacher || myTeacherName || '',
                  dateLabel: '巡回予定日', timeLabel: '巡回予定時間', visitorLabel: '巡回訪問教員', timePlaceholder: '例: 10:00〜11:30' }
              ].map(({ title, icon: Icon, headerColor, iconClass, statusField, dateField, timeField, visitorField, options, accent, defaultStatus, defaultDate, defaultTime, defaultVisitor, dateLabel, timeLabel, visitorLabel, timePlaceholder }) => (
                <div key={statusField} className="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                  <div className="flex items-center justify-between">
                    <h4 className={`text-xs font-bold ${headerColor} flex items-center gap-1`}>
                      <Icon className={`w-3.5 h-3.5 ${iconClass}`} />
                      {title}
                    </h4>
                    <div className="flex gap-2">
                      {options.map(([st, lbl]) => (
                        <label key={st} className="flex items-center gap-1 text-[10px] cursor-pointer font-semibold text-slate-700">
                          <input type="radio" name={statusField} value={st} defaultChecked={defaultStatus === st} className={accent} />
                          <span>{lbl}</span>
                        </label>
                      ))}
                    </div>
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="block text-[9px] text-slate-500 mb-0.5">{dateLabel}</label>
                      <button type="button" onClick={() => setDatePickerState({ value: formDates[dateField] || '', title: dateLabel, onSelect: (v) => setFormDates((f) => ({ ...f, [dateField]: v })) })}
                        className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-800 cursor-pointer hover:border-indigo-400 flex items-center justify-between transition-colors">
                        <span className={formDates[dateField] ? '' : 'text-slate-400'}>{formDates[dateField] ? formatShortDate(formDates[dateField]) : '日付選択'}</span>
                        <Calendar className="w-3.5 h-3.5 text-indigo-500" />
                      </button>
                      <input type="hidden" name={dateField} value={formDates[dateField] || ''} />
                    </div>
                    <div>
                      <label className="block text-[9px] text-slate-500 mb-0.5">{timeLabel}</label>
                      <input type="text" name={timeField} placeholder={timePlaceholder} defaultValue={defaultTime}
                        className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800" />
                    </div>
                    <div>
                      <label className="block text-[9px] text-slate-500 mb-0.5">{visitorLabel}</label>
                      <input type="text" name={visitorField} placeholder="例: 鈴木 先生" defaultValue={defaultVisitor}
                        className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800" />
                    </div>
                  </div>
                </div>
              ))}

              <div>
                <label className="block text-[11px] font-bold text-slate-600 mb-1">実習配慮事項・特記事項</label>
                <textarea name="notes" rows={3} placeholder="健康面、服薬関係、交通アクセスでの配慮事項など..." defaultValue={editingStudent?.notes || ''}
                  className="w-full bg-white border border-slate-300 rounded-xl p-3 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400 placeholder-slate-400 text-slate-800"></textarea>
              </div>

              <div className="flex justify-end gap-2 pt-2">
                <button type="button" onClick={() => { setIsAddEditOpen(false); setEditingStudent(null); }}
                  className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition-all cursor-pointer">キャンセル</button>
                <button type="submit"
                  className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-sm transition-all cursor-pointer">保存してダッシュボードに同期</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* 設定モーダル */}
      {isConfigOpen && (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white border border-slate-200 rounded-2xl shadow-2xl max-w-xl w-full overflow-hidden text-slate-800">
            <div className="px-6 py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
              <h3 className="text-sm font-bold text-slate-900 flex items-center gap-2">
                <Settings className="w-5 h-5 text-indigo-600" />
                実習管理システム：環境連携設定
              </h3>
              <button onClick={() => setIsConfigOpen(false)} className="text-slate-400 hover:text-slate-900 font-bold text-xl cursor-pointer">×</button>
            </div>

            <div className="p-6 space-y-6">
              <div className="space-y-3">
                <div className="bg-indigo-50 p-4 rounded-xl border border-indigo-100">
                  <h4 className="text-xs font-bold text-indigo-800 flex items-center gap-1.5 mb-1">
                    <Key className="w-4 h-4 text-indigo-600" />
                    学年・クラス部屋キーの設定 (合言葉)
                  </h4>
                  <p className="text-[11px] text-indigo-900 leading-relaxed">学校独自のFirebaseプロジェクトの中で、さらに「学級」「年度」ごとに部屋を細かく分けることができます。（例：3-1、3-2、2026-all など）</p>
                </div>

                <form onSubmit={handleRoomKeyChange} className="flex gap-2">
                  <input type="text" required placeholder="例: 3-1" value={tempRoomKey} onChange={(e) => setTempRoomKey(e.target.value)}
                    className="flex-1 px-3 py-2 border border-slate-300 rounded-xl text-xs bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800" />
                  <button type="submit" className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-sm shrink-0 cursor-pointer">合言葉を変更</button>
                </form>
              </div>

              <hr className="border-slate-200" />

              <div className="space-y-3">
                <h4 className="text-xs font-bold text-slate-800 flex items-center gap-1">
                  <Database className="w-4 h-4 text-indigo-600" />
                  学校独自の Firebase Config (接続情報)
                </h4>
                <p className="text-[11px] text-slate-500 leading-relaxed">安全なデータ保護とセキュリティルール適用のため、各自のFirebaseコンソールから取得した「ウェブアプリ設定」JSONオブジェクトを以下に貼り付けてください。</p>

                <form onSubmit={handleConfigSubmit} className="space-y-4">
                  <textarea rows={5} placeholder={'{\n  "apiKey": "AIzaSy...",\n  "projectId": "school-database", ...\n}'}
                    value={firebaseConfigStr} onChange={(e) => setFirebaseConfigStr(e.target.value)}
                    className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-mono bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-700 placeholder-slate-400"></textarea>

                  <div className="flex gap-2">
                    <button type="submit" className="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs shadow-sm cursor-pointer text-center">学校のクラウドに接続する</button>
                    {firebaseConfigStr && (
                      <button type="button" onClick={resetConfig} className="px-3 py-2.5 bg-slate-100 hover:bg-rose-50 hover:text-rose-700 text-slate-600 border border-slate-200 rounded-xl text-xs font-bold transition-all cursor-pointer">接続解除</button>
                    )}
                  </div>
                </form>

                {connectionError && (
                  <div className="p-3 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-800 leading-relaxed">
                    <span className="font-bold flex items-center gap-1 mb-1 text-rose-700">
                      <AlertTriangle className="w-4 h-4 shrink-0" />
                      接続エラーガイド
                    </span>
                    <p className="text-[10px] text-rose-900">{connectionError}</p>
                  </div>
                )}
              </div>
            </div>

            <div className="px-6 py-4 bg-slate-50 border-t border-slate-200 flex justify-end">
              <button onClick={() => setIsConfigOpen(false)} className="px-4 py-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 rounded-xl text-xs font-bold cursor-pointer">閉じる</button>
            </div>
          </div>
        </div>
      )}

      {/* カスタムアラート */}
      {alertState && (
        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/30 backdrop-blur-sm">
          <div className="bg-white border border-slate-200 rounded-2xl shadow-2xl max-w-sm w-full p-6 text-center animate-scaleIn">
            <div className="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-indigo-100 mb-4 text-indigo-600">
              <Info className="h-6 w-6" />
            </div>
            <h3 className="text-sm font-bold text-slate-900 mb-2">お知らせ</h3>
            <p className="text-xs text-slate-600 mb-6 leading-relaxed">{alertState.message}</p>
            <button onClick={closeAlert} className="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-sm transition-all active:scale-95 cursor-pointer">OK</button>
          </div>
        </div>
      )}

      {/* 関連資料モーダル */}
      {(() => {
        const target = students.find((s) => s.id === materialModalStudentId);
        return target ? (
          <MaterialModal
            student={target}
            onClose={() => setMaterialModalStudentId(null)}
            onAdd={handleAddMaterial}
            onDelete={handleDeleteMaterial}
            onPreview={setMaterialPreview}
            onAlert={showAlert}
          />
        ) : null;
      })()}

      {/* 資料プレビュー */}
      {materialPreview && (
        <div className="fixed inset-0 z-[120] bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4" onClick={() => setMaterialPreview(null)}>
          <div onClick={(e) => e.stopPropagation()} className="bg-white border border-slate-200 rounded-2xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-hidden flex flex-col animate-scaleIn">
            <div className="px-5 py-3 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
              <h3 className="text-sm font-bold text-slate-900 truncate">{materialPreview.name}</h3>
              <button onClick={() => setMaterialPreview(null)} className="text-slate-400 hover:text-slate-900 font-bold text-xl cursor-pointer shrink-0">×</button>
            </div>
            <div className="flex-1 overflow-auto bg-slate-100 flex items-center justify-center">
              {materialPreview.kind === 'url' ? (
                <div className="p-8 text-center space-y-3">
                  <p className="text-xs text-slate-600 break-all">{materialPreview.url}</p>
                  <a href={materialPreview.url} target="_blank" rel="noopener noreferrer" className="inline-block px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-bold">新しいタブで開く</a>
                </div>
              ) : materialPreview.mimeType?.startsWith('image/') ? (
                <img src={materialPreview.dataUrl} alt={materialPreview.name} className="max-w-full max-h-full object-contain" />
              ) : materialPreview.mimeType === 'application/pdf' ? (
                <iframe src={materialPreview.dataUrl} title={materialPreview.name} className="w-full h-[80vh] bg-white" />
              ) : (
                <div className="text-center p-8 space-y-3">
                  <p className="text-sm text-slate-600">この種類のファイルはプレビューできません</p>
                  <a href={materialPreview.dataUrl} download={materialPreview.name} className="inline-block px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-bold">ダウンロード</a>
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {/* 日付選択モーダル */}
      {datePickerState && (
        <DatePickerModal
          value={datePickerState.value}
          title={datePickerState.title}
          onSelect={datePickerState.onSelect}
          onClose={() => setDatePickerState(null)}
        />
      )}

      {/* カスタム確認ダイアログ */}
      {confirmState && (
        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/30 backdrop-blur-sm">
          <div className="bg-white border border-slate-200 rounded-2xl shadow-2xl max-w-sm w-full p-6 text-center animate-scaleIn">
            <div className="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-rose-100 mb-4 text-rose-600">
              <AlertTriangle className="h-6 w-6" />
            </div>
            <h3 className="text-sm font-bold text-slate-900 mb-2">確認</h3>
            <p className="text-xs text-slate-600 mb-6 leading-relaxed">{confirmState.message}</p>
            <div className="flex gap-2">
              <button onClick={confirmState.onCancel} className="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition-all cursor-pointer">キャンセル</button>
              <button onClick={confirmState.onConfirm} className="flex-1 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold shadow-sm transition-all active:scale-95 cursor-pointer">実行</button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

// =============================================================================
// 起動 / Bootstrap
// =============================================================================
const container = document.getElementById('root');
const root = createRoot(container);
root.render(<App />);
</script>
</body>
</html>
