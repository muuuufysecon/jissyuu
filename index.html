const parseFirebaseConfigText = (text) => {
  if (!text) return null;
  const trimmed = String(text).trim();
  if (!trimmed) return null;
  const isLikelyConfig = (o) => o && typeof o === 'object' && !Array.isArray(o) && (o.apiKey || o.projectId || o.appId);
  // 1) そのまま JSON として
  try {
    const obj = JSON.parse(trimmed);
    if (isLikelyConfig(obj)) return obj;
  } catch (e) {}
  // 2) 最初の { から最後の } までを切り出して評価
  const start = trimmed.indexOf('{');
  const end = trimmed.lastIndexOf('}');
  if (start !== -1 && end > start) {
    const body = trimmed.slice(start, end + 1);
    try {
      const obj = JSON.parse(body);
      if (isLikelyConfig(obj)) return obj;
    } catch (e) {}
    try {
      // JS オブジェクトリテラル（クォート無しキー / シングルクォート等）にも対応
      const obj = new Function('"use strict"; return (' + body + ');')();
      if (isLikelyConfig(obj)) return obj;
    } catch (e) {}
  }
  return null;
};

      const next = [...r, last];
      if (next.length > limit) next.shift();
      return next;
    });
    return last;
  }, [history, limit]);

  const popRedo = useCallback(() => {
    if (!redo.length) return null;
    const last = redo[redo.length - 1];
    setRedo((r) => r.slice(0, -1));
    setHistory((h) => {
      const next = [...h, last];
      if (next.length > limit) next.shift();
      return next;
    });
    return last;
  }, [redo, limit]);

  const clear = useCallback(() => { setHistory([]); setRedo([]); }, []);
  return { history, redo, push, popUndo, popRedo, clear };
}

// =============================================================================
// usePresence: rooms/{roomKey}/presence/{sessionId} にハートビートを書き、
// 直近60秒以内に更新されたドキュメントを「接続中」とカウントする。
// =============================================================================
function usePresence(connectionStatus, roomKey, teacherName) {
  const [onlineMembers, setOnlineMembers] = useState([]);
  const sessionIdRef = useRef(null);
  const teacherNameRef = useRef(teacherName);

  useEffect(() => { teacherNameRef.current = teacherName; }, [teacherName]);

  useEffect(() => {
    if (connectionStatus !== 'connected' || !window.firebase) {
      setOnlineMembers([]);
      return;
    }
    if (!sessionIdRef.current) {
      sessionIdRef.current = (typeof localStorage !== 'undefined' && localStorage.getItem('presence_session_id')) || ('sess-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10)); try { localStorage.setItem('presence_session_id', sessionIdRef.current); } catch (e) {}
    }
    const sessionId = sessionIdRef.current;
    const db = guardedFirestore(window.firebase.app().firestore(), roomKey);
    const presenceRef = db.collection('rooms').doc(roomKey).collection('presence').doc(sessionId);
    const collectionRef = db.collection('rooms').doc(roomKey).collection('presence');

    const writeHeartbeat = async () => {
      try {
        await presenceRef.set({
          lastSeen: window.firebase.firestore.FieldValue.serverTimestamp(),
          lastSeenClient: Date.now(),
          teacherName: teacherNameRef.current || '匿名',
          ua: (navigator.userAgent || '').slice(0, 80)
        }, { merge: true });
      } catch (e) {
        console.warn('presence heartbeat failed:', e.message);
      }
    };

    writeHeartbeat();
    // v3.10 fix: ハートビート間隔を 25s → 15s に短縮。切断検知のしきい値（35s）と
    // 合わせて、最大 1〜2 回ハートビートを取りこぼせば「接続中」表示から消える。
    const heartbeatInterval = setInterval(writeHeartbeat, 15000);

    // 接続を見離したセッションを期限切れとして表示から隠すための定期再検証
    // v3.10 fix: しきい値を 60s → 35s、再検証周期を 15s → 5s に短縮して、
    // 端末クラッシュ／ネットワーク遮断などで delete が走らなかった場合でも、
    // 「接続中」表示が長く残り続けないようにする。
    const recountInterval = setInterval(() => {
      setOnlineMembers((prev) => {
        const now = Date.now();
        return prev.filter((m) => now - m.lastSeen < 35000);
      });
    }, 5000);

    const unsubscribe = collectionRef.onSnapshot((snap) => {
      // v3.10 fix: snapshot がローカルキャッシュのみから来ている
      //   （＝自分の端末が Firestore と切断中）ときは、古いオンライン情報を
      //   そのまま表示し続けないよう、表示用リストを空にする。
      if (snap.metadata && snap.metadata.fromCache) {
        setOnlineMembers([]);
        return;
      }
      const now = Date.now();
      const members = [];
      snap.forEach((doc) => {
        const data = doc.data();
        // v3.10 fix: serverTimestamp が遅延して null になることがあるため、
        //   クライアント側の Date.now() を保存した lastSeenClient もフォールバックに使う。
        //   しきい値も 60s → 35s に短縮し、切断後に「接続中」表示が長く残らないようにする。
        const serverMs = data.lastSeen?.toMillis ? data.lastSeen.toMillis() : 0;
        const clientMs = typeof data.lastSeenClient === 'number' ? data.lastSeenClient : 0;
        const lastSeen = Math.max(serverMs, clientMs);
        if (lastSeen && now - lastSeen < 35000) {
          members.push({
            id: doc.id,
            teacherName: data.teacherName || '匿名',
            lastSeen,
            isSelf: doc.id === sessionId
          });
        }
      });
      members.sort((a, b) => b.lastSeen - a.lastSeen); const dedupMap = new Map(); for (const m of members) { const key = String(m.teacherName || '').trim() || ('__id__' + m.id); if (m.isSelf) dedupMap.set(key, m); else if (!dedupMap.has(key)) dedupMap.set(key, m); } members.length = 0; for (const m of dedupMap.values()) members.push(m); members.sort((a, b) => (Number(b.isSelf) - Number(a.isSelf)) || String(a.teacherName).localeCompare(String(b.teacherName), 'ja'));
      setOnlineMembers(members);
    }, (err) => {
      console.warn('presence snapshot error:', err.message);
    });

    const cleanup = () => {
      try { presenceRef.delete().catch(() => {}); } catch (e) {}
    };
    const onUnload = () => cleanup();
    window.addEventListener('beforeunload', onUnload);
    window.addEventListener('pagehide', onUnload);

    return () => {
      clearInterval(heartbeatInterval);
      clearInterval(recountInterval);
      unsubscribe();
      cleanup();
      window.removeEventListener('beforeunload', onUnload);
      window.removeEventListener('pagehide', onUnload);
    };
  }, [connectionStatus, roomKey]);

  return { onlineCount: onlineMembers.length, onlineMembers };
}

// =============================================================================
// useBoardSync: 画面上部の掲示板。rooms/{roomKey}/board コレクションを

  useEffect(() => {

      const __seedKey = 'board_seeded_' + roomKey; const __existing = stored ? JSON.parse(stored) : []; if (!localStorage.getItem(__seedKey)) { const __seed = { id: 'seed-init-' + roomKey + '-' + Date.now(), author: '加藤俊', message: '初期設定：この画面を開いたら次の設定をお願いします。\n１　メッセージで一緒に送られたファイルダウンロードする。\n２　環境設定を開く。\n３　ダウンロードしたファイルを点線で囲まれた configs・・・・・のようなところにドラッグアンドドロップする。', createdAt: Date.now() }; const __merged = [__seed, ...__existing].slice(0, 50); try { localStorage.setItem('local_board_' + roomKey, JSON.stringify(__merged)); localStorage.setItem(__seedKey, '1'); } catch (e) {} setPosts(__merged); } else { setPosts(__existing); }
    } catch (e) { setPosts([]); }

      const db = guardedFirestore(window.firebase.app().firestore(), roomKey);

  const addPost = async (author, message) => {

    }
    setPosts((prev) => {
      const next = [{ id: 'local-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6), author: author || '匿名', message, createdAt: Date.now() }, ...prev];

      const entry = { id: snap.id, author: snap.author || '匿名', message: snap.message || '', createdAt: ms || Date.now(), deletedAt: Date.now(), deletedBy: deletedBy || '匿名' };

    }

      try {
        const db = guardedFirestore(window.firebase.app().firestore(), roomKey);
        await db.collection('rooms').doc(roomKey).collection('board').doc(postId).delete();
        return;
      } catch (e) { window.alert('投稿を削除できませんでした: ' + e.message); return false; }
    }
    setPosts((prev) => {
      const next = prev.filter((p) => p.id !== postId);
      try { localStorage.setItem('local_board_' + roomKey, JSON.stringify(next)); } catch (e) {}
      return next;
    });
  };

  const [hiddenIds, setHiddenIds] = useState(() => { try { const v = localStorage.getItem('board_hidden_' + roomKey); return new Set(v ? JSON.parse(v) : []); } catch (e) { return new Set(); } });
  useEffect(() => {
    try { const v = localStorage.getItem('board_hidden_' + roomKey); setHiddenIds(new Set(v ? JSON.parse(v) : [])); } catch (e) { setHiddenIds(new Set()); }
    try { setDeletedHistory(JSON.parse(localStorage.getItem('board_deleted_history_' + roomKey) || '[]')); } catch (e) { setDeletedHistory([]); }
    try { setHiddenHistory(JSON.parse(localStorage.getItem('board_hidden_history_' + roomKey) || '[]')); } catch (e) { setHiddenHistory([]); }
  }, [roomKey]);
  // v3.16: 非表示にした投稿のスナップショットを履歴へ保存（端末ごと）。
  const hidePost = (postId) => {
    const snap = posts.find((p) => p.id === postId);
    if (snap) {
      const ts = snap.createdAt;
      const ms = ts && typeof ts === 'object' && ts.toMillis ? ts.toMillis() : (typeof ts === 'number' ? ts : 0);
      const entry = { id: snap.id, author: snap.author || '匿名', message: snap.message || '', createdAt: ms || Date.now(), hiddenAt: Date.now() };

    }
    setHiddenIds((prev) => { const next = new Set(prev); next.add(postId); try { localStorage.setItem('board_hidden_' + roomKey, JSON.stringify(Array.from(next))); } catch (e) {} return next; });
  };
  // v3.16: 非表示にした投稿を自分の画面に再表示する。
  const restoreHiddenPost = (postId) => {
    setHiddenIds((prev) => { const next = new Set(prev); next.delete(postId); try { localStorage.setItem('board_hidden_' + roomKey, JSON.stringify(Array.from(next))); } catch (e) {} return next; });
    setHiddenHistory((prev) => { const next = prev.filter((h) => h.id !== postId); try { localStorage.setItem('board_hidden_history_' + roomKey, JSON.stringify(next)); } catch (e) {} return next; });

  const visiblePosts = posts.filter((p) => !hiddenIds.has(p.id));

  return { posts: visiblePosts, addPost, deletePost, hidePost, deletedHistory, hiddenHistory, restoreHiddenPost, clearDeletedHistory, clearHiddenHistory };
}

// v3.27.0: 既存のステータスを移行せずにワークフローとして表示する。

// v3.29.0: 登録済みの日付だけを配置する、クリック編集付き工程表。

const shiftWorkflowDay = (day, count) => { const d = new Date(day + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+count); return d.toISOString().slice(0,10); };

// v3.9: locked / onToggleLock / isAdmin を受け取るよう拡張。
//   ・locked=true かつ isAdmin=false のときクリックを完全に無反応にし、グレーアウト表示。
//   ・onToggleLock が渡されていれば（管理者だけ）、ボタン右肩に🔒/🔓トグルを表示。
const ProgressToggleButton = ({ icon: Icon, label, status, palette, onClick, suffix, cellHandlers, clickGate, locked, onToggleLock, isAdmin }) => {
  const lockedForUser = locked && !isAdmin;
  const handleMain = (e) => {
    if (lockedForUser) { e.preventDefault(); e.stopPropagation(); return; }
    if (clickGate && !clickGate()) return;
    if (onClick) onClick(e);
  };
  const tooltip = lockedForUser ? '管理者によりロックされています' : label;
  const lockedStyle = lockedForUser ? ' opacity-40 grayscale cursor-not-allowed' : '';
  const cursorStyle = lockedForUser ? '' : ' cursor-pointer';
  const lockBadge = onToggleLock ? (
    <button
      type="button"
      onClick={(e) => { e.stopPropagation(); onToggleLock(); }}
      title={locked ? '管理者ロックを解除' : '一般利用者のクリックを禁止する'}
      className={`ml-1 shrink-0 inline-flex items-center justify-center w-4 h-4 rounded-full border text-[9px] cursor-pointer transition-all ${locked ? 'bg-amber-100 border-amber-400' : 'bg-white border-slate-300 hover:border-amber-300'}`}
    >
      <span>{locked ? '🔒' : '🔓'}</span>
    </button>
  ) : null;
  if (status === 'none') {
    return (
      <span className="w-full flex items-center gap-0.5">
        <button onClick={handleMain} {...(cellHandlers || {})} title={tooltip} className={`flex-1 py-1.5 px-2.5 text-[10px] font-bold flex items-center justify-center text-slate-500 transition-all active:scale-95${cursorStyle}${lockedStyle}`}>ー</button>
        {lockBadge}
      </span>
    );
  }
  return (
    <span className="w-full flex items-center gap-0.5">
      <button
        onClick={handleMain} {...(cellHandlers || {})}
        title={tooltip}
        className={`flex-1 py-1.5 px-2.5 rounded-lg border text-[10px] font-bold flex items-center justify-between transition-all active:scale-95 shadow-sm ${palette}${cursorStyle}${lockedStyle}`}
      >
        <span className="flex items-center gap-1">
          <Icon className="w-3.5 h-3.5" />
          {label}
        </span>
        <span>{suffix}</span>
      </button>
      {lockBadge}
    </span>
  );
};

// v3.18: 添付ファイルのダウンロード。旧データ（dataUrl）はそのまま、Storage 保存分（url）は fetch→blob 経由でダウンロードする。
const downloadMaterialFile = async (m) => {
  const trigger = (href) => { const a = document.createElement('a'); a.href = href; a.download = m.name || 'file'; document.body.appendChild(a); a.click(); document.body.removeChild(a); };
  if (m.dataUrl) { trigger(m.dataUrl); return; }
  if (!m.url) return;
  try {
    const res = await fetch(m.url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();
    const objUrl = URL.createObjectURL(blob);
    trigger(objUrl);
    setTimeout(() => URL.revokeObjectURL(objUrl), 10000);
  } catch (e) {
    window.open(m.url, '_blank', 'noopener');
  }
};

// v3.25.2: PDF はアプリ内モーダルではなく、ブラウザの別タブで開く。
const isPdfMaterial = (m) =>
  m?.mimeType === 'application/pdf' || /\.pdf(?:$|[?#])/i.test(String(m?.name || '')) || /\.pdf(?:$|[?#])/i.test(String(m?.url || ''));

const openPdfInNewTab = (m) => {
  try {
    let href = m?.url || '';
    let revokeUrl = '';
    if (!href && m?.dataUrl) {
      const match = String(m.dataUrl).match(/^data:([^;,]+)?(;base64)?,(.*)$/s);
      if (!match) throw new Error('PDFデータの形式が正しくありません。');
      const mime = match[1] || 'application/pdf';
      const bytes = match[2]
        ? Uint8Array.from(atob(match[3]), (c) => c.charCodeAt(0))
        : new TextEncoder().encode(decodeURIComponent(match[3]));
      revokeUrl = URL.createObjectURL(new Blob([bytes], { type: mime }));
      href = revokeUrl;
    }
    if (!href) throw new Error('PDFの保存先が見つかりません。');
    const opened = window.open('about:blank', '_blank');
    if (!opened) throw new Error('別タブを開けませんでした。ブラウザのポップアップを許可してください。');
    const doc = opened.document;
    doc.title = m?.name || 'PDF';
    doc.documentElement.style.height = '100%';
    doc.body.style.cssText = 'height:100%;margin:0;background:#334155;overflow:hidden';
    const embed = doc.createElement('embed');
    embed.src = href; embed.type = 'application/pdf';
    embed.style.cssText = 'display:block;width:100%;height:100%;border:0';
    doc.body.appendChild(embed);
    opened.opener = null;
    if (revokeUrl) setTimeout(() => URL.revokeObjectURL(revokeUrl), 30 * 60 * 1000);
    return true;
  } catch (e) {
    console.warn('PDFを別タブで開けませんでした:', e.message);
    return false;
  }
};

const DatePickerModal = ({ value, title, onSelect, onClose, allowClear = true }) => {
  const initial = value ? new Date(value + 'T00:00:00') : new Date();
  const [year, setYear] = useState(initial.getFullYear());
  const [month, setMonth] = useState(initial.getMonth());

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const prevMonthDays = new Date(year, month, 0).getDate();
  const cells = [];
  for (let i = firstDay - 1; i >= 0; i--) cells.push({ day: prevMonthDays - i, isCurrent: false, y: month === 0 ? year - 1 : year, m: month === 0 ? 11 : month - 1 });
  for (let i = 1; i <= daysInMonth; i++) cells.push({ day: i, isCurrent: true, y: year, m: month });
  const rem = 42 - cells.length;
  for (let i = 1; i <= rem; i++) cells.push({ day: i, isCurrent: false, y: month === 11 ? year + 1 : year, m: month === 11 ? 0 : month + 1 });

  const today = new Date();
  const todayKey = formatDateKey(today.getFullYear(), today.getMonth(), today.getDate());

  const handlePrev = () => { if (month === 0) { setYear(year - 1); setMonth(11); } else setMonth(month - 1); };
  const handleNext = () => { if (month === 11) { setYear(year + 1); setMonth(0); } else setMonth(month + 1); };

  return (
    <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm" onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} className="bg-white border border-slate-200 rounded-2xl shadow-2xl max-w-sm w-full overflow-hidden animate-scaleIn">
        <div className="px-5 py-3 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
          <h3 className="text-sm font-bold text-slate-900 flex items-center gap-2">
            <Calendar className="w-4 h-4 text-indigo-600" />
            <span>{title || '日付を選択'}</span>
          </h3>
          <button type="button" onClick={onClose} className="text-slate-400 hover:text-slate-900 font-bold text-xl cursor-pointer">×</button>
        </div>

        <div className="p-4">
          <div className="flex items-center justify-between mb-3">
            <button type="button" onClick={handlePrev} className="p-1.5 hover:bg-slate-100 bg-white border border-slate-200 rounded-lg text-slate-700 transition-all cursor-pointer">
              <ChevronLeft className="w-4 h-4" />
            </button>
            <span className="text-sm font-bold text-slate-900">{year}年 {month + 1}月</span>
            <button type="button" onClick={handleNext} className="p-1.5 hover:bg-slate-100 bg-white border border-slate-200 rounded-lg text-slate-700 transition-all cursor-pointer">
              <ChevronRight className="w-4 h-4" />
            </button>
          </div>

          <div className="grid grid-cols-7 text-center text-[10px] font-bold text-slate-500 mb-1 select-none">
            <div className="text-rose-500">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div className="text-sky-500">土</div>
          </div>

          <div className="grid grid-cols-7 gap-1">
            {cells.map((c, i) => {
              const key = formatDateKey(c.y, c.m, c.day);
              const isToday = key === todayKey;
              const isSelected = key === value;
              const dow = i % 7;
              const palette = isSelected ? 'bg-indigo-600 text-white shadow-sm' : isToday ? 'bg-indigo-50 text-indigo-700 border border-indigo-200' : c.isCurrent ? (dow === 0 ? 'text-rose-600 hover:bg-rose-50' : dow === 6 ? 'text-sky-600 hover:bg-sky-50' : 'text-slate-800 hover:bg-slate-100') : 'text-slate-300 hover:bg-slate-50';
              return (
                <button key={i} type="button" onClick={() => { onSelect(key); onClose(); }} className={`aspect-square text-xs font-bold rounded-lg transition-all cursor-pointer ${palette}`}>
                  {c.day}
                </button>
              );
            })}
          </div>
        </div>

        <div className="px-5 py-3 bg-slate-50 border-t border-slate-200 flex justify-between gap-2">
          <button type="button" onClick={() => { onSelect(todayKey); onClose(); }}
            className="px-3 py-1.5 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 rounded-lg text-xs font-bold cursor-pointer">今日</button>
          <div className="flex gap-2">
            {allowClear && value && (
              <button type="button" onClick={() => { onSelect(''); onClose(); }}
                className="px-3 py-1.5 bg-white border border-rose-200 hover:bg-rose-50 text-rose-700 rounded-lg text-xs font-bold cursor-pointer">クリア</button>
            )}
            <button type="button" onClick={onClose}
              className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold cursor-pointer">閉じる</button>
          </div>
        </div>
      </div>
    </div>
  );
};

              <div className="flex items-center gap-2 flex-wrap">
                <button type="button" onClick={handleCopyPrompt} className={`px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 ${copied ? 'bg-emerald-50 border border-emerald-300 text-emerald-700' : 'bg-violet-600 hover:bg-violet-700 text-white border border-violet-600'} cursor-pointer shadow-sm`} title="ChatGPT / Claude / Gemini Web 等のAIに貼り付けるためのプロンプト文をクリップボードへコピーします">{copied ? (<><CheckCircle className="w-3.5 h-3.5" /><span>コピーしました！</span></>) : (<><Copy className="w-3.5 h-3.5" /><span>プロンプトをコピー</span></>)}</button>
              </div>
              <p className="text-[10px] text-slate-500 leading-relaxed">※ 上の欄に貼り付けた内容と「14列CSVで出力してください」という指示文をまとめてクリップボードへコピーします。<br />※ ChatGPT / Claude / Gemini Web 等を開いてペースト → 返ってきたCSVをコピー → 下の「ここにCSV/TSVを貼り付け」欄にペーストして「全件登録」してください。<br />※ 上の貼り付け欄が空の場合でも、テンプレート付きのプロンプトだけコピーできます。</p>
            </div>
          </details>
          <textarea value={text} onChange={(e) => { setText(e.target.value); parseInput(e.target.value); }} rows={8} placeholder="ここにCSV/TSVを貼り付け（1行目はヘッダー）" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-mono focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800" />
          {errors.length > 0 && (<div className="p-2 bg-rose-50 border border-rose-200 rounded-lg text-xs text-rose-800 space-y-1">{errors.map((e, i) => <div key={i}>⚠ {e}</div>)}</div>)}
          {parsed && parsed.length > 0 && (
            <div className="border border-slate-200 rounded-xl overflow-hidden">
              <div className="px-3 py-2 bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-700 flex items-center justify-between"><span>プレビュー: <span className="text-indigo-700">{parsed.length}名</span></span><span className="text-[10px] text-slate-500 font-medium">下の「全件登録」で確定します</span></div>
              <div className="overflow-auto max-h-64">
                <table className="w-full text-[10px]">
                  <thead className="bg-slate-50 sticky top-0"><tr className="text-slate-600 font-bold border-b border-slate-200"><th className="p-1.5 text-left">氏名</th><th className="p-1.5 text-left">学年/組</th><th className="p-1.5 text-left">担当教員</th><th className="p-1.5 text-left">実習先</th><th className="p-1.5 text-left">種別</th><th className="p-1.5 text-left">実習日</th><th className="p-1.5 text-left">電話</th><th className="p-1.5 text-left">配付</th><th className="p-1.5 text-left">挨拶日</th><th className="p-1.5 text-left">巡回</th></tr></thead>
                  <tbody className="divide-y divide-slate-200">{parsed.map((r, i) => (<tr key={i} className="hover:bg-slate-50"><td className="p-1.5 font-bold text-slate-800">{r.name}</td><td className="p-1.5">{r.grade}年{r.classVal}組</td><td className="p-1.5">{r.teacher}</td><td className="p-1.5">{r.location}</td><td className="p-1.5">{r.internshipType === 'observation' ? '見学' : '実習'}</td><td className="p-1.5">{r.internshipDates.length}日</td><td className="p-1.5">{r.phoneStatus === 'completed' ? '完了' : r.phoneStatus === 'none' ? '不要' : '未完了'}</td><td className="p-1.5">{r.docStatus === 'completed' ? '完了' : r.docStatus === 'none' ? '不要' : '未完了'}</td><td className="p-1.5">{r.greetingDate || '-'}</td><td className="p-1.5">{r.patrols.length}件</td></tr>))}</tbody>
                </table>
              </div>
            </div>
          )}
        </div>
        <div className="px-5 py-3 bg-slate-50 border-t border-slate-200 flex justify-end gap-2 shrink-0">
          <button onClick={onClose} className="px-3 py-1.5 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 rounded-lg text-xs font-bold cursor-pointer">キャンセル</button>
          <button onClick={() => { if (!parsed || parsed.length === 0) { onAlert('登録するデータがありません。テンプレートに沿って入力してください。'); return; } onCommit(parsed); }} disabled={!parsed || parsed.length === 0 || errors.length > 0} className={`px-4 py-1.5 rounded-lg text-xs font-bold ${parsed && parsed.length > 0 && errors.length === 0 ? 'bg-indigo-600 hover:bg-indigo-700 text-white cursor-pointer shadow-sm' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>全件登録 ({parsed?.length || 0}名)</button>
        </div>
      </div>
    </div>
  );
};

// v3.28.0: 検索・掲示板を必要なときだけ表示する補助ダイアログ。
function AppUtilityDialog({ title, onClose, children, wide = false, suspended = false, className = '' }) {
  const ref = useRef(null);
  useEffect(() => {
    const previous = document.activeElement;
    const overflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    (ref.current?.querySelector('input') || ref.current?.querySelector('button'))?.focus();
    return () => { document.body.style.overflow = overflow; if (previous?.isConnected) previous.focus?.(); };
  }, []);
  useEffect(() => {
    const keydown = (event) => {
      if (suspended) return;
      if (event.key === 'Escape') { event.preventDefault(); onClose(); }
      if (event.key !== 'Tab') return;
      const nodes = [...(ref.current?.querySelectorAll('button:not(:disabled),input:not(:disabled),textarea:not(:disabled),select:not(:disabled),[tabindex="0"]') || [])].filter((node) => node.getClientRects().length);
      if (event.shiftKey && document.activeElement === nodes[0]) { event.preventDefault(); nodes[nodes.length-1]?.focus(); }
      else if (!event.shiftKey && document.activeElement === nodes[nodes.length-1]) { event.preventDefault(); nodes[0]?.focus(); }
    };
    document.addEventListener('keydown',keydown); return () => document.removeEventListener('keydown',keydown);
  }, [suspended,onClose]);
  return <div className="sb-utility-overlay no-print" onMouseDown={(event) => { if (event.target === event.currentTarget) onClose(); }}><section ref={ref} role="dialog" aria-modal="true" aria-label={title} className={`sb-utility-dialog ${wide ? 'sb-board-dialog' : ''} ${className}`}><header><h2>{title}</h2><button type="button" className="sb-icon-button" aria-label={`${title}を閉じる`} onClick={onClose}>×</button></header><div className="sb-utility-body">{children}</div></section></div>;
}

// v3.36.3: 生徒を1人1行に並べた業務別進捗一覧。状態変更は既存の個別画面で行う。
const WORKFLOW_OVERVIEW_COLUMNS=[
  {key:'phone',title:'事前電話連絡'}, {key:'doc',title:'保護者お知らせ'},
  {key:'greeting',title:'事前あいさつ・打合せ'}, {key:'gift',title:'菓子折'},
  {key:'dates',title:'現場実習・見学'}, {key:'patrol',title:'巡回・同行'},
  {key:'studentThankYou',title:'生徒お礼状'}, {key:'teacherThankYou',title:'教師お礼状'}
];
const EMPTY_WORKFLOW_OVERVIEW_FILTERS={grade:'all',classVal:'all',teacher:'all',type:'all',unfinished:false};
const getWorkflowOverviewRow=(student)=>{
  const model=getWorkflowModel(student),tasks=model.phases.flatMap(p=>p.tasks);
  const unfinished=tasks.filter(t=>!['done','exempt','deferred'].includes(t.state)).length;
  return {student,model,tasks,unfinished,done:tasks.filter(t=>t.state==='done').length};
};
function WorkflowOverview({students,period,filters,onFilters,onOpenStudent,isAdmin,searchQuery=''}) {
  const pageRef=useRef(null);
  const [pageHeight,setPageHeight]=useState(null);
  useEffect(()=>{
    const page=pageRef.current;if(!page)return;
    const measure=()=>{const top=page.getBoundingClientRect().top+window.scrollY;const next=Math.max(320,Math.floor(window.innerHeight-top-8));setPageHeight(old=>old===next?old:next);};
    measure();
    const observer=new ResizeObserver(measure);
    [page.parentElement,document.querySelector('.sb-topbar'),document.querySelector('.sb-demo-note')].filter(Boolean).forEach(el=>observer.observe(el));
    window.addEventListener('resize',measure);
    window.visualViewport?.addEventListener('resize',measure);
    return ()=>{observer.disconnect();window.removeEventListener('resize',measure);window.visualViewport?.removeEventListener('resize',measure);};
  },[]);
  const options=(field)=>[...new Set(students.map(s=>String(s[field]||'')).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja',{numeric:true}));
  const query=searchQuery.trim().toLowerCase();
  const rows=students.map(getWorkflowOverviewRow).filter(({student:s,unfinished})=>
    (!query||[s.name,s.location,s.teacher,s.grade?String(s.grade)+'年':'',s.classVal?String(s.classVal)+'組':'',...(s.internshipDates||[])].some(value=>String(value||'').toLowerCase().includes(query)))&&
    (filters.grade==='all'||String(s.grade||'')===filters.grade)&&
    (filters.classVal==='all'||String(s.classVal||'')===filters.classVal)&&
    (filters.teacher==='all'||String(s.teacher||'')===filters.teacher)&&
    (filters.type==='all'||(s.internshipType==='observation'?'observation':'internship')===filters.type)&&
    (!filters.unfinished||unfinished>0)
  ).sort((a,b)=>String(a.student.grade||'').localeCompare(String(b.student.grade||''),'ja',{numeric:true})||String(a.student.classVal||'').localeCompare(String(b.student.classVal||''),'ja',{numeric:true})||String(a.student.name||'').localeCompare(String(b.student.name||''),'ja'));
  const change=(key,value)=>onFilters({...filters,[key]:value});
  const filterCount=Object.keys(EMPTY_WORKFLOW_OVERVIEW_FILTERS).filter(k=>k==='unfinished'?filters[k]:filters[k]!=='all').length;
  const filtersOpen=filters.expanded ?? false;
  const activeFilterLabels=[filters.grade!=='all'?(filters.grade==='other'?'他学年':filters.grade+'年'):'',filters.classVal!=='all'?filters.classVal+'組':'',filters.teacher!=='all'?filters.teacher:'',filters.type!=='all'?(filters.type==='observation'?'見学':'実習'):'',filters.unfinished?'未完了あり':''].filter(Boolean);
  const totals=rows.reduce((sum,r)=>({unfinished:sum.unfinished+r.unfinished,done:sum.done+r.done}),{unfinished:0,done:0});
  const tableRef=useRef(null);
  const lastScroll=useRef({left:filters.scrollLeft||0,top:filters.scrollTop||0});
  useEffect(()=>{if(tableRef.current){tableRef.current.scrollLeft=filters.scrollLeft||0;tableRef.current.scrollTop=filters.scrollTop||0;}},[]);
  const rememberScroll=()=>{const e=tableRef.current;if(e){lastScroll.current={left:e.scrollLeft,top:e.scrollTop};if(filters.scrollLeft!==e.scrollLeft||filters.scrollTop!==e.scrollTop)onFilters({...filters,scrollLeft:e.scrollLeft,scrollTop:e.scrollTop});}};
  const open=(s,key)=>{onFilters({...filters,scrollLeft:lastScroll.current.left,scrollTop:lastScroll.current.top});onOpenStudent(s,key);};
  return <section ref={pageRef} style={pageHeight?{'--ow-page-height':pageHeight+'px'}:undefined} className="ow-page ow-dialog" aria-label="業務ワークフロー 一括進捗一覧"><h2 className="ow-sr-only">業務ワークフロー 一括進捗一覧</h2><div className="sb-utility-body">
    <section className="ow-compact-bar" aria-label="一覧の対象と集計">
      <div className="ow-period"><strong>{period.name}</strong>{period.locked&&<span className="ow-period-lock">🔒 {isAdmin?'管理者として編集中':'終了済み・閲覧のみ'}</span>}</div>
      <div className="ow-counts" role="status"><span>表示 <b>{rows.length}</b> / {students.length}名</span><span>未完了・予定・要確認 <b>{totals.unfinished}</b>件</span><span>完了 <b>{totals.done}</b>件</span></div>
      <div className="ow-filter-bar"><button type="button" aria-expanded={filtersOpen} aria-controls="ow-filter-controls" onClick={()=>onFilters({...filters,expanded:!filtersOpen})}>絞り込み{filterCount?'（'+filterCount+'）':''} {filtersOpen?'⌃':'⌄'}</button></div>
    </section>
    {filtersOpen&&<div id="ow-filter-controls" className="ow-filters" role="group" aria-label="業務一覧の絞り込み">
      <label>学年<select aria-label="業務一覧の学年" value={filters.grade} onChange={e=>change('grade',e.target.value)}><option value="all">すべて</option>{options('grade').map(v=><option key={v} value={v}>{v==='other'?'他':v+'年'}</option>)}</select></label>
      <label>組<select aria-label="業務一覧の組" value={filters.classVal} onChange={e=>change('classVal',e.target.value)}><option value="all">すべて</option>{options('classVal').map(v=><option key={v} value={v}>{v}組</option>)}</select></label>
      <label>担当教員<select aria-label="業務一覧の担当教員" value={filters.teacher} onChange={e=>change('teacher',e.target.value)}><option value="all">すべて</option>{options('teacher').map(v=><option key={v} value={v}>{v}</option>)}</select></label>
      <label>種別<select aria-label="業務一覧の種別" value={filters.type} onChange={e=>change('type',e.target.value)}><option value="all">すべて</option><option value="internship">実習</option><option value="observation">見学</option></select></label>
      <label className="ow-check"><input type="checkbox" checked={filters.unfinished} onChange={e=>change('unfinished',e.target.checked)}/>未完了のある生徒のみ</label>
      <button type="button" className="ow-reset" disabled={!filterCount} onClick={()=>onFilters({...EMPTY_WORKFLOW_OVERVIEW_FILTERS,expanded:true,scrollLeft:filters.scrollLeft,scrollTop:filters.scrollTop})}>絞り込み解除</button>
    </div>}
    <p className="ow-help ow-sr-only" id="ow-usage">{filtersOpen?'未完了には予定・要確認を含みます。終了後対応は除外。この実習期の全員から絞り込みます。':'左右にスクロールして全業務を確認できます。生徒名は固定表示です。'}</p>
    {activeFilterLabels.length>0&&<p className="ow-active-filters" role="status">条件：{activeFilterLabels.join(' ／ ')}</p>}
    <div ref={tableRef} onScroll={rememberScroll} aria-describedby="ow-usage" className="ow-table-scroll" tabIndex={0} role="region" aria-label="生徒別の業務進捗。狭い画面は左右にスクロール">
      <table className="ow-table"><caption className="ow-sr-only">{period.name}の生徒別業務進捗一覧</caption><thead><tr><th scope="col" className="ow-person">生徒・実習先<span>学級／担当教員</span></th>{WORKFLOW_OVERVIEW_COLUMNS.map(c=><th key={c.key} scope="col">{c.key==='greeting'?<>事前あいさつ<br/>・打合せ</>:c.title}</th>)}</tr></thead>
      <tbody>{rows.map(({student:s,model,tasks})=><tr key={s.id} data-ow-student={s.id}><th scope="row" className="ow-person student-identity-color" style={studentIdentityStyle(s)} data-identity-grade={s.grade||'unset'} data-identity-type={s.internshipType==='observation'?'observation':'internship'}><button type="button" className="ow-person-button" aria-label={`${s.name||'氏名未設定'}のワークフローを開く`} onClick={()=>open(s,null)}><strong>{s.name||'氏名未設定'}（{s.location||'実習先未設定'}）</strong><span>{s.grade?(s.grade==='other'?'他':s.grade+'年'):'学年未設定'}{s.classVal?' '+s.classVal+'組':''} · {s.teacher||'担当未設定'}</span><small className={s.internshipType==='observation'?'ow-observation':'ow-internship'}>{s.internshipType==='observation'?'見学':'実習'}</small></button></th>{WORKFLOW_OVERVIEW_COLUMNS.map(c=>{
        const task=tasks.find(t=>t.key===c.key),plan=getWorkflowPlan(s,task),completion=workflowCompletion(s,task);
        const state=task.state!=='done'&&plan?.kind==='thanks'?'scheduled':task.state;
        const label=task.state==='unknown'&&task.key!=='dates'?'要確認':task.state==='deferred'&&!plan?'終了後に対応':task.state==='exempt'?'必要なし':task.key==='gift'&&task.state==='todo'?'持参待ち':plan?.kind==='thanks'&&task.state!=='done'?'送付予定':task.key==='dates'?(model.finished?'期間終了':model.started?'実施中':model.days.length?'実施予定':'日程未設定'):task.key==='patrol'&&task.state==='scheduled'?'予定あり':task.label;
        let sub='';if(completion)sub=completion.date?formatShortDate(completion.date):'実施日未設定';else if(c.key==='dates'&&model.days.length)sub=formatShortDate(model.days[0])+(model.days.length>1?'〜'+formatShortDate(model.days.at(-1)):'');else if(c.key==='greeting'&&s.greetingDate)sub=formatShortDate(s.greetingDate);else if(c.key==='patrol'&&(s.patrols||[]).length){const ps=(s.patrols||[]).filter(p=>!p.done).map(p=>p.date).filter(workflowDayKey).sort();sub=ps[0]?formatShortDate(ps[0]):'';}else if(plan?.dates?.length)sub=formatShortDate(plan.dates[0])+(plan.dates.length>1?'〜'+formatShortDate(plan.dates.at(-1)):'');
        const locked=!!period.locked&&!isAdmin||!isAdmin&&((s.lockedFields||[]).includes(task.field)||(c.key==='patrol'&&(s.lockedFields||[]).includes('patrolStatus')));
        return <td key={c.key}><button type="button" className={`ow-cell ow-${state}`} aria-label={`${s.name||'氏名未設定'}：${c.title}（${label}）を開く`} onClick={()=>open(s,c.key)}><WorkflowBadge state={state}>{label}</WorkflowBadge>{sub&&<span className="ow-cell-date">{sub}</span>}{locked&&<span className="ow-lock">🔒 閲覧のみ</span>}</button></td>;
      })}</tr>)}</tbody></table>
      {!rows.length&&<div className="ow-empty" role="status">{students.length?'条件に一致する生徒はいません。絞り込みを解除してください。':'この実習期には生徒が登録されていません。'}</div>}
    </div>
    <footer className="ow-footer"><div className="ow-legend" title="状態を押して確認・編集。左右にスクロールして全業務を確認できます。未完了は予定・要確認を含み、終了後対応は除きます。"><span className="ow-legend-help">状態を押して編集</span><span>✓ 完了</span><span>○ 未完了</span><span>◷ 予定</span><span>? 要確認</span><span>— 必要なし</span></div></footer>
  </div></section>;
}

const readPeriodSelection=(room)=>{try{return localStorage.getItem(`active_internship_period${ENV_SUFFIX}_${room}`)||'';}catch{return '';}};
const readLocalPeriods=(room)=>{try{const list=JSON.parse(localStorage.getItem(`internship_periods${ENV_SUFFIX}_${room}`)||'[]');return Array.isArray(list)&&list.length?list:[DEFAULT_PERIOD];}catch{return [DEFAULT_PERIOD];}};

          await db.collection('rooms').doc(rk).collection('visitors').doc(`${todayKey}_${myTeacherName}`).set({ teacherName: myTeacherName, dateKey: todayKey, editCount: window.firebase.firestore.FieldValue.increment(n), lastSeenAt: Date.now() }, { merge: true });
        } else {
          const cur = JSON.parse(localStorage.getItem(lsKey) || '{}');
          if (!cur[myTeacherName]) cur[myTeacherName] = { firstSeenAt: Date.now(), lastSeenAt: Date.now(), editCount: 0 };
          cur[myTeacherName].editCount = (cur[myTeacherName].editCount || 0) + n;
          cur[myTeacherName].lastSeenAt = Date.now();
          localStorage.setItem(lsKey, JSON.stringify(cur));
          setTodayVisitors({ ...cur });
        }
      } catch (e) { /* ignore */ }
    };

    let unsubscribe = null;
    let hbTimer = null;
    if (fbConnected) {
      const visitorsRef = guardedFirestore(window.firebase.firestore(), roomKey).collection('rooms').doc(rk).collection('visitors');
      unsubscribe = visitorsRef.where('dateKey', '==', todayKey).onSnapshot((snap) => {
        const next = {};
        snap.forEach((d) => { const v = d.data(); if (v && v.teacherName) next[v.teacherName] = { firstSeenAt: v.firstSeenAt || 0, lastSeenAt: v.lastSeenAt || 0, editCount: v.editCount || 0 }; });
        setTodayVisitors(next);
      }, () => {});
      if (myTeacherName) {
        const beat = async () => {
          try {
            const ref = visitorsRef.doc(`${todayKey}_${myTeacherName}`);
            const snap = await ref.get();
            if (!snap.exists) await ref.set({ teacherName: myTeacherName, dateKey: todayKey, firstSeenAt: Date.now(), lastSeenAt: Date.now(), editCount: 0 });
            else await ref.update({ lastSeenAt: Date.now() });
          } catch (e) { /* ignore */ }
        };
        beat();
        hbTimer = setInterval(beat, 25000);
      }
    } else {
      try { setTodayVisitors(JSON.parse(localStorage.getItem(lsKey) || '{}')); } catch (e) { setTodayVisitors({}); }
      if (myTeacherName) {
        const beat = () => {
          try {
            const cur = JSON.parse(localStorage.getItem(lsKey) || '{}');
            if (!cur[myTeacherName]) cur[myTeacherName] = { firstSeenAt: Date.now(), lastSeenAt: Date.now(), editCount: 0 };
            else cur[myTeacherName].lastSeenAt = Date.now();
            localStorage.setItem(lsKey, JSON.stringify(cur));
            setTodayVisitors({ ...cur });
          } catch (e) { /* ignore */ }
        };
        beat();
        hbTimer = setInterval(beat, 25000);
      }
    }
    return () => { if (unsubscribe) { try { unsubscribe(); } catch (e) {} } if (hbTimer) clearInterval(hbTimer); window.__bumpVisitorEditCount = null; };
  }, [connectionStatus, roomKey, myTeacherName]);

  // v3.14: ルーム登録者一覧（全期間 + 過去ソース統合）の購読。
  //   visitors コレクションは v3.9 で導入されたため、それ以前にこのルームを
  //   使っていた人は visitors には記録が残らない。そのため次の追加ソースも
  //   統合して「過去にこのルームで活動したことのある人」を漏れなく拾う：
  //     ① rooms/{rk}/visitors（v3.9 以降の訪問記録：firstSeen/lastSeen/editCount）
  //     ② rooms/{rk}/presence の全ドキュメント（teacherName を持つもの。
  //        期限切れセッションも履歴として統合する）
  //     ③ 現在ロード済みの students[].teacher（過去に担当教員名として登録された名前）
  //     ④ 現在ロード済みの boardPosts[].author（掲示板に書き込んだ名前）
  //   ローカルモードでも local_visitors_<rk>_<dateKey> 全期間に加え、
  //   students[].teacher / boardPosts[].author を統合する。
  useEffect(() => {
    const rk = roomKey || '3-1';
    const fbConnected = connectionStatus === 'connected' && window.firebase;
    const mergeName = (acc, rawName, info, source) => {
      const name = String(rawName || '').trim();
      if (!name || name === '匿名') return;
      const firstSeen = (info && typeof info.firstSeenAt === 'number') ? info.firstSeenAt : 0;
      const lastSeen = (info && typeof info.lastSeenAt === 'number') ? info.lastSeenAt : 0;
      const editCount = (info && typeof info.editCount === 'number') ? info.editCount : 0;
      const dk = (info && info.lastDateKey) || '';
      if (!acc[name]) {
        acc[name] = { firstSeenAt: firstSeen || lastSeen, lastSeenAt: lastSeen, editCount, lastDateKey: dk, sources: new Set([source]) };
      } else {
        const prev = acc[name];
        const candidateFirst = firstSeen || lastSeen;
        if (candidateFirst && (!prev.firstSeenAt || candidateFirst < prev.firstSeenAt)) prev.firstSeenAt = candidateFirst;
        if (lastSeen > prev.lastSeenAt) prev.lastSeenAt = lastSeen;
        prev.editCount = (prev.editCount || 0) + editCount;
        if (dk > (prev.lastDateKey || '')) prev.lastDateKey = dk;
        prev.sources.add(source);
      }
    };
    const finalize = (acc) => {
      const out = {};
      Object.entries(acc).forEach(([k, v]) => { out[k] = { firstSeenAt: v.firstSeenAt, lastSeenAt: v.lastSeenAt, editCount: v.editCount, lastDateKey: v.lastDateKey, sources: Array.from(v.sources || []) }; });
      return out;
    };
    const mergeExtraSources = (acc) => {
      // students[].teacher（過去に担当教員として割り当てられた名前を全部拾う）
      (students || []).forEach((s) => { if (s && s.teacher) mergeName(acc, s.teacher, {}, 'student'); });
      // boardPosts[].author（掲示板に書き込んだ人。createdAt があれば最終訪問日として使う）
      (boardPosts || []).forEach((p) => {
        if (!p || !p.author) return;
        const ts = typeof p.createdAt === 'number' ? p.createdAt : (p.createdAt && typeof p.createdAt.toMillis === 'function' ? p.createdAt.toMillis() : 0);
        mergeName(acc, p.author, { firstSeenAt: ts, lastSeenAt: ts }, 'board');
      });
    };
    if (fbConnected) {
      const db = guardedFirestore(window.firebase.firestore(), roomKey);
      const visitorsRef = db.collection('rooms').doc(rk).collection('visitors');
      const presenceRef = db.collection('rooms').doc(rk).collection('presence');
      let visitorsSnap = null;
      let presenceSnap = null;
      const recompute = () => {
        const acc = {};
        if (visitorsSnap) {
          visitorsSnap.forEach((d) => {
            const v = d.data();
            if (!v || !v.teacherName) return;
            mergeName(acc, v.teacherName, { firstSeenAt: v.firstSeenAt, lastSeenAt: v.lastSeenAt, editCount: v.editCount, lastDateKey: v.dateKey }, 'visitors');
          });
        }
        if (presenceSnap) {
          presenceSnap.forEach((d) => {
            const v = d.data();
            if (!v || !v.teacherName) return;
            const serverMs = v.lastSeen && typeof v.lastSeen.toMillis === 'function' ? v.lastSeen.toMillis() : 0;
            const clientMs = typeof v.lastSeenClient === 'number' ? v.lastSeenClient : 0;
            const lastSeen = Math.max(serverMs, clientMs);
            mergeName(acc, v.teacherName, { firstSeenAt: lastSeen, lastSeenAt: lastSeen, editCount: 0 }, 'presence');
          });
        }
        mergeExtraSources(acc);
        setAllMembers(finalize(acc));
      };
      const unsubV = visitorsRef.onSnapshot((snap) => { visitorsSnap = snap; recompute(); }, (err) => { console.warn('all visitors snapshot:', err.message); });
      const unsubP = presenceRef.onSnapshot((snap) => { presenceSnap = snap; recompute(); }, (err) => { console.warn('all presence snapshot:', err.message); });
      return () => { try { unsubV(); } catch (e) {} try { unsubP(); } catch (e) {} };
    } else {
      // ローカルモード：local_visitors_<rk>_<dateKey> 全期間 + students + boardPosts を統合
      try {
        const acc = {};
        const prefix = `local_visitors_${rk}_`;
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (!k || !k.startsWith(prefix)) continue;
          const dk = k.slice(prefix.length);
          let map = {};
          try { map = JSON.parse(localStorage.getItem(k) || '{}'); } catch (e) { map = {}; }
          Object.entries(map).forEach(([name, info]) => {
            mergeName(acc, name, { firstSeenAt: info && info.firstSeenAt, lastSeenAt: info && info.lastSeenAt, editCount: info && info.editCount, lastDateKey: dk }, 'visitors');
          });
        }
        mergeExtraSources(acc);
        setAllMembers(finalize(acc));
      } catch (e) { setAllMembers({}); }
    }
  }, [connectionStatus, roomKey, todayVisitors, students, boardPosts]);

  // v3.9: 「登録」ボタンを押すまで実データを作成しない方式に変更。
  // 以前は ＋ ボタンや FAB を押した時点で Firestore / localStorage に
  // 空レコードを追加していたため、誤クリックで予定が増えてしまっていた。
  // 今後は AddEditModal を開くだけにして、モーダル内の保存ボタンを
  // 押した時にだけ handleSaveStudent 経由で実際の登録が行われる。
  const openAddModal = (initialInternshipDates = []) => {
    if (!requireWriteAccess()) return false;
    if (isActivePeriodLocked && !isAdmin) { showAlert('この実習期は終了済みのため編集できません。管理者にロック解除を依頼してください。'); return; }
    setEditingStudent(null);
    setFormDates({
      internshipDates: [...initialInternshipDates],
      phoneDate: '', docDate: '', greetingDate: '', patrolDate: ''
    });
    setIsAddEditOpen(true);
  };

  const openEditModal = (student) => {
    if (!requireWriteAccess()) return false;
    if (isActivePeriodLocked && !isAdmin) { showAlert('この実習期は終了済みのため編集できません。管理者にロック解除を依頼してください。'); return; }
    setEditingStudent(student);
    setFormDates({
      internshipDates: [...(student.internshipDates || [])].sort(),
      phoneDate: student.phoneDate || '',
      docDate: student.docDate || '',
      greetingDate: student.greetingDate || '',
      patrolDate: student.patrolDate || ''
    });
    setIsAddEditOpen(true);
  };

  const [searchQuery, setSearchQuery] = useState('');
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [isSearchOpen, setIsSearchOpen] = useState(false);
  const [searchDraft, setSearchDraft] = useState('');
  const [isBoardPanelOpen, setIsBoardPanelOpen] = useState(false);
  const sidebarRef = useRef(null);
  const menuButtonRef = useRef(null);
  const [filterProgress, setFilterProgress] = useState('all');
  const [filterGrade, setFilterGrade] = useState('all');
  const [filterClass, setFilterClass] = useState('all');
  const [filterInternshipType, setFilterInternshipType] = useState('all');
  const [filterPhoneStatus, setFilterPhoneStatus] = useState('all');
  const [filterDocStatus, setFilterDocStatus] = useState('all');
  const [filterGreetingStatus, setFilterGreetingStatus] = useState('all');
  const [filterPatrolStatus, setFilterPatrolStatus] = useState('all');
  const [filterStudentThankYouStatus, setFilterStudentThankYouStatus] = useState('all');
  const [filterTeacherThankYouStatus, setFilterTeacherThankYouStatus] = useState('all');

  const persistPartial = async (studentId, partial) => {
    if (!requireWriteAccess()) return false;
    const targetStudent = students.find((s) => s.id === studentId);
    const targetPeriodId = targetStudent?.periodId || DEFAULT_PERIOD_ID;
    const targetPeriod = periods.find((p) => p.id === targetPeriodId);
    if (targetPeriod?.locked && !isAdmin) { showAlert('この実習期は終了済みのため編集できません。'); return; }
    if (connectionStatus === 'connected' && window.firebase) {
      try {
        const db = guardedFirestore(window.firebase.app().firestore(), roomKey);
        await db.collection('rooms').doc(roomKey).collection('students').doc(studentId).update(partial);
      } catch (e) {
        showAlert(`リアルタイム更新に失敗しました: ${e.message}`);
        return false;
      }
    } else {
      const updated = students.map((s) => s.id === studentId ? { ...s, ...partial } : s);
      setStudents(updated);
      localStorage.setItem(`local_students_${roomKey}`, JSON.stringify(updated));
    }
    return true;
  };

  const patchWorkflowStudent = async (student, partial) => {
    if (!requireWriteAccess()) return false;
    const current = students.find((item) => item.id === student.id) || student;
    const period = periods.find((item) => item.id === (current.periodId || DEFAULT_PERIOD_ID));
    if (period?.locked && !isAdmin) { showAlert('この実習期は終了済みのため編集できません。'); return false; }
    if (!isAdmin) {
      const locked = current.lockedFields || [];
      const mapped = Object.keys(partial).map((field) => ({ phoneDate: 'phoneStatus', greetingCompletedDate: 'greetingStatus', giftCompletedDate: 'giftStatus', greetingDate: 'greetingStatus', greetingTime: 'greetingStatus', greetingVisitor: 'greetingStatus', studentThankYouDate: 'studentThankYouStatus' }[field] || field));
      if (mapped.some((field) => WORKFLOW_LOCKABLE_FIELDS.includes(field) && locked.includes(field))) { showAlert('この項目は管理者によりロックされています。'); return false; }
      if (partial.workflowExemptions && locked.includes('greetingStatus') && workflowExemptions(current).includes('greeting') !== partial.workflowExemptions.includes('greeting')) { showAlert('事前挨拶は管理者によりロックされています。'); return false; }
      if (partial.patrols) {
        if (locked.includes('patrolStatus') || (current.patrols || []).some((patrol) => locked.includes('patrol:' + patrol.id) && JSON.stringify(patrol) !== JSON.stringify(partial.patrols.find((next) => next.id === patrol.id)))) { showAlert('巡回・同行は管理者によりロックされています。'); return false; }
      }
    }
    const before = Object.fromEntries(Object.keys(partial).map((field) => [field, current[field] ?? (field === 'workflowExemptions' ? [] : '')]));
    recordUpdate(current.id, before, partial);
    return await persistPartial(current.id, partial);
  };

  const writeStudentRaw = async (student) => {
    if (!requireWriteAccess()) return false;
    const { id, ...data } = student;
    if (connectionStatus === 'connected' && window.firebase) {
      try {
        const db = guardedFirestore(window.firebase.app().firestore(), roomKey);
        await db.collection('rooms').doc(roomKey).collection('students').doc(id).set(data);
      } catch (e) {
        showAlert(`データの復元に失敗しました: ${e.message}`);
      }
    } else {
      const exists = students.some((s) => s.id === id);
      const updated = exists
        ? students.map((s) => s.id === id ? { ...student } : s)
        : [...students, { ...student }];
      setStudents(updated);
      localStorage.setItem(`local_students_${roomKey}`, JSON.stringify(updated));
    }
  };

  const removeStudentRaw = async (studentId) => {
    if (!requireWriteAccess()) return false;
    if (connectionStatus === 'connected' && window.firebase) {
      try {
        const db = guardedFirestore(window.firebase.app().firestore(), roomKey);
        await db.collection('rooms').doc(roomKey).collection('students').doc(studentId).delete();
      } catch (e) {
        showAlert(`削除の取消に失敗しました: ${e.message}`);
      }
    } else {
      const updated = students.filter((s) => s.id !== studentId);
      setStudents(updated);
      localStorage.setItem(`local_students_${roomKey}`, JSON.stringify(updated));
    }
  };

  const applyHistoryEntry = async (entry, direction) => {
    if (!requireWriteAccess()) return false;
    if (!entry || !entry.kind) return;
    if (entry.kind === 'update') {
      const target = direction === 'undo' ? entry.before : entry.after;
      await persistPartial(entry.studentId, target);
    } else if (entry.kind === 'create') {
      if (direction === 'undo') await removeStudentRaw(entry.student.id);
      else await writeStudentRaw(entry.student);
    } else if (entry.kind === 'delete') {
      if (direction === 'undo') await writeStudentRaw(entry.student);
      else await removeStudentRaw(entry.student.id);
    }
  };

  const handleUndo = async () => {
    if (!requireWriteAccess()) return false;
    const entry = popUndo();
    if (entry) await applyHistoryEntry(entry, 'undo');
  };

  const handleRedo = async () => {
    if (!requireWriteAccess()) return false;
    const entry = popRedo();
    if (entry) await applyHistoryEntry(entry, 'redo');
  };

  // v3.9: 編集アクションと同時に「今日の訪問者」の編集件数を +1 する。undo/redo からは呼ばれないので重複カウントしない。
  const recordUpdate = (studentId, before, after) => { if (!requireWriteAccess()) return false; const s = students.find((x) => x.id === studentId); const p = periods.find((x) => x.id === (s?.periodId || DEFAULT_PERIOD_ID)); if (p?.locked && !isAdmin) return false; pushHistory({ kind: 'update', studentId, before, after }); try { if (window.__bumpVisitorEditCount) window.__bumpVisitorEditCount(1); } catch (e) {} return true; };
  const recordCreate = (student) => { if (!requireWriteAccess()) return false; pushHistory({ kind: 'create', student }); try { if (window.__bumpVisitorEditCount) window.__bumpVisitorEditCount(1); } catch (e) {} };
  const recordDelete = (student) => { if (!requireWriteAccess()) return false; pushHistory({ kind: 'delete', student }); try { if (window.__bumpVisitorEditCount) window.__bumpVisitorEditCount(1); } catch (e) {} };

  const handleSaveStudent = async (studentData) => {
    if (!requireWriteAccess()) return false;
    if (isActivePeriodLocked && !isAdmin) { showAlert('この実習期は終了済みのため登録・編集できません。'); return; }
    setIsLoading(true);
    const today = getTodayString();

    const prepared = {
      ...studentData,
      periodId: editingStudent?.periodId || activePeriodId,
      materials: editingStudent?.materials || [],
      phoneDate: studentData.phoneStatus === 'completed' && !studentData.phoneDate ? today : studentData.phoneDate,
      docDate:   studentData.docStatus   === 'completed' && !studentData.docDate   ? today : studentData.docDate
    };

    if (connectionStatus === 'connected' && window.firebase) {
      try {
        const db = guardedFirestore(window.firebase.app().firestore(), roomKey);
        const ref = db.collection('rooms').doc(roomKey).collection('students');
        if (editingStudent) {
          await ref.doc(editingStudent.id).update(prepared);
        } else {
          await ref.add(prepared);
        }
        setIsAddEditOpen(false);
        setEditingStudent(null);
      } catch (e) {
        showAlert(`データの保存に失敗しました: ${e.message}`);
      } finally {
        setIsLoading(false);
      }
    } else {
      let updated = [...students];
      if (editingStudent) {
        updated = updated.map((s) => s.id === editingStudent.id ? { ...s, ...prepared } : s);
      } else {
        updated.push({ id: 'local-' + Date.now(), ...prepared });
      }
      setStudents(updated);
      localStorage.setItem(`local_students_${roomKey}`, JSON.stringify(updated));
      setIsAddEditOpen(false);
      setEditingStudent(null);
      setIsLoading(false);
    }
  };

  const handleInstantToggle = async (student, field, currentStatus) => {
    if (!requireWriteAccess()) return false;
    const studentPeriod = periods.find((p) => p.id === (student.periodId || DEFAULT_PERIOD_ID));
    if (studentPeriod?.locked && !isAdmin) { showAlert('この実習期は終了済みのため編集できません。'); return; }
    const stepKey = FIELD_TO_STEP[field];
    if (!stepKey) return;
    // v3.9: ロックされたフィールドは管理者以外の変更を拒否（リスト画面の🔒マークで設定）
    // v3.15: ロック対象は「事前電話・事前挨拶・生徒お礼状」の3項目のみ。
    //   それ以外（教師お礼状・連絡票配付など）に過去データの lockedFields が
    //   残っていてもロック扱いしない。
    const LOCKABLE_FIELDS_ONLY = ['phoneStatus', 'greetingStatus', 'giftStatus', 'studentThankYouStatus'];
    if (!isAdmin && LOCKABLE_FIELDS_ONLY.includes(field) && (student.lockedFields || []).includes(field)) {
      showAlert('この項目は管理者によりロックされています。');
      return;
    }
    const next = nextStatus(stepKey, currentStatus || 'pending');
    const update = buildStepUpdate(stepKey, next);
    const before = Object.fromEntries(Object.keys(update).map((k) => [k, student[k] ?? '']));
    recordUpdate(student.id, before, update);
    await persistPartial(student.id, update);
  };

  const handleAddInternshipDate = async (student, dateKey) => {
    if (!requireWriteAccess()) return false;
    const current = student.internshipDates || [];
    if (current.includes(dateKey)) return;
    const next = [...current, dateKey].sort();
    recordUpdate(student.id, { internshipDates: current }, { internshipDates: next });
    await persistPartial(student.id, { internshipDates: next });
  };

  const handleRemoveInternshipDate = async (student, dateKey) => {
    if (!requireWriteAccess()) return false;
    const current = student.internshipDates || [];
    if (!current.includes(dateKey)) return;
    const next = current.filter((d) => d !== dateKey);
    recordUpdate(student.id, { internshipDates: current }, { internshipDates: next });
    await persistPartial(student.id, { internshipDates: next });
  };

  const handleAddPatrol = async (student, date, time, teacher) => {
    if (!requireWriteAccess()) return false;
    const current = student.patrols || [];
    const next = [...current, { id: 'p-' + Date.now(), date, time: time || '', teacher: teacher || '', done: false }].sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
    recordUpdate(student.id, { patrols: current }, { patrols: next });
    await persistPartial(student.id, { patrols: next });
  };

  const handleRemovePatrol = async (student, patrolId) => {
    if (!requireWriteAccess()) return false;
    const current = student.patrols || [];
    const next = current.filter((p) => p.id !== patrolId);
    recordUpdate(student.id, { patrols: current }, { patrols: next });
    await persistPartial(student.id, { patrols: next });
  };

  const handleTogglePatrol = async (student, patrolId) => {
    const current = student.patrols || [];
    const next = current.map((p) => p.id === patrolId ? { ...p, done: !p.done, completedDate: !p.done ? (p.completedDate || getTodayString()) : '' } : p);
    recordUpdate(student.id, { patrols: current }, { patrols: next });
    await persistPartial(student.id, { patrols: next });
  };

  // v3.23: Firebase Storage の利用を廃止し、v3.17 までの方式（dataUrl を Firestore / localStorage に保存）に戻した。
  //（Storage 未有効化（Sparkプラン）のプロジェクトでは put() が 404 を長時間リトライし続け、
  //  「同期中」のままアップロードが止まって見えるため。Firestore は1ドキュメント約1MiB上限のため、
  //  1ファイル500KB・生徒1人あたりの関連資料合計を約900KB（JSON換算）に制限する。）
  const MATERIALS_TOTAL_LIMIT = 900 * 1024;
  const materialsTotalSizeOk = (materialsArr) => {
    try { return JSON.stringify(materialsArr || []).length <= MATERIALS_TOTAL_LIMIT; } catch (e) { return true; }
  };

  const readFileAsDataUrl = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error('ファイルの読み込みに失敗しました。'));
    reader.readAsDataURL(file);
  });

  const handleAddMaterial = async (material) => {
    if (!requireWriteAccess()) return false;
    const target = students.find((s) => s.id === materialModalStudentId);
    if (!target) return;
    const matId = 'mat-' + Date.now();
    let item = { ...material, id: matId };
    if (material.kind === 'file' && material.file) {
      const { file, ...rest } = material;
      setIsLoading(true);
      try {
        const dataUrl = await readFileAsDataUrl(file);
        item = { ...rest, id: matId, dataUrl };
      } catch (e) {
        setIsLoading(false);
        showAlert('ファイルの読み込みに失敗しました: ' + e.message);
        return;
      }
      setIsLoading(false);
    }
    const current = target.materials || [];
    const next = [...current, item];
    if (!materialsTotalSizeOk(next)) {
      showAlert('この生徒の関連資料の合計サイズが上限（約900KB）を超えるため保存できません。不要なファイルを削除するか、Google Drive 等の共有URLとして登録してください。');
      return;
    }
    recordUpdate(target.id, { materials: current }, { materials: next });
    await persistPartial(target.id, { materials: next });
  };

  const handleDeleteMaterial = async (materialId) => {
    if (!requireWriteAccess()) return false;
    const target = students.find((s) => s.id === materialModalStudentId);
    if (!target) return;
    const current = target.materials || [];
    const removed = current.find((m) => m.id === materialId);
    // v3.18: Storage 上のファイル本体も削除する（本体削除に失敗しても一覧からは消す）。
    if (removed && removed.storagePath && connectionStatus === 'connected' && window.firebase) {
      try { await window.firebase.app().storage().ref().child(removed.storagePath).delete(); }
      catch (e) { console.warn('Storage ファイルの削除に失敗:', e.message); }
    }
    const next = current.filter((m) => m.id !== materialId);
    recordUpdate(target.id, { materials: current }, { materials: next });
    await persistPartial(target.id, { materials: next });

    const current = target.materials || [];
    const next = current.map((m) => m.id === materialId ? { ...m, name: trimmed } : m);
    recordUpdate(target.id, { materials: current }, { materials: next });
    await persistPartial(target.id, { materials: next });

  // v3.6: リスト画面の「追加」ボタンへのファイルドロップで、その生徒の関連資料として一括インポートする。
  // v3.23: ファイル本体は dataUrl として Firestore / localStorage に保存する（1ファイル 500KB まで）。
  const handleDropFilesForMaterial = async (studentId, files) => {
    const target = students.find((s) => s.id === studentId);
    if (!target || !files || files.length === 0) return;
    const arr = Array.from(files);
    const tooLarge = arr.filter((f) => f.size > 500 * 1024);
    const ok = arr.filter((f) => f.size <= 500 * 1024);
    if (tooLarge.length > 0) {
      showAlert('次のファイルは500KBを超えているため取り込めません: ' + tooLarge.map((f) => f.name).join('、') + '\n大きなファイルは関連資料モーダルから Google Drive 等の共有URLとして登録してください。');
    }
    if (ok.length === 0) return;
    const importOne = async (file) => {
      const matId = 'mat-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
      const base = { id: matId, name: file.name, kind: 'file', mimeType: file.type, size: file.size };
      try {
        const dataUrl = await readFileAsDataUrl(file);
        return { ok: true, item: { ...base, dataUrl } };
      } catch (e) {
        return { ok: false, name: file.name };
      }
    };
    setIsLoading(true);
    const results = await Promise.all(ok.map(importOne));
    setIsLoading(false);
    const failed = results.filter((r) => !r.ok).map((r) => r.name);
    const items = results.filter((r) => r.ok).map((r) => r.item);
    if (failed.length > 0) showAlert('読み込みに失敗したファイル: ' + failed.join('、'));
    if (items.length === 0) return;
    const latest = students.find((s) => s.id === studentId) || target;
    const current = latest.materials || [];
    const next = [...current, ...items];
    if (!materialsTotalSizeOk(next)) {
      showAlert('この生徒の関連資料の合計サイズが上限（約900KB）を超えるため保存できません。不要なファイルを削除するか、Google Drive 等の共有URLとして登録してください。');
      return;
    }
    recordUpdate(latest.id, { materials: current }, { materials: next });
    await persistPartial(latest.id, { materials: next });
  };

  const handleDeleteStudent = (studentId) => {

    showConfirm('この生徒の実習進捗データを削除してもよろしいですか？', async () => {
      if (!requireWriteAccess()) return false;
      const target = students.find((s) => s.id === studentId);
      if (target) recordDelete(target);

        } catch (e) {
          showAlert(`削除に失敗しました: ${e.message}`);

          setIsLoading(false);
        }
      } else {

  const handleConfigSubmit = (e) => {

  // v3.8: 印刷オプションを body のクラスとして適用してから window.print() を呼ぶ。

  const handleConfirmPrint = useCallback(() => {

    body.classList.remove('print-only-selected', 'print-break-by-class', 'print-compact-columns');

    if (printOptions.breakByClass) body.classList.add('print-break-by-class');
    if (printOptions.compactColumns) body.classList.add('print-compact-columns');

    setTimeout(() => {

  // v3.9: 管理者パスワードをハッシュ化して保存。
  // 教室内ツールなので厳密な暗号化ではなく、roomKeyをソルトにした簡易ハッシュとする。
  const computeAdminHash = useCallback((pw) => {
    try { return btoa(unescape(encodeURIComponent('jissyuu_v39_admin:' + roomKey + ':' + (pw || '')))); }
    catch (e) { return ''; }
  }, [roomKey]);

  // ルーム切り替え時に管理者状態を再読込
  useEffect(() => {
    try {
      setAdminPasswordHash(localStorage.getItem(`admin_password_hash_${roomKey}`) || '');
      setIsAdmin(localStorage.getItem(`is_admin_${roomKey}`) === '1');
    } catch (e) {}
  }, [roomKey]);

  // Firestore の rooms/{roomKey} ドキュメントから管理者パスワードハッシュを購読。
  // 初期化時にクラウド側にないがローカルにある場合はクラウドへ上げる。
  useEffect(() => {
    if (connectionStatus !== 'connected' || !window.firebase) return;
    const db = guardedFirestore(window.firebase.app().firestore(), roomKey);
    const ref = db.collection('rooms').doc(roomKey);
    const unsub = ref.onSnapshot((snap) => {
      const data = snap.data() || {};
      const cloudHash = data.adminPasswordHash || '';
      let localHash = '';
      try { localHash = localStorage.getItem(`admin_password_hash_${roomKey}`) || ''; } catch (e) {}
      if (cloudHash) {
        setAdminPasswordHash(cloudHash);
        try { localStorage.setItem(`admin_password_hash_${roomKey}`, cloudHash); } catch (e) {}
        // クラウドと一致しない “以前設定した管理者状態” を強制クリアしない（他端末で変更しただけの可能性もあるため）
      } else if (localHash) {
        // v3.36.3: local credentials must never be uploaded automatically.
      }
    }, (err) => { console.warn('admin hash snapshot:', err.message); });
    return () => { try { unsub(); } catch (e) {} };
  }, [connectionStatus, roomKey]);

  // 管理者パスワードを設定/変更。未設定時は旧パスワード不要、設定済み時は旧パスワード必須。
  //  v3.9 fix: 確認用パスワード（newPassword2）の一致チェックを追加。
  //            ローカル保存を先に確実に行い、クラウド書き込みが失敗しても
  //            ローカルだけは必ず反映する（Firestore ルールで rooms/{rk} ドキュメント自体
  //            への書き込みが許可されていない場合でも管理者登録は完了する）。
  const setAdminPasswordTo = async (newPassword, oldPassword, newPassword2) => {
    if (!requireWriteAccess()) return false;
    if (adminPasswordHash) {
      if (computeAdminHash(oldPassword) !== adminPasswordHash) {
        showAlert('現在の管理者パスワードが違います。');
        return false;
      }
    }
    if (!newPassword || newPassword.length < 4) {
      showAlert('管理者パスワードは4文字以上にしてください。');
      return false;
    }
    // newPassword2 が明示的に渡された場合のみ一致チェック（UI 側で確認入力を使うときのためのフック）
    if (typeof newPassword2 === 'string' && newPassword2 !== '' && newPassword !== newPassword2) {
      showAlert('1回目と2回目の管理者パスワードが一致しません。同じパスワードを2回入力してください。');
      return false;
    }
    const wasSet = !!adminPasswordHash;
    const newHash = computeAdminHash(newPassword);
    // まずローカルへ保存（必ず成功させる）。
    // Firestore のセキュリティルールで rooms/{rk} ドキュメントへの write が拒否される環境でも、
    // この端末ではローカル保存だけで管理者として正しく動作する。
    try { localStorage.setItem(`admin_password_hash_${roomKey}`, newHash); } catch (e) {}
    setAdminPasswordHash(newHash);
    try { localStorage.setItem(`is_admin_${roomKey}`, '1'); } catch (e) {}
    setIsAdmin(true);
    // クラウド接続中なら、ベストエフォートでクラウドにも保存を試みる。
    // 失敗しても無視。useEffect の snapshot listener が後で自動で再同期するため、ユーザーへエラーは出さない。
    if (connectionStatus === 'connected' && window.firebase) {
      try {
        const db = guardedFirestore(window.firebase.app().firestore(), roomKey);
        await db.collection('rooms').doc(roomKey).set({ adminPasswordHash: newHash }, { merge: true });
      } catch (e) { /* ignore: ローカル保存だけで管理者として登録は完了している */ }
    }
    showAlert(wasSet ? '✅ 管理者パスワードを変更しました。このまま管理者としてログインしています。' : '✅ このルームの管理者として登録しました。\n他の端末では「管理者ログイン」しない限り、ロック項目を編集できません。');
    return true;
  };

  // 管理者ログイン / ログアウト
  const loginAsAdmin = (password) => {
    if (!adminPasswordHash) {
      showAlert('このルームにはまだ管理者パスワードが設定されていません。「新規設定」から登録してください。');
      return false;
    }
    if (computeAdminHash(password) !== adminPasswordHash) {
      showAlert('管理者パスワードが違います。');
      return false;
    }
    try { localStorage.setItem(`is_admin_${roomKey}`, '1'); } catch (e) {}
    setIsAdmin(true);
    return true;
  };
  const logoutAdmin = () => {
    try { localStorage.removeItem(`is_admin_${roomKey}`); } catch (e) {}
    setIsAdmin(false);
  };

  // ロック判定：student.lockedFields[] に含まれていて一般利用者なら true。
  const isFieldLocked = useCallback((student, fieldName) => {
    if (isAdmin) return false;
    const arr = (student && student.lockedFields) || [];
    return arr.includes(fieldName);
  }, [isAdmin]);

  // 管理者のみ：ある生徒のあるフィールドのロック ON/OFF を切替。
  const toggleLockField = async (student, fieldName) => {
    if (!isAdmin || !student) return;
    const current = student.lockedFields || [];
    const next = current.includes(fieldName)
      ? current.filter((f) => f !== fieldName)
      : [...current, fieldName];
    recordUpdate(student.id, { lockedFields: current }, { lockedFields: next });
    await persistPartial(student.id, { lockedFields: next });
  };

  // v3.12 fix: 指定された roomKey がすでに作成済みかどうかを判定する。
  //   非管理者でも実在ルームに入れるよう、判定を「複数シグナルのうち
  //   いずれか1つでも見つかれば存在する」と緩める。
  //   ・先にローカル痕跡（local_students_* / visited_rooms）をチェックすることで、
  //     Firestore セキュリティルールで rooms/{rk} doc 自体の read が拒否される
  //     環境でも誤って「存在しない」と判定されないようにする。
  //   ・クラウドでは rooms/{rk} doc / students / presence / board / visitors を
  //     Promise.all で並列に limit(1) read。個別の read 失敗（権限なし等）は
  //     .catch で個別に握りつぶし、他のシグナルで救えるようにする。
  //   ・管理者が作成直後で students が空のときも、presence や board / visitors
  //     のいずれかにデータがあれば true を返す。
  const roomExists = useCallback(async (rk) => {
    const target = String(rk || '').trim();
    if (!target) return false;
    // 1) まずローカル痕跡をチェック（権限エラーで誤判定されるのを防ぐ）
    try {
      if (localStorage.getItem('local_students_' + target)) return true;
      const visited = JSON.parse(localStorage.getItem('visited_rooms') || '[]');
      if (Array.isArray(visited) && visited.includes(target)) return true;
    } catch (e) {}
    // 2) クラウド接続中なら複数シグナルを並列でチェック
    if (connectionStatus === 'connected' && window.firebase) {
      try {
        const db = guardedFirestore(window.firebase.app().firestore(), roomKey);
        const roomRef = db.collection('rooms').doc(target);
        const checks = await Promise.all([
          roomRef.get().then((s) => !!s.exists).catch(() => false),
          roomRef.collection('students').limit(1).get().then((s) => !s.empty).catch(() => false),
          roomRef.collection('presence').limit(1).get().then((s) => !s.empty).catch(() => false),
          roomRef.collection('board').limit(1).get().then((s) => !s.empty).catch(() => false),
          roomRef.collection('visitors').limit(1).get().then((s) => !s.empty).catch(() => false),
        ]);
        if (checks.some(Boolean)) return true;
      } catch (e) { /* 全体失敗時はそのまま false 扱いに落とす */ }
    }
    return false;
  }, [connectionStatus]);

  const handleRoomKeyChange = async (e) => {
    e.preventDefault();
    const target = String(tempRoomKey || '').trim();
    if (!target) return;
    if (target === roomKey) { setIsConfigOpen(false); return; }
    // v3.10 fix: 既存ルームでない場合、一般利用者には新規作成を許可しない。
    //   管理者は確認ダイアログを経たうえで新規ルームとして作成できる。
    const exists = await roomExists(target);
    if (!exists) {

        return;

      showConfirm(`ルーム「${target}」はまだ存在しません。\n管理者として新規ルームを作成しますか？`, () => {

        setIsConfigOpen(false);

    // v3.11 fix: 既存ルームへの切替時も、合言葉の入力ミスで意図しない別の部屋に

    showConfirm(`これから「${target}」というルームに入ります。\n（現在は「${roomKey}」のルームを開いています）\n\n合言葉が合っているか、もう一度確認してください。\nこのルームに入ってよろしいですか？`, () => {

  const fetchAllRooms = useCallback(async () => {

      const rooms = new Set();

  const handleWipeAllData = (password) => {
    if (!requireWriteAccess()) return false;

        } else {
