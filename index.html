                  <span className="flex items-center gap-1.5"><span className="w-3.5 h-3.5 bg-yellow-100 border border-yellow-300 rounded-md block"></span><span>実習</span></span>
                  <span className="flex items-center gap-1.5"><span className="w-3.5 h-3.5 bg-pink-100 border border-pink-300 rounded-md block"></span><span>見学</span></span>
                  <span className="flex items-center gap-1.5"><span className="w-3.5 h-3.5 bg-green-200 border border-green-400 rounded-md block"></span><span>挨拶</span></span>
                  <span className="flex items-center gap-1.5"><span className="w-3.5 h-3.5 bg-blue-200 border border-blue-400 rounded-md block"></span><span>巡回</span></span>
                </div>
              </div>
            </div>

            <div className="grid grid-cols-7 border-b border-slate-200 bg-slate-100 text-center text-xs font-bold text-slate-600 py-2 select-none">
              <div className="text-rose-600">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div className="text-sky-600">土</div>
            </div>

            <div className="grid grid-cols-7 grid-rows-6 divide-x divide-y divide-slate-200 min-h-[500px] bg-slate-50">
              {calendarDays.map((cell, index) => {
                const dayEvents = getEventsForDate(cell.year, cell.month, cell.day);
                const today = new Date();
                const isToday = today.getFullYear() === cell.year && today.getMonth() === cell.month && today.getDate() === cell.day;
                const isInternshipDay = hasPeriodEventOnDate(cell.year, cell.month, cell.day);
                const dayOfWeek = index % 7;

                return (
                  <div
                    key={`${cell.year}-${cell.month}-${cell.day}-${index}`}
                    onClick={(e) => {
                      if (e.target === e.currentTarget) {
                        const formattedDate = formatDateKey(cell.year, cell.month, cell.day);
                        openAddModal([formattedDate]);
                      }
                    }}
                    className={`p-1.5 flex flex-col min-h-[80px] transition-all relative group cursor-pointer ${cell.isCurrentMonth ? 'bg-white' : 'bg-slate-50/50 text-slate-400'} ${isToday ? 'ring-2 ring-indigo-500 ring-inset bg-indigo-50/25' : ''}`}
                  >
                    <div className="flex items-center justify-between mb-1 select-none">
                      <span className={`text-xs font-bold ${isToday ? 'bg-indigo-600 text-white w-5 h-5 rounded-full flex items-center justify-center' : cell.isCurrentMonth ? (dayOfWeek === 0 ? 'text-rose-600' : dayOfWeek === 6 ? 'text-sky-600' : 'text-slate-800') : 'text-slate-400'}`}>
                        {cell.day}
                      </span>
                    </div>

                    <div className="flex flex-col">
                      {(() => {
                        const renderEvent = (ev, evIdx) => {
                          if (ev.type === 'period') {
                            return (
                              <div key={evIdx} className={`text-[10px] px-1.5 py-0.5 rounded border font-bold select-none transition-colors shadow-sm flex items-center justify-between gap-1 ${ev.color}`} title={ev.title || ev.label}>
                                <button onClick={(e) => { e.stopPropagation(); setSelectedStudentDetail(ev.student); }} className="truncate text-left flex-1 cursor-pointer">{ev.label}</button>
                                <button onClick={(e) => { e.stopPropagation(); handleRemoveInternshipDate(ev.student, ev.dateKey); }}
                                  title="この日を実習日から外す"
                                  className="hover:bg-white/60 rounded px-1 shrink-0 text-[10px] font-bold cursor-pointer leading-none">×</button>
                              </div>
                            );
                          }
                          return (
                            <div key={evIdx} onClick={(e) => { e.stopPropagation(); setSelectedStudentDetail(ev.student); }}
                              className={`text-[10px] px-1.5 py-0.5 rounded border font-bold truncate select-none transition-colors shadow-sm cursor-pointer ${ev.color}`} title={ev.label}>
                              {ev.label}
                            </div>
                          );
                        };
                        const isObservation = (ev) => ev.type === 'period' && ev.student && ev.student.internshipType === 'observation';
                        const topEvents = dayEvents.filter((ev) => !isObservation(ev));
                        const bottomEvents = dayEvents.filter((ev) => isObservation(ev));
                        const weekStart = Math.floor(index / 7) * 7;
                        let maxTop = 0, maxBottom = 0;
                        for (let wi = weekStart; wi < weekStart + 7 && wi < calendarDays.length; wi++) {
                          const wc = calendarDays[wi];
                          const wevs = getEventsForDate(wc.year, wc.month, wc.day);
                          const tc = wevs.filter((ev) => !isObservation(ev)).length;
                          const bc = wevs.filter((ev) => isObservation(ev)).length;
                          if (tc > maxTop) maxTop = tc;
                          if (bc > maxBottom) maxBottom = bc;
                        }
                        return (
                          <>
                            <div className="space-y-1 min-h-[18px] pb-1 border-b border-dashed border-slate-200">
                              {Array.from({ length: Math.max(maxTop, 1) }).map((_, i) => topEvents[i] ? renderEvent(topEvents[i], i) : <div key={`top-spc-${i}`} className="h-[18px]" aria-hidden="true" />)}
                            </div>
                            <div className="space-y-1 min-h-[18px] pt-1">
                              {Array.from({ length: Math.max(maxBottom, 1) }).map((_, i) => bottomEvents[i] ? renderEvent(bottomEvents[i], i) : <div key={`bot-spc-${i}`} className="h-[18px]" aria-hidden="true" />)}
                            </div>
                          </>
                        );
                      })()}
                    </div>

                    <button
                      type="button"
                      onClick={(e) => { e.stopPropagation(); openAddModal([formatDateKey(cell.year, cell.month, cell.day)]); }}
                      title="この日付で実習生を登録"
                      className="absolute bottom-1 right-1 opacity-0 group-hover:opacity-100 transition-opacity bg-white border border-slate-200 hover:border-indigo-300 hover:bg-indigo-50 rounded-full p-0.5 cursor-pointer shadow-sm"
                    >
                      <Plus className="w-3.5 h-3.5 text-slate-500 hover:text-indigo-600" />
                    </button>
                  </div>
                );
              })}
            </div>
          </div>
        ) : (
          <div key="view-kanban" className="space-y-4 animate-fadeIn">
            <div className="bg-white p-3 border border-slate-200 rounded-2xl flex flex-wrap items-center justify-between gap-3 shadow-sm">
              <span className="text-xs font-bold text-slate-600 flex items-center gap-1.5">
                <LayoutGrid className="w-4 h-4 text-indigo-600" />
                <span>進捗変更ステップ切り替え：</span>
              </span>
              <div className="flex flex-wrap gap-2">
                {Object.entries(STEP_CONFIG).map(([key, cfg]) => (
                  <button key={key} onClick={() => setKanbanStep(key)}
                    className={`px-3 py-1.5 text-xs font-bold rounded-xl border transition-all cursor-pointer ${kanbanStep === key ? cfg.activeColor : 'bg-white hover:bg-slate-50 border-slate-200 text-slate-700'}`}>
                    {cfg.label}
                  </button>
                ))}
              </div>
              <span className="text-[11px] text-slate-500 font-medium">※ 生徒カードをドラッグして各列にドロップするだけで、瞬時に進捗ステータスを更新できます。</span>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              {kanbanColumns.cols.map((col) => {
                const groupStudents = kanbanColumns.groups[col.key] || [];
                return (
                  <div key={col.key}
                    onDragOver={(e) => e.preventDefault()}
                    onDrop={() => { if (draggingStudentId) { handleKanbanDrop(draggingStudentId, col.key); setDraggingStudentId(null); } }}
                    className="bg-white border-2 border-dashed border-slate-200 rounded-2xl p-4 min-h-[400px] flex flex-col space-y-3 shadow-sm">
                    <div className={`p-2.5 rounded-xl border-l-4 font-extrabold text-xs flex items-center justify-between ${col.styles}`}>
                      <span>{col.title}</span>
                      <span className="bg-slate-100 text-slate-800 px-2 py-0.5 rounded-full text-[10px]">{groupStudents.length}名</span>
                    </div>
                    <div className="flex-1 space-y-2.5 overflow-y-auto max-h-[550px] p-0.5">
                      {groupStudents.length === 0 ? (
                        <div className="text-center text-slate-400 text-[10px] py-12">該当生徒はいません</div>
                      ) : (
                        groupStudents.map((student) => {
                          const isMy = myTeacherName && student.teacher === myTeacherName;
                          return (
                            <div key={student.id} draggable
                              onDragStart={() => setDraggingStudentId(student.id)}
                              className={`p-3 bg-white border border-slate-200 rounded-xl shadow-sm hover:shadow-md transition-all active:scale-95 cursor-grab active:cursor-grabbing group relative ${isMy ? 'ring-1 ring-indigo-400 bg-indigo-50/10' : ''}`}>
                              <div className="flex items-center justify-between">
                                <span className="font-extrabold text-sm text-slate-900">{student.name}</span>
                                <span className="text-[9px] bg-slate-100 text-slate-600 font-bold px-1.5 py-0.5 rounded">
                                  {student.grade ? `${student.grade}年` : ''}{student.classVal ? `${student.classVal}組` : ''}
                                </span>
                              </div>
                              <p className="text-xs text-slate-700 font-bold mt-1.5 truncate">{student.location}</p>
                              {(student.internshipDates || []).length > 0 && (
                                <p className="text-[10px] text-slate-400 mt-0.5 truncate">📅 {student.internshipDates.length}日間: {formatShortDate(student.internshipDates[0])} 〜 {formatShortDate(student.internshipDates[student.internshipDates.length - 1])}</p>
                              )}
                              <div className="flex items-center justify-between border-t border-slate-100 mt-2.5 pt-2 text-[10px] text-slate-500">
                                <span className="font-bold">担当教員: {student.teacher}</span>
                                <button onClick={() => setSelectedStudentDetail(student)} className="text-indigo-600 hover:text-indigo-800 font-bold hover:underline cursor-pointer">詳細表示</button>
                              </div>
                            </div>
                          );
                        })
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}
      {isBulkImportOpen && (<BulkImportModal onClose={() => setIsBulkImportOpen(false)} onCommit={handleBulkImport} onAlert={showAlert} defaultTeacher={myTeacherName} />)}

      </main>

      <footer className="bg-white border-t border-slate-200 py-6 px-4 mt-12 shrink-0">
        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4 text-xs text-slate-500">
          <div>
            <p className="font-semibold text-slate-700">現場実習進捗マネージャー - HTML スタンドアロン版</p>
            <p className="mt-0.5">Google Firebase Infrastructure 連携対応</p>
          </div>
          <div className="flex items-center gap-4 font-medium text-slate-400">
            <span>匿名認証・合言葉部屋分割・BOM付きCSV出力・Undo/Redo・カレンダー日付入力</span>
          </div>
        </div>
      </footer>

      {/* 詳細・編集モーダル(各項目タップで編集ポップアップ) */}
      {selectedStudentDetail && (() => { const sd = students.find((s) => s.id === selectedStudentDetail.id) || selectedStudentDetail; return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white border border-slate-200 rounded-2xl shadow-2xl max-w-md w-full overflow-hidden text-slate-800 animate-scaleIn max-h-[90vh] flex flex-col">
            <div className="px-6 py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between shrink-0">
              <h3 className="text-sm font-bold text-slate-900 flex items-center gap-2">
                <User className="w-5 h-5 text-indigo-600" />
                <span>実習生 詳細情報</span>
                <span className="text-[10px] bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded font-bold border border-indigo-100">タップで編集</span>
              </h3>
              <button onClick={() => setSelectedStudentDetail(null)} className="text-slate-400 hover:text-slate-900 font-bold text-xl cursor-pointer">×</button>
            </div>

            <div className="p-6 space-y-4 overflow-y-auto">
              <div>
                <div className="text-xs text-slate-400 font-bold">生徒情報（学年・組）</div>
                <div className="flex items-center gap-2 mt-1 flex-wrap">
                  <button onClick={() => setTextEditState({ value: sd.name || '', title: '生徒氏名を編集', label: '氏名(イニシャル推奨)', onSave: (v) => persistPartial(sd.id, { name: v }) })} className="text-base font-extrabold text-slate-950 hover:bg-indigo-50 px-2 py-0.5 rounded-lg cursor-pointer border border-transparent hover:border-indigo-200">{sd.name || '(未設定)'}</button>
                  <button onClick={() => setSelectEditState({ value: sd.grade || '3', title: '学年を選択', options: [['1','1年'],['2','2年'],['3','3年'],['other','他']], onSave: (v) => persistPartial(sd.id, { grade: v }) })} className="text-xs font-bold text-slate-700 hover:bg-indigo-50 px-2 py-0.5 rounded-lg cursor-pointer border border-slate-200 hover:border-indigo-200">{sd.grade ? `${sd.grade}年` : '学年'}</button>
                  <button onClick={() => setSelectEditState({ value: sd.classVal || '', title: '組を変更', options: [['', '未設定'], ['1', '1組'], ['2', '2組'], ['3', '3組']], onSave: (v) => persistPartial(sd.id, { classVal: v }) })} className="text-xs font-bold text-slate-700 hover:bg-indigo-50 px-2 py-0.5 rounded-lg cursor-pointer border border-slate-200 hover:border-indigo-200">{sd.classVal ? `${sd.classVal}組` : '組'}</button>
                </div>
              </div>

              <div>
                <div className="text-xs text-slate-400 font-bold flex items-center justify-between gap-1">
                  <span>実習先 / 活動種別</span>
                  <button onClick={() => setSelectEditState({ value: sd.internshipType || 'internship', title: '活動種別を選択', options: [['internship','実習'],['observation','見学']], onSave: (v) => persistPartial(sd.id, { internshipType: v }) })} className={`text-[10px] font-bold px-1.5 py-0.5 rounded cursor-pointer border ${sd.internshipType === 'observation' ? 'bg-pink-100 text-pink-900 border-pink-300 hover:bg-pink-200' : 'bg-yellow-100 text-yellow-900 border-yellow-300 hover:bg-yellow-200'}`}>{sd.internshipType === 'observation' ? '見学' : '実習'}</button>
                </div>
                <button onClick={() => setTextEditState({ value: sd.location || '', title: '実習先を編集', label: '企業・事業所名', onSave: (v) => persistPartial(sd.id, { location: v }) })} className="w-full text-left text-sm font-bold text-slate-900 mt-1 hover:bg-indigo-50 px-2 py-1 rounded-lg cursor-pointer border border-transparent hover:border-indigo-200">{sd.location || <span className="placeholder-empty">未設定(タップ)</span>}</button>
              </div>

              <div>
                <div className="text-xs text-slate-400 font-bold">実習日({(sd.internshipDates || []).length}日)</div>
                <div className="mt-1 flex flex-wrap items-center gap-1 text-[10px] font-medium">
                  {(sd.internshipDates || []).length === 0 && <span className="placeholder-empty mr-1">実習日 未設定</span>}
                  {(sd.internshipDates || []).map((d, idx, arr) => { const palette = sd.internshipType === 'observation' ? 'bg-pink-100 border-pink-300 text-pink-900 hover:bg-pink-200' : 'bg-yellow-100 border-yellow-300 text-yellow-900 hover:bg-yellow-200'; return (<span key={d} className={`inline-flex items-center gap-1 px-1.5 py-0.5 rounded border font-bold ${palette}`}><span>{sd.internshipType === 'observation' ? '見学' : (idx + 1) + '／' + arr.length}　　{formatShortDate(d)}</span><button onClick={() => handleRemoveInternshipDate(sd, d)} title="この日を外す" className="hover:bg-white/60 rounded text-slate-500 hover:text-rose-700 leading-none cursor-pointer font-bold">×</button></span>); })}
                  <button onClick={() => setDatePickerState({ value: '', title: `${sd.name} の実習日を追加`, onSelect: (v) => { if (v) handleAddInternshipDate(sd, v); } })} className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded border border-dashed border-indigo-400 bg-white hover:bg-indigo-50 text-indigo-700 font-bold cursor-pointer"><Plus className="w-3 h-3" /><span>追加</span></button>
                </div>
              </div>

              <hr className="border-slate-100" />

              <div className="space-y-1.5">
                <div className="flex items-center justify-between text-xs">
                  <span className="font-bold text-slate-500 flex items-center gap-1"><Phone className="w-3.5 h-3.5 text-indigo-500" />事前電話連絡</span>
                  <button onClick={() => handleInstantToggle(sd, 'phoneStatus', sd.phoneStatus)} className={`px-2 py-0.5 rounded-md font-bold cursor-pointer ${sd.phoneStatus === 'completed' ? 'bg-indigo-50 text-indigo-700 border border-indigo-200 hover:bg-indigo-100' : sd.phoneStatus === 'none' ? 'bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200' : 'bg-rose-50 text-rose-700 border border-rose-200 hover:bg-rose-100'}`}>{sd.phoneStatus === 'completed' ? '連絡済み' : sd.phoneStatus === 'none' ? '必要なし' : '未連絡'}</button>
                </div>
                {sd.phoneStatus === 'completed' && (<button onClick={() => setDatePickerState({ value: sd.phoneDate || '', title: `${sd.name} の電話連絡日`, onSelect: (v) => persistPartial(sd.id, { phoneDate: v }) })} className="text-[11px] text-slate-600 hover:text-indigo-700 hover:underline cursor-pointer block text-left pl-5">📅 連絡日: {sd.phoneDate ? formatShortDate(sd.phoneDate) : <span className="placeholder-empty">未設定(タップ)</span>}</button>)}
              </div>

              <div className="space-y-1.5">
                <div className="flex items-center justify-between text-xs">
                  <span className="font-bold text-slate-500 flex items-center gap-1"><FileText className="w-3.5 h-3.5 text-emerald-500" />保護者お知らせ</span>
                  <button onClick={() => handleInstantToggle(sd, 'docStatus', sd.docStatus)} className={`px-2 py-0.5 rounded-md font-bold cursor-pointer ${sd.docStatus === 'completed' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100' : sd.docStatus === 'none' ? 'bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200' : 'bg-rose-50 text-rose-700 border border-rose-200 hover:bg-rose-100'}`}>{sd.docStatus === 'completed' ? '配付済み' : sd.docStatus === 'none' ? '必要なし' : '未配付'}</button>
                </div>
                {sd.docStatus === 'completed' && (<button onClick={() => setDatePickerState({ value: sd.docDate || '', title: `${sd.name} の配付日`, onSelect: (v) => persistPartial(sd.id, { docDate: v }) })} className="text-[11px] text-slate-600 hover:text-indigo-700 hover:underline cursor-pointer block text-left pl-5">📅 配付日: {sd.docDate ? formatShortDate(sd.docDate) : <span className="placeholder-empty">未設定(タップ)</span>}</button>)}
              </div>

              <div className="space-y-2">
                <div className="flex items-center justify-between text-xs">
                  <span className="font-bold text-slate-500 flex items-center gap-1"><Handshake className="w-3.5 h-3.5 text-teal-600" />事前挨拶訪問</span>
                  <button onClick={() => handleInstantToggle(sd, 'greetingStatus', sd.greetingStatus)} className={`px-2 py-0.5 rounded-md font-bold cursor-pointer ${sd.greetingStatus === 'completed' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100' : sd.greetingStatus === 'scheduled' ? 'bg-sky-50 text-sky-700 border border-sky-200 hover:bg-sky-100' : sd.greetingStatus === 'unadjusted' ? 'bg-amber-50 text-amber-700 border border-amber-200 hover:bg-amber-100' : 'bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200'}`}>{sd.greetingStatus === 'completed' ? '挨拶終了' : sd.greetingStatus === 'scheduled' ? '挨拶日決定' : sd.greetingStatus === 'unadjusted' ? '未調整' : 'ー'}</button>
                </div>
                {sd.greetingStatus !== 'pending' && (<div className="p-2 bg-emerald-50/40 border border-emerald-100 text-emerald-900 rounded-lg text-xs font-semibold space-y-1">
                  <button onClick={() => setDatePickerState({ value: sd.greetingDate || '', title: `${sd.name} の挨拶予定日`, onSelect: (v) => { const upd = { greetingDate: v }; if (v && (!sd.greetingStatus || sd.greetingStatus === 'pending')) upd.greetingStatus = 'scheduled'; persistPartial(sd.id, upd); } })} className="hover:bg-white/60 rounded px-1 cursor-pointer block text-left w-full">📅 挨拶予定: <span className={sd.greetingDate ? '' : 'text-slate-400 italic'}>{sd.greetingDate ? formatShortDate(sd.greetingDate) : '未設定(タップ)'}</span></button>
                  <button onClick={() => setTextEditState({ value: sd.greetingTime || '', title: '挨拶予定時間を編集', label: '時間(例: 13:30)', onSave: (v) => persistPartial(sd.id, { greetingTime: v }) })} className="hover:bg-white/60 rounded px-1 cursor-pointer block text-left w-full">⏰ 時間: <span className={sd.greetingTime ? '' : 'text-slate-400 italic'}>{sd.greetingTime || '未設定(タップ)'}</span></button>
                  <button onClick={() => setTextEditState({ value: sd.greetingVisitor || '', title: '引率教員を編集', label: '引率教員', onSave: (v) => persistPartial(sd.id, { greetingVisitor: v }) })} className="hover:bg-white/60 rounded px-1 cursor-pointer block text-left w-full">👤 引率教員: <span className={sd.greetingVisitor ? '' : 'text-slate-400 italic'}>{sd.greetingVisitor || '未設定(タップ)'}</span></button>
                </div>)}
              </div>

              <div className="space-y-1.5">
                <div className="text-xs text-slate-400 font-bold flex items-center gap-1"><Clock className="w-3.5 h-3.5 text-violet-500" />指導巡回</div>
                <div className="flex flex-wrap items-center gap-1 text-[11px] font-medium">
                  {(sd.patrols || []).length === 0 && <span className="placeholder-empty mr-1">巡回 未設定</span>}
                  {(sd.patrols || []).map((p) => (<label key={p.id} className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded border border-slate-200 bg-white hover:bg-slate-50 cursor-pointer"><input type="checkbox" checked={!!p.done} onChange={() => handleTogglePatrol(sd, p.id)} className="cursor-pointer accent-violet-600" /><span className={`font-bold ${p.done ? 'line-through text-slate-400' : 'text-slate-700'}`}>{p.teacher ? p.teacher + '　' : ''}{sd.internshipType === 'observation' ? (p.time || '') : formatShortDate(p.date) + (p.time ? '　' + p.time : '')}</span><button onClick={(e) => { e.preventDefault(); handleRemovePatrol(sd, p.id); }} title="削除" className="text-slate-400 hover:text-rose-600 leading-none cursor-pointer font-bold">×</button></label>))}
                  <button onClick={() => setDatePickerState({ value: '', title: `${sd.name} の巡回日を追加`, onSelect: (v) => { if (!v) return; setTextEditState({ value: '', title: '巡回時間を入力', label: '時間 (例: 10:00 ※空欄可)', onSave: (t) => handleAddPatrol(sd, v, t) }); } })} className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded border border-dashed border-indigo-400 bg-white hover:bg-indigo-50 text-indigo-700 font-bold cursor-pointer"><Plus className="w-3 h-3" /><span>追加</span></button>
                </div>
              </div>

              <div className="space-y-1">
                <div className="text-xs text-slate-400 font-bold">特記事項・配慮事項</div>

> (<button key={val} type="button" onClick={() => saveStatus(val)} className={'w-full text-left px-3 py-2 rounded-lg text-xs font-bold cursor-pointer transition-colors ' + (currentStatus === val ? 'bg-indigo-600 text-white' : 'bg-slate-50 hover:bg-indigo-50 text-slate-700 border border-slate-200')}>{currentStatus === val ? '● ' : '○ '}{lbl}</button>))}</div></div>{field !== 'greeting' && currentStatus === 'completed' && (<div><div className="text-[11px] font-bold text-slate-600 mb-1.5">{field === 'phone' ? '連絡日' : '配付日'}</div><button type="button" onClick={() => setDatePickerState({ value: sd[dateKey] || '', title: title, onSelect: (v) => persistPartial(sd.id, { [dateKey]: v }) })} className="w-full bg-white border border-slate-300 hover:border-indigo-400 rounded-xl px-3 py-2 text-xs text-left cursor-pointer flex items-center justify-between transition-colors"><span className={sd[dateKey] ? 'text-slate-800 font-bold' : 'text-slate-400 italic'}>{sd[dateKey] ? formatShortDate(sd[dateKey]) : 'タップして日付を選択'}</span><Calendar className="w-3.5 h-3.5 text-indigo-500" /></button></div>)}{field === 'greeting' && currentStatus !== 'pending' && (<div className="space-y-2"><div><div className="text-[11px] font-bold text-slate-600 mb-1.5">挨拶日</div><button type="button" onClick={() => setDatePickerState({ value: sd.greetingDate || '', title: '事前挨拶日', onSelect: (v) => persistPartial(sd.id, { greetingDate: v }) })} className="w-full bg-white border border-slate-300 hover:border-indigo-400 rounded-xl px-3 py-2 text-xs text-left cursor-pointer flex items-center justify-between transition-colors"><span className={sd.greetingDate ? 'text-slate-800 font-bold' : 'text-slate-400 italic'}>{sd.greetingDate ? formatShortDate(sd.greetingDate) : 'タップして日付を選択'}</span><Calendar className="w-3.5 h-3.5 text-indigo-500" /></button></div><div><div className="text-[11px] font-bold text-slate-600 mb-1.5">時間</div><input type="text" placeholder="例: 13:30" defaultValue={sd.greetingTime || ''} onBlur={(e) => { if (e.target.value !== (sd.greetingTime || '')) persistPartial(sd.id, { greetingTime: e.target.value }); }} className="w-full bg-white border border-slate-300 focus:border-indigo-400 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800" /></div><div><div className="text-[11px] font-bold text-slate-600 mb-1.5">引率教員</div><input type="text" placeholder="例: 鈴木 先生" defaultValue={sd.greetingVisitor || ''} onBlur={(e) => { if (e.target.value !== (sd.greetingVisitor || '')) persistPartial(sd.id, { greetingVisitor: e.target.value }); }} className="w-full bg-white border border-slate-300 focus:border-indigo-400 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800" /></div></div>)}<div className="text-[10px] text-slate-500 leading-relaxed pt-1 border-t border-slate-100">※ クリック（タップ）で従来通りステータスを切替、長押し（0.5秒）またはダブルクリックでこの編集モーダルを開きます。</div></div><div className="px-5 py-3 bg-slate-50 border-t border-slate-200 flex justify-end gap-2"><button type="button" onClick={close} className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold cursor-pointer">閉じる</button></div></div></div>); })()}

                <form onSubmit={handleRoomKeyChange} className="flex gap-2">
                  <input type="text" required placeholder="例: 3-1" value={tempRoomKey} onChange={(e) => setTempRoomKey(e.target.value)}
                    className="flex-1 px-3 py-2 border border-slate-300 rounded-xl text-xs bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800" />
                  <button type="submit" className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-sm shrink-0 cursor-pointer">合言葉を変更</button>
                </form>
              </div>

              <hr className="border-slate-200" />

              <div className="space-y-3">
                <h4 className="text-xs font-bold text-slate-800 flex items-center gap-1">
                  <Database className="w-4 h-4 text-indigo-600" />
                  学校独自の Firebase Config (接続情報)
                </h4>
                <p className="text-[11px] text-slate-500 leading-relaxed">安全なデータ保護とセキュリティルール適用のため、各自のFirebaseコンソールから取得した「ウェブアプリ設定」JSONオブジェクトを以下に貼り付けてください。</p>

                <form onSubmit={handleConfigSubmit} className="space-y-4">
              {/* v3.7: config.js / config.json をドラッグ＆ドロップ または クリックで選択してインポートできるゾーン */}
              <div
                onDragEnter={(e) => { const types = Array.from(e.dataTransfer.types || []); if (types.includes('Files')) { e.preventDefault(); e.stopPropagation(); setIsConfigModalDragOver(true); } }}
                onDragOver={(e) => { const types = Array.from(e.dataTransfer.types || []); if (types.includes('Files')) { e.preventDefault(); e.stopPropagation(); e.dataTransfer.dropEffect = 'copy'; setIsConfigModalDragOver(true); } }}
                onDragLeave={(e) => { e.stopPropagation(); setIsConfigModalDragOver(false); }}
                onDrop={(e) => { e.preventDefault(); e.stopPropagation(); setIsConfigModalDragOver(false); const file = e.dataTransfer?.files?.[0]; if (file && typeof window.__loadConfigFromFile === 'function') window.__loadConfigFromFile(file); }}
                onClick={() => { if (configFileInputRef.current) configFileInputRef.current.click(); }}
                title="config.js / config.json ファイルをここにドラッグ＆ドロップするか、クリックして選択するとインポートできます"
                className={'flex items-center justify-center gap-2 px-3 py-4 border-2 border-dashed rounded-xl text-xs font-bold cursor-pointer transition-all ' + (isConfigModalDragOver ? 'bg-indigo-100 border-indigo-500 text-indigo-800 ring-2 ring-indigo-300 scale-[1.01]' : 'bg-indigo-50/40 border-indigo-300 hover:border-indigo-500 hover:bg-indigo-50 text-indigo-700')}
              >
                <Upload className="w-4 h-4" />
                <span>{isConfigModalDragOver ? 'ここにドロップしてインポート' : 'config.js / config.json をドロップ、またはクリックして選択'}</span>
              </div>
                  <textarea rows={5} placeholder={'{\n  "apiKey": "AIzaSy...",\n  "projectId": "school-database", ...\n}'}
                    value={firebaseConfigStr} onChange={(e) => setFirebaseConfigStr(e.target.value)}
                    className={"w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-mono bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-700 placeholder-slate-400 " + (showConfigText ? '' : 'config-mask')}></textarea>
                  <div className="flex justify-end -mt-2"><button type="button" onClick={() => setShowConfigText(v => !v)} className="text-[10px] font-bold px-2.5 py-1 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 rounded-md cursor-pointer flex items-center gap-1">{showConfigText ? '🙈 隠す' : '👁 表示する'}</button></div>

                  <div className="flex gap-2">
                    <button type="submit" className="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs shadow-sm cursor-pointer text-center">学校のクラウドに接続する</button>
                    {firebaseConfigStr && (
                      <button type="button" onClick={resetConfig} className="px-3 py-2.5 bg-slate-100 hover:bg-rose-50 hover:text-rose-700 text-slate-600 border border-slate-200 rounded-xl text-xs font-bold transition-all cursor-pointer">接続解除</button>
                    )}
                  </div>
                </form>

                {/* v3.6: 危険ゾーン：過去データ一括削除（パスワード「@kirari」必須） */}
              <hr className="border-slate-200" />
              <div className="space-y-2 p-3 bg-slate-50 border border-slate-200 rounded-xl">
              <div className="flex items-center justify-between mb-1 gap-2 flex-wrap">
                <h4 className="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                  <List className="w-4 h-4 text-indigo-600" />
                  <span>作成されたすべてのルーム</span>
                  <span className="text-[10px] font-mono bg-white border border-slate-300 text-slate-600 rounded px-1.5 py-0.5">{availableRooms.length}件</span>
                </h4>
                <button type="button" onClick={fetchAllRooms} disabled={isLoadingRooms} className="text-[10px] font-bold px-2 py-1 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 rounded-md cursor-pointer flex items-center gap-1 disabled:opacity-50">{isLoadingRooms ? '取得中…' : '🔄 一覧を更新'}</button>
              </div>
              {availableRooms.length === 0 ? (
                <p className="text-[11px] text-slate-400 italic">ルームがまだ作成されていません。</p>
              ) : (
                <div className="flex flex-wrap gap-1.5">
                  {availableRooms.map((rm) => (
                    <button key={rm} type="button" onClick={() => { if (rm === roomKey) return; setRoomSwitchTarget(rm); setRoomSwitchPassword(''); setRoomSwitchError(''); }} className={"inline-flex items-center gap-1 px-2.5 py-1 rounded-lg border text-[11px] font-bold transition-all " + (rm === roomKey ? 'bg-indigo-600 border-indigo-600 text-white cursor-default' : 'bg-white border-slate-300 text-slate-700 hover:bg-indigo-50 hover:border-indigo-300 hover:text-indigo-700 cursor-pointer')}>
                      <span className="font-mono">{rm}</span>
                      {rm === roomKey && <span className="text-[9px] bg-white/25 px-1 rounded">現在</span>}
                    </button>
                  ))}
                </div>
              )}
              <p className="text-[10px] text-slate-500 mt-1 leading-relaxed">※ 別のルームを開くにはパスワードの入力が必要です。<br />※ 切り替えると、Firebase / ローカル両方の保存先がそのルームに切り替わります。</p>
            </div>
            <hr className="border-slate-200" />
            <div className="space-y-3 p-4 bg-rose-50/40 border border-rose-200 rounded-xl">
                <h4 className="text-xs font-bold text-rose-800 flex items-center gap-1.5">
                  <AlertTriangle className="w-4 h-4 text-rose-600" />
                  <span>危険ゾーン：過去データの一括削除</span>
                </h4>
                <p className="text-[11px] text-rose-900 leading-relaxed">現在のルーム「<span className="font-mono font-bold">{roomKey}</span>」に保存されている<strong>すべての生徒データ</strong>を削除します。この操作は<strong>取り消せません（Undo不可）</strong>。続行するにはパスワードを入力してください。</p>
                <form onSubmit={(e) => { e.preventDefault(); const fd = new FormData(e.currentTarget); handleWipeAllData(fd.get('wipePassword')); e.currentTarget.reset(); }} className="flex gap-2">
                  <input type="password" name="wipePassword" required placeholder="パスワードを入力" autoComplete="off" className="flex-1 px-3 py-2 border border-rose-300 rounded-xl text-xs bg-white focus:outline-none focus:ring-2 focus:ring-rose-400 text-slate-800" />
                  <button type="submit" className="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold shadow-sm shrink-0 cursor-pointer flex items-center gap-1.5"><Trash2 className="w-3.5 h-3.5" /><span>過去データを一括削除</span></button>
                </form>
              </div>

              {connectionError && (
                  <div className="p-3 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-800 leading-relaxed">
                    <span className="font-bold flex items-center gap-1 mb-1 text-rose-700">
                      <AlertTriangle className="w-4 h-4 shrink-0" />
                      接続エラーガイド
                    </span>
                    <p className="text-[10px] text-rose-900">{connectionError}</p>
                  </div>
                )}
              </div>
            </div>

            <div className="px-6 py-4 bg-slate-50 border-t border-slate-200 flex justify-end">
              <button onClick={() => setIsConfigOpen(false)} className="px-4 py-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 rounded-xl text-xs font-bold cursor-pointer">閉じる</button>
            </div>
          </div>
        </div>
      )}

      {/* カスタムアラート */}
      {alertState && (
        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/30 backdrop-blur-sm">
          <div className="bg-white border border-slate-200 rounded-2xl shadow-2xl max-w-sm w-full p-6 text-center animate-scaleIn">
            <div className="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-indigo-100 mb-4 text-indigo-600">
              <Info className="h-6 w-6" />
            </div>
            <h3 className="text-sm font-bold text-slate-900 mb-2">お知らせ</h3>
            <p className="text-xs text-slate-600 mb-6 leading-relaxed">{alertState.message}</p>
            <button onClick={closeAlert} className="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-sm transition-all active:scale-95 cursor-pointer">OK</button>
          </div>
        </div>
      )}

      {/* 関連資料モーダル */}
      {(() => {
        const target = students.find((s) => s.id === materialModalStudentId);
        return target ? (
          <MaterialModal
            student={target}
            onClose={() => setMaterialModalStudentId(null)}
            onAdd={handleAddMaterial}
            onDelete={handleDeleteMaterial}
            onPreview={setMaterialPreview}
            onAlert={showAlert}
          />
        ) : null;
      })()}

      {/* 資料プレビュー */}
      {materialPreview && (
        <div className="fixed inset-0 z-[120] bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4" onClick={() => setMaterialPreview(null)}>
          <div onClick={(e) => e.stopPropagation()} className="bg-white border border-slate-200 rounded-2xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-hidden flex flex-col animate-scaleIn">
            <div className="px-5 py-3 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
              <h3 className="text-sm font-bold text-slate-900 truncate">{materialPreview.name}</h3>
              <button onClick={() => setMaterialPreview(null)} className="text-slate-400 hover:text-slate-900 font-bold text-xl cursor-pointer shrink-0">×</button>
            </div>
            <div className="flex-1 overflow-auto bg-slate-100 flex items-center justify-center">
              {materialPreview.kind === 'url' ? (
                <div className="p-8 text-center space-y-3">
                  <p className="text-xs text-slate-600 break-all">{materialPreview.url}</p>
                  <a href={materialPreview.url} target="_blank" rel="noopener noreferrer" className="inline-block px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-bold">新しいタブで開く</a>
                </div>
              ) : materialPreview.mimeType?.startsWith('image/') ? (
                <img src={materialPreview.dataUrl} alt={materialPreview.name} className="max-w-full max-h-full object-contain" />
              ) : materialPreview.mimeType === 'application/pdf' ? (
                <iframe src={materialPreview.dataUrl} title={materialPreview.name} className="w-full h-[80vh] bg-white" />
              ) : (
                <div className="text-center p-8 space-y-3">
                  <p className="text-sm text-slate-600">この種類のファイルはプレビューできません</p>
                  <a href={materialPreview.dataUrl} download={materialPreview.name} className="inline-block px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-bold">ダウンロード</a>
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {/* 日付選択モーダル */}
      {roomSwitchTarget && (
        <div className="fixed inset-0 z-[140] bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-200 animate-scaleIn">
            <div className="bg-gradient-to-r from-indigo-500 to-purple-600 px-6 py-5 text-white">
              <div className="flex items-center gap-3">
                <Key className="w-6 h-6" />
                <div>
                  <div className="text-base font-extrabold">ルームを開く</div>
                  <div className="text-xs text-indigo-100">「<span className="font-mono font-bold">{roomSwitchTarget}</span>」を開くにはパスワードが必要です</div>
                </div>
              </div>
            </div>
            <form onSubmit={handleConfirmRoomSwitch} className="p-6 space-y-4">
              <div>
                <label className="text-xs font-bold text-slate-700 mb-1.5 block">パスワード</label>
                <input type="password" autoFocus value={roomSwitchPassword} onChange={(e) => { setRoomSwitchPassword(e.target.value); setRoomSwitchError(''); }} className="w-full px-4 py-2.5 border-2 border-slate-200 focus:border-indigo-400 rounded-xl text-sm font-bold outline-none transition-colors" placeholder="続行するにはパスワードを入力してください" />
                {roomSwitchError && <div className="mt-2 text-xs text-rose-700 font-bold">⚠ {roomSwitchError}</div>}
              </div>
              <div className="flex gap-2">
                <button type="button" onClick={() => { setRoomSwitchTarget(null); setRoomSwitchPassword(''); setRoomSwitchError(''); }} className="flex-1 px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-bold transition-colors cursor-pointer">キャンセル</button>
                <button type="submit" className="flex-1 px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-extrabold transition-colors shadow-sm cursor-pointer">このルームを開く</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {datePickerState && (
        <DatePickerModal
          value={datePickerState.value}
          title={datePickerState.title}
          onSelect={datePickerState.onSelect}
          onClose={() => setDatePickerState(null)}
        />
      )}

      {/* カスタム確認ダイアログ */}
      {confirmState && (
        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/30 backdrop-blur-sm">
          <div className="bg-white border border-slate-200 rounded-2xl shadow-2xl max-w-sm w-full p-6 text-center animate-scaleIn">
            <div className="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-rose-100 mb-4 text-rose-600">
              <AlertTriangle className="h-6 w-6" />
            </div>
            <h3 className="text-sm font-bold text-slate-900 mb-2">確認</h3>
            <p className="text-xs text-slate-600 mb-6 leading-relaxed">{confirmState.message}</p>
            <div className="flex gap-2">
              <button onClick={confirmState.onCancel} className="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition-all cursor-pointer">キャンセル</button>
              <button onClick={confirmState.onConfirm} className="flex-1 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold shadow-sm transition-all active:scale-95 cursor-pointer">実行</button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

// =============================================================================
// 起動 / Bootstrap
// =============================================================================
const container = document.getElementById('root');
const root = createRoot(container);
root.render(<App />);
</script>
</body>
</html>
