              {[
                { title: '事前挨拶訪問', icon: Handshake, headerColor: 'text-teal-800', iconClass: 'text-teal-600',
                  statusField: 'greetingStatus', dateField: 'greetingDate', timeField: 'greetingTime', visitorField: 'greetingVisitor',
                  options: [['pending', '未調整'], ['scheduled', '日程確定'], ['completed', '挨拶終了']], accent: 'accent-teal-600',
                  defaultStatus: editingStudent?.greetingStatus || 'pending', defaultDate: editingStudent?.greetingDate || '',
                  defaultTime: editingStudent?.greetingTime || '', defaultVisitor: editingStudent?.greetingVisitor || editingStudent?.teacher || myTeacherName || '',
                  dateLabel: '挨拶予定日', timeLabel: '挨拶予定時間', visitorLabel: '引率教員', timePlaceholder: '例: 13:30' },
                { title: '指導巡回・同行予定', icon: Clock, headerColor: 'text-violet-800', iconClass: 'text-violet-600',
                  statusField: 'patrolStatus', dateField: 'patrolDate', timeField: 'patrolTime', visitorField: 'patrolVisitor',
                  options: [['pending', '未確定'], ['scheduled', '日程確定'], ['completed', '巡回終了']], accent: 'accent-violet-600',
                  defaultStatus: editingStudent?.patrolStatus || 'pending', defaultDate: editingStudent?.patrolDate || '',
                  defaultTime: editingStudent?.patrolTime || '', defaultVisitor: editingStudent?.patrolVisitor || editingStudent?.teacher || myTeacherName || '',
                  dateLabel: '巡回・同行予定日', timeLabel: '巡回・同行予定時間', visitorLabel: '巡回訪問教員', timePlaceholder: '例: 10:00〜11:30' }
              ].map(({ title, icon: Icon, headerColor, iconClass, statusField, dateField, timeField, visitorField, options, accent, defaultStatus, defaultDate, defaultTime, defaultVisitor, dateLabel, timeLabel, visitorLabel, timePlaceholder }) => (
                <div key={statusField} className="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                  <div className="flex items-center justify-between">
                    <h4 className={`text-xs font-bold ${headerColor} flex items-center gap-1`}>
                      <Icon className={`w-3.5 h-3.5 ${iconClass}`} />
                      {title}
                    </h4>
                    <div className="flex gap-2">
                      {options.map(([st, lbl]) => (
                        <label key={st} className="flex items-center gap-1 text-[10px] cursor-pointer font-semibold text-slate-700">
                          <input type="radio" name={statusField} value={st} defaultChecked={defaultStatus === st} className={accent} />
                          <span>{lbl}</span>
                        </label>
                      ))}
                    </div>
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="block text-[9px] text-slate-500 mb-0.5">{dateLabel}</label>
                      <button type="button" onClick={() => setDatePickerState({ value: formDates[dateField] || '', title: dateLabel, onSelect: (v) => setFormDates((f) => ({ ...f, [dateField]: v })) })}
                        className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-800 cursor-pointer hover:border-indigo-400 flex items-center justify-between transition-colors">
                        <span className={formDates[dateField] ? '' : 'text-slate-400'}>{formDates[dateField] ? formatShortDate(formDates[dateField]) : '日付選択'}</span>
                        <Calendar className="w-3.5 h-3.5 text-indigo-500" />
                      </button>
                      <input type="hidden" name={dateField} value={formDates[dateField] || ''} />
                    </div>
                    <div>
                      <label className="block text-[9px] text-slate-500 mb-0.5">{timeLabel}</label>
                      <input type="text" name={timeField} placeholder={timePlaceholder} defaultValue={defaultTime}
                        className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800" />
                    </div>
                    <div>
                      <label className="block text-[9px] text-slate-500 mb-0.5">{visitorLabel}</label>
                      <input type="text" name={visitorField} placeholder="例: 鈴木 先生" defaultValue={defaultVisitor}
                        className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800" />
                    </div>
                  </div>
                </div>
              ))}

              <div>
                <label className="block text-[11px] font-bold text-slate-600 mb-1">実習配慮事項・特記事項</label>
                <textarea name="notes" rows={3} placeholder="健康面、服薬関係、交通アクセスでの配慮事項など..." defaultValue={editingStudent?.notes || ''}
                  className="w-full bg-white border border-slate-300 rounded-xl p-3 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400 placeholder-slate-400 text-slate-800"></textarea>
              </div>

              <div className="flex justify-end gap-2 pt-2">
                <button type="button" onClick={() => { setIsAddEditOpen(false); setEditingStudent(null); }}
                  className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition-all cursor-pointer">キャンセル</button>
                <button type="submit"
                  className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-sm transition-all cursor-pointer">保存してダッシュボードに同期</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* 設定モーダル */}
      {isConfigOpen && (
        <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white border border-slate-200 rounded-2xl shadow-2xl max-w-5xl w-full max-h-[90vh] overflow-hidden text-slate-800 flex flex-col">
            <div className="px-6 py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
              <h3 className="text-sm font-bold text-slate-900 flex items-center gap-2">
                <Settings className="w-5 h-5 text-indigo-600" />
                実習管理システム：環境連携設定
              </h3>
              <button onClick={() => setIsConfigOpen(false)} className="text-slate-400 hover:text-slate-900 font-bold text-xl cursor-pointer">×</button>
            </div>

            <div className="p-6 overflow-y-auto flex-1">
              {cloudConfigured && <section className="cache-settings" aria-label="端末一時保存と再接続">
                <h4>端末一時保存と再接続</h4><p role="status">{cloudReadOnly ? 'クラウド確認前のため閲覧のみです。追加・編集・削除・復元はできません。' : '最新データを受信済みです。'}</p>
                {cacheSavedAt && <p>最終受信：{new Date(cacheSavedAt).toLocaleString('ja-JP')}</p>}
                <p>一時保存は最長24時間です。共有端末では利用後に削除してください。端末の一時データをクラウドへ自動で書き戻すことはありません。</p>
                {connectionError && <p role="status">{connectionError}</p>}{cacheNotice && <p role="status">{cacheNotice}</p>}
                <div>{cloudReadOnly && <button type="button" disabled={pendingWrites > 0} onClick={retryConnection}>接続を再試行</button>}<button type="button" disabled={!cacheEnabled} onClick={()=>showConfirm('このルームの端末一時データだけを削除します。クラウドの情報は削除しません。この画面では一時保存を停止します。',clearTemporaryCache)}>端末の一時データを削除</button></div>
              </section>}
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <div className="space-y-6">
              <div className="space-y-3">
                <div className="bg-indigo-50 p-4 rounded-xl border border-indigo-100">
                  <h4 className="text-xs font-bold text-indigo-800 flex items-center gap-1.5 mb-1">
                    <Key className="w-4 h-4 text-indigo-600" />
                    学年・クラス部屋キーの設定 (合言葉)
                  </h4>
                  <p className="text-[11px] text-indigo-900 leading-relaxed">学校独自のFirebaseプロジェクトの中で、さらに「学級」「年度」ごとに部屋を細かく分けることができます。（例：3-1、3-2、2026-all など）</p>
                </div>

                <form onSubmit={handleRoomKeyChange} className="flex gap-2">
                  <input type="text" required placeholder="例: 3-1" value={tempRoomKey} onChange={(e) => setTempRoomKey(e.target.value)}
                    className="flex-1 px-3 py-2 border border-slate-300 rounded-xl text-xs bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800" />
                  <button type="submit" className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-sm shrink-0 cursor-pointer">合言葉を変更</button>
                </form>
              </div>

              <hr className="border-slate-200" />

              <div className="space-y-3">
                <h4 className="text-xs font-bold text-slate-800 flex items-center gap-1">
                  <Database className="w-4 h-4 text-indigo-600" />
                  学校独自の Firebase Config (接続情報)
                </h4>
                <p className="text-[11px] text-slate-500 leading-relaxed">安全なデータ保護とセキュリティルール適用のため、各自のFirebaseコンソールから取得した「ウェブアプリ設定」JSONオブジェクトを以下に貼り付けてください。</p>

                <form onSubmit={handleConfigSubmit} className="space-y-4">
              {/* v3.7: config.js / config.json をドラッグ＆ドロップ または クリックで選択してインポートできるゾーン */}
              <div
                onDragEnter={(e) => { const types = Array.from(e.dataTransfer.types || []); if (types.includes('Files')) { e.preventDefault(); e.stopPropagation(); setIsConfigModalDragOver(true); } }}
                onDragOver={(e) => { const types = Array.from(e.dataTransfer.types || []); if (types.includes('Files')) { e.preventDefault(); e.stopPropagation(); e.dataTransfer.dropEffect = 'copy'; setIsConfigModalDragOver(true); } }}
                onDragLeave={(e) => { e.stopPropagation(); setIsConfigModalDragOver(false); }}
                onDrop={(e) => { e.preventDefault(); e.stopPropagation(); setIsConfigModalDragOver(false); const file = e.dataTransfer?.files?.[0]; if (file && typeof window.__loadConfigFromFile === 'function') window.__loadConfigFromFile(file); }}
                onClick={() => { if (configFileInputRef.current) configFileInputRef.current.click(); }}
                title="config.js / config.json ファイルをここにドラッグ＆ドロップするか、クリックして選択するとインポートできます"
                className={'flex items-center justify-center gap-2 px-3 py-4 border-2 border-dashed rounded-xl text-xs font-bold cursor-pointer transition-all ' + (isConfigModalDragOver ? 'bg-indigo-100 border-indigo-500 text-indigo-800 ring-2 ring-indigo-300 scale-[1.01]' : 'bg-indigo-50/40 border-indigo-300 hover:border-indigo-500 hover:bg-indigo-50 text-indigo-700')}
              >
                <Upload className="w-4 h-4" />
                <span>{isConfigModalDragOver ? 'ここにドロップしてインポート' : 'config.js / config.json をドロップ、またはクリックして選択'}</span>
              </div>
                  <textarea rows={5} placeholder={'{\n  "apiKey": "AIzaSy...",\n  "projectId": "school-database", ...\n}'}
                    value={firebaseConfigStr} onChange={(e) => setFirebaseConfigStr(e.target.value)}
                    className={"w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-mono bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-700 placeholder-slate-400 " + (showConfigText ? '' : 'config-mask')}></textarea>
                  <div className="flex justify-end -mt-2"><button type="button" onClick={() => setShowConfigText(v => !v)} className="text-[10px] font-bold px-2.5 py-1 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 rounded-md cursor-pointer flex items-center gap-1">{showConfigText ? '🙈 隠す' : '👁 表示する'}</button></div>

                  <div className="flex gap-2">
                    <button type="submit" className="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs shadow-sm cursor-pointer text-center">学校のクラウドに接続する</button>
                    {firebaseConfigStr && (
                      <button type="button" onClick={resetConfig} className="px-3 py-2.5 bg-slate-100 hover:bg-rose-50 hover:text-rose-700 text-slate-600 border border-slate-200 rounded-xl text-xs font-bold transition-all cursor-pointer">接続解除</button>
                    )}
                  </div>
                </form>
              </div>
              </div>

              <div className="space-y-6">
              <div className="space-y-2 p-3 bg-slate-50 border border-slate-200 rounded-xl">
              <div className="flex items-center justify-between mb-1 gap-2 flex-wrap">
                <h4 className="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                  <List className="w-4 h-4 text-indigo-600" />
                  <span>作成されたすべてのルーム</span>
                  <span className="text-[10px] font-mono bg-white border border-slate-300 text-slate-600 rounded px-1.5 py-0.5">{availableRooms.length}件</span>
                </h4>
                <button type="button" onClick={fetchAllRooms} disabled={isLoadingRooms} className="text-[10px] font-bold px-2 py-1 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 rounded-md cursor-pointer flex items-center gap-1 disabled:opacity-50">{isLoadingRooms ? '取得中…' : '🔄 一覧を更新'}</button>
              </div>
              {availableRooms.length === 0 ? (
                <p className="text-[11px] text-slate-400 italic">ルームがまだ作成されていません。</p>
              ) : (
                <div className="flex flex-wrap gap-1.5">
                  {availableRooms.map((rm) => (
                    <button key={rm} type="button" onClick={() => { if (rm === roomKey) return; setRoomSwitchTarget(rm); setRoomSwitchPassword(''); setRoomSwitchError(''); }} className={"inline-flex items-center gap-1 px-2.5 py-1 rounded-lg border text-[11px] font-bold transition-all " + (rm === roomKey ? 'bg-indigo-600 border-indigo-600 text-white cursor-default' : 'bg-white border-slate-300 text-slate-700 hover:bg-indigo-50 hover:border-indigo-300 hover:text-indigo-700 cursor-pointer')}>
                      <span className="font-mono">{rm}</span>
                      {rm === roomKey && <span className="text-[9px] bg-white/25 px-1 rounded">現在</span>}
                    </button>
                  ))}
                </div>
              )}
              <p className="text-[10px] text-slate-500 mt-1 leading-relaxed">※ 別のルームを開くにはパスワードの入力が必要です。<br />※ 切り替えると、Firebase / ローカル両方の保存先がそのルームに切り替わります。</p>
            </div>
            {/* v3.9: 管理者モード設定（パスワード登録 / ログイン / 変更 / ログアウト） */}
            <div className="space-y-3 p-4 bg-amber-50/40 border border-amber-300 rounded-xl">
              <h4 className="text-xs font-bold text-amber-800 flex items-center gap-1.5">
                <span className="text-sm leading-none">🛡️</span>
                <span>管理者モード（このルームの権限設定）</span>
                {isAdmin && (<span className="ml-1 text-[10px] bg-amber-200 border border-amber-400 text-amber-900 font-bold px-1.5 py-0.5 rounded-full">ログイン中</span>)}
              </h4>
              <p className="text-[11px] text-amber-900 leading-relaxed">
                ルームに「管理者用パスワード」を設定すると、管理者だけがリスト画面の各ステップに 🔒 マークを付けて、一般利用者のクリックを禁止できるようになります。<br />※ パスワードはルームごとに保存され、クラウド接続中は全端末で共有されます。ログイン状態は「端末ごと」に保存されます。
              </p>
              {!adminPasswordHash ? (
                <form onSubmit={(e) => { e.preventDefault(); const fd = new FormData(e.currentTarget); const newPw = fd.get('newPw'); const newPw2 = fd.get('newPw2'); if (newPw !== newPw2) { showAlert('1回目と2回目の管理者パスワードが一致しません。同じパスワードを2回入力してください。'); return; } setAdminPasswordTo(newPw, '', newPw2); }} className="space-y-2">
                  <div className="text-[11px] font-bold text-amber-900">🆕 管理者として新規登録（このボタンを押した人がこのルームの管理者になります）</div>
                  <input type="password" name="newPw" required minLength={4} placeholder="新しい管理者パスワード（4文字以上）" autoComplete="new-password" className="w-full px-3 py-2 border border-amber-300 rounded-xl text-xs bg-white focus:outline-none focus:ring-2 focus:ring-amber-400 text-slate-800" />
                  <input type="password" name="newPw2" required minLength={4} placeholder="確認のためもう一度入力（同じパスワード）" autoComplete="new-password" className="w-full px-3 py-2 border border-amber-300 rounded-xl text-xs bg-white focus:outline-none focus:ring-2 focus:ring-amber-400 text-slate-800" />
                  <button type="submit" className="w-full px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-xs font-bold shadow-sm cursor-pointer">管理者として登録</button>
                  <p className="text-[10px] text-amber-800 leading-relaxed">※ 確認のため、同じパスワードを2回入力してください。一致しないと登録できません。</p>
                </form>
              ) : isAdmin ? (
                <div className="space-y-2">
                  <div className="text-[11px] font-bold text-amber-900 flex items-center gap-1.5 bg-amber-100 px-3 py-2 rounded-lg border border-amber-300">
                    <span className="text-sm leading-none">🛡️</span>
                    <span>あなたは現在「管理者」としてログイン中です。リスト画面の各ステップ右肩の 🔓 マークを押すとロックを設定できます。</span>
                  </div>
                  <button type="button" onClick={() => { showConfirm('管理者モードからログアウトしますか？ロック項目が再び編集できなくなります。', () => logoutAdmin()); }} className="w-full px-3 py-2 bg-white border border-amber-300 hover:bg-amber-100 text-amber-800 rounded-xl text-xs font-bold cursor-pointer">管理者からログアウト</button>
                  <details className="bg-white border border-amber-200 rounded-xl">
                    <summary className="px-3 py-2 text-[11px] font-bold text-amber-800 cursor-pointer select-none">🔑 管理者パスワードを変更する</summary>
                    <form onSubmit={(e) => { e.preventDefault(); const fd = new FormData(e.currentTarget); const newPw = fd.get('newPw'); const newPw2 = fd.get('newPw2'); const oldPw = fd.get('oldPw'); if (newPw !== newPw2) { showAlert('新しいパスワードが一致しません。'); return; } setAdminPasswordTo(newPw, oldPw).then((ok) => { if (ok) e.currentTarget && e.currentTarget.reset && e.currentTarget.reset(); }); }} className="p-3 space-y-2">
                      <input type="password" name="oldPw" required placeholder="現在のパスワード" autoComplete="current-password" className="w-full px-3 py-2 border border-amber-300 rounded-xl text-xs bg-white focus:outline-none focus:ring-2 focus:ring-amber-400 text-slate-800" />
                      <input type="password" name="newPw" required minLength={4} placeholder="新しいパスワード（4文字以上）" autoComplete="new-password" className="w-full px-3 py-2 border border-amber-300 rounded-xl text-xs bg-white focus:outline-none focus:ring-2 focus:ring-amber-400 text-slate-800" />
                      <input type="password" name="newPw2" required minLength={4} placeholder="新しいパスワード（確認）" autoComplete="new-password" className="w-full px-3 py-2 border border-amber-300 rounded-xl text-xs bg-white focus:outline-none focus:ring-2 focus:ring-amber-400 text-slate-800" />
                      <button type="submit" className="w-full px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-xs font-bold shadow-sm cursor-pointer">パスワードを変更</button>
                    </form>
                  </details>
                </div>
              ) : (
                <form onSubmit={(e) => { e.preventDefault(); const fd = new FormData(e.currentTarget); if (loginAsAdmin(fd.get('loginPw'))) e.currentTarget.reset(); }} className="space-y-2">
                  <div className="text-[11px] font-bold text-amber-900">🔑 管理者としてログイン（ロック項目を編集可能にする）</div>
                  <div className="flex gap-2">
                    <input type="password" name="loginPw" required placeholder="管理者パスワード" autoComplete="current-password" className="flex-1 px-3 py-2 border border-amber-300 rounded-xl text-xs bg-white focus:outline-none focus:ring-2 focus:ring-amber-400 text-slate-800" />
                    <button type="submit" className="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-xs font-bold shadow-sm shrink-0 cursor-pointer">ログイン</button>
                  </div>
                  <p className="text-[10px] text-amber-800 leading-relaxed">※ ログインはこの端末とこのルームだけに有効です。別の端末では再度パスワード入力が必要です。</p>
                </form>
              )}
            </div>
            {/* v3.6: 危険ゾーン：過去データ一括削除（パスワード「@kirari」必須） */}
            <div className="space-y-3 p-4 bg-rose-50/40 border border-rose-200 rounded-xl">
                <h4 className="text-xs font-bold text-rose-800 flex items-center gap-1.5">
                  <AlertTriangle className="w-4 h-4 text-rose-600" />
                  <span>危険ゾーン：過去データの一括削除</span>
                </h4>
                <p className="text-[11px] text-rose-900 leading-relaxed">現在のルーム「<span className="font-mono font-bold">{roomKey}</span>」に保存されている<strong>すべての生徒データ</strong>を削除します。この操作は<strong>取り消せません（Undo不可）</strong>。続行するにはパスワードを入力してください。</p>
                <form onSubmit={(e) => { e.preventDefault(); const fd = new FormData(e.currentTarget); handleWipeAllData(fd.get('wipePassword')); e.currentTarget.reset(); }} className="flex gap-2">
                  <input type="password" name="wipePassword" required placeholder="パスワードを入力" autoComplete="off" className="flex-1 px-3 py-2 border border-rose-300 rounded-xl text-xs bg-white focus:outline-none focus:ring-2 focus:ring-rose-400 text-slate-800" />
                  <button type="submit" className="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold shadow-sm shrink-0 cursor-pointer flex items-center gap-1.5"><Trash2 className="w-3.5 h-3.5" /><span>過去データを一括削除</span></button>
                </form>
              </div>

              {connectionError && (
                  <div className="p-3 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-800 leading-relaxed">
                    <span className="font-bold flex items-center gap-1 mb-1 text-rose-700">
                      <AlertTriangle className="w-4 h-4 shrink-0" />
                      接続エラーガイド
                    </span>
                    <p className="text-[10px] text-rose-900">{connectionError}</p>
                  </div>
                )}
              </div>

                    <span className="flex-1 text-slate-700">
                      <span className="font-bold block">📋 コンパクト列で印刷</span>
                      <span className="text-[10px] text-slate-500">「生徒お礼状」「教師お礼状」の2列を省略し、主要な進捗だけを横長レイアウトで印刷します</span>
                    </span>
                  </label>
                </div>
              ) : (
                <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 text-[11px] text-slate-700 leading-relaxed">
                  <p>カレンダーは現在表示中の<strong>{calendarYear}年{calendarMonth + 1}月</strong>を、<strong>{calendarFilter === 'all' ? '全表示' : calendarFilter === 'student' ? '生徒の予定のみ' : '教師の予定のみ'}</strong>で印刷します。表示する月や種別フィルターを切り替えてから印刷ボタンを押してください。</p>
                </div>
              )}
              <div className="p-3 bg-amber-50/50 border border-amber-200 rounded-xl text-[10px] text-amber-900 leading-relaxed">
                <strong>📋 ブラウザの印刷ダイアログでの推奨設定：</strong><br />
                ・用紙の向き：<strong>横（横向き）</strong><br />
                ・余白：<strong>最小</strong><br />
                ・「背景のグラフィック」を<strong>オン</strong>にすると色付きで印刷されます<br />
                ・「送信先」で「PDFに保存」を選ぶとPDFファイルとして残せます
              </div>
            </div>
            <div className="px-5 py-3 bg-slate-50 border-t border-slate-200 flex justify-end gap-2">
              <button type="button" onClick={() => setIsPrintOpen(false)} className="px-3 py-1.5 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 rounded-lg text-xs font-bold cursor-pointer">キャンセル</button>
              <button type="button" onClick={handleConfirmPrint} className="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold cursor-pointer shadow-sm flex items-center gap-1.5"><Printer className="w-3.5 h-3.5" /><span>印刷する</span></button>
            </div>
          </div>
        </div>
      )}

      {/* v3.25: 実習期管理 */}
      {isPeriodManagerOpen && (
        <div className="fixed inset-0 z-[115] flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm" onClick={() => setIsPeriodManagerOpen(false)}>
          <div onClick={(e) => e.stopPropagation()} className="bg-white border border-slate-200 rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden animate-scaleIn">
            <div className="px-5 py-3 bg-violet-50 border-b border-violet-200 flex items-center justify-between">
              <h3 className="text-sm font-bold text-violet-950">🗂️ 実習期の管理</h3>
              <button onClick={() => setIsPeriodManagerOpen(false)} className="text-slate-500 hover:text-slate-900 text-xl font-bold cursor-pointer">×</button>
            </div>
            <div className="p-5 space-y-4 max-h-[75vh] overflow-y-auto">
              <div>
                <div className="text-xs font-bold text-slate-700 mb-2">登録済みの実習期</div>
                <div className="space-y-1.5">
                  {periods.map((p) => (
                    <div key={p.id} className={`flex items-center gap-2 p-2.5 rounded-xl border ${p.id === activePeriodId ? 'bg-violet-50 border-violet-300' : 'bg-slate-50 border-slate-200'}`}>
                      <button onClick={() => { setActivePeriodId(p.id); setIsPeriodManagerOpen(false); }} className="flex-1 text-left text-xs font-bold text-slate-800 cursor-pointer">{p.locked ? '🔒 ' : '📂 '}{p.name}</button>
                      {isAdmin && <button onClick={() => handleTogglePeriodLock(p)} className="px-2 py-1 bg-white border border-slate-300 rounded-lg text-[10px] font-bold cursor-pointer">{p.locked ? 'ロック解除' : '終了・ロック'}</button>}
                    </div>
                  ))}
                </div>
              </div>
              {isAdmin ? (
                <div className="border-t border-slate-200 pt-4 space-y-3">
                  <div className="text-xs font-bold text-slate-700">新しい実習期を作成</div>
                  <input value={newPeriodName} onChange={(e) => setNewPeriodName(e.target.value)} placeholder="例：2026年度 後期" className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-400" />
                  <label className="flex items-start gap-2 text-xs text-slate-700 cursor-pointer"><input type="checkbox" checked={copyPreviousRoster} onChange={(e) => setCopyPreviousRoster(e.target.checked)} className="mt-0.5 accent-violet-600" /><span>現在の実習期から氏名・学年・組・担当教員をコピーする<br/><span className="text-[10px] text-slate-500">実習先・日程・進捗・資料・備考は空の状態で作成します。</span></span></label>
                  <label className="flex items-center gap-2 text-xs text-slate-700 cursor-pointer"><input type="checkbox" checked={lockPreviousPeriod} onChange={(e) => setLockPreviousPeriod(e.target.checked)} className="accent-violet-600" /><span>現在の実習期を終了済みとしてロックする</span></label>
                  <button onClick={handleCreatePeriod} className="w-full py-2 bg-violet-600 hover:bg-violet-700 text-white rounded-xl text-xs font-bold cursor-pointer shadow-sm">新しい実習期を作成</button>
                </div>
              ) : (
                <div className="border-t border-slate-200 pt-4 text-[11px] text-slate-500 bg-slate-50 rounded-xl p-3">新しい実習期の作成とロック変更は、管理者モードで行えます。</div>
              )}
              <div className="border-t border-slate-200 pt-4">
                <div className="text-xs font-bold text-slate-700 mb-2">全期間バックアップ</div>
                <div className="flex gap-2">
                  <button onClick={handleExportAllData} className="flex-1 py-2 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-800 rounded-xl text-xs font-bold cursor-pointer">JSON書き出し</button>
                  <button disabled={!isAdmin} onClick={() => periodBackupInputRef.current?.click()} className={`flex-1 py-2 border rounded-xl text-xs font-bold ${isAdmin ? 'bg-sky-50 hover:bg-sky-100 border-sky-200 text-sky-800 cursor-pointer' : 'bg-slate-100 border-slate-200 text-slate-400 cursor-not-allowed'}`}>JSON読み込み</button>
                  <input ref={periodBackupInputRef} type="file" accept="application/json,.json" className="hidden" onChange={(e) => handleImportAllData(e.target.files?.[0])} />
                </div>
                <p className="text-[10px] text-slate-500 mt-2">実習期と全生徒記録をまとめて保存します。後期作成前にも書き出してください。</p>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* カスタム確認ダイアログ */}
      {confirmState && (
        <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-slate-900/30 backdrop-blur-sm">
          <div className="bg-white border border-slate-200 rounded-2xl shadow-2xl max-w-sm w-full p-6 text-center animate-scaleIn">
            <div className="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-rose-100 mb-4 text-rose-600">
              <AlertTriangle className="h-6 w-6" />
            </div>
            <h3 className="text-sm font-bold text-slate-900 mb-2">確認</h3>
            <p className="text-xs text-slate-600 mb-6 leading-relaxed">{confirmState.message}</p>
            <div className="flex gap-2">
              <button onClick={confirmState.onCancel} className="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition-all cursor-pointer">キャンセル</button>
              <button onClick={confirmState.onConfirm} className="flex-1 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold shadow-sm transition-all active:scale-95 cursor-pointer">実行</button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

// =============================================================================
// 起動 / Bootstrap
// =============================================================================
const container = document.getElementById('root');
const root = createRoot(container);
root.render(<App />);
</script>
</body>
</html>
