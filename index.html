const getTodayString = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};

const formatShortDate = (yyyymmdd) => {
  if (!yyyymmdd) return '';
  const m = String(yyyymmdd).match(/^\d{4}-(\d{2})-(\d{2})/);

const loadFirebaseSDK = () => new Promise((resolve, reject) => {
  if (window.firebase) return resolve(window.firebase);
  const urls = [
    'https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js',
    'https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js',

    'https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js'
  ];
  const load = (i) => {
    if (i >= urls.length) return resolve(window.firebase);
    const s = document.createElement('script');
    s.src = urls[i];
    s.onload = () => load(i + 1);
    s.onerror = () => reject(new Error(`Firebase SDK の読み込みに失敗しました: ${urls[i]}`));
    document.head.appendChild(s);
  };
  load(0);
});

const computeInternshipDayInfo = (student, target) => {

// 貼り付け / ドロップされたテキストから Firebase config オブジェクトを抽出する。
// JSON / JS のオブジェクトリテラル / "window.FIREBASE_CONFIG = {...}" / "const firebaseConfig = {...}" 形式に対応。
const parseFirebaseConfigText = (text) => {
  if (!text) return null;
  const trimmed = String(text).trim();
  if (!trimmed) return null;
  const isLikelyConfig = (o) => o && typeof o === 'object' && !Array.isArray(o) && (o.apiKey || o.projectId || o.appId);
  // 1) そのまま JSON として
  try {
    const obj = JSON.parse(trimmed);
    if (isLikelyConfig(obj)) return obj;
  } catch (e) {}
  // 2) 最初の { から最後の } までを切り出して評価
  const start = trimmed.indexOf('{');
  const end = trimmed.lastIndexOf('}');
  if (start !== -1 && end > start) {
    const body = trimmed.slice(start, end + 1);
    try {
      const obj = JSON.parse(body);
      if (isLikelyConfig(obj)) return obj;
    } catch (e) {}
    try {
      // JS オブジェクトリテラル（クォート無しキー / シングルクォート等）にも対応
      const obj = new Function('"use strict"; return (' + body + ');')();
      if (isLikelyConfig(obj)) return obj;
    } catch (e) {}
  }
  return null;
};

// =============================================================================
// カスタムフック / Hooks
// =============================================================================

function useFirestoreSync(firebaseConfigStr, roomKey) {
  const [students, setStudents] = useState([]);
  const [isLoading, setIsLoading] = useState(true);
  const [connectionStatus, setConnectionStatus] = useState('local');
  const [connectionError, setConnectionError] = useState('');
  const unsubscribeRef = useRef(null);

  useEffect(() => {
    let active = true;

    const loadLocal = () => {
      const stored = localStorage.getItem(`local_students_${roomKey}`);
      try {
        if (stored) {
          setStudents(JSON.parse(stored));
        } else {
          setStudents(MOCK_STUDENTS);
          localStorage.setItem(`local_students_${roomKey}`, JSON.stringify(MOCK_STUDENTS));
        }
      } catch {
        setStudents(MOCK_STUDENTS);
      }
    };

    const init = async () => {
      setIsLoading(true);
      setConnectionError('');

      if (!firebaseConfigStr.trim()) {
        if (!active) return;
        loadLocal();
        setConnectionStatus('local');
        setIsLoading(false);
        return;
      }

      try {
        setConnectionStatus('connecting');
        let configObj;
        try { configObj = JSON.parse(firebaseConfigStr); }
        catch { throw new Error('Configの形式(JSON)が正しくありません。'); }

        const fb = await loadFirebaseSDK();
        const app = fb.apps.length ? fb.app() : fb.initializeApp(configObj);
        const db = app.firestore();
        await app.auth().signInAnonymously();

        if (unsubscribeRef.current) unsubscribeRef.current();

        const queryRef = db.collection('rooms').doc(roomKey).collection('students');
        unsubscribeRef.current = queryRef.onSnapshot(
          (snap) => {
            if (!active) return;
            const list = [];
            snap.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
            setStudents(list);
            setConnectionStatus('connected');
            setIsLoading(false);
            setConnectionError('');
          },
          (error) => {
            if (!active) return;
            setConnectionStatus('error');
            setConnectionError(`Firestoreへのアクセスに失敗しました。ルール等を確認してください。(詳細: ${error.message})`);
            setIsLoading(false);
          }
        );
      } catch (err) {
        if (!active) return;
        setConnectionStatus('error');
        setConnectionError(err.message || 'Firebaseの接続に失敗しました。');
        setIsLoading(false);
        loadLocal();
      }
    };

    init();
    return () => {
      active = false;
      if (unsubscribeRef.current) unsubscribeRef.current();
    };
  }, [firebaseConfigStr, roomKey]);

  return { students, setStudents, isLoading, setIsLoading, connectionStatus, connectionError };
}

function useHistory(limit = 30) {
  const [history, setHistory] = useState([]);
  const [redo, setRedo] = useState([]);

  const push = useCallback((entry) => {
    setHistory((prev) => {
      const next = [...prev, entry];
      if (next.length > limit) next.shift();
      return next;
    });
    setRedo([]);
  }, [limit]);

  const popUndo = useCallback(() => {
    if (!history.length) return null;
    const last = history[history.length - 1];
    setHistory((h) => h.slice(0, -1));
    setRedo((r) => {
      const next = [...r, last];
      if (next.length > limit) next.shift();
      return next;
    });
    return last;
  }, [history, limit]);

  const popRedo = useCallback(() => {
    if (!redo.length) return null;
    const last = redo[redo.length - 1];
    setRedo((r) => r.slice(0, -1));
    setHistory((h) => {
      const next = [...h, last];
      if (next.length > limit) next.shift();
      return next;
    });
    return last;
  }, [redo, limit]);

  return { history, redo, push, popUndo, popRedo };
}

function useDialog() {
  const [alertState, setAlertState] = useState(null);
  const [confirmState, setConfirmState] = useState(null);

  const showAlert = useCallback((message) => setAlertState({ message }), []);
  const showConfirm = useCallback((message, onConfirm) => {
    setConfirmState({
      message,
      onConfirm: () => { onConfirm(); setConfirmState(null); },
      onCancel: () => setConfirmState(null)
    });
  }, []);
  const closeAlert = useCallback(() => setAlertState(null), []);

  return { alertState, confirmState, showAlert, showConfirm, closeAlert };
}

// =============================================================================
// usePresence: rooms/{roomKey}/presence/{sessionId} にハートビートを書き、
// 直近60秒以内に更新されたドキュメントを「接続中」とカウントする。
// =============================================================================
function usePresence(connectionStatus, roomKey, teacherName) {
  const [onlineMembers, setOnlineMembers] = useState([]);
  const sessionIdRef = useRef(null);
  const teacherNameRef = useRef(teacherName);

  useEffect(() => { teacherNameRef.current = teacherName; }, [teacherName]);

  useEffect(() => {
    if (connectionStatus !== 'connected' || !window.firebase) {
      setOnlineMembers([]);
      return;
    }
    if (!sessionIdRef.current) {
      sessionIdRef.current = (typeof localStorage !== 'undefined' && localStorage.getItem('presence_session_id')) || ('sess-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10)); try { localStorage.setItem('presence_session_id', sessionIdRef.current); } catch (e) {}
    }
    const sessionId = sessionIdRef.current;
    const db = window.firebase.app().firestore();
    const presenceRef = db.collection('rooms').doc(roomKey).collection('presence').doc(sessionId);
    const collectionRef = db.collection('rooms').doc(roomKey).collection('presence');

    const writeHeartbeat = async () => {
      try {
        await presenceRef.set({
          lastSeen: window.firebase.firestore.FieldValue.serverTimestamp(),
          lastSeenClient: Date.now(),
          teacherName: teacherNameRef.current || '匿名',
          ua: (navigator.userAgent || '').slice(0, 80)
        }, { merge: true });
      } catch (e) {
        console.warn('presence heartbeat failed:', e.message);
      }
    };

    writeHeartbeat();
    // v3.10 fix: ハートビート間隔を 25s → 15s に短縮。切断検知のしきい値（35s）と
    // 合わせて、最大 1〜2 回ハートビートを取りこぼせば「接続中」表示から消える。
    const heartbeatInterval = setInterval(writeHeartbeat, 15000);

    // 接続を見離したセッションを期限切れとして表示から隠すための定期再検証
    // v3.10 fix: しきい値を 60s → 35s、再検証周期を 15s → 5s に短縮して、
    // 端末クラッシュ／ネットワーク遮断などで delete が走らなかった場合でも、
    // 「接続中」表示が長く残り続けないようにする。
    const recountInterval = setInterval(() => {
      setOnlineMembers((prev) => {
        const now = Date.now();
        return prev.filter((m) => now - m.lastSeen < 35000);
      });
    }, 5000);

    const unsubscribe = collectionRef.onSnapshot((snap) => {
      // v3.10 fix: snapshot がローカルキャッシュのみから来ている
      //   （＝自分の端末が Firestore と切断中）ときは、古いオンライン情報を
      //   そのまま表示し続けないよう、表示用リストを空にする。
      if (snap.metadata && snap.metadata.fromCache) {
        setOnlineMembers([]);
        return;
      }
      const now = Date.now();
      const members = [];
      snap.forEach((doc) => {
        const data = doc.data();
        // v3.10 fix: serverTimestamp が遅延して null になることがあるため、
        //   クライアント側の Date.now() を保存した lastSeenClient もフォールバックに使う。
        //   しきい値も 60s → 35s に短縮し、切断後に「接続中」表示が長く残らないようにする。
        const serverMs = data.lastSeen?.toMillis ? data.lastSeen.toMillis() : 0;
        const clientMs = typeof data.lastSeenClient === 'number' ? data.lastSeenClient : 0;
        const lastSeen = Math.max(serverMs, clientMs);
        if (lastSeen && now - lastSeen < 35000) {
          members.push({
            id: doc.id,
            teacherName: data.teacherName || '匿名',
            lastSeen,
            isSelf: doc.id === sessionId
          });
        }
      });
      members.sort((a, b) => b.lastSeen - a.lastSeen); const dedupMap = new Map(); for (const m of members) { const key = String(m.teacherName || '').trim() || ('__id__' + m.id); if (m.isSelf) dedupMap.set(key, m); else if (!dedupMap.has(key)) dedupMap.set(key, m); } members.length = 0; for (const m of dedupMap.values()) members.push(m); members.sort((a, b) => (Number(b.isSelf) - Number(a.isSelf)) || String(a.teacherName).localeCompare(String(b.teacherName), 'ja'));
      setOnlineMembers(members);
    }, (err) => {
      console.warn('presence snapshot error:', err.message);
    });

    const cleanup = () => {
      try { presenceRef.delete().catch(() => {}); } catch (e) {}
    };
    const onUnload = () => cleanup();
    window.addEventListener('beforeunload', onUnload);
    window.addEventListener('pagehide', onUnload);

    return () => {
      clearInterval(heartbeatInterval);
      clearInterval(recountInterval);
      unsubscribe();
      cleanup();
      window.removeEventListener('beforeunload', onUnload);
      window.removeEventListener('pagehide', onUnload);
    };
  }, [connectionStatus, roomKey]);

  return { onlineCount: onlineMembers.length, onlineMembers };
}

// =============================================================================
// useBoardSync: 画面上部の掲示板。rooms/{roomKey}/board コレクションを
// 購読、接続中はリアルタイム同期、ローカル時は localStorage を使う。
// =============================================================================
function useBoardSync(connectionStatus, roomKey) {
  const [posts, setPosts] = useState([]);
  const unsubRef = useRef(null);
  // v3.16: 削除済み投稿の履歴（ルーム単位・端末ごとに保存）。誰が・いつ削除したかも保持する。
  const [deletedHistory, setDeletedHistory] = useState(() => { try { return JSON.parse(localStorage.getItem('board_deleted_history_' + roomKey) || '[]'); } catch (e) { return []; } });
  // v3.16: 自分の画面で非表示にした投稿の履歴（この端末専用）。
  const [hiddenHistory, setHiddenHistory] = useState(() => { try { return JSON.parse(localStorage.getItem('board_hidden_history_' + roomKey) || '[]'); } catch (e) { return []; } });

  useEffect(() => {
    try {
      const stored = localStorage.getItem('local_board_' + roomKey);
      const __seedKey = 'board_seeded_' + roomKey; const __existing = stored ? JSON.parse(stored) : []; if (!localStorage.getItem(__seedKey)) { const __seed = { id: 'seed-init-' + roomKey + '-' + Date.now(), author: '加藤俊', message: '初期設定：この画面を開いたら次の設定をお願いします。\n１　メッセージで一緒に送られたファイルダウンロードする。\n２　環境設定を開く。\n３　ダウンロードしたファイルを点線で囲まれた configs・・・・・のようなところにドラッグアンドドロップする。', createdAt: Date.now() }; const __merged = [__seed, ...__existing].slice(0, 50); try { localStorage.setItem('local_board_' + roomKey, JSON.stringify(__merged)); localStorage.setItem(__seedKey, '1'); } catch (e) {} setPosts(__merged); } else { setPosts(__existing); }
    } catch (e) { setPosts([]); }

    if (connectionStatus === 'connected' && window.firebase) {
      const db = window.firebase.app().firestore();
      const ref = db.collection('rooms').doc(roomKey).collection('board').orderBy('createdAt', 'desc').limit(50);
      if (unsubRef.current) unsubRef.current();
      unsubRef.current = ref.onSnapshot((snap) => {
        const list = [];
        snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
        setPosts(list);
      }, (err) => { console.warn('board snapshot:', err.message); });
    }

    return () => { if (unsubRef.current) { unsubRef.current(); unsubRef.current = null; } };
  }, [connectionStatus, roomKey]);

  const addPost = async (author, message) => {
    if (connectionStatus === 'connected' && window.firebase) {
      try {
        const db = window.firebase.app().firestore();
        await db.collection('rooms').doc(roomKey).collection('board').add({ author: author || '匿名', message, createdAt: window.firebase.firestore.FieldValue.serverTimestamp() });
        return;
      } catch (e) { console.warn('board add failed:', e.message); }
    }
    setPosts((prev) => {
      const next = [{ id: 'local-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6), author: author || '匿名', message, createdAt: Date.now() }, ...prev];
      try { localStorage.setItem('local_board_' + roomKey, JSON.stringify(next.slice(0, 50))); } catch (e) {}
      return next.slice(0, 50);
    });
  };

  // v3.16: 削除前に投稿スナップショットを履歴へ保存し、誰がいつ削除したかも記録する。
  const deletePost = async (postId, deletedBy) => {
    const snap = posts.find((p) => p.id === postId);
    if (snap) {
      const ts = snap.createdAt;
      const ms = ts && typeof ts === 'object' && ts.toMillis ? ts.toMillis() : (typeof ts === 'number' ? ts : 0);
      const entry = { id: snap.id, author: snap.author || '匿名', message: snap.message || '', createdAt: ms || Date.now(), deletedAt: Date.now(), deletedBy: deletedBy || '匿名' };
      setDeletedHistory((prev) => { const next = [entry, ...prev.filter((h) => h.id !== postId)].slice(0, 200); try { localStorage.setItem('board_deleted_history_' + roomKey, JSON.stringify(next)); } catch (e) {} return next; });
    }
    if (connectionStatus === 'connected' && window.firebase && !String(postId).startsWith('local-')) {
      try {
        const db = window.firebase.app().firestore();
        await db.collection('rooms').doc(roomKey).collection('board').doc(postId).delete();
        return;
      } catch (e) { console.warn('board delete failed:', e.message); }
    }
    setPosts((prev) => {
      const next = prev.filter((p) => p.id !== postId);
      try { localStorage.setItem('local_board_' + roomKey, JSON.stringify(next)); } catch (e) {}
      return next;
    });
  };

  const [hiddenIds, setHiddenIds] = useState(() => { try { const v = localStorage.getItem('board_hidden_' + roomKey); return new Set(v ? JSON.parse(v) : []); } catch (e) { return new Set(); } });
  useEffect(() => {
    try { const v = localStorage.getItem('board_hidden_' + roomKey); setHiddenIds(new Set(v ? JSON.parse(v) : [])); } catch (e) { setHiddenIds(new Set()); }
    try { setDeletedHistory(JSON.parse(localStorage.getItem('board_deleted_history_' + roomKey) || '[]')); } catch (e) { setDeletedHistory([]); }
    try { setHiddenHistory(JSON.parse(localStorage.getItem('board_hidden_history_' + roomKey) || '[]')); } catch (e) { setHiddenHistory([]); }
  }, [roomKey]);
  // v3.16: 非表示にした投稿のスナップショットを履歴へ保存（端末ごと）。
  const hidePost = (postId) => {
    const snap = posts.find((p) => p.id === postId);
    if (snap) {
      const ts = snap.createdAt;
      const ms = ts && typeof ts === 'object' && ts.toMillis ? ts.toMillis() : (typeof ts === 'number' ? ts : 0);
      const entry = { id: snap.id, author: snap.author || '匿名', message: snap.message || '', createdAt: ms || Date.now(), hiddenAt: Date.now() };
      setHiddenHistory((prev) => { const next = [entry, ...prev.filter((h) => h.id !== postId)].slice(0, 200); try { localStorage.setItem('board_hidden_history_' + roomKey, JSON.stringify(next)); } catch (e) {} return next; });
    }
    setHiddenIds((prev) => { const next = new Set(prev); next.add(postId); try { localStorage.setItem('board_hidden_' + roomKey, JSON.stringify(Array.from(next))); } catch (e) {} return next; });
  };
  // v3.16: 非表示にした投稿を自分の画面に再表示する。
  const restoreHiddenPost = (postId) => {
    setHiddenIds((prev) => { const next = new Set(prev); next.delete(postId); try { localStorage.setItem('board_hidden_' + roomKey, JSON.stringify(Array.from(next))); } catch (e) {} return next; });
    setHiddenHistory((prev) => { const next = prev.filter((h) => h.id !== postId); try { localStorage.setItem('board_hidden_history_' + roomKey, JSON.stringify(next)); } catch (e) {} return next; });
  };
  const clearDeletedHistory = () => { setDeletedHistory([]); try { localStorage.removeItem('board_deleted_history_' + roomKey); } catch (e) {} };
  const clearHiddenHistory = () => { setHiddenHistory([]); try { localStorage.removeItem('board_hidden_history_' + roomKey); } catch (e) {} };
  const visiblePosts = posts.filter((p) => !hiddenIds.has(p.id));

  return { posts: visiblePosts, addPost, deletePost, hidePost, deletedHistory, hiddenHistory, restoreHiddenPost, clearDeletedHistory, clearHiddenHistory };
}

// v3.9: locked / onToggleLock / isAdmin を受け取るよう拡張。
//   ・locked=true かつ isAdmin=false のときクリックを完全に無反応にし、グレーアウト表示。

const ProgressToggleButton = ({ icon: Icon, label, status, palette, onClick, suffix, cellHandlers, clickGate, locked, onToggleLock, isAdmin }) => {
  const lockedForUser = locked && !isAdmin;
  const handleMain = (e) => {
    if (lockedForUser) { e.preventDefault(); e.stopPropagation(); return; }
    if (clickGate && !clickGate()) return;
    if (onClick) onClick(e);
  };
  const tooltip = lockedForUser ? '管理者によりロックされています' : label;
  const lockedStyle = lockedForUser ? ' opacity-40 grayscale cursor-not-allowed' : '';
  const cursorStyle = lockedForUser ? '' : ' cursor-pointer';
  const lockBadge = onToggleLock ? (
    <button
      type="button"
      onClick={(e) => { e.stopPropagation(); onToggleLock(); }}
      title={locked ? '管理者ロックを解除' : '一般利用者のクリックを禁止する'}
      className={`ml-1 shrink-0 inline-flex items-center justify-center w-4 h-4 rounded-full border text-[9px] cursor-pointer transition-all ${locked ? 'bg-amber-100 border-amber-400' : 'bg-white border-slate-300 hover:border-amber-300'}`}
    >
      <span>{locked ? '🔒' : '🔓'}</span>

  ) : null;
  if (status === 'none') {
    return (
      <span className="w-full flex items-center gap-0.5">

        {lockBadge}
      </span>
    );
  }
  return (
    <span className="w-full flex items-center gap-0.5">
      <button
        onClick={handleMain} {...(cellHandlers || {})}
        title={tooltip}
        className={`flex-1 py-1.5 px-2.5 rounded-lg border text-[10px] font-bold flex items-center justify-between transition-all active:scale-95 shadow-sm ${palette}${cursorStyle}${lockedStyle}`}

        </span>

};

// v3.18: 添付ファイルのダウンロード。旧データ（dataUrl）はそのまま、Storage 保存分（url）は fetch→blob 経由でダウンロードする。
const downloadMaterialFile = async (m) => {
  const trigger = (href) => { const a = document.createElement('a'); a.href = href; a.download = m.name || 'file'; document.body.appendChild(a); a.click(); document.body.removeChild(a); };
  if (m.dataUrl) { trigger(m.dataUrl); return; }
  if (!m.url) return;
  try {
    const res = await fetch(m.url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();
    const objUrl = URL.createObjectURL(blob);
    trigger(objUrl);
    setTimeout(() => URL.revokeObjectURL(objUrl), 10000);
  } catch (e) {
    window.open(m.url, '_blank', 'noopener');
  }
};

                  <button onClick={() => { if (m.kind === 'file') gateFile(() => onPreview(m)); else onPreview(m); }} className="px-2 py-1 bg-white border border-slate-200 hover:bg-indigo-50 hover:border-indigo-300 text-indigo-700 rounded-lg text-[10px] font-bold cursor-pointer shrink-0">プレビュー</button>

const DatePickerModal = ({ value, title, onSelect, onClose, allowClear = true }) => {
  const initial = value ? new Date(value + 'T00:00:00') : new Date();
  const [year, setYear] = useState(initial.getFullYear());
  const [month, setMonth] = useState(initial.getMonth());

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const prevMonthDays = new Date(year, month, 0).getDate();
  const cells = [];
  for (let i = firstDay - 1; i >= 0; i--) cells.push({ day: prevMonthDays - i, isCurrent: false, y: month === 0 ? year - 1 : year, m: month === 0 ? 11 : month - 1 });
  for (let i = 1; i <= daysInMonth; i++) cells.push({ day: i, isCurrent: true, y: year, m: month });
  const rem = 42 - cells.length;
  for (let i = 1; i <= rem; i++) cells.push({ day: i, isCurrent: false, y: month === 11 ? year + 1 : year, m: month === 11 ? 0 : month + 1 });

  const today = new Date();
  const todayKey = formatDateKey(today.getFullYear(), today.getMonth(), today.getDate());

  const handlePrev = () => { if (month === 0) { setYear(year - 1); setMonth(11); } else setMonth(month - 1); };
  const handleNext = () => { if (month === 11) { setYear(year + 1); setMonth(0); } else setMonth(month + 1); };

  return (
    <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm" onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} className="bg-white border border-slate-200 rounded-2xl shadow-2xl max-w-sm w-full overflow-hidden animate-scaleIn">

          <h3 className="text-sm font-bold text-slate-900 flex items-center gap-2">
            <Calendar className="w-4 h-4 text-indigo-600" />
            <span>{title || '日付を選択'}</span>
          </h3>
          <button type="button" onClick={onClose} className="text-slate-400 hover:text-slate-900 font-bold text-xl cursor-pointer">×</button>
        </div>

        <div className="p-4">
          <div className="flex items-center justify-between mb-3">
            <button type="button" onClick={handlePrev} className="p-1.5 hover:bg-slate-100 bg-white border border-slate-200 rounded-lg text-slate-700 transition-all cursor-pointer">
              <ChevronLeft className="w-4 h-4" />
            </button>
            <span className="text-sm font-bold text-slate-900">{year}年 {month + 1}月</span>

w === '不要' ? 'none' : 'pending', phoneDate: '', docStatus: docRaw === '完了' ? 'completed' : docRaw === '不要' ? 'none' : 'pending', docDate: '', greetingStatus: greetingDate ? 'scheduled' : 'pending', greetingDate, greetingTime: get(headerMap[10]), greetingVisitor: get(headerMap[11]), patrols, studentThankYouStatus: 'pending', studentThankYouDate: '', teacherThankYouStatus: 'pending', teacherThankYouDate: '', notes: get(headerMap[13]), materials: [] }); } setErrors(localErrors); setParsed(rows); };

  useEffect(() => {

      const name = String(rawName || '').trim();
      if (!name || name === '匿名') return;
      const firstSeen = (info && typeof info.firstSeenAt === 'number') ? info.firstSeenAt : 0;
      const lastSeen = (info && typeof info.lastSeenAt === 'number') ? info.lastSeenAt : 0;
      const editCount = (info && typeof info.editCount === 'number') ? info.editCount : 0;
      const dk = (info && info.lastDateKey) || '';
      if (!acc[name]) {
        acc[name] = { firstSeenAt: firstSeen || lastSeen, lastSeenAt: lastSeen, editCount, lastDateKey: dk, sources: new Set([source]) };
      } else {
        const prev = acc[name];
        const candidateFirst = firstSeen || lastSeen;
        if (candidateFirst && (!prev.firstSeenAt || candidateFirst < prev.firstSeenAt)) prev.firstSeenAt = candidateFirst;
        if (lastSeen > prev.lastSeenAt) prev.lastSeenAt = lastSeen;
        prev.editCount = (prev.editCount || 0) + editCount;
        if (dk > (prev.lastDateKey || '')) prev.lastDateKey = dk;
        prev.sources.add(source);
      }
    };
    const finalize = (acc) => {
      const out = {};
      Object.entries(acc).forEach(([k, v]) => { out[k] = { firstSeenAt: v.firstSeenAt, lastSeenAt: v.lastSeenAt, editCount: v.editCount, lastDateKey: v.lastDateKey, sources: Array.from(v.sources || []) }; });
      return out;

            mergeName(acc, v.teacherName, { firstSeenAt: v.firstSeenAt, lastSeenAt: v.lastSeenAt, editCount: v.editCount, lastDateKey: v.dateKey }, 'visitors');
          });

        if (presenceSnap) {

            const lastSeen = Math.max(serverMs, clientMs);
            mergeName(acc, v.teacherName, { firstSeenAt: lastSeen, lastSeenAt: lastSeen, editCount: 0 }, 'presence');

      localStorage.setItem(`local_students_${roomKey}`, JSON.stringify(updated));
    }
  };

  const removeStudentRaw = async (studentId) => {
    if (connectionStatus === 'connected' && window.firebase) {
      try {
        const db = window.firebase.app().firestore();
        await db.collection('rooms').doc(roomKey).collection('students').doc(studentId).delete();
      } catch (e) {
        showAlert(`削除の取消に失敗しました: ${e.message}`);
      }
    } else {
      const updated = students.filter((s) => s.id !== studentId);
      setStudents(updated);
      localStorage.setItem(`local_students_${roomKey}`, JSON.stringify(updated));
    }
  };

  const applyHistoryEntry = async (entry, direction) => {
    if (!entry || !entry.kind) return;
    if (entry.kind === 'update') {
      const target = direction === 'undo' ? entry.before : entry.after;
      await persistPartial(entry.studentId, target);
    } else if (entry.kind === 'create') {
      if (direction === 'undo') await removeStudentRaw(entry.student.id);
      else await writeStudentRaw(entry.student);
    } else if (entry.kind === 'delete') {
      if (direction === 'undo') await writeStudentRaw(entry.student);
      else await removeStudentRaw(entry.student.id);
    }
  };

  const handleUndo = async () => {
    const entry = popUndo();
    if (entry) await applyHistoryEntry(entry, 'undo');
  };

  const handleRedo = async () => {
    const entry = popRedo();
    if (entry) await applyHistoryEntry(entry, 'redo');
  };

  // v3.9: 編集アクションと同時に「今日の訪問者」の編集件数を +1 する。undo/redo からは呼ばれないので重複カウントしない。
  const recordUpdate = (studentId, before, after) => { pushHistory({ kind: 'update', studentId, before, after }); try { if (window.__bumpVisitorEditCount) window.__bumpVisitorEditCount(1); } catch (e) {} };
  const recordCreate = (student) => { pushHistory({ kind: 'create', student }); try { if (window.__bumpVisitorEditCount) window.__bumpVisitorEditCount(1); } catch (e) {} };
  const recordDelete = (student) => { pushHistory({ kind: 'delete', student }); try { if (window.__bumpVisitorEditCount) window.__bumpVisitorEditCount(1); } catch (e) {} };

  const handleSaveStudent = async (studentData) => {
    setIsLoading(true);
    const today = getTodayString();

    const prepared = {
      ...studentData,
      materials: editingStudent?.materials || [],
      phoneDate: studentData.phoneStatus === 'completed' && !studentData.phoneDate ? today : studentData.phoneDate,
      docDate:   studentData.docStatus   === 'completed' && !studentData.docDate   ? today : studentData.docDate
    };

    if (connectionStatus === 'connected' && window.firebase) {
      try {
        const db = window.firebase.app().firestore();
        const ref = db.collection('rooms').doc(roomKey).collection('students');
        if (editingStudent) {
          await ref.doc(editingStudent.id).update(prepared);
        } else {
          await ref.add(prepared);
        }
        setIsAddEditOpen(false);
        setEditingStudent(null);
      } catch (e) {
        showAlert(`データの保存に失敗しました: ${e.message}`);
      } finally {
        setIsLoading(false);
      }
    } else {
      let updated = [...students];
      if (editingStudent) {
        updated = updated.map((s) => s.id === editingStudent.id ? { ...s, ...prepared } : s);
      } else {
        updated.push({ id: 'local-' + Date.now(), ...prepared });
      }
      setStudents(updated);
      localStorage.setItem(`local_students_${roomKey}`, JSON.stringify(updated));
      setIsAddEditOpen(false);
      setEditingStudent(null);
      setIsLoading(false);
    }
  };

  const handleInstantToggle = async (student, field, currentStatus) => {
    const stepKey = FIELD_TO_STEP[field];
    if (!stepKey) return;
    // v3.9: ロックされたフィールドは管理者以外の変更を拒否（リスト画面の🔒マークで設定）
    // v3.15: ロック対象は「事前電話・事前挨拶・生徒お礼状」の3項目のみ。
    //   それ以外（教師お礼状・連絡票配付など）に過去データの lockedFields が
    //   残っていてもロック扱いしない。
    const LOCKABLE_FIELDS_ONLY = ['phoneStatus', 'greetingStatus', 'giftStatus', 'studentThankYouStatus'];
    if (!isAdmin && LOCKABLE_FIELDS_ONLY.includes(field) && (student.lockedFields || []).includes(field)) {
      showAlert('この項目は管理者によりロックされています。');
      return;
    }
    const next = nextStatus(stepKey, currentStatus || 'pending');
    const update = buildStepUpdate(stepKey, next);
    const before = Object.fromEntries(Object.keys(update).map((k) => [k, student[k] ?? '']));
    recordUpdate(student.id, before, update);
    await persistPartial(student.id, update);
  };

  const handleAddInternshipDate = async (student, dateKey) => {
    const current = student.internshipDates || [];
    if (current.includes(dateKey)) return;
    const next = [...current, dateKey].sort();
    recordUpdate(student.id, { internshipDates: current }, { internshipDates: next });
    await persistPartial(student.id, { internshipDates: next });
  };

  const handleRemoveInternshipDate = async (student, dateKey) => {
    const current = student.internshipDates || [];
    if (!current.includes(dateKey)) return;
    const next = current.filter((d) => d !== dateKey);
    recordUpdate(student.id, { internshipDates: current }, { internshipDates: next });
    await persistPartial(student.id, { internshipDates: next });
  };

  const handleAddPatrol = async (student, date, time, teacher) => {
    const current = student.patrols || [];
    const next = [...current, { id: 'p-' + Date.now(), date, time: time || '', teacher: teacher || '', done: false }].sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
    recordUpdate(student.id, { patrols: current }, { patrols: next });
    await persistPartial(student.id, { patrols: next });
  };

  const handleRemovePatrol = async (student, patrolId) => {
    const current = student.patrols || [];
    const next = current.filter((p) => p.id !== patrolId);
    recordUpdate(student.id, { patrols: current }, { patrols: next });
    await persistPartial(student.id, { patrols: next });
  };

  const handleTogglePatrol = async (student, patrolId) => {
    const current = student.patrols || [];
    const next = current.map((p) => p.id === patrolId ? { ...p, done: !p.done } : p);
    recordUpdate(student.id, { patrols: current }, { patrols: next });
    await persistPartial(student.id, { patrols: next });
  };

  // v3.18: ファイル本体は Firebase Storage に保存し、Firestore にはダウンロードURLと保存パスのみ持たせる。
  //（base64 を Firestore ドキュメントへ保存すると 1MB 上限を超えて保存に失敗するため。オフライン時は従来どおり dataUrl で localStorage に保存する。）
  const uploadMaterialFile = async (studentId, matId, file) => {
    const storage = window.firebase.app().storage();
    const safeName = (file.name || 'file').split('/').join('_');
    const path = 'rooms/' + roomKey + '/materials/' + studentId + '/' + matId + '_' + safeName;
    const storageRef = storage.ref().child(path);
    await storageRef.put(file, { contentType: file.type || 'application/octet-stream', contentDisposition: 'inline' });
    const url = await storageRef.getDownloadURL();
    return { url, storagePath: path };
  };

  const readFileAsDataUrl = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error('ファイルの読み込みに失敗しました。'));
    reader.readAsDataURL(file);
  });

  const handleAddMaterial = async (material) => {
    const target = students.find((s) => s.id === materialModalStudentId);
    if (!target) return;
    const matId = 'mat-' + Date.now();
    let item = { ...material, id: matId };
    if (material.kind === 'file' && material.file) {
      const { file, ...rest } = material;
      setIsLoading(true);
      try {
        if (connectionStatus === 'connected' && window.firebase) {
          const uploaded = await uploadMaterialFile(target.id, matId, file);
          item = { ...rest, id: matId, url: uploaded.url, storagePath: uploaded.storagePath };
        } else {
          const dataUrl = await readFileAsDataUrl(file);
          item = { ...rest, id: matId, dataUrl };
        }
      } catch (e) {
        setIsLoading(false);
        showAlert('ファイルのアップロードに失敗しました: ' + e.message);
        return;
      }
      setIsLoading(false);
    }
    const current = target.materials || [];
    const next = [...current, item];
    recordUpdate(target.id, { materials: current }, { materials: next });
    await persistPartial(target.id, { materials: next });
  };

  const handleDeleteMaterial = async (materialId) => {
    const target = students.find((s) => s.id === materialModalStudentId);
    if (!target) return;
    const current = target.materials || [];
    const removed = current.find((m) => m.id === materialId);
    // v3.18: Storage 上のファイル本体も削除する（本体削除に失敗しても一覧からは消す）。
    if (removed && removed.storagePath && connectionStatus === 'connected' && window.firebase) {
      try { await window.firebase.app().storage().ref().child(removed.storagePath).delete(); }
      catch (e) { console.warn('Storage ファイルの削除に失敗:', e.message); }
    }
    const next = current.filter((m) => m.id !== materialId);
    recordUpdate(target.id, { materials: current }, { materials: next });
    await persistPartial(target.id, { materials: next });
  };

  const handleRenameMaterial = async (materialId, newName) => {
    const target = students.find((s) => s.id === materialModalStudentId);
    if (!target) return;
    const trimmed = String(newName || '').trim();
    if (!trimmed) return;
    const current = target.materials || [];
    const next = current.map((m) => m.id === materialId ? { ...m, name: trimmed } : m);
    recordUpdate(target.id, { materials: current }, { materials: next });
    await persistPartial(target.id, { materials: next });
  };

  // v3.6: リスト画面の「追加」ボタンへのファイルドロップで、その生徒の関連資料として一括インポートする。
  // v3.18: ファイル本体は Firebase Storage にアップロードし、Firestore にはURLのみ保存する（1ファイル 20MB まで。オフライン時は dataUrl で localStorage 保存）。
  const handleDropFilesForMaterial = async (studentId, files) => {
    const target = students.find((s) => s.id === studentId);
    if (!target || !files || files.length === 0) return;
    const arr = Array.from(files);
    const tooLarge = arr.filter((f) => f.size > 20 * 1024 * 1024);
    const ok = arr.filter((f) => f.size <= 20 * 1024 * 1024);
    if (tooLarge.length > 0) {
      showAlert('次のファイルは20MBを超えているため取り込めません: ' + tooLarge.map((f) => f.name).join('、') + '\n大きなファイルは関連資料モーダルから Google Drive 等の共有URLとして登録してください。');
    }
    if (ok.length === 0) return;
    const importOne = async (file) => {
      const matId = 'mat-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
      const base = { id: matId, name: file.name, kind: 'file', mimeType: file.type, size: file.size };
      try {
        if (connectionStatus === 'connected' && window.firebase) {
          const uploaded = await uploadMaterialFile(studentId, matId, file);
          return { ok: true, item: { ...base, url: uploaded.url, storagePath: uploaded.storagePath } };
        }
        const dataUrl = await readFileAsDataUrl(file);
        return { ok: true, item: { ...base, dataUrl } };
      } catch (e) {
        return { ok: false, name: file.name };
      }
    };
    setIsLoading(true);
    const results = await Promise.all(ok.map(importOne));
    setIsLoading(false);
    const failed = results.filter((r) => !r.ok).map((r) => r.name);
    const items = results.filter((r) => r.ok).map((r) => r.item);
    if (failed.length > 0) showAlert('読み込みに失敗したファイル: ' + failed.join('、'));
    if (items.length === 0) return;
    const latest = students.find((s) => s.id === studentId) || target;
    const current = latest.materials || [];
    const next = [...current, ...items];
    recordUpdate(latest.id, { materials: current }, { materials: next });
    await persistPartial(latest.id, { materials: next });
  };

  const handleDeleteStudent = (studentId) => {
    showConfirm('この生徒の実習進捗データを削除してもよろしいですか？', async () => {
      const target = students.find((s) => s.id === studentId);
      if (target) recordDelete(target);
      setIsLoading(true);
      if (connectionStatus === 'connected' && window.firebase) {
        try {
          const db = window.firebase.app().firestore();
          await db.collection('rooms').doc(roomKey).collection('students').doc(studentId).delete();
        } catch (e) {
          showAlert(`削除に失敗しました: ${e.message}`);
        } finally {
          setIsLoading(false);
        }
      } else {
        const updated = students.filter((s) => s.id !== studentId);
        setStudents(updated);
        localStorage.setItem(`local_students_${roomKey}`, JSON.stringify(updated));
        setIsLoading(false);
      }
    });
  };

  const handleConfigSubmit = (e) => {
    e.preventDefault();
    localStorage.setItem('school_firebase_config', firebaseConfigStr);
    setIsConfigOpen(false);
  };

  // v3.8: 印刷オプションを body のクラスとして適用してから window.print() を呼ぶ。
  //       印刷ダイアログを閉じた後にクラスを取り外して、画面表示を元に戻す。
  const handleConfirmPrint = useCallback(() => {
    const body = document.body;
    body.classList.remove('print-only-selected', 'print-break-by-class', 'print-compact-columns');
    if (printOptions.onlySelected && selectedIds.size > 0) body.classList.add('print-only-selected');
    if (printOptions.breakByClass) body.classList.add('print-break-by-class');
    if (printOptions.compactColumns) body.classList.add('print-compact-columns');
    setIsPrintOpen(false);
    setTimeout(() => {
      window.print();
      setTimeout(() => {
        body.classList.remove('print-only-selected', 'print-break-by-class', 'print-compact-columns');
      }, 500);
    }, 120);
  }, [printOptions, selectedIds]);

  // v3.9: 管理者パスワードをハッシュ化して保存。
  // 教室内ツールなので厳密な暗号化ではなく、roomKeyをソルトにした簡易ハッシュとする。
  const computeAdminHash = useCallback((pw) => {
    try { return btoa(unescape(encodeURIComponent('jissyuu_v39_admin:' + roomKey + ':' + (pw || '')))); }
    catch (e) { return ''; }
  }, [roomKey]);

  // ルーム切り替え時に管理者状態を再読込
  useEffect(() => {
    try {
      setAdminPasswordHash(localStorage.getItem(`admin_password_hash_${roomKey}`) || '');
      setIsAdmin(localStorage.getItem(`is_admin_${roomKey}`) === '1');
    } catch (e) {}
  }, [roomKey]);

  // Firestore の rooms/{roomKey} ドキュメントから管理者パスワードハッシュを購読。
  // 初期化時にクラウド側にないがローカルにある場合はクラウドへ上げる。
  useEffect(() => {
    if (connectionStatus !== 'connected' || !window.firebase) return;
    const db = window.firebase.app().firestore();
    const ref = db.collection('rooms').doc(roomKey);
    const unsub = ref.onSnapshot((snap) => {
      const data = snap.data() || {};
      const cloudHash = data.adminPasswordHash || '';
      let localHash = '';
      try { localHash = localStorage.getItem(`admin_password_hash_${roomKey}`) || ''; } catch (e) {}
      if (cloudHash) {
        setAdminPasswordHash(cloudHash);
        try { localStorage.setItem(`admin_password_hash_${roomKey}`, cloudHash); } catch (e) {}
        // クラウドと一致しない “以前設定した管理者状態” を強制クリアしない（他端末で変更しただけの可能性もあるため）
      } else if (localHash) {
        // クラウド未設定だがローカルにはある → クラウドへ同期
        ref.set({ adminPasswordHash: localHash }, { merge: true }).catch(() => {});
      }
    }, (err) => { console.warn('admin hash snapshot:', err.message); });
    return () => { try { unsub(); } catch (e) {} };
  }, [connectionStatus, roomKey]);

  // 管理者パスワードを設定/変更。未設定時は旧パスワード不要、設定済み時は旧パスワード必須。
  //  v3.9 fix: 確認用パスワード（newPassword2）の一致チェックを追加。
  //            ローカル保存を先に確実に行い、クラウド書き込みが失敗しても
  //            ローカルだけは必ず反映する（Firestore ルールで rooms/{rk} ドキュメント自体
  //            への書き込みが許可されていない場合でも管理者登録は完了する）。
  const setAdminPasswordTo = async (newPassword, oldPassword, newPassword2) => {
    if (adminPasswordHash) {
      if (computeAdminHash(oldPassword) !== adminPasswordHash) {
        showAlert('現在の管理者パスワードが違います。');
        return false;
      }
    }
    if (!newPassword || newPassword.length < 4) {
      showAlert('管理者パスワードは4文字以上にしてください。');
      return false;
    }
    // newPassword2 が明示的に渡された場合のみ一致チェック（UI 側で確認入力を使うときのためのフック）
    if (typeof newPassword2 === 'string' && newPassword2 !== '' && newPassword !== newPassword2) {
      showAlert('1回目と2回目の管理者パスワードが一致しません。同じパスワードを2回入力してください。');
      return false;
    }
    const wasSet = !!adminPasswordHash;
    const newHash = computeAdminHash(newPassword);
    // まずローカルへ保存（必ず成功させる）。
    // Firestore のセキュリティルールで rooms/{rk} ドキュメントへの write が拒否される環境でも、
    // この端末ではローカル保存だけで管理者として正しく動作する。
    try { localStorage.setItem(`admin_password_hash_${roomKey}`, newHash); } catch (e) {}
    setAdminPasswordHash(newHash);
    try { localStorage.setItem(`is_admin_${roomKey}`, '1'); } catch (e) {}
    setIsAdmin(true);
    // クラウド接続中なら、ベストエフォートでクラウドにも保存を試みる。
    // 失敗しても無視。useEffect の snapshot listener が後で自動で再同期するため、ユーザーへエラーは出さない。
    if (connectionStatus === 'connected' && window.firebase) {
      try {
        const db = window.firebase.app().firestore();
        await db.collection('rooms').doc(roomKey).set({ adminPasswordHash: newHash }, { merge: true });
      } catch (e) { /* ignore: ローカル保存だけで管理者として登録は完了している */ }
    }
    showAlert(wasSet ? '✅ 管理者パスワードを変更しました。このまま管理者としてログインしています。' : '✅ このルームの管理者として登録しました。\n他の端末では「管理者ログイン」しない限り、ロック項目を編集できません。');
    return true;
  };

  // 管理者ログイン / ログアウト
  const loginAsAdmin = (password) => {
    if (!adminPasswordHash) {
      showAlert('このルームにはまだ管理者パスワードが設定されていません。「新規設定」から登録してください。');
      return false;
    }
    if (computeAdminHash(password) !== adminPasswordHash) {
      showAlert('管理者パスワードが違います。');
      return false;
    }
    try { localStorage.setItem(`is_admin_${roomKey}`, '1'); } catch (e) {}
    setIsAdmin(true);
    return true;
  };
  const logoutAdmin = () => {
    try { localStorage.removeItem(`is_admin_${roomKey}`); } catch (e) {}
    setIsAdmin(false);
  };

  // ロック判定：student.lockedFields[] に含まれていて一般利用者なら true。
  const isFieldLocked = useCallback((student, fieldName) => {
    if (isAdmin) return false;
    const arr = (student && student.lockedFields) || [];
    return arr.includes(fieldName);
  }, [isAdmin]);

  // 管理者のみ：ある生徒のあるフィールドのロック ON/OFF を切替。
  const toggleLockField = async (student, fieldName) => {
    if (!isAdmin || !student) return;
    const current = student.lockedFields || [];
    const next = current.includes(fieldName)
      ? current.filter((f) => f !== fieldName)
      : [...current, fieldName];
    recordUpdate(student.id, { lockedFields: current }, { lockedFields: next });
    await persistPartial(student.id, { lockedFields: next });
  };

  // v3.12 fix: 指定された roomKey がすでに作成済みかどうかを判定する。
  //   非管理者でも実在ルームに入れるよう、判定を「複数シグナルのうち
  //   いずれか1つでも見つかれば存在する」と緩める。
  //   ・先にローカル痕跡（local_students_* / visited_rooms）をチェックすることで、
  //     Firestore セキュリティルールで rooms/{rk} doc 自体の read が拒否される
  //     環境でも誤って「存在しない」と判定されないようにする。
  //   ・クラウドでは rooms/{rk} doc / students / presence / board / visitors を
  //     Promise.all で並列に limit(1) read。個別の read 失敗（権限なし等）は
  //     .catch で個別に握りつぶし、他のシグナルで救えるようにする。
  //   ・管理者が作成直後で students が空のときも、presence や board / visitors
  //     のいずれかにデータがあれば true を返す。
  const roomExists = useCallback(async (rk) => {
    const target = String(rk || '').trim();
    if (!target) return false;
    // 1) まずローカル痕跡をチェック（権限エラーで誤判定されるのを防ぐ）
    try {
      if (localStorage.getItem('local_students_' + target)) return true;
      const visited = JSON.parse(localStorage.getItem('visited_rooms') || '[]');
      if (Array.isArray(visited) && visited.includes(target)) return true;
    } catch (e) {}
    // 2) クラウド接続中なら複数シグナルを並列でチェック
    if (connectionStatus === 'connected' && window.firebase) {
      try {
        const db = window.firebase.app().firestore();
        const roomRef = db.collection('rooms').doc(target);
        const checks = await Promise.all([
          roomRef.get().then((s) => !!s.exists).catch(() => false),
          roomRef.collection('students').limit(1).get().then((s) => !s.empty).catch(() => false),
          roomRef.collection('presence').limit(1).get().then((s) => !s.empty).catch(() => false),
          roomRef.collection('board').limit(1).get().then((s) => !s.empty).catch(() => false),
          roomRef.collection('visitors').limit(1).get().then((s) => !s.empty).catch(() => false),
        ]);
        if (checks.some(Boolean)) return true;
      } catch (e) { /* 全体失敗時はそのまま false 扱いに落とす */ }
    }
    return false;
  }, [connectionStatus]);

  const handleRoomKeyChange = async (e) => {
    e.preventDefault();
    const target = String(tempRoomKey || '').trim();
    if (!target) return;
    if (target === roomKey) { setIsConfigOpen(false); return; }
    // v3.10 fix: 既存ルームでない場合、一般利用者には新規作成を許可しない。
    //   管理者は確認ダイアログを経たうえで新規ルームとして作成できる。
    const exists = await roomExists(target);
    if (!exists) {
      if (!isAdmin) {
        showAlert('このルームは存在しません。\nルーム名（合言葉）を確認するか、管理者にルームの作成を依頼してください。');
        return;
      }
      showConfirm(`ルーム「${target}」はまだ存在しません。\n管理者として新規ルームを作成しますか？`, () => {

    // v3.11 fix: 既存ルームへの切替時も、合言葉の入力ミスで意図しない別の部屋に

    showConfirm(`これから「${target}」というルームに入ります。\n（現在は「${roomKey}」のルームを開いています）\n\n合言葉が合っているか、もう一度確認してください。\nこのルームに入ってよろしいですか？`, () => {
      localStorage.setItem('school_room_key', target);
      setRoomKey(target);
      setIsConfigOpen(false);
    });
  };

  // v3.7: 作成された全ルーム名の一覧取得（ローカル + クラウド）と、@kirari パスワードでのルーム切替。
  //        ローカルは localStorage の "local_students_*" キーから、クラウドは rooms コレクションを get() で列挙する。
  const fetchAllRooms = useCallback(async () => {
    setIsLoadingRooms(true);
    try {
      const rooms = new Set();
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith('local_students_')) rooms.add(k.replace('local_students_', ''));
      }
      // v3.7: 過去に開いたルームの履歴も一覧に含める
      try {
        const visited = JSON.parse(localStorage.getItem('visited_rooms') || '[]');
        if (Array.isArray(visited)) visited.forEach((r) => { if (r) rooms.add(r); });
      } catch (e) {}
      if (connectionStatus === 'connected' && window.firebase) {
        try {
          const db = window.firebase.app().firestore();
          const snap = await db.collection('rooms').get();
          snap.forEach((doc) => rooms.add(doc.id));
        } catch (e) { console.warn('rooms list error:', e.message); }
      }
      if (roomKey) rooms.add(roomKey);
      setAvailableRooms(Array.from(rooms).sort());
    } catch (e) {
      showAlert('ルーム一覧の取得に失敗しました: ' + e.message);
    } finally {
      setIsLoadingRooms(false);
    }
  }, [connectionStatus, roomKey, showAlert]);

  const handleConfirmRoomSwitch = async (e) => {
    e.preventDefault();
    if (String(roomSwitchPassword || '').trim() !== '@kirari') {
      setRoomSwitchError('パスワードが違います。');
      return;
    }
    const target = roomSwitchTarget;
    if (!target) return;
    // v3.10 fix: 一覧から選んだルームでも、念のため存在を再確認。
    //   一般利用者には存在しないルームへの切替（＝新規作成）を許可しない。
    const exists = await roomExists(target);
    if (!exists && !isAdmin) {
      setRoomSwitchError('このルームは存在しません。');
      return;
    }
    setRoomSwitchTarget(null);
    setRoomSwitchPassword('');
    setRoomSwitchError('');
    localStorage.setItem('school_room_key', target);
    setTempRoomKey(target);
    setRoomKey(target);
    setIsConfigOpen(false);
  };

  // v3.7: 訪問したルーム名を localStorage に履歴として記録する。これにより、別のルームに切り替えても以前いたルームを一覧に表示できる。
  useEffect(() => {
    if (!roomKey) return;
    try {
      const arr = JSON.parse(localStorage.getItem('visited_rooms') || '[]');
      const set = new Set(Array.isArray(arr) ? arr : []);
      set.add(roomKey);
      localStorage.setItem('visited_rooms', JSON.stringify(Array.from(set)));
    } catch (e) {
      try { localStorage.setItem('visited_rooms', JSON.stringify([roomKey])); } catch (e2) {}
    }
  }, [roomKey]);

  // v3.7: クラウド接続したらマーカードキュメントを書き込み、後でルーム一覧から見つけられるようにする。
  useEffect(() => {
    if (connectionStatus !== 'connected' || !window.firebase) return;
    try {
      const db = window.firebase.app().firestore();
      db.collection('rooms').doc(roomKey).set({
        lastSeen: window.firebase.firestore.FieldValue.serverTimestamp(),
        name: roomKey
      }, { merge: true }).catch(() => {});
    } catch (e) {}
  }, [connectionStatus, roomKey]);

  // 環境設定モーダルを開いたら、ルーム一覧を自動取得する。
  useEffect(() => {
    if (isConfigOpen) fetchAllRooms();
  }, [isConfigOpen, fetchAllRooms]);

  // v3.6: 環境設定モーダルから「過去データを一括削除」する。パスワード「@kirari」必須。
  //        クラウド接続中なら Firestore のドキュメントをバッチ削除、ローカルなら localStorage を消去。
  const handleWipeAllData = (password) => {
    if (String(password || '').trim() !== '@kirari') {
      showAlert('パスワードが違います。正しいパスワードを入力してください。');
      return;
    }
    showConfirm(`本当にこのルーム「${roomKey}」の過去データをすべて削除しますか？この操作は取り消せません（Undo不可）。`, async () => {
      setIsLoading(true);
      try {
        if (connectionStatus === 'connected' && window.firebase) {
          const db = window.firebase.app().firestore();
          const snap = await db.collection('rooms').doc(roomKey).collection('students').get();
          const docs = snap.docs;
          const batchSize = 400;
          for (let i = 0; i < docs.length; i += batchSize) {
            const batch = db.batch();
            docs.slice(i, i + batchSize).forEach((d) => batch.delete(d.ref));
            await batch.commit();
          }
          showAlert(`クラウド上の${docs.length}件の生徒データを削除しました。`);
        } else {
          const count = students.length;
          localStorage.removeItem(`local_students_${roomKey}`);
          setStudents([]);
          showAlert(`ローカル保存の${count}件の生徒データを削除しました。`);
        }
        setSelectedIds(new Set());
        setIsConfigOpen(false);
      } catch (e) {
        showAlert(`一括削除に失敗しました: ${e.message}`);
      } finally {
        setIsLoading(false);
      }
    });
  };

  const resetConfig = () => {
    showConfirm('接続情報を削除してローカルのお試しデモモードに戻しますか？', () => {
      localStorage.removeItem('school_firebase_config');
      setFirebaseConfigStr('');
      setIsConfigOpen(false);
    });
  };

  useEffect(() => {
    if (myTeacherName) localStorage.setItem('my_teacher_name', myTeacherName);
    else localStorage.removeItem('my_teacher_name');
  }, [myTeacherName]);

  // クラウド接続したときに編集者名が空なら自動でモーダルを開く
  useEffect(() => {
    if (connectionStatus === 'connected' && !myTeacherName) {
      setTempTeacherName('');
      setIsNamePromptOpen(true);
    }
  }, [connectionStatus, myTeacherName]);

  // ========== ドラッグ＆ドロップ / 貼り付けで config.js を取り込む（v3.5〜） ==========
  useEffect(() => {
    const applyConfigObject = (obj, sourceLabel) => {
      try {
        const json = JSON.stringify(obj);
        setFirebaseConfigStr(json);
        localStorage.setItem('school_firebase_config', json);
        setConfigDropOverlay('success');
        setConfigDropMessage(`${sourceLabel} から Firebase 接続情報を読み込みました。クラウド接続を開始します。`);
        setIsConfigOpen(false);
        setTimeout(() => setConfigDropOverlay(null), 3500);
      } catch (e) {
        setConfigDropOverlay('error');
        setConfigDropMessage('接続情報の適用に失敗しました: ' + e.message);
        setTimeout(() => setConfigDropOverlay(null), 4500);
      }
    };
    const readFile = (file) => {
      if (!file) return;
      const name = file.name || 'ファイル';
      const reader = new FileReader();
      reader.onload = () => {
        const text = String(reader.result || '');
        const obj = parseFirebaseConfigText(text);
        if (obj) applyConfigObject(obj, `「${name}」`);
        else {
          setConfigDropOverlay('error');
          setConfigDropMessage(`「${name}」から Firebase 接続情報を読み取れませんでした。Firebase Console でコピーした config を含む .js / .json / .txt ファイルを指定してください。`);
          setTimeout(() => setConfigDropOverlay(null), 5500);
        }
      };
      reader.onerror = () => {
        setConfigDropOverlay('error');
        setConfigDropMessage('ファイルの読み込みに失敗しました。');
        setTimeout(() => setConfigDropOverlay(null), 4000);
      };
      reader.readAsText(file, 'UTF-8');
    };
    // 「config.js を読み込む」ボタンや環境設定ポップアップ内のファイル選択から呼べるよう window に公開。
    // v3.6: 画面全体へのドラッグ＆ドロップ / 自動貼り付け取り込みは廃止。
    //       config の貼り付け・ファイル読み込みは「環境設定」ポップアップ内のみで完結する。
    window.__loadConfigFromFile = readFile;
    window.__applyConfigFromText = (text, label) => {
      const obj = parseFirebaseConfigText(text);
      if (obj) { applyConfigObject(obj, label || 'クリップボード'); return true; }
      return false;
    };
    return () => {
      delete window.__loadConfigFromFile;
      delete window.__applyConfigFromText;
    };
  }, []);

  useEffect(() => {
    try { setCustomOrder(JSON.parse(localStorage.getItem('list_custom_order_' + roomKey) || '{}')); }
    catch (e) { setCustomOrder({}); }
    // v3.17: ルーム切替時も、次にデータを読み込んだ時点で全セクションを畳む
    collapsedInitializedRoomRef.current = null;
    setCollapsedSections(new Set());
  }, [roomKey]);

  const sortByCustomOrder = (list, gradeKey) => {
    const arr = customOrder[gradeKey] || [];
    return [...list].sort((a, b) => { const ia = arr.indexOf(a.id); const ib = arr.indexOf(b.id); if (ia === -1 && ib === -1) return 0; if (ia === -1) return 1; if (ib === -1) return -1; return ia - ib; });
  };

  const reorderListRow = (sectionKey, draggedId, targetId) => {
    if (!draggedId || draggedId === targetId) return;
    let sectionAll;
    if (sectionKey === 'other') {
      sectionAll = students.filter((s) => !['1','2','3'].includes(s.grade));
    } else if (sectionKey.endsWith('-_nocls')) {
      const g = sectionKey.split('-')[0];
      sectionAll = students.filter((s) => s.grade === g && !s.classVal);
    } else {
      const [g, c] = sectionKey.split('-');
      sectionAll = students.filter((s) => s.grade === g && s.classVal === c);
    }
    const currentArr = customOrder[sectionKey] || [];
    let ordered = sectionAll.map((s) => s.id).sort((a, b) => { const ia = currentArr.indexOf(a); const ib = currentArr.indexOf(b); if (ia === -1 && ib === -1) return 0; if (ia === -1) return 1; if (ib === -1) return -1; return ia - ib; });
    if (!ordered.includes(draggedId)) return;
    ordered = ordered.filter((id) => id !== draggedId);
    const ti = ordered.indexOf(targetId);
    if (ti === -1) ordered.push(draggedId); else ordered.splice(ti, 0, draggedId);
    const next = { ...customOrder, [sectionKey]: ordered };
    setCustomOrder(next);
    try { localStorage.setItem('list_custom_order_' + roomKey, JSON.stringify(next)); } catch (e) {}
  };

  const filteredStudents = useMemo(() => {
    const q = searchQuery.trim().toLowerCase();
    return students.filter((s) => {
      const matchSearch = !q ||
        s.name.toLowerCase().includes(q) ||
        s.location.toLowerCase().includes(q) ||
        (s.internshipDates && s.internshipDates.some((d) => d.includes(q))) ||
        (s.teacher && s.teacher.toLowerCase().includes(q)) ||
        (s.grade && `${s.grade}年`.includes(q)) ||
        (s.classVal && `${s.classVal}組`.includes(q));

      if (!matchSearch) return false;
      // v3.6: myTeacherName は「編集者名（あなたの名前）」として使うため、担当教員フィルターとしては使わない。
      // 「自分の担当生徒だけ表示」したい場合は上部の検索欄や今後追加のフィルターを使う。

      switch (filterProgress) {
        case 'phone_pending':    if (s.phoneStatus && s.phoneStatus !== 'pending') return false; break;
        case 'doc_pending':      if (s.docStatus && s.docStatus !== 'pending') return false; break;
        case 'greeting_pending': if (s.greetingStatus === 'completed') return false; break;
        case 'patrol_pending':   if ((s.patrols || []).length > 0 && (s.patrols || []).every((p) => p.done)) return false; break;
        case 'internship_in_progress': if (!(s.internshipDates || []).includes(getTodayString())) return false; break;
        case 'student_thankyou_pending': if ((s.studentThankYouStatus || 'pending') !== 'pending') return false; break;
        case 'teacher_thankyou_pending': if ((s.teacherThankYouStatus || 'pending') !== 'pending') return false; break;
        default: break;
      }

      if (filterGrade !== 'all' && s.grade !== filterGrade) return false;
      if (filterClass !== 'all' && s.classVal !== filterClass) return false;
      if (filterInternshipType !== 'all' && (s.internshipType || 'internship') !== filterInternshipType) return false;
      if (filterPhoneStatus !== 'all' && (s.phoneStatus || 'pending') !== filterPhoneStatus) return false;
      if (filterDocStatus !== 'all' && (s.docStatus || 'pending') !== filterDocStatus) return false;
      if (filterGreetingStatus !== 'all' && (s.greetingStatus || 'pending') !== filterGreetingStatus) return false;
      if (filterPatrolStatus !== 'all') { const ps = s.patrols || []; const hasUnchecked = ps.some((p) => !p.done); const allDone = ps.length > 0 && !hasUnchecked; if (filterPatrolStatus === 'pending' && !(ps.length === 0 || hasUnchecked)) return false; if (filterPatrolStatus === 'completed' && !allDone) return false; }
      if (filterStudentThankYouStatus !== 'all' && (s.studentThankYouStatus || 'pending') !== filterStudentThankYouStatus) return false;
      if (filterTeacherThankYouStatus !== 'all' && (s.teacherThankYouStatus || 'pending') !== filterTeacherThankYouStatus) return false;

      return true;
    });
  }, [students, searchQuery, filterProgress, filterGrade, filterClass,
      filterPhoneStatus, filterDocStatus, filterGreetingStatus, filterPatrolStatus,
      filterStudentThankYouStatus, filterTeacherThankYouStatus, filterInternshipType]);

  const stats = useMemo(() => {
    const total = students.length;
    if (total === 0) return {
      total: 0, phonePercent: 0, docPercent: 0, greetingPercent: 0, patrolPercent: 0,
      phonePendingCount: 0, docPendingCount: 0, greetingPendingCount: 0, patrolPendingCount: 0,
      internshipImplPercent: 0, internshipInProgressCount: 0,
      studentThankYouPercent: 0, studentThankYouPendingCount: 0,
      teacherThankYouPercent: 0, teacherThankYouPendingCount: 0
    };
    const todayKey = getTodayString();
    const phoneNeeded = students.filter((s) => (s.phoneStatus || 'pending') !== 'none').length;
    const phoneDone = students.filter((s) => s.phoneStatus === 'completed').length;
    const docNeeded = students.filter((s) => (s.docStatus || 'pending') !== 'none').length;
    const docDone = students.filter((s) => s.docStatus === 'completed').length;
    const greetingNeeded = students.filter((s) => (s.greetingStatus || 'pending') !== 'none').length;
    const greetingDone = students.filter((s) => s.greetingStatus === 'completed').length;
    const patrolNeeded = students.filter((s) => (s.patrols || []).length > 0).length;
    const patrolDone = students.filter((s) => { const ps = s.patrols || []; return ps.length > 0 && ps.every((p) => p.done); }).length;
    const internshipNeeded = students.filter((s) => (s.internshipDates || []).length > 0).length;
    const internshipImplDone = students.filter((s) => { const dates = s.internshipDates || []; if (dates.length === 0) return false; const last = [...dates].sort().pop(); return last < todayKey; }).length;
    const internshipInProgressCount = students.filter((s) => (s.internshipDates || []).includes(todayKey)).length;
    const studentTYNeeded = students.filter((s) => (s.studentThankYouStatus || 'pending') !== 'none').length;
    const studentTYDone = students.filter((s) => s.studentThankYouStatus === 'completed').length;
    const teacherTYNeeded = students.filter((s) => (s.teacherThankYouStatus || 'pending') !== 'none').length;
    const teacherTYDone = students.filter((s) => s.teacherThankYouStatus === 'completed').length;
    return {
      total,
      phonePercent:    phoneNeeded > 0 ? Math.round((phoneDone / phoneNeeded) * 100) : 0,
      docPercent:      docNeeded > 0 ? Math.round((docDone / docNeeded) * 100) : 0,
      greetingPercent: greetingNeeded > 0 ? Math.round((greetingDone / greetingNeeded) * 100) : 0,
      patrolPercent:   patrolNeeded > 0 ? Math.round((patrolDone / patrolNeeded) * 100) : 0,
      phonePendingCount:    students.filter((s) => s.phoneStatus === 'pending').length,
      docPendingCount:      students.filter((s) => s.docStatus   === 'pending').length,
      greetingPendingCount: students.filter((s) => s.greetingStatus === 'pending' || s.greetingStatus === 'scheduled').length,
      patrolPendingCount:   students.filter((s) => (s.patrols || []).some((p) => !p.done)).length,
      internshipImplPercent: internshipNeeded > 0 ? Math.round((internshipImplDone / internshipNeeded) * 100) : 0,
      internshipInProgressCount,
      studentThankYouPercent: studentTYNeeded > 0 ? Math.round((studentTYDone / studentTYNeeded) * 100) : 0,
      studentThankYouPendingCount: students.filter((s) => (s.studentThankYouStatus || 'pending') === 'pending').length,
      teacherThankYouPercent: teacherTYNeeded > 0 ? Math.round((teacherTYDone / teacherTYNeeded) * 100) : 0,
      teacherThankYouPendingCount: students.filter((s) => (s.teacherThankYouStatus || 'pending') === 'pending').length
    };
  }, [students]);

  const uniqueTeachers = useMemo(() => {
    const set = new Set();
    students.forEach((s) => { if (s.teacher) set.add(s.teacher); });
    return Array.from(set);
  }, [students]);

  const calendarDays = useMemo(() => {
    const firstDayIndex = new Date(calendarYear, calendarMonth, 1).getDay();
    const numberOfDays = new Date(calendarYear, calendarMonth + 1, 0).getDate();
    const prevMonthDays = new Date(calendarYear, calendarMonth, 0).getDate();
    const days = [];
    for (let i = firstDayIndex - 1; i >= 0; i--) {
      days.push({
        day: prevMonthDays - i,
        month: calendarMonth === 0 ? 11 : calendarMonth - 1,
        year: calendarMonth === 0 ? calendarYear - 1 : calendarYear,
        isCurrentMonth: false
      });
    }
    for (let i = 1; i <= numberOfDays; i++) {
      days.push({ day: i, month: calendarMonth, year: calendarYear, isCurrentMonth: true });
    }
    const remaining = 42 - days.length;
    for (let i = 1; i <= remaining; i++) {
      days.push({
        day: i,
        month: calendarMonth === 11 ? 0 : calendarMonth + 1,
        year: calendarMonth === 11 ? calendarYear + 1 : calendarYear,
        isCurrentMonth: false
      });
    }
    return days;
  }, [calendarYear, calendarMonth]);

  const getEventsForDate = (year, month, day) => {
    const target = formatDateKey(year, month, day);
    const events = [];
    filteredStudents.forEach((student) => {
      if ((calendarFilter === 'all' || calendarFilter === 'student') && student.greetingDate === target) {
        events.push({
          type: 'greeting',
          label: `挨拶: ${student.name} (${student.greetingTime || '時間未定'})`,
          student,
          color: student.greetingStatus === 'completed'

            : 'bg-green-200 border-green-400 text-green-900 hover:bg-green-300'
        });
      }
      if (calendarFilter === 'teacher' || calendarFilter === 'all') {
        (student.patrols || []).forEach((p) => {
          if (p.date !== target) return;
          events.push({
            type: 'patrol',
            label: `巡回: ${student.name}${p.teacher ? ' / ' + p.teacher : ''}${p.time ? ` (${p.time})` : ''}`,
            student,
            color: p.done
              ? 'bg-blue-300 border-blue-500 text-blue-900 hover:bg-blue-400'
              : 'bg-blue-200 border-blue-400 text-blue-900 hover:bg-blue-300'
          });
        });
      }
      const info = computeInternshipDayInfo(student, target);
      if (info && (calendarFilter === 'student' || calendarFilter === 'all')) {
        const isObs = student.internshipType === 'observation';
        const color = isObs
          ? 'bg-pink-100 border-pink-300 text-pink-900 hover:bg-pink-200'
          : 'bg-yellow-100 border-yellow-300 text-yellow-900 hover:bg-yellow-200';
        const patrolsOnDay = (student.patrols || []).filter((p) => p.date === target);
        const patrolNames = patrolsOnDay.map((p) => p.teacher).filter(Boolean);
        const tipLines = [`${student.name}　${info.dayNumber}／${info.totalDays}（${student.location}）`];
        if (student.teacher) tipLines.push(`同行: ${student.teacher}`);
        if (patrolNames.length > 0) tipLines.push(`巡回: ${patrolNames.join('、')}`);
        events.push({
          type: 'period',
          label: `${student.name}　${info.dayNumber}／${info.totalDays}（${student.location}）`,
          title: tipLines.join('\n'),
          student,
          color,
          dateKey: target
        });
      }
    });
    return events;
  };

  const hasPeriodEventOnDate = (year, month, day) => {

    setFilterPhoneStatus('all'); setFilterDocStatus('all');
    setFilterGreetingStatus('all'); setFilterPatrolStatus('all');
    setFilterStudentThankYouStatus('all'); setFilterTeacherThankYouStatus('all'); setFilterInternshipType('all');

    filterGrade !== 'all' || filterClass !== 'all' ||

    filterStudentThankYouStatus !== 'all' || filterTeacherThankYouStatus !== 'all' || filterInternshipType !== 'all';

  const handleExportExcel = () => {
    if (filteredStudents.length === 0) {
      showAlert('出力対象の生徒データがありません。');

    }
    const headers = [
      '生徒氏名', '学年', '組', '担当教員', '実習先企業・事業所名', '実習日数', '実習日（スラッシュ区切り）',
