const getTodayString = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};

const formatDateKey = (year, month, day) =>

const formatShortDate = (yyyymmdd) => {
  if (!yyyymmdd) return '';
  const m = String(yyyymmdd).match(/^\d{4}-(\d{2})-(\d{2})/);
  return m ? `${parseInt(m[1], 10)}／${parseInt(m[2], 10)}` : yyyymmdd;
};

const loadFirebaseSDK = () => new Promise((resolve, reject) => {
  if (window.firebase) return resolve(window.firebase);
  const urls = [
    'https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js',
    'https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js',
    'https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js'
  ];
  const load = (i) => {
    if (i >= urls.length) return resolve(window.firebase);
    const s = document.createElement('script');
    s.src = urls[i];
    s.onload = () => load(i + 1);
    s.onerror = () => reject(new Error(`Firebase SDK の読み込みに失敗しました: ${urls[i]}`));
    document.head.appendChild(s);
  };
  load(0);
});

const nextStatus = (stepKey, currentStatus) => {

const buildStepUpdate = (stepKey, newStatus) => {

  const update = { [cfg.field]: newStatus };
  if (cfg.dateField) {

  }
  return update;
};

const computeInternshipDayInfo = (student, target) => {
  const dates = student.internshipDates || [];
  if (!dates.includes(target)) return null;

// 貼り付け / ドロップされたテキストから Firebase config オブジェクトを抽出する。
// JSON / JS のオブジェクトリテラル / "window.FIREBASE_CONFIG = {...}" / "const firebaseConfig = {...}" 形式に対応。
const parseFirebaseConfigText = (text) => {
  if (!text) return null;
  const trimmed = String(text).trim();
  if (!trimmed) return null;
  const isLikelyConfig = (o) => o && typeof o === 'object' && !Array.isArray(o) && (o.apiKey || o.projectId || o.appId);
  // 1) そのまま JSON として
  try {
    const obj = JSON.parse(trimmed);
    if (isLikelyConfig(obj)) return obj;
  } catch (e) {}
  // 2) 最初の { から最後の } までを切り出して評価
  const start = trimmed.indexOf('{');
  const end = trimmed.lastIndexOf('}');
  if (start !== -1 && end > start) {
    const body = trimmed.slice(start, end + 1);
    try {
      const obj = JSON.parse(body);
      if (isLikelyConfig(obj)) return obj;
    } catch (e) {}
    try {
      // JS オブジェクトリテラル（クォート無しキー / シングルクォート等）にも対応
      const obj = new Function('"use strict"; return (' + body + ');')();
      if (isLikelyConfig(obj)) return obj;
    } catch (e) {}
  }
  return null;
};

function useFirestoreSync(firebaseConfigStr, roomKey) {
  const [students, setStudents] = useState([]);
  const [isLoading, setIsLoading] = useState(true);
  const [connectionStatus, setConnectionStatus] = useState('local');
  const [connectionError, setConnectionError] = useState('');
  const unsubscribeRef = useRef(null);

  useEffect(() => {
    let active = true;

    const loadLocal = () => {
      const stored = localStorage.getItem(`local_students_${roomKey}`);
      try {
        if (stored) {
          setStudents(JSON.parse(stored));
        } else {
          setStudents(MOCK_STUDENTS);
          localStorage.setItem(`local_students_${roomKey}`, JSON.stringify(MOCK_STUDENTS));
        }
      } catch {
        setStudents(MOCK_STUDENTS);
      }
    };

    const init = async () => {
      setIsLoading(true);
      setConnectionError('');

      if (!firebaseConfigStr.trim()) {
        if (!active) return;
        loadLocal();
        setConnectionStatus('local');
        setIsLoading(false);
        return;
      }

      try {
        setConnectionStatus('connecting');
        let configObj;
        try { configObj = JSON.parse(firebaseConfigStr); }
        catch { throw new Error('Configの形式(JSON)が正しくありません。'); }

        const fb = await loadFirebaseSDK();
        const app = fb.apps.length ? fb.app() : fb.initializeApp(configObj);
        const db = app.firestore();
        await app.auth().signInAnonymously();

        if (unsubscribeRef.current) unsubscribeRef.current();

        const queryRef = db.collection('rooms').doc(roomKey).collection('students');
        unsubscribeRef.current = queryRef.onSnapshot(
          (snap) => {
            if (!active) return;
            const list = [];
            snap.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
            setStudents(list);
            setConnectionStatus('connected');
            setIsLoading(false);
            setConnectionError('');
          },
          (error) => {
            if (!active) return;
            setConnectionStatus('error');
            setConnectionError(`Firestoreへのアクセスに失敗しました。ルール等を確認してください。(詳細: ${error.message})`);
            setIsLoading(false);
          }
        );
      } catch (err) {
        if (!active) return;
        setConnectionStatus('error');
        setConnectionError(err.message || 'Firebaseの接続に失敗しました。');
        setIsLoading(false);
        loadLocal();
      }
    };

    init();
    return () => {
      active = false;
      if (unsubscribeRef.current) unsubscribeRef.current();
    };
  }, [firebaseConfigStr, roomKey]);

  return { students, setStudents, isLoading, setIsLoading, connectionStatus, connectionError };
}

function useHistory(limit = 30) {
  const [history, setHistory] = useState([]);
  const [redo, setRedo] = useState([]);

  const push = useCallback((entry) => {
    setHistory((prev) => {
      const next = [...prev, entry];
      if (next.length > limit) next.shift();
      return next;
    });
    setRedo([]);
  }, [limit]);

  const popUndo = useCallback(() => {
    if (!history.length) return null;
    const last = history[history.length - 1];
    setHistory((h) => h.slice(0, -1));
    setRedo((r) => {
      const next = [...r, last];
      if (next.length > limit) next.shift();
      return next;
    });
    return last;
  }, [history, limit]);

  const popRedo = useCallback(() => {
    if (!redo.length) return null;
    const last = redo[redo.length - 1];
    setRedo((r) => r.slice(0, -1));
    setHistory((h) => {
      const next = [...h, last];
      if (next.length > limit) next.shift();
      return next;
    });
    return last;
  }, [redo, limit]);

  return { history, redo, push, popUndo, popRedo };
}

function useDialog() {
  const [alertState, setAlertState] = useState(null);
  const [confirmState, setConfirmState] = useState(null);

  const showAlert = useCallback((message) => setAlertState({ message }), []);
  const showConfirm = useCallback((message, onConfirm) => {
    setConfirmState({
      message,
      onConfirm: () => { onConfirm(); setConfirmState(null); },
      onCancel: () => setConfirmState(null)
    });
  }, []);
  const closeAlert = useCallback(() => setAlertState(null), []);

  return { alertState, confirmState, showAlert, showConfirm, closeAlert };
}

// =============================================================================
// usePresence: rooms/{roomKey}/presence/{sessionId} にハートビートを書き、
// 直近60秒以内に更新されたドキュメントを「接続中」とカウントする。
// =============================================================================
function usePresence(connectionStatus, roomKey, teacherName) {
  const [onlineMembers, setOnlineMembers] = useState([]);
  const sessionIdRef = useRef(null);
  const teacherNameRef = useRef(teacherName);

  useEffect(() => { teacherNameRef.current = teacherName; }, [teacherName]);

  useEffect(() => {
    if (connectionStatus !== 'connected' || !window.firebase) {
      setOnlineMembers([]);
      return;
    }
    if (!sessionIdRef.current) {
      sessionIdRef.current = (typeof localStorage !== 'undefined' && localStorage.getItem('presence_session_id')) || ('sess-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10)); try { localStorage.setItem('presence_session_id', sessionIdRef.current); } catch (e) {}
    }
    const sessionId = sessionIdRef.current;
    const db = window.firebase.app().firestore();
    const presenceRef = db.collection('rooms').doc(roomKey).collection('presence').doc(sessionId);
    const collectionRef = db.collection('rooms').doc(roomKey).collection('presence');

    const writeHeartbeat = async () => {
      try {
        await presenceRef.set({
          lastSeen: window.firebase.firestore.FieldValue.serverTimestamp(),
          teacherName: teacherNameRef.current || '匿名',
          ua: (navigator.userAgent || '').slice(0, 80)
        }, { merge: true });
      } catch (e) {
        console.warn('presence heartbeat failed:', e.message);
      }
    };

    writeHeartbeat();
    const heartbeatInterval = setInterval(writeHeartbeat, 25000);

    // 接続を見離したセッションを期限切れとして表示から隠すための定期再検証
    const recountInterval = setInterval(() => {
      setOnlineMembers((prev) => {
        const now = Date.now();
        return prev.filter((m) => now - m.lastSeen < 60000);
      });
    }, 15000);

    const unsubscribe = collectionRef.onSnapshot((snap) => {
      const now = Date.now();
      const members = [];
      snap.forEach((doc) => {
        const data = doc.data();
        const lastSeen = data.lastSeen?.toMillis ? data.lastSeen.toMillis() : 0;
        if (lastSeen && now - lastSeen < 60000) {
          members.push({
            id: doc.id,
            teacherName: data.teacherName || '匿名',
            lastSeen,
            isSelf: doc.id === sessionId
          });
        }
      });
      members.sort((a, b) => b.lastSeen - a.lastSeen); const dedupMap = new Map(); for (const m of members) { const key = String(m.teacherName || '').trim() || ('__id__' + m.id); if (m.isSelf) dedupMap.set(key, m); else if (!dedupMap.has(key)) dedupMap.set(key, m); } members.length = 0; for (const m of dedupMap.values()) members.push(m); members.sort((a, b) => (Number(b.isSelf) - Number(a.isSelf)) || String(a.teacherName).localeCompare(String(b.teacherName), 'ja'));
      setOnlineMembers(members);
    }, (err) => {
      console.warn('presence snapshot error:', err.message);
    });

    const cleanup = () => {
      try { presenceRef.delete().catch(() => {}); } catch (e) {}
    };
    const onUnload = () => cleanup();
    window.addEventListener('beforeunload', onUnload);
    window.addEventListener('pagehide', onUnload);

    return () => {
      clearInterval(heartbeatInterval);
      clearInterval(recountInterval);
      unsubscribe();
      cleanup();
      window.removeEventListener('beforeunload', onUnload);
      window.removeEventListener('pagehide', onUnload);
    };
  }, [connectionStatus, roomKey]);

  return { onlineCount: onlineMembers.length, onlineMembers };
}

// =============================================================================
// useBoardSync: 画面上部の掲示板。rooms/{roomKey}/board コレクションを
// 購読、接続中はリアルタイム同期、ローカル時は localStorage を使う。
// =============================================================================
function useBoardSync(connectionStatus, roomKey) {
  const [posts, setPosts] = useState([]);
  const unsubRef = useRef(null);

  useEffect(() => {
    try {
      const stored = localStorage.getItem('local_board_' + roomKey);
      setPosts(stored ? JSON.parse(stored) : []);
    } catch (e) { setPosts([]); }

    if (connectionStatus === 'connected' && window.firebase) {
      const db = window.firebase.app().firestore();
      const ref = db.collection('rooms').doc(roomKey).collection('board').orderBy('createdAt', 'desc').limit(50);
      if (unsubRef.current) unsubRef.current();
      unsubRef.current = ref.onSnapshot((snap) => {
        const list = [];
        snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
        setPosts(list);
      }, (err) => { console.warn('board snapshot:', err.message); });
    }

    return () => { if (unsubRef.current) { unsubRef.current(); unsubRef.current = null; } };
  }, [connectionStatus, roomKey]);

  const addPost = async (author, message) => {
    if (connectionStatus === 'connected' && window.firebase) {
      try {
        const db = window.firebase.app().firestore();
        await db.collection('rooms').doc(roomKey).collection('board').add({ author: author || '匿名', message, createdAt: window.firebase.firestore.FieldValue.serverTimestamp() });
        return;
      } catch (e) { console.warn('board add failed:', e.message); }
    }
    setPosts((prev) => {
      const next = [{ id: 'local-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6), author: author || '匿名', message, createdAt: Date.now() }, ...prev];
      try { localStorage.setItem('local_board_' + roomKey, JSON.stringify(next.slice(0, 50))); } catch (e) {}
      return next.slice(0, 50);
    });
  };

  const deletePost = async (postId) => {
    if (connectionStatus === 'connected' && window.firebase && !String(postId).startsWith('local-')) {
      try {
        const db = window.firebase.app().firestore();
        await db.collection('rooms').doc(roomKey).collection('board').doc(postId).delete();
        return;
      } catch (e) { console.warn('board delete failed:', e.message); }
    }
    setPosts((prev) => {
      const next = prev.filter((p) => p.id !== postId);
      try { localStorage.setItem('local_board_' + roomKey, JSON.stringify(next)); } catch (e) {}
      return next;
    });
  };

  return { posts, addPost, deletePost };
}

const ConnectionBadge = ({ status, roomKey }) => {

  const gateFile = (action) => { if (typeof window.__requestFileUnlock === 'function') window.__requestFileUnlock(action); else action(); };

      return;

    reader.onload = () => {
      onAdd({ name: file.name, kind: 'file', dataUrl: reader.result, mimeType: file.type, size: file.size });
      if (fileInputRef.current) fileInputRef.current.value = '';

const DatePickerModal = ({ value, title, onSelect, onClose, allowClear = true }) => {
  const initial = value ? new Date(value + 'T00:00:00') : new Date();
  const [year, setYear] = useState(initial.getFullYear());
  const [month, setMonth] = useState(initial.getMonth());

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const prevMonthDays = new Date(year, month, 0).getDate();
  const cells = [];
  for (let i = firstDay - 1; i >= 0; i--) cells.push({ day: prevMonthDays - i, isCurrent: false, y: month === 0 ? year - 1 : year, m: month === 0 ? 11 : month - 1 });
  for (let i = 1; i <= daysInMonth; i++) cells.push({ day: i, isCurrent: true, y: year, m: month });
  const rem = 42 - cells.length;
  for (let i = 1; i <= rem; i++) cells.push({ day: i, isCurrent: false, y: month === 11 ? year + 1 : year, m: month === 11 ? 0 : month + 1 });

  const today = new Date();
  const todayKey = formatDateKey(today.getFullYear(), today.getMonth(), today.getDate());

  const handlePrev = () => { if (month === 0) { setYear(year - 1); setMonth(11); } else setMonth(month - 1); };
  const handleNext = () => { if (month === 11) { setYear(year + 1); setMonth(0); } else setMonth(month + 1); };

  return (
    <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm" onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} className="bg-white border border-slate-200 rounded-2xl shadow-2xl max-w-sm w-full overflow-hidden animate-scaleIn">
        <div className="px-5 py-3 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
          <h3 className="text-sm font-bold text-slate-900 flex items-center gap-2">
            <Calendar className="w-4 h-4 text-indigo-600" />
            <span>{title || '日付を選択'}</span>
          </h3>
          <button type="button" onClick={onClose} className="text-slate-400 hover:text-slate-900 font-bold text-xl cursor-pointer">×</button>
        </div>

        <div className="p-4">
          <div className="flex items-center justify-between mb-3">
            <button type="button" onClick={handlePrev} className="p-1.5 hover:bg-slate-100 bg-white border border-slate-200 rounded-lg text-slate-700 transition-all cursor-pointer">
              <ChevronLeft className="w-4 h-4" />
            </button>
            <span className="text-sm font-bold text-slate-900">{year}年 {month + 1}月</span>
            <button type="button" onClick={handleNext} className="p-1.5 hover:bg-slate-100 bg-white border border-slate-200 rounded-lg text-slate-700 transition-all cursor-pointer">
              <ChevronRight className="w-4 h-4" />
            </button>
          </div>

          <div className="grid grid-cols-7 text-center text-[10px] font-bold text-slate-500 mb-1 select-none">
            <div className="text-rose-500">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div className="text-sky-500">土</div>
          </div>

          <div className="grid grid-cols-7 gap-1">
            {cells.map((c, i) => {
              const key = formatDateKey(c.y, c.m, c.day);
              const isToday = key === todayKey;
              const isSelected = key === value;
              const dow = i % 7;
              const palette = isSelected ? 'bg-indigo-600 text-white shadow-sm' : isToday ? 'bg-indigo-50 text-indigo-700 border border-indigo-200' : c.isCurrent ? (dow === 0 ? 'text-rose-600 hover:bg-rose-50' : dow === 6 ? 'text-sky-600 hover:bg-sky-50' : 'text-slate-800 hover:bg-slate-100') : 'text-slate-300 hover:bg-slate-50';
              return (
                <button key={i} type="button" onClick={() => { onSelect(key); onClose(); }} className={`aspect-square text-xs font-bold rounded-lg transition-all cursor-pointer ${palette}`}>
                  {c.day}
                </button>
              );
            })}
          </div>
        </div>

        <div className="px-5 py-3 bg-slate-50 border-t border-slate-200 flex justify-between gap-2">
          <button type="button" onClick={() => { onSelect(todayKey); onClose(); }}
            className="px-3 py-1.5 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 rounded-lg text-xs font-bold cursor-pointer">今日</button>
          <div className="flex gap-2">
            {allowClear && value && (
              <button type="button" onClick={() => { onSelect(''); onClose(); }}
                className="px-3 py-1.5 bg-white border border-rose-200 hover:bg-rose-50 text-rose-700 rounded-lg text-xs font-bold cursor-pointer">クリア</button>
            )}
            <button type="button" onClick={onClose}
              className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold cursor-pointer">閉じる</button>
          </div>
        </div>
      </div>
    </div>
  );
};

const BulkImportModal = ({ onClose, onCommit, onAlert, defaultTeacher }) => {
  const HEADERS = ['氏名','学年','組','担当教員','実習先','種別','実習日','事前電話','お知らせ','挨拶日','挨拶時間','引率','巡回','備考'];
  const [text, setText] = useState('');
  const [parsed, setParsed] = useState(null);
  const [errors, setErrors] = useState([]);
  const fileRef = useRef(null);
  const [aiInput, setAiInput] = useState('');
  const [copied, setCopied] = useState(false);
  const buildExternalPrompt = (inputText) => {
    const safeInput = inputText && inputText.trim() ? inputText.trim() : '【ここに名簿のテキストや崩れたCSV/メモを貼り付けてください】';
    return '以下の自由テキストや崩れたCSV/TSVから現場実習の生徒情報を抽出し、次の14列CSV形式で出力してください。\n\n' +
      '列(この順番): ' + HEADERS.join(',') + '\n\n' +
      '規則:\n' +
      '- 出力はCSVのみ。1行目はヘッダー、2行目以降にデータ。前後の説明文やコードフェンスは絶対に付けない。\n' +
      '- 氏名はフルネーム（半角スペース可）。学年は数字のみ(1/2/3)。組は数字のみ。\n' +
      '- 担当教員/引率は「姓 先生」形式（例: 鈴木 先生）。\n' +
      '- 種別は「実習」または「見学」のみ。不明なら「実習」。\n' +
      '- 実習日は YYYY-MM-DD を「/」区切り（例: 2026-06-01/2026-06-02）。範囲表記(6/1〜6/5など)は展開する。\n' +
      '- 事前電話/お知らせは「完了」「未完了」「不要」のいずれか。不明なら「未完了」。\n' +
      '- 挨拶日は YYYY-MM-DD、挨拶時間は HH:MM、不明なら空欄。\n' +
      '- 巡回は「YYYY-MM-DD HH:MM 教員名」を「/」区切り。不明なら空欄。\n' +
      '- 値にカンマや改行を含む場合は二重引用符で囲む。\n' +
      '- 年が不明な場合は ' + new Date().getFullYear() + ' 年とする。\n\n' +
      '入力:\n' + safeInput;
  };
  const handleCopyPrompt = async () => {
    const text = buildExternalPrompt(aiInput);
    try {
      await navigator.clipboard.writeText(text);
      setCopied(true);
      setTimeout(() => setCopied(false), 2500);
    } catch (e) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        setCopied(true);
        setTimeout(() => setCopied(false), 2500);
      } catch (e2) {
        onAlert('クリップボードへのコピーに失敗しました。上のテキストを手動で選択コピーしてください。');
      }
    }
  };
  const parseLine = (line, sep) => { const result = []; let cur = ''; let inQuote = false; for (let i = 0; i < line.length; i++) { const c = line[i]; if (inQuote) { if (c === '"' && line[i+1] === '"') { cur += '"'; i++; } else if (c === '"') inQuote = false; else cur += c; } else { if (c === '"') inQuote = true; else if (c === sep) { result.push(cur); cur = ''; } else cur += c; } } result.push(cur); return result; };

  // v3.6: リスト画面の「追加」ボタンへのファイルドロップで、その生徒の関連資料として一括インポートし、Firestore / localStorage に保存する。
  // 1ファイル 4MB 以上は、Firestore ドキュメントサイズを超えないように警告を出してスキップする。
  const handleDropFilesForMaterial = async (studentId, files) => {
    const target = students.find((s) => s.id === studentId);
    if (!target || !files || files.length === 0) return;
    const arr = Array.from(files);
    const tooLarge = arr.filter((f) => f.size > 4 * 1024 * 1024);
    const ok = arr.filter((f) => f.size <= 4 * 1024 * 1024);
    if (tooLarge.length > 0) {
      showAlert('次のファイルは4MBを超えているため取り込めません: ' + tooLarge.map((f) => f.name).join('、') + '\n大きなファイルは関連資料モーダルから Google Drive 等の共有URLとして登録してください。');
    }
    if (ok.length === 0) return;
    const readFile = (file) => new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve({ ok: true, item: { id: 'mat-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8), name: file.name, kind: 'file', dataUrl: reader.result, mimeType: file.type, size: file.size } });
      reader.onerror = () => resolve({ ok: false, name: file.name });
      reader.readAsDataURL(file);
    });
    const results = await Promise.all(ok.map(readFile));
    const failed = results.filter((r) => !r.ok).map((r) => r.name);
    const items = results.filter((r) => r.ok).map((r) => r.item);
    if (failed.length > 0) showAlert('読み込みに失敗したファイル: ' + failed.join('、'));
    if (items.length === 0) return;
    const latest = students.find((s) => s.id === studentId) || target;
    const current = latest.materials || [];
    const next = [...current, ...items];
    recordUpdate(latest.id, { materials: current }, { materials: next });
    await persistPartial(latest.id, { materials: next });
  };

  const fetchAllRooms = useCallback(async () => {

  useEffect(() => {

  // 環境設定モーダルを開いたら、ルーム一覧を自動取得する。

  // v3.6: 環境設定モーダルから「過去データを一括削除」する。パスワード「@kirari」必須。
  //        クラウド接続中なら Firestore のドキュメントをバッチ削除、ローカルなら localStorage を消去。
  const handleWipeAllData = (password) => {
    if (String(password || '').trim() !== '@kirari') {
      showAlert('パスワードが違います。正しいパスワードを入力してください。');
      return;
    }
    showConfirm(`本当にこのルーム「${roomKey}」の過去データをすべて削除しますか？この操作は取り消せません（Undo不可）。`, async () => {

  useEffect(() => {

  // ========== ドラッグ＆ドロップ / 貼り付けで config.js を取り込む（v3.5〜） ==========
  useEffect(() => {

        const json = JSON.stringify(obj);

        localStorage.setItem('school_firebase_config', json);
        setConfigDropOverlay('success');
        setConfigDropMessage(`${sourceLabel} から Firebase 接続情報を読み込みました。クラウド接続を開始します。`);

    // 「config.js を読み込む」ボタンや環境設定ポップアップ内のファイル選択から呼べるよう window に公開。

  const sortByCustomOrder = (list, gradeKey) => {
    const arr = customOrder[gradeKey] || [];
    return [...list].sort((a, b) => { const ia = arr.indexOf(a.id); const ib = arr.indexOf(b.id); if (ia === -1 && ib === -1) return 0; if (ia === -1) return 1; if (ib === -1) return -1; return ia - ib; });
  };

  const reorderListRow = (sectionKey, draggedId, targetId) => {
    if (!draggedId || draggedId === targetId) return;
    let sectionAll;
    if (sectionKey === 'other') {
      sectionAll = students.filter((s) => !['1','2','3'].includes(s.grade));
    } else if (sectionKey.endsWith('-_nocls')) {
      const g = sectionKey.split('-')[0];
      sectionAll = students.filter((s) => s.grade === g && !s.classVal);
    } else {
      const [g, c] = sectionKey.split('-');
      sectionAll = students.filter((s) => s.grade === g && s.classVal === c);
    }
    const currentArr = customOrder[sectionKey] || [];
    let ordered = sectionAll.map((s) => s.id).sort((a, b) => { const ia = currentArr.indexOf(a); const ib = currentArr.indexOf(b); if (ia === -1 && ib === -1) return 0; if (ia === -1) return 1; if (ib === -1) return -1; return ia - ib; });
    if (!ordered.includes(draggedId)) return;
    ordered = ordered.filter((id) => id !== draggedId);
    const ti = ordered.indexOf(targetId);
    if (ti === -1) ordered.push(draggedId); else ordered.splice(ti, 0, draggedId);

      if (filterPhoneStatus !== 'all' && (s.phoneStatus || 'pending') !== filterPhoneStatus) return false;

      if (filterGreetingStatus !== 'all' && (s.greetingStatus || 'pending') !== filterGreetingStatus) return false;

      if (filterStudentThankYouStatus !== 'all' && (s.studentThankYouStatus || 'pending') !== filterStudentThankYouStatus) return false;
      if (filterTeacherThankYouStatus !== 'all' && (s.teacherThankYouStatus || 'pending') !== filterTeacherThankYouStatus) return false;

      return true;

      phonePendingCount: 0, docPendingCount: 0, greetingPendingCount: 0, patrolPendingCount: 0,
      internshipImplPercent: 0, internshipInProgressCount: 0,
      studentThankYouPercent: 0, studentThankYouPendingCount: 0,
      teacherThankYouPercent: 0, teacherThankYouPendingCount: 0
    };
    const todayKey = getTodayString();
    const phoneDone    = students.filter((s) => s.phoneStatus === 'completed' || s.phoneStatus === 'none').length;
    const docDone      = students.filter((s) => s.docStatus   === 'completed' || s.docStatus   === 'none').length;
    const greetingDone = students.filter((s) => s.greetingStatus === 'completed').length;
    const patrolDone   = students.filter((s) => { const ps = s.patrols || []; return ps.length > 0 && ps.every((p) => p.done); }).length;
    const internshipImplDone = students.filter((s) => { const dates = s.internshipDates || []; if (dates.length === 0) return false; const last = [...dates].sort().pop(); return last < todayKey; }).length;
    const internshipInProgressCount = students.filter((s) => (s.internshipDates || []).includes(todayKey)).length;
    const studentTYDone = students.filter((s) => s.studentThankYouStatus === 'completed' || s.studentThankYouStatus === 'none').length;
    const teacherTYDone = students.filter((s) => s.teacherThankYouStatus === 'completed' || s.teacherThankYouStatus === 'none').length;
    return {
      total,
      phonePercent:    Math.round((phoneDone    / total) * 100),
      docPercent:      Math.round((docDone      / total) * 100),
      greetingPercent: Math.round((greetingDone / total) * 100),
      patrolPercent:   Math.round((patrolDone   / total) * 100),
      phonePendingCount:    students.filter((s) => s.phoneStatus === 'pending').length,
      docPendingCount:      students.filter((s) => s.docStatus   === 'pending').length,
      greetingPendingCount: students.filter((s) => s.greetingStatus === 'pending' || s.greetingStatus === 'scheduled').length,
      patrolPendingCount:   students.filter((s) => (s.patrols || []).some((p) => !p.done)).length,
      internshipImplPercent: Math.round((internshipImplDone / total) * 100),
      internshipInProgressCount,
      studentThankYouPercent: Math.round((studentTYDone / total) * 100),
      studentThankYouPendingCount: students.filter((s) => (s.studentThankYouStatus || 'pending') === 'pending').length,
      teacherThankYouPercent: Math.round((teacherTYDone / total) * 100),
      teacherThankYouPendingCount: students.filter((s) => (s.teacherThankYouStatus || 'pending') === 'pending').length
    };
  }, [students]);

  const uniqueTeachers = useMemo(() => {
    const set = new Set();
    students.forEach((s) => { if (s.teacher) set.add(s.teacher); });
    return Array.from(set);
  }, [students]);

  const calendarDays = useMemo(() => {
    const firstDayIndex = new Date(calendarYear, calendarMonth, 1).getDay();
    const numberOfDays = new Date(calendarYear, calendarMonth + 1, 0).getDate();
    const prevMonthDays = new Date(calendarYear, calendarMonth, 0).getDate();
    const days = [];
    for (let i = firstDayIndex - 1; i >= 0; i--) {
      days.push({
        day: prevMonthDays - i,
        month: calendarMonth === 0 ? 11 : calendarMonth - 1,
        year: calendarMonth === 0 ? calendarYear - 1 : calendarYear,
        isCurrentMonth: false
      });
    }
    for (let i = 1; i <= numberOfDays; i++) {
      days.push({ day: i, month: calendarMonth, year: calendarYear, isCurrentMonth: true });
    }
    const remaining = 42 - days.length;
    for (let i = 1; i <= remaining; i++) {
      days.push({
        day: i,
        month: calendarMonth === 11 ? 0 : calendarMonth + 1,
        year: calendarMonth === 11 ? calendarYear + 1 : calendarYear,
        isCurrentMonth: false
      });
    }
    return days;
  }, [calendarYear, calendarMonth]);

  const getEventsForDate = (year, month, day) => {
    const target = formatDateKey(year, month, day);
    const events = [];
    filteredStudents.forEach((student) => {
      if ((calendarFilter === 'all' || calendarFilter === 'student') && student.greetingDate === target) {
        events.push({
          type: 'greeting',
          label: `挨拶: ${student.name} (${student.greetingTime || '時間未定'})`,
          student,
          color: student.greetingStatus === 'completed'
            ? 'bg-green-300 border-green-500 text-green-900 hover:bg-green-400'
            : 'bg-green-200 border-green-400 text-green-900 hover:bg-green-300'
        });
      }
      if (calendarFilter === 'teacher' || calendarFilter === 'all') {
        (student.patrols || []).forEach((p) => {
          if (p.date !== target) return;
          events.push({
            type: 'patrol',
            label: `巡回: ${student.name}${p.teacher ? ' / ' + p.teacher : ''}${p.time ? ` (${p.time})` : ''}`,
            student,
            color: p.done
              ? 'bg-blue-300 border-blue-500 text-blue-900 hover:bg-blue-400'
              : 'bg-blue-200 border-blue-400 text-blue-900 hover:bg-blue-300'
          });
        });
      }
      const info = computeInternshipDayInfo(student, target);
      if (info && (calendarFilter === 'student' || calendarFilter === 'all')) {
        const isObs = student.internshipType === 'observation';
        const color = isObs
          ? 'bg-pink-100 border-pink-300 text-pink-900 hover:bg-pink-200'
          : 'bg-yellow-100 border-yellow-300 text-yellow-900 hover:bg-yellow-200';
        const patrolsOnDay = (student.patrols || []).filter((p) => p.date === target);
        const patrolNames = patrolsOnDay.map((p) => p.teacher).filter(Boolean);
        const tipLines = [`${student.name}　${info.dayNumber}／${info.totalDays}（${student.location}）`];
        if (student.teacher) tipLines.push(`同行: ${student.teacher}`);
        if (patrolNames.length > 0) tipLines.push(`巡回: ${patrolNames.join('、')}`);
        events.push({
          type: 'period',
          label: `${student.name}　${info.dayNumber}／${info.totalDays}（${student.location}）`,
          title: tipLines.join('\n'),
          student,
          color,
          dateKey: target
        });
      }
    });
    return events;
  };

  const hasPeriodEventOnDate = (year, month, day) => {
    const target = formatDateKey(year, month, day);
    return filteredStudents.some((s) => (s.internshipDates || []).includes(target));
  };

  const handlePrevMonth = () => {
    if (calendarMonth === 0) { setCalendarYear((y) => y - 1); setCalendarMonth(11); }
    else setCalendarMonth((m) => m - 1);
  };
  const handleNextMonth = () => {
    if (calendarMonth === 11) { setCalendarYear((y) => y + 1); setCalendarMonth(0); }
    else setCalendarMonth((m) => m + 1);
  };
  const handleToday = () => {
    const t = new Date();
    setCalendarYear(t.getFullYear());
    setCalendarMonth(t.getMonth());
  };

  const kanbanColumns = useMemo(() => {
    const keys = STEP_CONFIG[kanbanStep].cycle.includes('scheduled')
      ? ['pending', 'scheduled', 'completed']
      : ['pending', 'none', 'completed'];
    const cols = keys.map((k) => ({ key: k, ...KANBAN_COL_TEMPLATE[k] }));
    const groups = Object.fromEntries(keys.map((k) => [k, []]));
    const field = STEP_CONFIG[kanbanStep].field;
    filteredStudents.forEach((student) => {
      const status = student[field] || 'pending';
      (groups[status] || groups.pending).push(student);
    });
    return { cols, groups };
  }, [filteredStudents, kanbanStep]);

  const clearFilters = () => {
    setSearchQuery(''); setFilterProgress('all');
    setFilterGrade('all'); setFilterClass('all');
    setFilterPhoneStatus('all'); setFilterDocStatus('all');
    setFilterGreetingStatus('all'); setFilterPatrolStatus('all');
    setFilterStudentThankYouStatus('all'); setFilterTeacherThankYouStatus('all');
  };

  const hasActiveFilter = filterProgress !== 'all' || searchQuery ||
    filterGrade !== 'all' || filterClass !== 'all' ||
    filterPhoneStatus !== 'all' || filterDocStatus !== 'all' ||
    filterGreetingStatus !== 'all' || filterPatrolStatus !== 'all' ||
    filterStudentThankYouStatus !== 'all' || filterTeacherThankYouStatus !== 'all';

  const handleExportExcel = () => {
    if (filteredStudents.length === 0) {
      showAlert('出力対象の生徒データがありません。');
      return;
    }
    const headers = [
      '生徒氏名', '学年', '組', '担当教員', '実習先企業・事業所名', '実習日数', '実習日（スラッシュ区切り）',
      '事前電話状況', '電話連絡完了日',
      '保護者お知らせ状況', 'お知らせ回収日',
      '事前挨拶状況', '挨拶訪問日', '挨拶予定時間', '挨拶引率教員',
      '巡回・同行予定一覧', '巡回完了件数',
      '特記事項・配慮事項'
    ];
    const labelOf = {
      phone:    (s) => s === 'completed' ? '完了'   : s === 'none' ? '不要' : '未完了',
      doc:      (s) => s === 'completed' ? '完了'   : s === 'none' ? '不要' : '未完了',
      greeting: (s) => s === 'completed' ? '挨拶終了' : s === 'scheduled' ? '挨拶日決定' : s === 'unadjusted' ? '未調整' : '必要なし'
    };
    const rows = filteredStudents.map((s) => [
      s.name || '', s.grade ? `${s.grade}年` : '', s.classVal ? `${s.classVal}組` : '', s.teacher || '',
      s.location || '', (s.internshipDates || []).length, (s.internshipDates || []).join(' / '),
      labelOf.phone(s.phoneStatus), s.phoneDate || '',
      labelOf.doc(s.docStatus), s.docDate || '',
      labelOf.greeting(s.greetingStatus), s.greetingDate || '', s.greetingTime || '', s.greetingVisitor || '',
      (s.patrols || []).map((p) => `${p.teacher ? p.teacher + ' ' : ''}${p.date}${p.time ? ' ' + p.time : ''}${p.done ? '(済)' : ''}`).join(' / '), (s.patrols || []).filter((p) => p.done).length,
      s.notes || ''
    ]);
    const csv = [
      headers.join(','),
      ...rows.map((row) => row.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(','))
    ].join('\r\n');
    const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
    const blob = new Blob([bom, csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    const dateStr = new Date().toLocaleDateString('ja-JP').replace(/\//g, '');
    link.href = url;
    link.download = `現場実習進捗リスト_${roomKey}_${dateStr}.csv`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  };

  const handleBulkImport = async (rows) => {
    setIsLoading(true);
    try {
      if (connectionStatus === 'connected' && window.firebase) {
        const db = window.firebase.app().firestore();
        const ref = db.collection('rooms').doc(roomKey).collection('students');
        const created = [];
        for (const r of rows) {
          const docRef = await ref.add(r);
          created.push({ id: docRef.id, ...r });
        }
        created.forEach((s) => recordCreate(s));
      } else {
        const created = rows.map((r, i) => ({ id: 'local-' + Date.now() + '-' + i, ...r }));
        const updated = [...students, ...created];
        setStudents(updated);
        localStorage.setItem(`local_students_${roomKey}`, JSON.stringify(updated));
        created.forEach((s) => recordCreate(s));
      }
      setIsBulkImportOpen(false);
      showAlert(`${rows.length}名を一括登録しました。`);
    } catch (e) {
      showAlert(`一括登録に失敗しました: ${e.message}`);
    } finally {
      setIsLoading(false);
    }
  };

  const toggleSelectAll = () => {
    if (filteredStudents.length > 0 && selectedIds.size === filteredStudents.length) {
      setSelectedIds(new Set());
    } else {
      setSelectedIds(new Set(filteredStudents.map((s) => s.id)));
    }
  };

  const toggleSelectOne = (id) => {
    setSelectedIds((prev) => { const n = new Set(prev); if (n.has(id)) n.delete(id); else n.add(id); return n; });
  };

  const handleBulkDelete = () => {
    if (selectedIds.size === 0) return;
    showConfirm(`選択中の${selectedIds.size}名の進捗データを削除してもよろしいですか？「戻る」ボタンで取り消せます。`, async () => {
      const targets = students.filter((s) => selectedIds.has(s.id));
      setIsLoading(true);
      try {
        if (connectionStatus === 'connected' && window.firebase) {
          const db = window.firebase.app().firestore();
          for (const t of targets) {
            await db.collection('rooms').doc(roomKey).collection('students').doc(t.id).delete();
            recordDelete(t);
          }
        } else {
          const updated = students.filter((s) => !selectedIds.has(s.id));
          setStudents(updated);
          localStorage.setItem(`local_students_${roomKey}`, JSON.stringify(updated));
          targets.forEach((t) => recordDelete(t));
        }
        setSelectedIds(new Set());
        showAlert(`${targets.length}名を削除しました。`);
      } catch (e) {
        showAlert(`一括削除に失敗しました: ${e.message}`);
      } finally {
        setIsLoading(false);
      }
    });
  };

  return (
    <div className="min-h-screen bg-slate-50 text-slate-800 flex flex-col font-sans">

      {/* v3.7: 画面上部の掲示板。ルーム単位で共有され、投稿者名と削除ボタン付き。 */}
      <div className="sticky top-0 z-40 bg-gradient-to-r from-amber-50 via-yellow-50 to-amber-50 border-b border-amber-300 shadow-sm">
        <div className="max-w-7xl mx-auto px-4 py-2">
          <div className="flex items-center gap-2">
            <button type="button" onClick={() => setIsBoardOpen((v) => !v)} className="flex items-center gap-2 text-xs font-bold text-amber-900 hover:text-amber-700 cursor-pointer">
              <span className="text-base">📣</span>
              <span>掲示板</span>
              <span className="bg-amber-200 text-amber-900 px-2 py-0.5 rounded-full text-[10px] font-mono">{boardPosts.length}件</span>
              <ChevronDown className={"w-3.5 h-3.5 transition-transform " + (isBoardOpen ? "rotate-180" : "")} />
            </button>
            {!isBoardOpen && boardPosts[0] && (
              <div className="text-[11px] text-amber-900 truncate flex-1 min-w-0">
                <span className="font-bold">{boardPosts[0].author || '匿名'}:</span> {boardPosts[0].message}
              </div>
            )}
          </div>
          {isBoardOpen && (
            <div className="mt-2 space-y-2">
              <form onSubmit={(e) => { e.preventDefault(); if (!boardInput.trim()) return; addBoardPost(myTeacherName || '匿名', boardInput.trim()); setBoardInput(''); }} className="flex items-start gap-2">
                <div className="flex-shrink-0 bg-amber-100 border border-amber-300 px-2.5 py-1.5 rounded-lg text-[11px] font-bold text-amber-900 whitespace-nowrap" title="投稿者名。「編集者名」と同じ。">
                  {myTeacherName || '匿名'}
                </div>
                <textarea value={boardInput} onChange={(e) => setBoardInput(e.target.value)} placeholder="連絡事項やお知らせを入力（CtrlまたはCmd + Enter で投稿）" rows={1} onKeyDown={(e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); if (boardInput.trim()) { addBoardPost(myTeacherName || '匿名', boardInput.trim()); setBoardInput(''); } } }} className="flex-1 bg-white border border-amber-300 focus:border-amber-500 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-amber-300 text-slate-800 resize-y min-h-[34px]" />
                <button type="submit" disabled={!boardInput.trim()} className={"px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap shrink-0 " + (boardInput.trim() ? "bg-amber-600 hover:bg-amber-700 text-white cursor-pointer shadow-sm" : "bg-slate-200 text-slate-400 cursor-not-allowed")}>投稿</button>
              </form>
              {boardPosts.length === 0 ? (
                <p className="text-[11px] text-amber-700/70 italic text-center py-2">まだ投稿はありません。</p>
              ) : (
                <div className="space-y-1 max-h-56 overflow-y-auto scrollbar-thin pr-1">
                  {boardPosts.map((p) => { const ts = p.createdAt; const ms = ts && typeof ts === 'object' && ts.toMillis ? ts.toMillis() : (typeof ts === 'number' ? ts : 0); const timeStr = ms ? new Date(ms).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : ''; const canDelete = !myTeacherName || !p.author || p.author === '匿名' || p.author === myTeacherName; return (
                    <div key={p.id} className="flex items-start gap-2 bg-white/80 border border-amber-200 rounded-lg px-3 py-2 text-xs">
                      <div className="shrink-0 min-w-[80px]">
                        <div className="font-bold text-amber-900 text-[11px] truncate">{p.author || '匿名'}</div>
                        <div className="text-[9px] text-slate-500 font-mono">{timeStr}</div>
                      </div>
                      <div className="flex-1 text-slate-800 whitespace-pre-wrap break-words leading-relaxed">{p.message}</div>
                      <button type="button" onClick={() => showConfirm('この投稿を削除しますか？', () => deleteBoardPost(p.id))} title={canDelete ? 'この投稿を削除' : '他の人の投稿も削除できます'} className="shrink-0 px-2 py-1 bg-white hover:bg-rose-50 border border-rose-200 text-rose-700 rounded-lg text-[10px] font-bold cursor-pointer">削除</button>
                    </div>
                  ); })}
                </div>
              )}
            </div>
          )}
        </div>
      </div>


      {/* v3.6: 起動パスワードロック画面。@kirari を入力するまでアプリ操作をブロック */}
      {pendingFileAction && (
        <div className="fixed inset-0 z-[300] bg-slate-900/70 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-200 animate-scaleIn">
            <div className="bg-gradient-to-r from-indigo-500 to-purple-600 px-6 py-5 text-white">
              <div className="flex items-center gap-3">
                <Key className="w-7 h-7" />
                <div>
                  <div className="text-lg font-extrabold">パスワードを入力</div>
                  <div className="text-xs text-indigo-100">この保存ファイルを開くにはパスワードが必要です</div>
                </div>
              </div>
            </div>
            <form onSubmit={(e) => { e.preventDefault(); if (passwordInput.trim() === '@kirari') { const action = pendingFileAction; setPasswordError(''); setPasswordInput(''); setPendingFileAction(null); if (typeof action === 'function') { try { action(); } catch (err) {} } } else { setPasswordError('パスワードが違います。'); } }} className="p-6 space-y-4">
              <div>
                <label className="text-xs font-bold text-slate-700 mb-1.5 block">パスワード</label>
                <input type="password" autoFocus value={passwordInput} onChange={(e) => { setPasswordInput(e.target.value); setPasswordError(''); }} className="w-full px-4 py-2.5 border-2 border-slate-200 focus:border-indigo-400 rounded-xl text-sm font-bold outline-none transition-colors" placeholder="パスワードを入力" />
                {passwordError && <div className="mt-2 text-xs text-rose-700 font-bold">⚠ {passwordError}</div>}
              </div>
              <div className="flex gap-2"><button type="button" onClick={() => { setPendingFileAction(null); setPasswordInput(''); setPasswordError(''); }} className="flex-1 px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-bold transition-colors">キャンセル</button><button type="submit" className="flex-1 px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-extrabold transition-colors shadow-sm">開く</button></div>
              <p className="text-[10px] text-slate-500 leading-relaxed">※ セキュリティのため、保存ファイルを開くたびにパスワードの入力が必要です。</p>
            </form>
          </div>
        </div>
      )}

      {/* 隠しファイル入力: 「config.js を読み込む」ボタンから呼ばれる */}
      <input
        ref={configFileInputRef}
        type="file"
        accept=".js,.json,.txt,application/json,text/javascript,text/plain"
        className="hidden"
        onChange={(e) => {
          const file = e.target.files?.[0];
          if (file && typeof window.__loadConfigFromFile === 'function') {
            window.__loadConfigFromFile(file);
          }
          e.target.value = '';
        }}
      />

      {/* v3.6: 編集者名入力モーダル（初回接続時に自動表示 / ヘッダーの✏️ボタンからも開ける） */}
      {isNamePromptOpen && (
        <div className="fixed inset-0 z-[150] bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn">
          <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-200">
            <div className="bg-gradient-to-r from-indigo-500 to-purple-600 px-6 py-4">
              <div className="flex items-center gap-3 text-white">
                <span className="text-3xl">✏️</span>
                <div>
                  <div className="text-lg font-extrabold">編集者名を入力</div>
                  <div className="text-xs text-indigo-100">この端末を使うあなたの名前を教えてください</div>
                </div>
              </div>
            </div>
            <div className="p-6 space-y-4">
              <div>
                <label className="text-xs font-bold text-slate-700 mb-1.5 block">あなたの名前（編集者名）</label>
                <input
                  type="text"
                  value={tempTeacherName}
                  onChange={(e) => setTempTeacherName(e.target.value)}
                  onKeyDown={(e) => {
                    if (e.key === 'Enter' && tempTeacherName.trim()) {
                      setMyTeacherName(tempTeacherName.trim());
                      setIsNamePromptOpen(false);
                    } else if (e.key === 'Escape') {
                      setIsNamePromptOpen(false);
                    }
                  }}
                  placeholder="例: 加藤 / 須田先生 / 北原 など"
                  autoFocus
                  className="w-full px-4 py-2.5 border-2 border-slate-200 focus:border-indigo-400 rounded-xl text-sm font-bold outline-none transition-colors"
                />
              </div>
              <div className="bg-sky-50 border border-sky-200 text-sky-800 text-[11px] p-3 rounded-lg leading-relaxed">
                <strong className="font-bold">この名前の使い道:</strong><br />
                ・「👥 接続中」一覧に表示されます<br />
                ・このPCで行ったコメント・編集の記録に使われます<br />
                ・後からヘッダーの ✏️ ボタンや「環境設定」でいつでも変更できます
              </div>
              <div className="flex items-center gap-2 pt-2">
                <button
                  onClick={() => setIsNamePromptOpen(false)}
                  className="flex-1 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition-colors"
                >
                  あとで設定（匿名のまま）
                </button>
                <button
                  disabled={!tempTeacherName.trim()}
                  onClick={() => {
                    setMyTeacherName(tempTeacherName.trim());
                    setIsNamePromptOpen(false);
                  }}
                  className="flex-1 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white rounded-xl text-xs font-extrabold transition-colors shadow-sm"
                >
                  この名前で保存
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* 読み込み結果トースト（環境設定ポップアップから取り込んだときに表示） */}
      {(configDropOverlay === 'success' || configDropOverlay === 'error') && (
        <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-[200] px-4 py-3 rounded-xl shadow-2xl border max-w-md text-xs font-bold animate-slideDown ${configDropOverlay === 'success' ? 'bg-emerald-50 border-emerald-300 text-emerald-900' : 'bg-rose-50 border-rose-300 text-rose-900'}`}>
          <div className="flex items-start gap-2">
            <span className="text-base shrink-0">{configDropOverlay === 'success' ? '✅' : '⚠️'}</span>
            <span className="leading-relaxed">{configDropMessage}</span>
          </div>
        </div>
      )}

      <header className="bg-white border-b border-slate-200 shrink-0 sticky top-0 z-40 shadow-sm">
        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
          <div className="flex items-center gap-3">
            <div>
              <div className="flex items-center gap-2">
                <h1 className="text-lg font-bold tracking-tight text-slate-900">Work Experience Progress Status</h1>
                <span className="text-[10px] bg-slate-100 text-slate-600 font-mono px-1.5 py-0.5 rounded border border-slate-200">v3.5 HTML</span>
                {isConfigFromFile && <span className="text-[10px] bg-emerald-50 text-emerald-700 font-mono px-1.5 py-0.5 rounded border border-emerald-200" title="config.js から Firebase 接続情報を読み込んでいます">config.js 適用中</span>}
              </div>
              <p className="text-xs text-slate-500">教員間リアルタイム同期・実習開始/終了日カレンダーピッカー・履歴復元ボード</p>
            </div>
          </div>

          <div className="flex items-center gap-2">
            <ConnectionBadge status={connectionStatus} roomKey={roomKey} />
            {/* v3.6: 編集者名バッジ。未設定のときは赤くパルスして気づかせる。 */}
            <button
              onClick={() => { setTempTeacherName(myTeacherName || ''); setIsNamePromptOpen(true); }}
              className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold transition-all shadow-sm border ${myTeacherName ? 'bg-indigo-50 hover:bg-indigo-100 border-indigo-200 text-indigo-800' : 'bg-rose-50 hover:bg-rose-100 border-rose-300 text-rose-700 animate-pulse'}`}
              title="編集者名（あなたの名前）を設定・変更します。「接続中」一覧や記録に使われます。"
            >
              <span className="text-sm leading-none">✏️</span>
              <span className="max-w-[120px] truncate">{myTeacherName || '名前を入力'}</span>
            </button>
            {connectionStatus === 'connected' && (
              <div className="relative">
                <button
                  type="button"
                  onClick={() => setIsOnlineListOpen((v) => !v)}
                  className="flex items-center gap-1.5 px-3 py-1.5 bg-sky-50 hover:bg-sky-100 active:bg-sky-200 border border-sky-200 text-sky-800 rounded-full text-xs font-bold transition-all shadow-sm cursor-pointer"
                  title={onlineMembers.length > 0 ? 'クリックで接続中の先生の一覧を表示' : '同期接続中の人数'}
                >
                  <span className="text-sm leading-none">👥</span>
                  <span>{onlineCount} 名 接続中</span>
                  <ChevronDown className={`w-3 h-3 transition-transform ${isOnlineListOpen ? 'rotate-180' : ''}`} />
                </button>
                {isOnlineListOpen && (
                  <>
                    <div className="fixed inset-0 z-40" onClick={() => setIsOnlineListOpen(false)} />
                    <div className="absolute right-0 top-full mt-1 bg-white border border-slate-200 rounded-xl shadow-2xl p-2 min-w-[220px] z-50 animate-slideDown">
                      <div className="text-[10px] font-bold text-slate-500 px-2 py-1 border-b border-slate-100 mb-1">
                        同期接続中 ({onlineCount}名)
                      </div>
                      {onlineMembers.length === 0 ? (
                        <div className="text-xs text-slate-400 italic px-2 py-2 text-center">接続中のセッションはありません</div>
                      ) : (
                        <div className="max-h-64 overflow-y-auto scrollbar-thin">
                          {onlineMembers.map((m) => (
                            <div key={m.id} className="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-slate-50">
                              <span className="w-2 h-2 rounded-full bg-emerald-500 shrink-0 animate-pulse"></span>
                              <span className="text-xs text-slate-800 font-bold flex-1 truncate">{m.teacherName}</span>
                              {m.isSelf && <span className="text-[10px] bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded font-mono">あなた</span>}
                            </div>
                          ))}
                        </div>
                      )}
                      <div className="text-[10px] text-slate-400 px-2 pt-2 pb-1 border-t border-slate-100 mt-1 leading-snug">
                        ※ 同じルーム名({roomKey})の部屋を開いている端末を表示します。<br />25秒ごとに更新、最終更新から60秒以上経ったセッションは離脱として扱います。
                      </div>
                    </div>
                  </>
                )}
              </div>
            )}
            <button
              onClick={() => { setTempRoomKey(roomKey); setIsConfigOpen(true); }}
              title="Firebase接続設定・ルーム名の切替・担当教員名の保存を行います"
              className="flex items-center gap-1.5 px-3 py-1.5 bg-white hover:bg-slate-50 active:bg-slate-100 text-slate-700 hover:text-slate-900 rounded-xl text-xs font-bold transition-all border border-slate-200 shadow-sm"
            >
              <Settings className="w-4 h-4 text-slate-500" />
              <span>環境設定</span>
            </button>
          </div>
        </div>
      </header>

      {connectionStatus === 'local' && (
        <div className="bg-amber-50 border-b border-amber-200 text-amber-900 text-xs py-2.5 px-4 shadow-sm">
          <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2 font-medium">
            <span className="flex items-center gap-2 text-amber-800">
              <AlertCircle className="w-5 h-5 shrink-0 text-amber-600" />
              現在はPC1台のみの「体験デモ」で稼働しています。右上の<strong className="font-bold">「環境設定」ボタン</strong>から、config の貼り付け または config.js ファイルの読み込みでクラウド接続できます。
            </span>
            <div className="flex items-center gap-2 shrink-0">
              <button
                onClick={() => { setTempRoomKey(roomKey); setIsConfigOpen(true); }}
                className="px-3 py-1 bg-amber-600 hover:bg-amber-700 text-white rounded-lg font-bold text-[11px] transition-colors shadow-sm"
              >
                環境設定を開く
              </button>
            </div>
          </div>
        </div>
      )}

      <main className="flex-1 max-w-7xl w-full mx-auto p-4 space-y-6">
        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-7 gap-4">
          <div className="bg-white border border-slate-200 rounded-2xl p-4 flex items-center justify-between shadow-sm">
            <div>
              <p className="text-xs text-slate-500 font-bold">全登録件数</p>
              <h3 className="text-2xl font-extrabold text-slate-950 mt-1">{stats.total} <span className="text-xs font-normal text-slate-500">名</span></h3>
            </div>
            <div className="p-3 bg-indigo-50 rounded-xl border border-indigo-100">
              <User className="w-5 h-5 text-indigo-600" />
            </div>
          </div>

          <StatCard icon={Phone} label="事前電話連絡状況" percent={stats.phonePercent} pendingCount={stats.phonePendingCount}
            active={filterProgress === 'phone_pending'}
            onClick={() => setFilterProgress(filterProgress === 'phone_pending' ? 'all' : 'phone_pending')}
            title="クリックで「未連絡」の生徒だけを絞り込みします"
            barColor="bg-indigo-600" iconColor="text-indigo-600" />
          <StatCard icon={FileText} label="保護者お知らせ状況" percent={stats.docPercent} pendingCount={stats.docPendingCount}
            active={filterProgress === 'doc_pending'}
            onClick={() => setFilterProgress(filterProgress === 'doc_pending' ? 'all' : 'doc_pending')}
            title="クリックで「未配付」の生徒だけを絞り込みます"
            barColor="bg-emerald-600" iconColor="text-emerald-600" />
          <StatCard icon={Handshake} label="事前挨拶 完了状況" percent={stats.greetingPercent} pendingCount={stats.greetingPendingCount}
            active={filterProgress === 'greeting_pending'}
            onClick={() => setFilterProgress(filterProgress === 'greeting_pending' ? 'all' : 'greeting_pending')}
            title="クリックで「挨拶未完了」の生徒だけを絞り込みます"
            barColor="bg-emerald-600" iconColor="text-teal-600" />
          <StatCard icon={Calendar} label="実習・見学 実施状況" percent={stats.internshipImplPercent} pendingCount={stats.internshipInProgressCount}
            active={filterProgress === 'internship_in_progress'}
            onClick={() => setFilterProgress(filterProgress === 'internship_in_progress' ? 'all' : 'internship_in_progress')}
            title="完了率＝最終実習日が過去になった生徒の割合。クリックで「本日実習中」の生徒だけを絞り込みます"
            barColor="bg-yellow-500" iconColor="text-yellow-600" />
          <StatCard icon={FileText} label="生徒お礼状 送付状況" percent={stats.studentThankYouPercent} pendingCount={stats.studentThankYouPendingCount}
            active={filterProgress === 'student_thankyou_pending'}
            onClick={() => setFilterProgress(filterProgress === 'student_thankyou_pending' ? 'all' : 'student_thankyou_pending')}
            title="クリックで「生徒お礼状未送付」の生徒だけを絞り込みます"
            barColor="bg-pink-500" iconColor="text-pink-600" />
          <StatCard icon={FileText} label="教師お礼状 送付状況" percent={stats.teacherThankYouPercent} pendingCount={stats.teacherThankYouPendingCount}
            active={filterProgress === 'teacher_thankyou_pending'}
            onClick={() => setFilterProgress(filterProgress === 'teacher_thankyou_pending' ? 'all' : 'teacher_thankyou_pending')}
            title="クリックで「教師お礼状未送付」の生徒だけを絞り込みます"
            barColor="bg-cyan-500" iconColor="text-cyan-600" />
        </div>

        <div className="bg-white border border-slate-200 rounded-2xl p-4 space-y-4 shadow-sm">
          <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
            <div className="flex flex-wrap items-center gap-2.5 flex-1">
              <div className="relative flex-1 min-w-[180px]">
                <Search className="absolute left-3 top-2.5 w-4 h-4 text-slate-400" />
                <input type="text" placeholder="生徒名、実習先、期間等で検索..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:bg-white transition-all" />
              </div>

              <div className="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1" title="表示する生徒を学年で絞り込みます">
                <Filter className="w-3.5 h-3.5 text-slate-500" />
                <select value={filterGrade} onChange={(e) => setFilterGrade(e.target.value)} title="表示する学年を選んでください"
                  className="bg-transparent text-xs text-slate-700 focus:outline-none pr-1 cursor-pointer font-bold">
                  <option value="all">学年: すべて</option>
                  <option value="1">1年</option>
                  <option value="2">2年</option>
                  <option value="3">3年</option>
                </select>
              </div>

              <div className="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1" title="表示する生徒を組で絞り込みます">
                <Filter className="w-3.5 h-3.5 text-slate-500" />
                <select value={filterClass} onChange={(e) => setFilterClass(e.target.value)} title="表示する組を選んでください"
                  className="bg-transparent text-xs text-slate-700 focus:outline-none pr-1 cursor-pointer font-bold">
                  <option value="all">組: すべて</option>
                  {Array.from(new Set(students.map((st) => st.classVal).filter(Boolean))).sort().map((c) => (
                    <option key={c} value={c}>{c}組</option>
                  ))}
                </select>
              </div>

              <div className="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200">
                {[
                  { key: 'list',     icon: List,       label: 'リスト一覧',     title: '全生徒の進捗を一覧表で表示します' },
                  { key: 'calendar', icon: Calendar,   label: 'カレンダー',   title: '月別カレンダーで実習日・事前挨拶・巪回を可視化します' },
                  { key: 'kanban',   icon: LayoutGrid, label: '進捗かんばん', title: '進捗ステータスごとに生徒をかんばん形式で並べて表示します' }
                ].map(({ key, icon: Icon, label, title }) => (
                  <button key={key} onClick={() => setCurrentView(key)} title={title}
                    className={`flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer ${currentView === key ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}>
                    <Icon className="w-3.5 h-3.5" />
                    <span>{label}</span>
                  </button>
                ))}
              </div>

              {hasActiveFilter && (
                <button onClick={clearFilters} className="flex items-center gap-1 text-[11px] font-bold text-indigo-600 hover:text-indigo-800 transition-colors">
                  <RotateCcw className="w-3 h-3" />
                  <span>解除</span>
                </button>
              )}
            </div>

            <div className="flex flex-wrap items-center gap-2 self-end lg:self-auto">
              <button onClick={handleUndo} disabled={history.length === 0}
                className={`px-3 py-2 text-xs font-bold rounded-xl flex items-center gap-1.5 border transition-all ${history.length > 0 ? 'bg-white hover:bg-slate-50 active:bg-slate-100 text-slate-700 border-slate-300 shadow-sm cursor-pointer' : 'bg-slate-50 text-slate-300 border-slate-200 cursor-not-allowed'}`}
                title="直前の操作を取り消して一つ前に戻します">
                <RotateCcw className={`w-4 h-4 ${history.length > 0 ? 'text-slate-600' : 'text-slate-300'}`} />
                <span>戻る</span>
              </button>

              <button onClick={handleRedo} disabled={redo.length === 0}
                className={`px-3 py-2 text-xs font-bold rounded-xl flex items-center gap-1.5 border transition-all ${redo.length > 0 ? 'bg-white hover:bg-slate-50 active:bg-slate-100 text-slate-700 border-slate-300 shadow-sm cursor-pointer' : 'bg-slate-50 text-slate-300 border-slate-200 cursor-not-allowed'}`}
                title="取り消した操作をやり直して一つ進めます">
                <RotateCw className={`w-4 h-4 ${redo.length > 0 ? 'text-slate-600' : 'text-slate-300'}`} />
                <span>進む</span>
              </button>

              <button onClick={() => setIsBulkImportOpen(true)}
                className="px-3 py-2 bg-indigo-50 hover:bg-indigo-100 active:bg-indigo-200 text-indigo-800 border border-indigo-200 text-xs font-bold rounded-xl flex items-center gap-1.5 shadow-sm transition-all cursor-pointer"
                title="CSV/TSVを使って複数の生徒を一括で登録します">
                <Upload className="w-4 h-4 text-indigo-600" />
                <span>一括登録</span>
              </button>

              <button onClick={handleExportExcel}
                className="px-3 py-2 bg-emerald-50 hover:bg-emerald-100 active:bg-emerald-200 text-emerald-800 border border-emerald-200 text-xs font-bold rounded-xl flex items-center gap-1.5 shadow-sm transition-all cursor-pointer"
                title="表示中の一覧をExcel等で開けるCSVファイルとして保存します">
                <Download className="w-4 h-4 text-emerald-600" />
                <span>エクセル</span>
              </button>

              <button onClick={() => openAddModal()}
                title="新しい生徒の進捗データを登録します"
                className="px-4 py-2 bg-yellow-200 hover:bg-yellow-300 active:bg-yellow-400 text-yellow-900 border border-yellow-300 text-xs font-bold rounded-xl flex items-center gap-2 shadow-sm transition-all transform active:scale-95 cursor-pointer">
                <Plus className="w-4 h-4" />
                <span>登録</span>
              </button>
            </div>
          </div>

        </div>

        {currentView === 'list' ? (
          <div key="view-list" className="list-text-scale-2 bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden animate-fadeIn">
            {selectedIds.size > 0 && (
              <div className="px-4 py-2.5 bg-indigo-50 border-b border-indigo-200 flex flex-wrap items-center justify-between gap-2 animate-slideDown">
                <span className="text-xs font-bold text-indigo-800 flex items-center gap-1.5"><CheckCircle2 className="w-4 h-4" />{selectedIds.size}名を選択中</span>
                <div className="flex items-center gap-2">
                  <button onClick={() => setSelectedIds(new Set())} className="px-3 py-1.5 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 text-xs font-bold rounded-lg cursor-pointer shadow-sm">選択解除</button>
                  <button onClick={handleBulkDelete} className="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold rounded-lg flex items-center gap-1.5 cursor-pointer shadow-sm"><Trash2 className="w-3.5 h-3.5" />選択した{selectedIds.size}名を削除</button>
                </div>
              </div>
            )}
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse table-auto">
                <thead>
                  <tr className="text-slate-600 text-xs font-bold select-none">
                    <th className="p-3 w-10 border-b border-slate-200 bg-slate-50 text-center"><input type="checkbox" checked={filteredStudents.length > 0 && selectedIds.size === filteredStudents.length} ref={(el) => { if (el) el.indeterminate = selectedIds.size > 0 && selectedIds.size < filteredStudents.length; }} onChange={toggleSelectAll} className="cursor-pointer accent-indigo-600 w-4 h-4" title="表示中の全件を選択 / 解除" /></th>
                    <th className="p-4 min-w-[90px] border-b border-slate-200 bg-slate-50">生徒情報</th>
                    <th className="p-4 min-w-[140px] border-b border-slate-200 bg-slate-50">実習先 &amp; 実習期間</th>
                    <th className="p-4 min-w-[100px] border-b border-slate-200 bg-slate-50">事前電話</th>
                    <th className="p-4 min-w-[120px] border-b border-slate-200 bg-slate-50"><span className="leading-tight">連絡票・<br />実施計画配付</span></th>
                    <th className="p-4 min-w-[100px] border-b border-slate-200 bg-slate-50">事前挨拶</th>
                    <th className="p-4 min-w-[140px] border-b border-slate-200 bg-slate-50">巡回・同行予定</th>
                    <th className="p-4 min-w-[100px] border-b border-slate-200 bg-slate-50">生徒お礼状</th>
                    <th className="p-4 min-w-[100px] border-b border-slate-200 bg-slate-50">教師お礼状</th>
                    <th className="p-4 text-center border-b border-slate-200 bg-slate-50">操作</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-sky-200 text-xs text-slate-700">
                  {isLoading ? (
                    <tr><td colSpan={10} className="p-12 text-center text-slate-500 font-medium">
                      <div className="flex flex-col items-center justify-center gap-2">
                        <span className="w-8 h-8 rounded-full border-2 border-indigo-600 border-t-transparent animate-spin inline-block"></span>
                        <span className="text-slate-600">データを同期しています...</span>
                      </div>
                    </td></tr>
                  ) : filteredStudents.length === 0 ? (
                    <tr><td colSpan={10} className="p-12 text-center text-slate-500 font-medium">条件に一致する実習対象生徒が見つかりません。</td></tr>
                  ) : (() => {
                    const grades = ['1', '2', '3'];
                    const ungraded = filteredStudents.filter((s) => !grades.includes(s.grade));
                    const sections = [];
                    const accentOf = (g) => g === '3' ? 'bg-rose-100 border-rose-100 text-rose-900' : g === '2' ? 'bg-emerald-100 border-emerald-100 text-emerald-900' : 'bg-sky-100 border-sky-100 text-sky-900';
                    grades.forEach((g) => {
                      const gradeStudents = filteredStudents.filter((s) => s.grade === g);
                      if (gradeStudents.length === 0) return;
                      const classes = Array.from(new Set(gradeStudents.map((s) => s.classVal).filter(Boolean))).sort();
                      classes.forEach((c) => {
                        const list = sortByCustomOrder(gradeStudents.filter((s) => s.classVal === c), g + '-' + c);
                        sections.push({ key: g + '-' + c, label: `${g}年${c}組`, list, accent: accentOf(g) });
                      });
                      const nocls = gradeStudents.filter((s) => !s.classVal);
                      if (nocls.length > 0) sections.push({ key: g + '-_nocls', label: `${g}年（組未設定）`, list: sortByCustomOrder(nocls, g + '-_nocls'), accent: accentOf(g) });
                    });
                    if (ungraded.length > 0) sections.push({ key: 'other', label: '学年未設定', list: sortByCustomOrder(ungraded, 'other'), accent: 'bg-slate-100 border-slate-100 text-slate-700' });
                    return sections.flatMap(({ key, label, list, accent }) => [
                      <tr key={`grade-header-${key}`} className={accent + ' border-y-4'}>
                        <td colSpan={10} className="class-section-header-cell px-4 py-3 text-sm font-extrabold"><div className="flex items-center justify-between gap-2"><span>{label}<span className="ml-2 text-[10px] font-mono bg-white border border-slate-300 text-slate-700 rounded px-1.5 py-0.5 font-bold">{list.length}件</span></span><button type="button" onClick={(e) => { const headers = Array.from(document.querySelectorAll('.class-section-header-cell')); const cur = e.currentTarget.closest('.class-section-header-cell'); const idx = headers.indexOf(cur); const target = headers[idx + 1] || headers[0]; if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' }); }} className="shrink-0 text-[11px] font-bold px-2.5 py-1 bg-white border border-slate-300 text-slate-700 rounded-lg hover:bg-indigo-50 hover:border-indigo-300 hover:text-indigo-700 cursor-pointer shadow-sm whitespace-nowrap transition-colors" title="次の組の先頭へスクロールします（最後の組にいるときは先頭に戻ります）">次の組へ ↓</button></div></td>
                      </tr>,
                      ...(list.length === 0 ? [<tr key={`grade-empty-${key}`} className="bg-white"><td colSpan={10} className="p-6 text-center text-xs text-slate-400 italic">表示するデータがありません</td></tr>] : list.map((s, idx) => {
                        // グレードヘッダの絵文字は下で削除済み
                      const isMyStudent = myTeacherName && s.teacher === myTeacherName;
                      const zebraBg = idx % 2 === 1 ? 'bg-sky-50/60' : 'bg-white';

                  })()}
